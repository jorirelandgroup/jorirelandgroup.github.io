    let i = 2; while (taken[first + i]) i++;
    return first + i;
  }

  /* People met for the first time in a workbook. `from` is how the sheet
     wrote them (MARLYN, MOH), kept as another name so the next import
     finds them. They have no sign-in code until someone sets one. */
  function addPeople(list) {
    return C.mutate({ what: 'Added ' + list.map(function (x) { return x.name; }).join(', ') + ' from the workbook', kind: 'people' }, function (s) {
      return list.map(function (o) {
        const id = 'p' + String(s.people.reduce(function (a, q) { return Math.max(a, +q.id.slice(1) || 0); }, 0) + 1).padStart(2, '0');
        const looksLikeInitials = /^[A-Z]{1,4}$/.test(o.from || '') && o.from.length <= 3;
        const initials = o.initials ? String(o.initials).toUpperCase() : freeInitials(s, o.name, looksLikeInitials ? o.from : null);
        const p = { id: id, name: o.name, first: o.name.split(' ')[0], initials: initials, role: '', access: 'staff',
          reportsTo: o.reportsTo || 'p02', email: '', aliases: o.from && o.from !== initials ? [o.from] : [], says: [] };
        s.people.push(p);
        return p;
      });
    });
  }

  /* A plan in the minutes layout: one tab per department, no meetings. Each
     row is an action on its owner's list, grouped under the plan, and the
     plan gets its own check-ins, run like any meeting. */
  function importPlan(o) {
    const nRows = o.tabs.reduce(function (a, t) { return a + t.rows.length; }, 0);
    return C.mutate({ what: 'Brought the plan “' + o.name + '” across (' + nRows + ' rows, ' + o.tabs.length + ' departments)', kind: 'import' }, function (s) {
      const who = me().id, day = today();
      s.topics = s.topics || [];
      const topicFor = function (name) {
        const n = String(name).toLowerCase();
        const guess = /reserv|hotel|contract/.test(n) ? 'res' : /transport|guide|coach/.test(n) ? 'guides' : /\bhr\b|people|staff|office/.test(n) ? 'office' :
          /operat/.test(n) ? 'ops' : /sales/.test(n) ? 'sales' : /market/.test(n) ? 'mkt' : /financ|account/.test(n) ? 'fin' :
          /show|travel/.test(n) ? 'shows' : /system|report/.test(n) ? 'systems' : null;
        if (guess && s.topics.some(function (t) { return t.id === guess; })) return guess;
        const have = s.topics.find(function (t) { return t.name.toLowerCase() === n; });
        if (have) return have.id;
        const id = 't' + (s.topics.length + 1) + Math.random().toString(36).slice(2, 5);
        s.topics.push({ id: id, name: String(name).trim().replace(/^./, function (c) { return c.toUpperCase(); }) });
        return id;
      };
      const people = {};
      o.tabs.forEach(function (t) { t.rows.forEach(function (r) { [r.owner].concat(r.helpers || []).forEach(function (p) { if (p) people[p] = true; }); }); });
      const admins = s.people.filter(function (p) { return !p.gone && (p.access === 'owner' || p.access === 'manager'); }).map(function (p) { return p.id; });
      const members = [];
      [o.chair || who, who].concat(admins, Object.keys(people)).forEach(function (p) { if (p && members.indexOf(p) < 0) members.push(p); });
      const short = o.short || (o.name.replace(/\b(19|20)\d\d\b/g, '').replace(/[^A-Za-z ]+/g, ' ').trim().split(/\s+/).slice(-2).join(' ') || 'Plan');
      const plan = { id: 's' + (s.series.reduce(function (a, q) { return Math.max(a, +String(q.id).slice(1) || 0); }, 0) + 1),
        kind: 'plan', name: o.name, short: short, every: o.every || (o.list ? 7 : 28), day: 1, time: '10:00', place: '', chair: o.chair || who,
        tint: '#B07A1E', members: members, standing: [], source: o.file || '' };
      s.series.push(plan);
      o.tabs.forEach(function (tab) {
        /* A department's list is filed under what the list is called ("Reservation TTD"), not its tab. */
        const topic = topicFor(o.list ? o.name : tab.sheet);
        tab.rows.forEach(function (r) {
          const kind = r.kind;
          /* A list says when each job went on it; a plan starts today. */
          const on = r.on && r.on <= day ? r.on : day;
          const it = {
            id: nextId('i'), ref: nextRef(kind), kind: kind, title: r.title, detail: r.detail || '', topic: topic,
            owner: r.owner || null, helpers: r.helpers || [], everyone: r.everyone || [], parts: {},
            due: r.due || null, ongoing: !!r.ongoing, status: 'open', progress: r.progress || 0, waitingOn: '', high: !!r.high,
            series: plan.id, meeting: null, private: false, by: who, on: on, doneOn: null, focus: r.focus || null,
            agenda: null, steps: [], hist: [], imported: true, fromPlan: o.list ? o.name : tab.sheet
          };
          if (kind === 'action') {
            it.hist.push({ on: on, by: who, m: null, k: 'new', to: { due: it.due, owner: it.owner, ongoing: it.ongoing } });
            if (r.update) it.hist.push({ on: day, by: who, m: null, k: 'upd', t: r.update });
            /* The day the list last had a comment on it: the job was touched then. */
            if (r.said && r.said > on && r.said <= day) it.hist.push({ on: r.said, by: who, m: null, k: 'listed' });
            if (r.progress && r.status !== 'done') it.hist.push({ on: day, by: who, m: null, k: 'prog', from: 0, to: r.progress });
            if (r.status === 'waiting') { it.hist.push({ on: day, by: who, m: null, k: 'wait', t: r.waitingOn || 'On hold' }); it.status = 'waiting'; it.waitingOn = r.waitingOn || 'On hold'; }
            if (r.status === 'done') { it.hist.push({ on: day, by: who, m: null, k: 'done', t: '' }); it.status = 'done'; it.doneOn = day; it.progress = 100; }
          } else if (r.update) it.detail = (it.detail ? it.detail + ' — ' : '') + r.update;
          s.items.push(it);
        });
      });
      return plan;
    });
  }

  /* A department's written procedures, kept with its topic, to be added
     to a to-do as its steps. Bringing them across again replaces them. */
  function saveProcedures(topicId, doc, file) {
    const t0 = (S().topics || []).find(function (t) { return t.id === topicId; });
    return C.mutate({ what: 'Brought across ' + doc.procs.length + ' procedures for ' + (t0 ? t0.name : topicId), kind: 'import' }, function (s) {
      const t = s.topics.find(function (x) { return x.id === topicId; });
      if (!t) return null;
      t.procs = doc.procs.map(function (p, i) {
        return { id: 'pr' + (i + 1), no: p.no, name: p.name, sec: p.sec || '', about: p.about || '', intro: p.intro || '',
          br: p.br.map(function (b) {
            return { when: b.when || '', steps: b.steps.map(function (x) {
              return { t: x.t, key: !!x.key, sub: (x.sub || []).map(function (c) { return { t: c.t, key: !!c.key }; }) };
            }) };
          }) };
      });
      t.procTitle = doc.title || ''; t.procFrom = file || ''; t.procOn = today();
      return t;
    });
  }

  function removeProcedures(topicId) {
    const t0 = (S().topics || []).find(function (t) { return t.id === topicId; });
    return C.mutate({ what: 'Removed the procedures for ' + (t0 ? t0.name : topicId), kind: 'import' }, function (s) {
      const t = s.topics.find(function (x) { return x.id === topicId; });
      if (t) { delete t.procs; delete t.procTitle; delete t.procFrom; delete t.procOn; }
      return t;
    });
  }

  function importSheet(o) {
    return importBook({ series: o.series, present: o.present, chair: o.chair, closeMissing: false,
      tabs: [{ sheet: o.sheet, date: o.date, rows: o.rows.map(function (r, i) { return Object.assign({ key: '0:' + i }, r); }) }] });
  }

  return {
    inMeeting: inMeeting, meetingNow: meetingNow,
    create: create, edit: edit, update: update, progress: progress, done: done, part: part, undoPart: undoPart,
    reopen: reopen, move: move, wait: wait, unwait: unwait, drop: drop, reassign: reassign, focus: focus,
    carryToday: carryToday, raise: raise, steps: steps, remove: remove, noted: noted,
    createMeeting: createMeeting, editMeeting: editMeeting, attend: attend, addAgenda: addAgenda,
    agendaNote: agendaNote, removeAgenda: removeAgenda, start: start, hear: hear, close: close,
    circulate: circulate, reopenMeeting: reopenMeeting,
    savePerson: savePerson, retirePerson: retirePerson, saveSeries: saveSeries, setToday: setToday, clearRecords: clearRecords,
    importSheet: importSheet, importBook: importBook, importPlan: importPlan, addPeople: addPeople, renameSpeaker: renameSpeaker, saveProcedures: saveProcedures, removeProcedures: removeProcedures,
    freeInitials: function (name) { return freeInitials(S(), name, null); }
  };
})();

</script>
<script>/* app.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the app shell
   Sign-in, the top bar, the router, one set of event listeners for the
   whole page, and the action card that every screen opens. The screens
   themselves are in todo.js, meet.js, minutes.js, register.js, team.js
   and admin.js; each registers what it draws and what its buttons do.
   ═══════════════════════════════════════════════════════════════════════ */

window.App = (function () {
  'use strict';
  const BOT = (window.JOR_MIN_DATA && window.JOR_MIN_DATA.BOT) || 'O’Reilly AI';   // the assistant's name on screen (data.js)

  const C = window.Core, E = window.Engine, W = window.When, U = window.UI, A = window.Actions, D = window.JOR_MIN_DATA;
  const esc = C.esc;

  const App = {
    view: 'todo', param: null,
    on: {}, onChange: {}, onInput: {}, onKey: {},
    views: {}, keep: {},
    get S() { return C.state; },
    get ME() { return C.who; },
    get today() { return C.state.today; }
  };

  /* ══ Boot ══════════════════════════════════════════════════════════════ */

  /* Three ways in: the server (set up on this device), setting a device up
     (the online build, before its first use), or this computer only (for
     trying the app out; the online build never offers it). */
  App.boot = function () {
    icon();
    C.onSync(function (top) {
      if (top && App.ME && top.by !== App.ME.id && top.kind !== 'focus') {
        U.toast('<b>' + esc(U.name(top.by)) + '</b> — ' + esc(top.what), 'sync', 5000);
      }
      if (App.ME) { App.render(); if (App.itemOpen) App.openItem(App.itemOpen, true); }
    });
    window.addEventListener('hashchange', function () { if (App.ME) route(); });
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', onKey);
    const sv = window.Server;
    if (sv && sv.ready()) {
      const c = sv.cfg();
      if (c.token && c.pid) {
        C.useServer(c.pid);
        if (App.ME) { if (c.must) choosePin(); else shell(); sv.boot(); return; }
        sv.boot().then(function () { if (App.ME) { if (sv.cfg().must) choosePin(); else shell(); } else gateServer(); })
          .catch(function (e) { gateServer(e.signin ? e.message : 'Couldn’t reach the server — ' + e.message); });
        document.body.innerHTML = '<div class="gate"><div class="gate-in"><div class="g-card"><p>Opening…</p></div></div></div>';
        return;
      }
      gateServer();
      return;
    }
    if (window.JOR_MIN_PROD) { deviceSetup(); return; }
    C.load();
    C.resume();
    if (App.ME) shell(); else gate();
  };

  /* ══ Signing in to the server ══════════════════════════════════════════ */

  function gateLeft() {
    return '<div class="g-left">' +
      '<img data-logo alt="JOR Ireland" class="g-logo">' +
      '<h1>Minutes &amp; To-Do</h1>' +
      '<p class="g-lede">One list of everything the team has to do. Meetings add to it, everyone works from it, ' +
      'and the minutes write themselves from what happened to each action.</p>' +
      '<ul class="g-points">' +
      '<li><b>Nothing is copied forward.</b> What is still open comes to the next meeting on its own.</li>' +
      '<li><b>Every action is on its owner’s to-do list</b> the moment it is agreed.</li>' +
      '<li><b>A date only moves with a reason,</b> and the app counts how often it has.</li>' +
      '<li><b>Speak, photograph or email it in</b> — ' + BOT + ' sorts it onto the right lists.</li></ul>' +
      '</div>';
  }

  /* Once per computer or phone: the office code. The page holds only the
     start of the server's link; the code finishes it. A page built without
     that start asks for the whole link instead. */
  function deviceSetup(msg) {
    const built = !!window.JOR_MIN_SERVER_START;
    document.body.innerHTML = '<div class="gate"><div class="gate-in">' + gateLeft() +
      '<div class="g-card"><h2>Set up this device</h2>' +
      '<p class="mini">' + (built ? 'Once on each computer or phone. The office code is on the notice Iain gave out — it’s kept on this device only.'
        : 'Once on each computer or phone: the server’s link, from Iain. It’s kept on this device only.') + '</p>' +
      '<label class="f"><span>' + (built ? 'Office code' : 'Server link') + '</span><input class="in" id="g-office" autocomplete="off" autocapitalize="off" spellcheck="false"' +
        (built ? '' : ' placeholder="https://script.google.com/macros/s/…/exec"') + '></label>' +
      '<div class="g-err' + (msg ? ' show' : '') + '" id="g-err">' + esc(msg || '') + '</div>' +
      '<button class="btn p block" id="g-setup">Continue</button></div></div></div>';
    logos();
    const go = function () {
      const typed = document.getElementById('g-office').value;
      const b = document.getElementById('g-setup'); b.disabled = true; b.textContent = 'Checking…';
      window.Server.setup(typed).then(function () { gateServer(); })
        .catch(function (e) { b.disabled = false; b.textContent = 'Continue'; const er = document.getElementById('g-err'); er.textContent = e.message; er.classList.add('show'); });
    };
    document.getElementById('g-setup').addEventListener('click', go);
    document.getElementById('g-office').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
    document.getElementById('g-office').focus();
  }

  function gateServer(msg) {
    const sv = window.Server, c = sv.cfg();
    const opts = function (list) {
      return '<option value="">Choose your name…</option>' + (list || []).slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (p) {
        return '<option value="' + esc(p.id) + '"' + (p.id === c.last ? ' selected' : '') + '>' + esc(p.name) + '</option>';
      }).join('');
    };
    document.body.innerHTML = '<div class="gate"><div class="gate-in">' + gateLeft() +
      '<div class="g-card"><h2>Sign in</h2>' +
      '<label class="f"><span>Your name</span><select class="in" id="g-who">' + opts(c.roster) + '</select></label>' +
      '<label class="f"><span>Your code</span><input class="in" id="g-pin" type="password" autocomplete="current-password"></label>' +
      '<label class="chk"><input type="checkbox" id="g-keep"' + (c.keep === false ? '' : ' checked') + '> Keep me signed in on this device</label>' +
      '<div class="g-err' + (msg ? ' show' : '') + '" id="g-err">' + esc(msg || '') + '</div>' +
      '<button class="btn p block" id="g-go">Sign in</button>' +
      '<p class="mini g-help">First time? Use the starting code Iain or Bernard gave you; you’ll then choose your own. Forgotten it? Ask them for a new one.</p>' +
      '<button class="linkbtn mini" id="g-forget">Not JOR’s device, or set up wrongly? Start again</button></div></div></div>';
    logos();
    const who = document.getElementById('g-who'), pin = document.getElementById('g-pin'), err = document.getElementById('g-err');
    const show = function (t) { err.textContent = t; err.classList.toggle('show', !!t); };
    sv.roster().then(function (list) { const v = who.value; who.innerHTML = opts(list); if (v) who.value = v; })
      .catch(function (e) { if (!(c.roster || []).length) show(e.message); });
    const go = function () {
      if (!who.value) { show('Choose your name.'); return; }
      const b = document.getElementById('g-go'); b.disabled = true; b.textContent = 'Signing in…';
      sv.signin(who.value, pin.value, document.getElementById('g-keep').checked).then(function (r) {
        App.view = 'todo'; App.param = null;
        if (location.hash) history.replaceState(null, '', location.pathname + location.search);
        sv.start();
        if (r.must) choosePin(); else shell();
      }).catch(function (e) { b.disabled = false; b.textContent = 'Sign in'; show(e.message); pin.select(); });
    };
    document.getElementById('g-go').addEventListener('click', go);
    pin.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
    document.getElementById('g-forget').addEventListener('click', function () {
      U.confirm({ title: 'Start again on this device?', body: '<p>This device forgets the office code. Nothing is deleted from the server.</p>', yes: 'Start again' })
        .then(function (y) { if (y) { sv.forgetDevice(); if (window.JOR_MIN_PROD) deviceSetup(); else { C.useLocal(); C.resume(); gate(); } } });
    });
    if (!who.value) who.focus(); else pin.focus();
  }

  /* After a starting code: choose your own before anything else. */
  function choosePin() {
    const ME = App.ME;
    document.body.innerHTML = '<div class="gate"><div class="gate-in">' + gateLeft() +
      '<div class="g-card"><h2>Welcome, ' + esc(ME.first || ME.name) + '</h2>' +
      '<p class="mini">Choose your own sign-in code. At least 6 characters — a few words or numbers only you would think of. Nobody else will see it, not even Iain.</p>' +
      '<label class="f"><span>Your new code</span><input class="in" id="g-new" type="password" autocomplete="new-password"></label>' +
      '<label class="f"><span>Once more</span><input class="in" id="g-new2" type="password" autocomplete="new-password"></label>' +
      '<div class="g-err" id="g-err"></div>' +
      '<button class="btn p block" id="g-set">Save my code</button></div></div></div>';
    logos();
    const err = document.getElementById('g-err');
    const go = function () {
      const a = document.getElementById('g-new').value, b = document.getElementById('g-new2').value;
      if (a !== b) { err.textContent = 'The two don’t match.'; err.classList.add('show'); return; }
      window.Server.setPin(ME.id, a).then(function () { shell(); U.toast('Your code is saved. Use it next time.', 'good'); })
        .catch(function (e) { err.textContent = e.message; err.classList.add('show'); });
    };
    document.getElementById('g-set').addEventListener('click', go);
    document.getElementById('g-new2').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
    document.getElementById('g-new').focus();
  }

  /* The session ended under us (expired, code changed on another device,
     marked as left): back to signing in, keeping unsent changes for when
     the same person signs back in. */
  App.signedOut = function (msg) {
    Voice.stopDictation();
    if (window.MeetRoom) window.MeetRoom.stop();
    U.close();
    C.who = null;
    gateServer(msg);
  };

  /* Settings → Server on a computer that was used on its own. */
  App.toServer = function () {
    C.signOut(); A.inMeeting(null);
    U.toast('Set up. Now sign in with your own code — the very first time, Iain and Bernard use the setup code.', 'good', 8000);
    gateServer();
  };

  function icon() {
    const ic = document.querySelector('link[rel=icon]');
    if (ic && window.JOR_MARKS) ic.href = window.JOR_MARKS.icon;
  }
  function logos() {
    document.querySelectorAll('img[data-logo]').forEach(function (i) { i.src = window.JOR_MARKS.logo; });
  }

  /* ══ Sign-in ═══════════════════════════════════════════════════════════ */

  function gate() {
    const S = App.S;
    const groups = {};
    S.people.filter(function (p) { return !p.gone; }).forEach(function (p) {
      const k = p.access === 'staff' ? 'Team' : 'Management';
      (groups[k] = groups[k] || []).push(p);
    });
    const opts = ['Management', 'Team'].filter(function (k) { return groups[k]; }).map(function (k) {
      return '<optgroup label="' + k + '">' + groups[k].map(function (p) {
        return '<option value="' + esc(p.id) + '"' + (p.id === 'p02' ? ' selected' : '') + '>' + esc(p.name) + (p.role ? ' — ' + esc(p.role) : '') + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
    document.body.innerHTML =
      '<div class="gate"><div class="gate-in">' +
      '<div class="g-left">' +
      '<img data-logo alt="JOR Ireland" class="g-logo">' +
      '<h1>Minutes &amp; To-Do</h1>' +
      '<p class="g-lede">One list of everything the team has to do. Meetings add to it, everyone works from it, ' +
      'and the minutes write themselves from what happened to each action.</p>' +
      '<ul class="g-points">' +
      '<li><b>Nothing is copied forward.</b> What is still open comes to the next meeting on its own.</li>' +
      '<li><b>Every action is on its owner’s to-do list</b> the moment it is agreed.</li>' +
      '<li><b>A date only moves with a reason,</b> and the app counts how often it has.</li>' +
      '<li><b>Speak instead of typing</b> — dictate an update, or transcribe the meeting.</li></ul>' +
      '</div>' +
      '<div class="g-card">' +
      '<h2>Sign in</h2>' +
      '<label class="f"><span>Your name</span><select class="in" id="g-who">' + opts + '</select></label>' +
      '<label class="f"><span>Code</span><input class="in" id="g-pin" type="password" autocomplete="off"></label>' +
      '<div class="g-err" id="g-err"></div>' +
      '<button class="btn p block" id="g-go">Sign in</button>' +
      '' +
      '</div></div></div>';
    logos();
    const pin = document.getElementById('g-pin'), who = document.getElementById('g-who');
    const fillPin = function () { const p = S.personMap[who.value]; pin.value = p ? D.DEMO_PINS[p.access] : ''; };
    fillPin();
    who.addEventListener('change', fillPin);
    const go = function () {
      const r = C.signIn(who.value, pin.value);
      if (!r.ok) { document.getElementById('g-err').textContent = r.why; return; }
      App.view = 'todo'; App.param = null;
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      shell();
    };
    document.getElementById('g-go').addEventListener('click', go);
    pin.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
  }

  /* ══ Shell ═════════════════════════════════════════════════════════════ */

  function tabs() {
    const t = [
      { k: 'todo', t: 'My to-do', i: 'check' },
      { k: 'meetings', t: 'Meetings', i: 'people' },
      { k: 'register', t: 'Register', i: 'list' }
    ];
    if (E.isAdmin(App.ME)) {
      t.push({ k: 'team', t: 'Dashboard', i: 'clock' });
      t.push({ k: 'admin', t: 'Settings', i: 'gear' });
    }
    return t;
  }

  function shell() {
    const ME = App.ME;
    document.body.innerHTML =
      '<div id="app">' +
      '<div class="topbar">' +
      '<div class="brandmark"><img data-logo alt="JOR Ireland"><span class="bt">Minutes &amp; To-Do</span></div>' +
      '<nav class="tabs" id="tabs"></nav>' +
      '<div class="spacer"></div>' +
      '<span class="daypill" title="The date the demo thinks it is. Change it in Settings.">' + esc(W.fmt(App.today, 'short')) + '</span>' +
      '<button class="whoami" data-act="my-code" title="Change my sign-in code"><span class="av" style="background:var(--gold)">' + esc(ME.initials) + '</span>' +
      '<span class="wt"><b>' + esc(ME.name) + '</b><span>' + esc(ME.role || (ME.access === 'staff' ? 'JOR team' : '')) + '</span></span></button>' +
      '<button class="signout" data-act="signout">Sign out</button>' +
      '</div><div class="work on" id="work"></div></div>';
    logos();
    route();
  }

  function drawTabs() {
    const el = document.getElementById('tabs');
    if (!el) return;
    const st = E.personStats(App.S, App.ME.id, App.today);
    const live = App.S.meetings.some(function (m) { return m.status === 'live' && E.canSeeMeeting(App.S, App.ME, m); });
    const cur = App.view === 'meeting' ? 'meetings' : App.view;
    el.innerHTML = tabs().map(function (x) {
      let badge = '';
      if (x.k === 'todo' && st.overdue) badge = '<span class="badge" title="Overdue">' + st.overdue + '</span>';
      if (x.k === 'meetings' && live) badge = '<span class="badge live-b">Live</span>';
      return '<button class="tab' + (x.k === cur ? ' on' : '') + '" data-act="tab" data-v="' + x.k + '">' +
        U.icon(x.i) + esc(x.t) + badge + '</button>';
    }).join('');
    const dp = document.querySelector('.daypill');
    if (dp) dp.textContent = W.fmt(App.today, 'short');
  }

  function route() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    const parts = h.split('/');
    let v = parts[0] || 'todo';
    if (!App.views[v]) v = 'todo';
    if (App.views[v].mgmt && !E.isAdmin(App.ME)) v = 'todo';
    App.view = v; App.param = parts.slice(1).join('/') || null;
    if (v !== 'meeting') A.inMeeting(null);
    const w = document.getElementById('work');
    if (w) w.scrollTop = 0;
    App.render();
  }

  App.go = function (v, p) {
    const h = '#' + v + (p ? '/' + encodeURIComponent(p) : '');
    if (location.hash === h) route(); else location.hash = h;
  };

  App.render = function () {
    const w = document.getElementById('work');
    if (!w || !App.ME) return;
    drawTabs();
    const V = App.views[App.view];
    const sc = w.scrollTop;
    const active = document.activeElement;
    const keepId = active && active.id && w.contains(active) ? active.id : null;
    const keepSel = keepId && active.selectionStart != null ? [active.selectionStart, active.selectionEnd] : null;
    w.className = 'work on v-' + App.view;
    w.innerHTML = V.render(App.param);
    w.scrollTop = sc;
    if (keepId) {
      const n = document.getElementById(keepId);
      if (n) { n.focus(); if (keepSel && n.setSelectionRange) try { n.setSelectionRange(keepSel[0], keepSel[1]); } catch (e) { } }
    }
    if (V.after) V.after(App.param);
  };

  /* ══ Events, for the whole page ════════════════════════════════════════ */

  function onClick(ev) {
    const a = ev.target.closest('[data-act]');
    if (a && !a.disabled) {
      const fn = App.on[a.getAttribute('data-act')];
      /* Let boxes and checkboxes inside a clickable card behave normally. */
      const field = ev.target.closest('input,select,textarea,label');
      if (fn && field && field !== a && a.contains(field)) { fn(a, ev); return; }
      if (fn) { if (a.tagName !== 'A') ev.preventDefault(); fn(a, ev); return; }
    }
    const o = ev.target.closest('[data-open]');
    if (o && !ev.target.closest('a,button,input,select,textarea,label')) { App.openItem(o.getAttribute('data-open')); return; }
    const g = ev.target.closest('[data-go]');
    if (g && !ev.target.closest('button:not([data-go]),input,select,textarea')) {
      const p = g.getAttribute('data-go').split('/');
      App.go(p[0], p.slice(1).join('/'));
    }
  }
  /* Remember what a picker held, to go back to if adding someone is cancelled. */
  document.addEventListener('focusin', function (ev) { if (ev.target.tagName === 'SELECT') ev.target.setAttribute('data-was', ev.target.value); });

  function addSomeone(sel, ev) {
    const was = sel.getAttribute('data-was') || '';
    sel.value = was === '__new' ? '' : was;
    if (sel.nextElementSibling && sel.nextElementSibling.classList.contains('addp')) { sel.nextElementSibling.querySelector('input').focus(); return; }
    const box = C.el('<span class="addp"><input class="in sm" placeholder="Their first name and surname" aria-label="New person’s name" autocomplete="off">' +
      '<span class="addp-ini" title="Initials — worked out from the name"></span><button type="button" class="btn sm p">Add</button><button type="button" class="btn sm">Cancel</button></span>');
    sel.insertAdjacentElement('afterend', box);
    const inp = box.querySelector('input'), ini = box.querySelector('.addp-ini');
    const same = function (n) { return App.S.people.find(function (p) { return !p.gone && p.name.toLowerCase() === n.toLowerCase(); }); };
    inp.addEventListener('input', function () {
      const n = inp.value.trim(), dup = n && same(n);
      ini.textContent = !n ? '' : dup ? 'already here: ' + dup.initials : A.freeInitials(n);
    });
    const done = function () { box.remove(); sel.focus(); };
    const go = function () {
      const n = inp.value.trim().replace(/\s+/g, ' ');
      if (n.length < 2) { inp.focus(); return; }
      let p = same(n);
      if (!p) {
        p = A.addPeople([{ name: n.charAt(0).toUpperCase() + n.slice(1), reportsTo: App.S.personMap.p02 ? 'p02' : App.ME.id }])[0];
        U.toast('Added ' + esc(p.name) + ' (' + esc(p.initials) + '). ' + (E.isAdmin(App.ME) ? 'Give them a starting code under Settings → People so they can sign in.' : 'Iain will give them a code to sign in.'), 'good', 8000);
      }
      if (!sel.querySelector('option[value="' + esc(p.id) + '"]')) {
        const o = document.createElement('option'); o.value = p.id; o.textContent = p.name + ' (' + p.initials + ')';
        sel.insertBefore(o, sel.querySelector('option[value="__new"]'));
      }
      sel.value = p.id;
      box.remove();
      const h = App.onChange[sel.getAttribute('data-ch')];
      if (h) h(sel, ev);
    };
    box.querySelector('.btn.p').addEventListener('click', go);
    box.querySelectorAll('.btn')[1].addEventListener('click', done);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); go(); } if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(); } });
    inp.focus();
  }

  function onChange(ev) {
    /* "+ Someone new…" in any people picker: a name box right there, so a
       dialog it sits in stays open. */
    if (ev.target.tagName === 'SELECT' && ev.target.value === '__new') { addSomeone(ev.target, ev); return; }
    const t = ev.target.closest('[data-ch]');
    if (t && App.onChange[t.getAttribute('data-ch')]) App.onChange[t.getAttribute('data-ch')](t, ev);
  }
  function onInput(ev) {
    const t = ev.target.closest('[data-in]');
    if (t && App.onInput[t.getAttribute('data-in')]) App.onInput[t.getAttribute('data-in')](t, ev);
  }
  function onKey(ev) {
    const t = ev.target.closest('[data-key]');
    if (t && App.onKey[t.getAttribute('data-key')]) App.onKey[t.getAttribute('data-key')](t, ev);
    const row = ev.target.closest('[data-open]');
    if (row && ev.target === row && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); App.openItem(row.getAttribute('data-open')); }
  }

  App.on.tab = function (b) { App.go(b.getAttribute('data-v')); };
  App.on.signout = function () {
    Voice.stopDictation();
    if (window.MeetRoom) window.MeetRoom.stop();
    A.inMeeting(null);
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    if (C.mode === 'server') {
      document.body.innerHTML = '<div class="gate"><div class="gate-in"><div class="g-card"><p>Saving and signing out…</p></div></div></div>';
      window.Server.signout().then(function (r) {
        C.signOut();
        gateServer(r.lostChanges ? 'Signed out. Some changes couldn’t reach the server and weren’t saved.' : '');
      });
      return;
    }
    C.signOut();
    gate();
  };

  /* Changing your own code: the current one, then the new one twice. */
  App.on['my-code'] = function () {
    const server = C.mode === 'server';
    U.modal({ title: 'Change my sign-in code',
      body: '<p class="mini">At least 6 characters. ' + (server ? 'Your other devices will need the new code.' : 'This copy of the app is on this computer only.') + '</p>' +
        U.field('Current code', '<input class="in" id="mc-old" type="password" autocomplete="current-password" data-focus>') +
        U.field('New code', '<input class="in" id="mc-new" type="password" autocomplete="new-password">') +
        U.field('New code, once more', '<input class="in" id="mc-new2" type="password" autocomplete="new-password">'),
      foot: '<button class="btn" data-close>Cancel</button><button class="btn p" data-act="mc-save">Change it</button>' });
  };
  App.on['mc-save'] = function () {
    const v = function (id) { return document.getElementById(id).value; };
    if (v('mc-new') !== v('mc-new2')) { U.toast('The two new codes don’t match.', 'bad'); return; }
    if (C.mode === 'server') {
      window.Server.setPin(App.ME.id, v('mc-new'), v('mc-old')).then(function () { U.close(); U.toast('Changed. Use the new code from now on.', 'good'); })
        .catch(function (e) { U.toast(esc(e.message), 'bad'); });
      return;
    }
    if (App.ME.pinHash !== C.sha256('jormin:' + v('mc-old'))) { U.toast('Your current code isn’t right.', 'bad'); return; }
    if (v('mc-new').length < 4) { U.toast('At least 4 characters here.', 'bad'); return; }
    A.savePerson({ id: App.ME.id, name: App.ME.name }, v('mc-new'));
    U.close(); U.toast('Changed.', 'good');
  };

  /* The microphone next to any box. */
  App.on.dictate = function (b) {
    const sel = b.getAttribute('data-target');
    const el = document.querySelector(sel);
    if (!el) return;
    el.focus();
    Voice.dictate(el, b, function (msg) { U.toast(esc(msg), 'bad', 7000); });
  };

  /* ══ Shared pieces for the screens ═════════════════════════════════════ */

  App.head = function (title, hint, right) {
    return '<div class="sechead"><h2>' + title + '</h2>' + (right ? '<div class="rowend">' + right + '</div>' : '') + '</div>' +
      (hint ? '<p class="hint">' + hint + '</p>' : '');
  };

  App.nextMeetingFor = function (it) {
    if (!it || !it.series) return null;
    return E.nextMeeting(App.S, it.series, App.today).date;
  };

  /* One line of a to-do list. */
  App.row = function (it, opts) {
    opts = opts || {};
    const ME = App.ME, T = App.today;
    const part = E.myPart(it, ME.id);
    const closed = it.status === 'done' || it.status === 'dropped' || part === 'partdone';
    const fl = E.flags(App.S, it, T);
    const lu = E.lastUpdate(it);
    let lead;
    if (part === 'asked' || opts.other) {
      lead = '<span class="td-who">' + U.avatar(it.owner, 'sm') + '</span>';
    } else if (part === 'helper') {
      lead = '<span class="td-who" title="You are helping ' + esc(U.first(it.owner)) + '">' + U.avatar(it.owner, 'sm') + '</span>';
    } else {
      lead = '<button class="ck' + (closed ? ' on' : '') + '" data-act="tick" data-id="' + esc(it.id) + '" aria-label="' +
        (closed ? 'Not done after all' : 'Mark done') + '" title="' + (closed ? 'Not done after all' : 'Done') + '">' + U.icon('check') + '</button>';
    }
    let sub = U.source(it, ME);
    if (part === 'helper') sub += '<span class="src ask">Helping ' + esc(U.first(it.owner)) + '</span>';
    if ((it.everyone || []).length) {
      const n = Object.keys(it.parts || {}).length;
      sub += '<span class="src ask" title="Everyone named does their own part">' + (part === 'part' || part === 'partdone' ? 'Your part · ' : '') + n + ' of ' + it.everyone.length + ' done</span>';
    }
    if (!closed) sub += U.flagChips(fl, ['overdue']);
    if (it.steps && it.steps.length) {
      const sd = it.steps.filter(function (s) { return s.done; }).length;
      sub += '<span class="stp">' + sd + '/' + it.steps.length + ' steps</span>';
    }
    if (lu && lu.t && !opts.noUpdate) sub += '<span class="lu" title="' + esc(W.fmt(lu.on, 'med') + ' — ' + U.name(lu.by)) + '">' + esc(lu.t) + '</span>';
    const focusable = !closed && (part === 'owner' || part === 'part');
    return '<div class="td' + (closed ? ' closed' : '') + (it.high && !closed ? ' hi' : '') + '" data-open="' + esc(it.id) + '" tabindex="0">' +
      lead +
      '<div class="td-m"><div class="td-t">' + esc(it.title) + '</div>' + (sub ? '<div class="td-s">' + sub + '</div>' : '') + '</div>' +
      '<div class="td-r">' + (closed ? '' : U.pbar(it.progress)) + U.dueChip(it, T) +
      (focusable ? '<button class="sun' + (it.focus === T ? ' on' : '') + '" data-act="focus" data-id="' + esc(it.id) + '" title="' +
        (it.focus === T ? 'Take off today’s list' : 'Put on today’s list') + '" aria-label="Today’s list">' + U.sun(it.focus === T) + '</button>' : '<span class="sun-sp"></span>') +
      '</div></div>';
  };

  /* Ticking a box: done, or my part done, with a way back. */
  App.on.tick = function (b) {
    const id = b.getAttribute('data-id');
    const it = App.S.itemMap[id];
    const part = E.myPart(it, App.ME.id);
    if (part === 'partdone') { A.undoPart(id, App.ME.id); App.render(); return; }
    if (it.status === 'done') { A.reopen(id); App.render(); U.toast('Back on the list.', ''); return; }
    const wasFocus = it.focus;
    A.done(id);
    App.render();
    const now = App.S.itemMap[id];
    const s0 = now.series ? App.S.seriesMap[now.series] : null;
    U.toast(part === 'part' ? 'Your part is done.' :
      s0 ? 'Done. It will be read out under “done since last time” at the ' + esc(s0.name) + '.' : 'Done.', 'good', 5200,
      { label: 'Undo', fn: function () {
        if (part === 'part') A.undoPart(id, App.ME.id);
        else { A.reopen(id); if (wasFocus) A.focus(id, true); }
        App.render();
      } });
  };

  App.on.focus = function (b) {
    const it = App.S.itemMap[b.getAttribute('data-id')];
    A.focus(it.id, it.focus !== App.today);
    App.render();
    if (App.itemOpen === it.id) App.openItem(it.id, true);
  };

  /* ══ The action card ═══════════════════════════════════════════════════
     Opened from every list. Everything saves as it changes; a date that
     moves later on a meeting action asks why before it moves.            */

  let pendingDate = null;

  App.openItem = function (id, keep) {
    const S = App.S, T = App.today, ME = App.ME;
    const it = S.itemMap[id];
    if (!it || !E.canSee(S, ME, it)) { U.close(); App.itemOpen = null; return; }
    if (!keep) pendingDate = null;
    const can = E.canEdit(S, ME, it), upd = E.canUpdate(S, ME, it);
    const part = E.myPart(it, ME.id);
    const open = E.isOpen(it);
    const nm = App.nextMeetingFor(it);
    const fl = E.flags(S, it, T);

    const head = '<div class="ih"><div class="ih-top">' + U.kindPill(it.kind) + '<span class="ref">' + esc(it.ref) + '</span>' +
      U.source(it, ME) + (it.imported ? '<span class="src">Imported</span>' : '') + '</div>' +
      (can ? '<input class="in ih-title" id="it-title" data-ch="it-title" value="' + esc(it.title) + '" aria-label="Title">'
        : '<h3>' + esc(it.title) + '</h3>') + '</div>';

    /* Left: what it is, its steps, an update, its story. */
    let L = '';
    L += U.field('Detail', can ? '<textarea class="in" id="it-detail" data-ch="it-detail" rows="2" placeholder="What done looks like">' + esc(it.detail) + '</textarea>'
      : '<div class="ro">' + (esc(it.detail) || '<span class="mini">—</span>') + '</div>');
    if (it.kind === 'action') {
      if (upd && open) {
        L += '<div class="updbox"><label class="f"><span>Add an update</span>' +
          '<div class="inmic"><textarea class="in" id="it-upd" rows="2" placeholder="Where it stands — this is what the meeting will read"></textarea>' + U.micBtn('#it-upd') + '</div></label>' +
          '<div class="row"><button class="btn p sm" data-act="it-upd">Save update</button>' +
          '<span class="mini">Saved with your name and today’s date' + (A.meetingNow() ? ', and recorded in this meeting’s minutes' : '') + '.</span></div></div>';
      }
      if (it.steps.length || can) {
        L += '<div class="steps"><div class="lbl">Steps</div>' + it.steps.map(function (s, i) {
          return '<div class="st' + (s.done ? ' on' : '') + '"><button class="ck sm' + (s.done ? ' on' : '') + '" data-act="it-step" data-i="' + i + '"' + (upd ? '' : ' disabled') + '>' + U.icon('check') + '</button>' +
            '<span>' + esc(s.t) + '</span>' + (can ? '<button class="xs-x" data-act="it-step-x" data-i="' + i + '" title="Remove step">✕</button>' : '') + '</div>';
        }).join('') +
          (can ? '<div class="st add"><input class="in" id="it-step-new" data-key="it-step" placeholder="Add a step and press Enter"></div>' : '') +
          (can && open ? procPicker(it) : '') + '</div>';
      }
    }
    L += '<div class="hist"><div class="lbl">History</div>' + histHtml(it) + '</div>';

    /* Right: who, when, how far. */
    let R = '';
    if (it.kind === 'action') {
      R += '<div class="kvp">';
      R += U.field('Owner', can && !it.private ? U.selectOf('owner', U.whoOptions(it.series && S.seriesMap[it.series] ? S.seriesMap[it.series].members : null, null, { firstLabel: 'In the meeting' }), it.owner, 'data-ch="it-owner"')
        : '<div class="ro person">' + U.avatar(it.owner, 'sm') + ' ' + esc(U.name(it.owner)) + '</div>');
      if ((it.helpers || []).length) R += U.field('Helping', '<div class="ro">' + it.helpers.map(function (h) { return U.avatar(h, 'xs') + ' ' + esc(U.first(h)); }).join(' &nbsp; ') + '</div>');
      if ((it.everyone || []).length) {
        R += U.field('Everyone’s part', '<div class="parts">' + it.everyone.map(function (pid) {
          return '<span class="pt' + (it.parts[pid] ? ' on' : '') + '" title="' + esc(U.name(pid) + (it.parts[pid] ? ' — done ' + W.fmt(it.parts[pid], 'dm') : ' — not yet')) + '">' + U.avatar(pid, 'xs') + '</span>';
        }).join('') + '</div>');
      }
      /* The date, and why it moved. */
      let dateBox = '';
      if (can && open) {
        dateBox = '<div class="row"><input class="in" type="date" id="it-due" data-ch="it-due" value="' + esc(it.due || '') + '">' +
          '<button class="btn sm" data-act="it-nodate" title="No fixed date — reviewed at every meeting">Ongoing</button></div>' + U.dateChips(T, nm, 'data-act="it-date" data-d');
        if (pendingDate) {
          dateBox += '<div class="why"><b>Why is it moving to ' + esc(pendingDate.to ? W.fmt(pendingDate.to, 'short') : 'no date') + '?</b>' +
            '<p class="mini">It was due ' + esc(W.fmt(it.due, 'med')) + '. The reason goes in the history and the minutes.</p>' +
            '<div class="whys">' + D.SLIP.map(function (r) { return '<button class="dchip" data-act="it-why" data-why="' + esc(r.t) + '">' + esc(r.t) + '</button>'; }).join('') + '</div>' +
            '<button class="btn sm" data-act="it-why-x">Keep the old date</button></div>';
        }
      } else dateBox = '<div class="ro">' + U.dueChip(it, T) + '</div>';
      R += U.field('Due', dateBox, E.slips(it) ? 'Moved ' + E.slips(it) + '× — first due ' + esc(W.fmt(E.firstDue(it), 'med')) : '');

      if (open && upd) {
        R += U.field('How far', '<div class="seg prog">' + [0, 25, 50, 75].map(function (p) {
          return '<button data-act="it-prog" data-p="' + p + '" class="' + (it.progress === p ? 'on' : '') + '">' + p + '%</button>';
        }).join('') + '<button data-act="it-done" class="done-b">Done ' + U.icon('check') + '</button></div>');
        R += U.field('Waiting on someone?', it.status === 'waiting'
          ? '<div class="row"><span class="fl k-waiting">Waiting on ' + esc(it.waitingOn) + '</span><button class="btn sm" data-act="it-unwait">Not any more</button></div>'
          : '<div class="row"><input class="in" id="it-wait" placeholder="Who or what it’s waiting on" data-key="it-wait"><button class="btn sm" data-act="it-wait">Set</button></div>');
      } else if (!open) {
        R += '<div class="closedbox">' + (it.status === 'done' ? 'Done ' + esc(W.fmt(it.doneOn, 'med')) : 'Dropped') +
          (upd ? ' <button class="btn sm" data-act="it-reopen">Reopen</button>' : '') + '</div>';
      }
      R += '<div class="toggles">';
      if (open && (part === 'owner' || part === 'part')) R += '<label class="chk"><input type="checkbox" data-ch="it-focus"' + (it.focus === T ? ' checked' : '') + '> On my list for today</label>';
      if (open && it.series && upd) R += '<label class="chk"><input type="checkbox" data-ch="it-raise"' + (it.agenda ? ' checked' : '') + '> Ask to discuss it at the ' + esc(S.seriesMap[it.series].name) + '</label>';
      if (open && can) R += '<label class="chk"><input type="checkbox" data-ch="it-high"' + (it.high ? ' checked' : '') + '> Priority</label>';
      if (!it.series && !it.meeting && it.owner === ME.id && it.by === ME.id) R += '<label class="chk"><input type="checkbox" data-ch="it-private"' + (it.private ? ' checked' : '') + '> Private — only I can see it</label>';
      R += '</div>';
      R += U.field('Topic', can ? U.selectOf('topic', U.topicOptions(), it.topic, 'data-ch="it-topic"') : '<div class="ro">' + esc(U.topicName(it.topic)) + '</div>');
      R += '</div>';
      if (fl.length && open) R += '<div class="flrow">' + U.flagChips(fl) + '</div>';
    } else {
      R += '<div class="kvp">' + U.field('Recorded', '<div class="ro">' + esc(W.fmt(it.on, 'long')) + ' by ' + esc(U.name(it.by)) + '</div>') +
        U.field('Topic', can ? U.selectOf('topic', U.topicOptions(), it.topic, 'data-ch="it-topic"') : '<div class="ro">' + esc(U.topicName(it.topic)) + '</div>') + '</div>';
    }

    const foot = (open && can && it.kind === 'action' ? '<button class="btn dngr" data-act="it-drop">Drop…</button>' : '') +
      (!it.series && !it.meeting && it.by === ME.id ? '<button class="btn dngr" data-act="it-del">Delete</button>' : '') +
      '<span class="rowend"></span><button class="btn p" data-close>Close</button>';

    const body = '<div class="icard-grid"><div class="ic-l">' + L + '</div><div class="ic-r">' + R + '</div></div>';
    const dlg = document.querySelector('.dlg.itemdlg');
    if (keep && dlg) {
      const b = dlg.querySelector('.dlg-b'), sc = b.scrollTop;
      const typed = (dlg.querySelector('#it-upd') || {}).value || '';
      dlg.querySelector('.dlg-h').innerHTML = head + '<button class="x" data-close aria-label="Close">✕</button>';
      b.innerHTML = body;
      dlg.querySelector('.dlg-f').innerHTML = foot;
      b.scrollTop = sc;
      const u = dlg.querySelector('#it-upd'); if (u && typed) u.value = typed;
    } else {
      U.modal({ head: head, body: body, foot: foot, wide: true, cls: 'itemdlg',
        onClose: function () { App.itemOpen = null; pendingDate = null; Voice.stopDictation(); } });
    }
    App.itemOpen = id;
  };

  function histHtml(it) {
    const S = App.S;
    const rows = (it.hist || []).slice().reverse().filter(function (h) { return h.k !== 'noted'; }).map(function (h) {
      const m = h.m && S.meetingMap[h.m];
      const at = m ? ' <span class="at">at the ' + esc((S.seriesMap[m.series] || {}).name || 'meeting') + '</span>' : '';
      let t = '';
      switch (h.k) {
        case 'new': t = 'Raised' + (h.to && h.to.due ? ', due ' + esc(W.fmt(h.to.due, 'med')) : '') + (h.to && h.to.owner ? ', for ' + esc(U.first(h.to.owner)) : ''); break;
        case 'upd': t = '<q>' + esc(h.t) + '</q>'; break;
        case 'prog': t = 'Progress ' + (+h.from || 0) + '% → ' + (+h.to || 0) + '%'; break;
        case 'due': t = '<b class="' + (h.from && h.to && h.to > h.from ? 'mv' : '') + '">Date ' + (h.from ? esc(W.fmt(h.from, 'dm')) : 'none') + ' → ' + (h.to ? esc(W.fmt(h.to, 'dm')) : 'ongoing') + '</b>' + (h.why ? ' — ' + esc(h.why) : ''); break;
        case 'done': t = '<b class="ok">Done</b>' + (h.t ? ' — <q>' + esc(h.t) + '</q>' : ''); break;
        case 'reopen': t = 'Reopened'; break;
        case 'drop': t = '<b>Dropped</b> — ' + esc(h.why || ''); break;
        case 'wait': t = 'Waiting on ' + esc(h.t); break;
        case 'unwait': t = 'No longer waiting'; break;
        case 'owner': t = 'Passed from ' + esc(U.first(h.from)) + ' to ' + esc(U.first(h.to)); break;
        case 'part': t = esc(h.t) + ' did their part'; break;
        case 'listed': t = 'Last commented on in the list it came from'; break;
        default: t = esc(h.k);
      }
      return '<div class="hr"><span class="hd">' + esc(W.fmt(h.on, 'dm')) + '</span><span class="hw">' + U.avatar(h.by, 'xs') + '</span><span class="ht">' + t + at + '</span></div>';
    });
    return rows.length ? rows.join('') : '<div class="mini">Nothing yet.</div>';
  }

  /* A department's procedures, any case of which can become this to-do's
     steps. The best matches for its words come first, when there are any. */
  function procPicker(it) {
    const ch = E.procedureChoices(App.S, it);
    if (!ch.length) return '';
    const label = function (o) {
      const w = o.when ? ' — ' + o.when.replace(/\s*:\s*$/, '').replace(/^[A-Z](?=[a-z])/, function (c) { return c.toLowerCase(); }) : '';
      const t = o.proc.no + ' ' + o.proc.name + w;
      return t.length > 110 ? t.slice(0, 107) + '…' : t;
    };
    const val = function (o) { return o.topic + '|' + o.proc.id + '|' + o.bi; };
    const best = ch.slice().sort(function (a, b) { return b.score - a.score; });
    const sugg = best.filter(function (o, i) { return i < 2 && o.score >= 2.5 && o.score >= 0.75 * best[0].score; });
    const rows = [{ v: '', t: 'Add the steps of a procedure…' }];
    if (sugg.length) rows.push({ group: 'Suggested', rows: sugg.map(function (o) { return { v: val(o), t: label(o) }; }) });
    const byT = {};
    ch.forEach(function (o) { (byT[o.topicName] = byT[o.topicName] || []).push({ v: val(o), t: label(o) }); });
    Object.keys(byT).forEach(function (n) { rows.push({ group: n, rows: byT[n] }); });
    return '<div class="st add procpick">' + U.selectOf('proc', rows, '', 'data-ch="it-proc"') + '</div>';
  }

  function cur() { return App.S.itemMap[App.itemOpen]; }
  function refresh() { App.render(); if (App.itemOpen) App.openItem(App.itemOpen, true); }

  App.onChange['it-title'] = function (el) { const v = el.value.trim(); if (v && v !== cur().title) { A.edit(cur().id, { title: v }); refresh(); } };
  App.onChange['it-detail'] = function (el) { if (el.value !== cur().detail) { A.edit(cur().id, { detail: el.value.trim() }); refresh(); } };
  App.onChange['it-topic'] = function (el) { A.edit(cur().id, { topic: el.value }); refresh(); };
  App.onChange['it-owner'] = function (el) { if (el.value && el.value !== cur().owner) { A.reassign(cur().id, el.value); U.toast('Now on ' + esc(U.first(el.value)) + '’s list.', 'good'); refresh(); } };
  App.onChange['it-focus'] = function (el) { A.focus(cur().id, el.checked); refresh(); };
  App.onChange['it-raise'] = function (el) { A.raise(cur().id, el.checked ? cur().series : null); refresh(); };
  App.onChange['it-high'] = function (el) { A.edit(cur().id, { high: el.checked }, (el.checked ? 'Marked ' : 'Unmarked ') + cur().ref + ' as priority'); refresh(); };
  App.onChange['it-private'] = function (el) { A.edit(cur().id, { private: el.checked }); refresh(); };
  App.onChange['it-due'] = function (el) { askDate(el.value || null); };

  App.on['it-date'] = function (b) { askDate(b.getAttribute('data-d')); };
  App.on['it-nodate'] = function () { askDate(null); };

  /* Moving a meeting action later needs a reason; anything else just moves. */
  function askDate(to) {
    const it = cur();
    if (to === it.due) return;
    const later = it.due && (!to || to > it.due);
    if (later && (it.series || it.by !== it.owner)) { pendingDate = { to: to }; App.openItem(it.id, true); return; }
    A.move(it.id, to, '');
    pendingDate = null;
    refresh();
  }
  App.on['it-why'] = function (b) {
    A.move(cur().id, pendingDate.to, b.getAttribute('data-why'));
    pendingDate = null;
    U.toast('Moved, with the reason on record.', 'good');
    refresh();
  };
  App.on['it-why-x'] = function () { pendingDate = null; App.openItem(cur().id, true); };

  App.on['it-upd'] = function () {
    const el = document.getElementById('it-upd');
    if (!el || !el.value.trim()) { U.toast('Say where it stands first.', 'bad'); return; }
    Voice.stopDictation();
    A.update(cur().id, el.value);
    el.value = '';
    U.toast('Update saved.', 'good');
    refresh();
  };
  App.on['it-prog'] = function (b) { A.progress(cur().id, +b.getAttribute('data-p')); refresh(); };
  App.on['it-done'] = function () {
    const el = document.getElementById('it-upd');
    const t = el && el.value.trim();
    A.done(cur().id, t || '');
    U.toast('Done.', 'good');
    refresh();
  };
  App.on['it-reopen'] = function () { A.reopen(cur().id); refresh(); };
  App.on['it-wait'] = function () {
    const el = document.getElementById('it-wait');
    if (!el.value.trim()) { el.focus(); return; }
    A.wait(cur().id, el.value.trim()); refresh();
  };
  App.onKey['it-wait'] = function (el, ev) { if (ev.key === 'Enter') App.on['it-wait'](); };
  App.on['it-unwait'] = function () { A.unwait(cur().id); refresh(); };
  App.on['it-step'] = function (b) {
    const it = cur(), list = C.clone(it.steps), i = +b.getAttribute('data-i');
    list[i].done = !list[i].done; A.steps(it.id, list); refresh();
  };
  App.on['it-step-x'] = function (b) {
    const it = cur(), list = C.clone(it.steps); list.splice(+b.getAttribute('data-i'), 1); A.steps(it.id, list); refresh();
  };
  App.onChange['it-proc'] = function (el) {
    const v = String(el.value).split('|');
    if (v.length !== 3) return;
    const t = (App.S.topics || []).find(function (x) { return x.id === v[0]; });
    const pr = t && (t.procs || []).find(function (x) { return x.id === v[1]; });
    const b = pr && pr.br[+v[2]];
    if (!b) return;
    const it = cur(), list = C.clone(it.steps);
    const add = window.Importer.checklist(b);
    add.forEach(function (x) { list.push({ t: x.length > 600 ? x.slice(0, 597) + '…' : x, done: false }); });
    const over = list.length > 100;
    A.steps(it.id, list.slice(0, 100));
    U.toast('Added ' + add.length + ' steps from ' + esc(pr.no + ' ' + pr.name) + '.' + (over ? ' A to-do holds 100 steps at most; the rest were left off.' : ''), over ? 'bad' : 'good');
    refresh();
  };
  App.onKey['it-step'] = function (el, ev) {
    if (ev.key !== 'Enter' || !el.value.trim()) return;
    ev.preventDefault();
    const it = cur(), list = C.clone(it.steps); list.push({ t: el.value.trim(), done: false });
    A.steps(it.id, list); refresh();
    setTimeout(function () { const n = document.getElementById('it-step-new'); if (n) n.focus(); }, 20);
  };
  let dropping = null;
  App.on['it-drop'] = function () {
    const it = cur();
    dropping = it.id;
    U.modal({
      title: 'Drop ' + it.ref + '?',
      body: '<p class="lede">Dropping keeps it in the history and the minutes with the reason, so nobody wonders later what happened to it.</p>' +
        '<div class="whys">' + D.DROP.map(function (r) { return '<button class="dchip" data-act="it-drop-why" data-why="' + esc(r) + '">' + esc(r) + '</button>'; }).join('') + '</div>',
      foot: '<button class="btn" data-close>Keep it</button>'
    });
  };
  App.on['it-drop-why'] = function (b) {
    const id = dropping;
    if (!id) return;
    dropping = null;
    A.drop(id, b.getAttribute('data-why'));
    U.close(); App.render();
    U.toast('Dropped — ' + esc(b.getAttribute('data-why')) + '.', '', 5000, { label: 'Undo', fn: function () { A.reopen(id); App.render(); } });
  };
  App.on['it-del'] = function () {
    const it = cur();
    U.confirm({ title: 'Delete this to-do?', body: '<p>“' + esc(it.title) + '” will be gone for good. It was never part of a meeting, so no minutes refer to it.</p>',
      yes: 'Delete', tone: 'danger' }).then(function (yes) { if (yes) { A.remove(it.id); App.render(); } });
  };

  return App;
})();

</script>
<script>/* todo.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — My to-do
   Everyone's front door. Actions from meetings sit here beside the things
   people add for themselves, so there is one list, not a sheet for the
   meeting and a notebook for the day. "Today" is the short list someone
   picks each morning; that is the daily work a manager can see.
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  'use strict';
  const BOT = (window.JOR_MIN_DATA && window.JOR_MIN_DATA.BOT) || 'O’Reilly AI';   // the assistant's name on screen (data.js)

  const App = window.App, C = window.Core, E = window.Engine, W = window.When, U = window.UI, A = window.Actions;
  const esc = C.esc;

  let show = 'all';
  let showDone = false;
  let quick = '';

  App.views.todo = { render: render };

  function mine() {
    const S = App.S, ME = App.ME;
    return S.items.filter(function (it) {
      if (it.kind !== 'action' || !E.canSee(S, ME, it)) return false;
      const p = E.myPart(it, ME.id);
      return p === 'owner' || p === 'part' || p === 'partdone' || p === 'helper';
    });
  }

  function isOpenForMe(it) {
    const p = E.myPart(it, App.ME.id);
    if (p === 'partdone') return false;
    if (p === 'part') return it.status !== 'dropped' && it.status !== 'done';
    return E.isOpen(it);
  }

  function greet() {
    const h = new Date().getHours();
    return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  }

  function render() {
    const S = App.S, ME = App.ME, T = App.today;
    let list = mine();
    const all = list.slice();
    if (show === 'meet') list = list.filter(function (it) { return it.series; });
    if (show === 'own') list = list.filter(function (it) { return !it.series && it.by === ME.id; });
    if (show === 'from') list = list.filter(function (it) { return !it.series && it.by !== ME.id; });

    const open = list.filter(isOpenForMe);
    const todayL = open.filter(function (it) { return it.focus === T || (it.due === T && it.status !== 'waiting'); });
    const rest = open.filter(function (it) { return todayL.indexOf(it) < 0; });
    const b = { overdue: [], week: [], later: [], nodate: [], waiting: [] };
    rest.forEach(function (it) {
      let k = E.bucket(it, T);
      if (k === 'today') k = 'week';
      (b[k] || b.later).push(it);
    });
    const byDue = function (a, c) { return (a.due || '9999') < (c.due || '9999') ? -1 : (a.due || '9999') > (c.due || '9999') ? 1 : (a.on < c.on ? -1 : 1); };
    Object.keys(b).forEach(function (k) { b[k].sort(byDue); });
    todayL.sort(function (a, c) { return (c.high ? 1 : 0) - (a.high ? 1 : 0) || byDue(a, c); });
    const carry = open.filter(function (it) { return it.focus && it.focus < T && todayL.indexOf(it) < 0; });
    const done7 = list.filter(function (it) {
      const p = E.myPart(it, ME.id);
      const d = p === 'partdone' ? it.parts[ME.id] : it.status === 'done' ? it.doneOn : null;
      return d && d >= W.add(T, -6) && p !== 'helper';
    }).sort(function (a, c) { return (c.doneOn || '') < (a.doneOn || '') ? -1 : 1; });

    const st = E.personStats(S, ME.id, T);

    let h = '<div class="pagehead todohead"><div class="ph-row"><div>' +
      '<div class="ph-date">' + esc(W.fmt(T, 'long')) + '</div>' +
      '<h2>' + greet() + ', ' + esc(ME.first) + '</h2>' +
      '<p>' + st.open + ' open' + (st.overdue ? ' · <b>' + st.overdue + ' overdue</b>' : '') + ' · ' + st.todayList.length + ' on today’s list · ' +
      st.done7 + ' done this week' + (st.fromMeetings ? ' · ' + st.fromMeetings + ' from meetings' : '') + '</p></div>' +
      '</div></div>';

    /* Add a to-do in one line, typed or spoken. */
    h += '<div class="card qadd"><div class="qrow">' +
      '<input class="in qin" id="q-in" data-in="q" data-key="q" autocomplete="off" value="' + esc(quick) + '" ' +
      'placeholder="Add a to-do">' +
      U.micBtn('#q-in', 'Say it instead') +
      '<button class="btn p" data-act="q-add">' + U.icon('plus') + 'Add</button></div>' +
      '<div class="qprev" id="q-prev">' + preview(quick) + '</div></div>';

    h += prep();
    if (!S.items.length && E.isAdmin(ME)) {
      h += '<div class="card welcome"><div class="card-b"><h3>Welcome, ' + esc(ME.first) + '</h3><div class="wl">' +
        '<div><b>Start from the minutes you already have.</b><p>Settings → Bring the spreadsheet across reads the workbook, tab by tab, and puts every open action on its owner’s list.</p>' +
        '<button class="btn p" data-go="admin/import">' + U.icon('upload') + 'Bring it across</button></div>' +
        '<div><b>Set up ' + BOT + '.</b><p>A free key lets recordings, photos of handwritten notes and typed notes be written up into the minutes, with to-dos for each person.</p>' +
        '<button class="btn" data-go="admin/gemini">Set up ' + BOT + '</button></div>' +
        '<div><b>Add surnames and email addresses.</b><p>For the daily and weekly emails, and so everyone’s name is right on the minutes.</p>' +
        '<button class="btn" data-go="admin/people">People</button></div></div></div></div>';
    }

    h += '<div class="todo-grid"><div class="todo-main">';

    h += section('today', 'Today', todayL, todayL.length ? 'What you’re getting done today' : '',
      (carry.length ? '<div class="carry">' + carry.length + ' from ' + esc(W.fmt(carry[0].focus, 'day')) + '’s list ' +
        (carry.length === 1 ? 'isn’t' : 'aren’t') + ' done yet. <button class="btn sm" data-act="carry" data-ids="' + carry.map(function (x) { return esc(x.id); }).join(',') + '">Add ' + (carry.length === 1 ? 'it' : 'them') + ' to today</button></div>' : '') +
      (todayL.length ? '' : '<div class="empty-today">Nothing on today’s list. Tap the ' + U.sun(false) + ' on anything below to put it here — it is the short list you mean to finish today.</div>'));
    h += section('overdue', 'Overdue', b.overdue);
    h += section('week', 'Later this week', b.week);
    h += section('later', 'Coming up', b.later);
    h += section('nodate', 'No date', b.nodate, b.nodate.length ? 'Ongoing work and things without a deadline' : '');
    h += section('waiting', 'Waiting on someone', b.waiting);

    if (done7.length) {
      h += '<section class="sect s-done"><button class="sect-h tog" data-act="todo-done">' +
        '<h3>Done this week</h3><span class="n">' + done7.length + '</span><span class="chev">' + (showDone ? '▾' : '▸') + '</span></button>' +
        (showDone ? '<div class="rows">' + done7.map(function (it) { return App.row(it); }).join('') + '</div>' : '') + '</section>';
    }
    if (!open.length && !done7.length) {
      h += '<div class="empty"><b>Nothing here.</b>' + (show === 'all' ? 'Add a to-do above, or wait for your next meeting.' : 'Try “All”.') + '</div>';
    }
    h += '</div>';

    /* The side column. */
    h += '<aside class="todo-side">';
    h += '<div class="card"><div class="card-b"><div class="lbl">Show</div><div class="seg wide">' +
      [['all', 'All'], ['meet', 'Meetings'], ['own', 'Mine'], ['from', 'From others']].map(function (x) {
        const n = x[0] === 'all' ? all.filter(isOpenForMe).length : x[0] === 'meet' ? all.filter(function (it) { return it.series && isOpenForMe(it); }).length :
          x[0] === 'own' ? all.filter(function (it) { return !it.series && it.by === ME.id && isOpenForMe(it); }).length :
            all.filter(function (it) { return !it.series && it.by !== ME.id && isOpenForMe(it); }).length;
        return '<button class="' + (show === x[0] ? 'on' : '') + '" data-act="todo-show" data-s="' + x[0] + '">' + x[1] + ' <small>' + n + '</small></button>';
      }).join('') + '</div></div></div>';

    h += weekStrip(all);
    h += window.Digest.card();
    h += myMeetings();
    h += askedOthers();
    h += '</aside></div>';
    return h;
  }

  function section(k, title, items, hint, extra) {
    if (!items.length && k !== 'today') return '';
    return '<section class="sect s-' + k + '"><div class="sect-h">' + (k === 'today' ? '<span class="sect-ic">' + U.sun(true) + '</span>' : '') +
      '<h3>' + esc(title) + '</h3><span class="n">' + items.length + '</span>' + (hint ? '<span class="sect-hint">' + esc(hint) + '</span>' : '') + '</div>' +
      (extra || '') + '<div class="rows">' + items.map(function (it) { return App.row(it); }).join('') + '</div></section>';
  }

  /* ══ Quick add ═════════════════════════════════════════════════════════ */

  function parsed(text) {
    return E.parseQuick(App.S, text, App.today, {});
  }

  function preview(text) {
    if (!text.trim()) return '<span class="mini">Type a date the way you’d say it — “fri”, “next week”, “end of month”, “9 Oct”. ' +
      '@ and someone’s initials puts it on their list. ! marks it a priority.</span>';
    const q = parsed(text);
    let h = '<span class="qp-t">' + esc(q.title || '…') + '</span>';
    if (q.due) h += '<span class="due ' + (q.due <= App.today ? 'today' : 'week') + '">' + U.icon('cal') + esc(W.fmt(q.due, 'short')) + '</span>';
    if (q.owner && q.owner !== App.ME.id) h += '<span class="src ask">' + U.avatar(q.owner, 'xs') + ' For ' + esc(U.name(q.owner)) + '</span>';
    if (q.high) h += '<span class="fl k-high">Priority</span>';
    return h + '<span class="mini qp-k">Enter to add</span>';
  }

  App.onInput.q = function (el) {
    quick = el.value;
    const p = document.getElementById('q-prev');
    if (p) p.innerHTML = preview(quick);
  };
  App.onKey.q = function (el, ev) { if (ev.key === 'Enter') { ev.preventDefault(); App.on['q-add'](); } };

  App.on['q-add'] = function () {
    const el = document.getElementById('q-in');
    const text = (el ? el.value : quick).trim();
    if (!text) { el && el.focus(); return; }
    Voice.stopDictation();
    const q = parsed(text);
    if (!q.title) { U.toast('Say what needs doing as well as when.', 'bad'); return; }
    const other = q.owner && q.owner !== App.ME.id;
    A.create({ kind: 'action', title: q.title, due: q.due, owner: q.owner || App.ME.id, high: q.high,
      focus: !other && q.due === App.today ? App.today : null,
      topic: 'ops' });
    quick = '';
    App.render();
    const n = document.getElementById('q-in'); if (n) n.focus();
    U.toast(other ? 'On ' + esc(U.first(q.owner)) + '’s list. It shows under “Asked of others” until it’s done.' :
      'Added' + (q.due ? ' — due ' + esc(W.fmt(q.due, 'short')) : '') + '.', 'good');
  };

  App.on['todo-show'] = function (b) { show = b.getAttribute('data-s'); App.render(); };
  App.on['todo-done'] = function () { showDone = !showDone; App.render(); };
  App.on.carry = function (b) {
    const ids = b.getAttribute('data-ids').split(',');
    A.carryToday(ids); App.render();
  };

  /* ══ Before the meeting ════════════════════════════════════════════════
     The meeting goes faster when owners have already said where things
     stand. This asks, a few days ahead, only for what has no update.    */

  function stale() {
    const S = App.S, ME = App.ME, T = App.today;
    const out = [];
    S.series.forEach(function (s) {
      if (s.members.indexOf(ME.id) < 0) return;
      const nm = E.nextMeeting(S, s.id, T);
      if (W.diff(T, nm.date) > 7 || (nm.m && nm.m.status === 'live')) return;
      const prev = E.lastClosed(S, s.id);
      const since = prev ? prev.date : '0000';
      const mineOpen = S.items.filter(function (it) {
        const p = E.myPart(it, ME.id);
        return it.series === s.id && it.kind === 'action' && isOpenForMe(it) && (p === 'owner' || p === 'part');
      });
      const need = mineOpen.filter(function (it) {
        return !(it.hist || []).some(function (h) { return h.on > since && h.k !== 'noted' && (h.by === ME.id || h.k === 'new'); });
      });
      if (need.length) out.push({ s: s, date: nm.date, m: nm.m, since: since, need: need, total: mineOpen.length });
    });
    return out;
  }

  function prep() {
    return stale().map(function (x) {
      return '<div class="prep"><div class="prep-ic">' + U.icon('people') + '</div><div class="prep-t"><b>' + esc(x.s.name) + '</b> is on ' +
        esc(W.fmt(x.date, 'short')) + (W.relNote(x.date, App.today) ? ' (' + esc(W.relNote(x.date, App.today)) + ')' : '') + '. ' +
        x.need.length + ' of your ' + x.total + ' action' + (x.total === 1 ? '' : 's') + ' from it ' + (x.need.length === 1 ? 'has' : 'have') + ' no update since ' +
        esc(x.since > '0000' ? W.fmt(x.since, 'dm') : 'it was raised') + '. A line each now, and the meeting won’t have to ask.</div>' +
        '<button class="btn g" data-act="prep-upd" data-s="' + esc(x.s.id) + '">Update them</button></div>';
    }).join('');
  }

  App.on['prep-upd'] = function (b) {
    const x = stale().find(function (y) { return y.s.id === b.getAttribute('data-s'); });
    if (!x) return;
    U.modal({
      title: 'Before the ' + x.s.name,
      sub: '<span class="mini">' + esc(W.fmt(x.date, 'long')) + ' — a line on each of these, or tick the ones that are done.</span>',
      wide: true,
      body: x.need.map(function (it) {
        const lu = E.lastUpdate(it);
        return '<div class="pu" data-id="' + esc(it.id) + '"><div class="pu-h"><b>' + esc(it.title) + '</b><span class="ref">' + esc(it.ref) + '</span>' +
          U.dueChip(it, App.today) + U.flagChips(E.flags(App.S, it, App.today), ['overdue']) + '</div>' +
          (lu ? '<div class="mini">Last: “' + esc(lu.t) + '” — ' + esc(W.fmt(lu.on, 'dm')) + '</div>' : '') +
          '<div class="inmic"><textarea class="in" id="pu-' + it.id + '" rows="2" placeholder="Where it stands"></textarea>' + U.micBtn('#pu-' + it.id) + '</div>' +
          '<div class="row"><div class="seg prog sm">' + [0, 25, 50, 75].map(function (p) {
            return '<button data-act="pu-prog" data-id="' + esc(it.id) + '" data-p="' + p + '" class="' + (it.progress === p ? 'on' : '') + '">' + p + '%</button>';
          }).join('') + '</div><button class="btn sm" data-act="pu-done" data-id="' + esc(it.id) + '">' + U.icon('check') + ' Done</button></div></div>';
      }).join(''),
      foot: '<button class="btn" data-close>Later</button><button class="btn p" data-act="pu-save">Save updates</button>'
    });
  };
  App.on['pu-prog'] = function (b) {
    const id = b.getAttribute('data-id');
    A.progress(id, +b.getAttribute('data-p'));
    b.parentNode.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
  };
  App.on['pu-done'] = function (b) {
    const id = b.getAttribute('data-id');
    const t = document.getElementById('pu-' + id);
    A.done(id, t ? t.value : '');
    const box = b.closest('.pu'); box.classList.add('pu-done');
    box.querySelector('.row').innerHTML = '<span class="fl k-ok">' + U.icon('check') + ' Done</span>';
    if (t) t.disabled = true;
  };
  App.on['pu-save'] = function () {
    let n = 0;
    document.querySelectorAll('.pu').forEach(function (box) {
      const id = box.getAttribute('data-id');
      const t = document.getElementById('pu-' + id);
      if (t && !t.disabled && t.value.trim()) { A.update(id, t.value); n++; }
    });
    Voice.stopDictation();
    U.close(); App.render();
    U.toast(n ? n + ' update' + (n === 1 ? '' : 's') + ' saved. The meeting will see them.' : 'Nothing typed — nothing saved.', n ? 'good' : '');
  };

  /* ══ Side panels ═══════════════════════════════════════════════════════ */

  function weekStrip(all) {
    const T = App.today, mon = W.mondayOf(T);
    const days = [0, 1, 2, 3, 4].map(function (i) {
      const d = W.add(mon, i);
      const due = all.filter(function (it) { return isOpenForMe(it) && it.due === d; }).length;
      const done = all.filter(function (it) { return (it.status === 'done' && it.doneOn === d) || (it.parts && it.parts[App.ME.id] === d); }).length;
      return { d: d, due: due, done: done };
    });
    const max = Math.max.apply(null, days.map(function (x) { return Math.max(x.due, x.done); }).concat([3]));
    return '<div class="card"><div class="card-h"><h3>Your week</h3><span class="note">due · done</span></div><div class="card-b wk">' +
      days.map(function (x) {
        const now = x.d === T, past = x.d < T;
        return '<div class="wkd' + (now ? ' now' : '') + '" title="' + esc(W.fmt(x.d, 'long') + ': ' + x.due + ' due, ' + x.done + ' done') + '">' +
          '<div class="wkb"><i class="bd" style="height:' + (x.due / max * 100).toFixed(0) + '%"></i><i class="bn" style="height:' + (x.done / max * 100).toFixed(0) + '%"></i></div>' +
          '<div class="wkl">' + W.DSHORT[W.dow(x.d)] + '</div><div class="wkn">' + (past ? x.done : x.due) + '</div></div>';
      }).join('') + '</div><div class="wk-leg"><span><i class="bd"></i>Due</span><span><i class="bn"></i>Done</span></div></div>';
  }

  function myMeetings() {
    const S = App.S, ME = App.ME, T = App.today;
    const rows = S.series.filter(function (s) { return s.members.indexOf(ME.id) >= 0; }).map(function (s) {
      const nm = E.nextMeeting(S, s.id, T);
      const mineOpen = S.items.filter(function (it) {
        const p = E.myPart(it, ME.id);
        return it.series === s.id && it.kind === 'action' && isOpenForMe(it) && (p === 'owner' || p === 'part');
      });
      const over = mineOpen.filter(function (it) { return it.due && it.due < T; }).length;
      return '<div class="mm" ' + (nm.m ? 'data-go="meeting/' + esc(nm.m.id) + '" role="button" tabindex="0"' : '') + '>' +
        '<i class="mm-t" style="background:' + U.tint(s.tint) + '"></i><div class="mm-m"><b>' + esc(s.name) + '</b>' +
        '<span>' + (nm.m && nm.m.status === 'live' ? '<b class="livetxt">Live now</b>' : esc(W.fmt(nm.date, 'short')) + (W.relNote(nm.date, T) ? ' · ' + esc(W.relNote(nm.date, T)) : '')) + '</span></div>' +
        '<div class="mm-n"><b>' + mineOpen.length + '</b><span>yours' + (over ? ', <em>' + over + ' over</em>' : '') + '</span></div></div>';
    });
    if (!rows.length) return '';
    return '<div class="card"><div class="card-h"><h3>Your meetings</h3></div><div class="card-b tight">' + rows.join('') + '</div></div>';
  }

  function askedOthers() {
    const S = App.S, ME = App.ME, T = App.today;
    const list = S.items.filter(function (it) {
      return it.kind === 'action' && it.by === ME.id && it.owner !== ME.id && !it.meeting && E.isOpen(it);
    }).sort(function (a, b) { return (a.due || '9') < (b.due || '9') ? -1 : 1; });
    if (!list.length) return '';
    return '<div class="card"><div class="card-h"><h3>Asked of others</h3><span class="note">' + list.length + ' open</span></div><div class="card-b tight">' +
      list.slice(0, 8).map(function (it) {
        return '<div class="askrow" data-open="' + esc(it.id) + '" tabindex="0">' + U.avatar(it.owner, 'xs') + '<span class="askrow-t">' + esc(it.title) + '</span>' + U.dueChip(it, T) + '</div>';
      }).join('') + '</div></div>';
  }
})();

</script>
<script>/* meet.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — meetings
   The list of meetings, the preparation page, and the meeting room.

   The meeting room replaces reading the spreadsheet top to bottom. The
   agenda is built from the register: what has been done since last time
   (read out, no discussion), what needs the meeting (overdue, moved, no
   update, waiting, asked for), what is on track (nodded through), the
   standing items, and anything the team raised. Every button on an action
   writes to that action, tagged with this meeting, and the minutes are
   written from those changes when the meeting closes.
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  'use strict';
  const BOT = (window.JOR_MIN_DATA && window.JOR_MIN_DATA.BOT) || 'O’Reilly AI';   // the assistant's name on screen (data.js)

  const App = window.App, C = window.Core, E = window.Engine, W = window.When, U = window.UI, A = window.Actions, D = window.JOR_MIN_DATA;
  const esc = C.esc;

  const room = { cur: null, kind: 'action', ownerSet: false, dueSet: false, listening: null, interim: '', playing: null,
    sugg: [], showTx: false, capText: '', capOwner: '', capDue: '' };

  App.views.meetings = { render: list };
  App.views.meeting = { render: one, after: after };

  /* ══ The list of meetings ══════════════════════════════════════════════ */

  function list() {
    const S = App.S, ME = App.ME, T = App.today;
    const series = S.series.filter(function (s) { return ME.access === 'owner' || s.members.indexOf(ME.id) >= 0 || E.isAdmin(ME); });
    let h = App.head('Meetings', 'Each meeting reviews one running list of actions. Nothing is copied from the last meeting: ' +
      'whatever is still open comes forward on its own, and the minutes are written from what happened to each action.',
      '<button class="btn" data-act="m-xlsx">' + U.icon('down') + 'All minutes in Excel</button>' + (E.canMinute(S, ME) ? '<button class="btn p" data-act="m-new">' + U.icon('plus') + 'New meeting</button>' : ''));
    if (!S.meetings.length) h += welcome();

    h += '<div class="scards">' + series.map(function (s) {
      const nm = E.nextMeeting(S, s.id, T);
      const acts = S.items.filter(function (it) { return it.series === s.id && it.kind === 'action' && !it.private; });
      const open = acts.filter(E.isOpen);
      const over = open.filter(function (it) { return it.due && it.due < T; }).length;
      const moved = open.filter(function (it) { return E.slips(it) >= 2; }).length;
      const last = E.lastClosed(S, s.id);
      const doneSince = last ? acts.filter(function (it) { return it.status === 'done' && it.doneOn > last.date; }).length : 0;
      const past = E.meetingsOf(S, s.id).filter(function (m) { return m.status === 'closed'; }).length;
      const live = nm.m && nm.m.status === 'live';
      return '<div class="scard" style="--t:' + U.tint(s.tint) + '">' +
        '<div class="sc-h"><h3>' + esc(s.name) + '</h3><span class="mini">' + (s.every === 7 ? 'Weekly' : s.every === 14 ? 'Every two weeks' : 'Every four weeks') +
        ' · ' + esc(W.fmt(nm.date, 'day').slice(0, 3)) + ' ' + esc(s.time) + ' · ' + esc(s.place) + '</span></div>' +
        '<div class="sc-next">' + (live ? '<span class="livedot"></span><b>Live now</b>' :
          '<span class="mini">Next</span><b>' + esc(W.fmt(nm.date, 'short')) + '</b><span class="mini">' + esc(W.relNote(nm.date, T)) + '</span>') + '</div>' +
        '<div class="sc-stats">' +
        '<div><b>' + open.length + '</b><span>open</span></div>' +
        '<div class="' + (over ? 'bad' : '') + '"><b>' + over + '</b><span>overdue</span></div>' +
        '<div class="' + (moved ? 'warn' : '') + '"><b>' + moved + '</b><span>moved 2+ times</span></div>' +
        '<div class="' + (doneSince ? 'good' : '') + '"><b>' + doneSince + '</b><span>done since last</span></div></div>' +
        '<div class="sc-f">' + U.avatars(s.members, 8) +
        (nm.m ? '<button class="btn ' + (live ? 'g' : 'p') + ' sm" data-go="meeting/' + esc(nm.m.id) + '">' + (live ? 'Join' : 'Prepare') + U.icon('arrow') + '</button>'
          : ((s.members.indexOf(ME.id) >= 0 || E.isAdmin(ME)) && E.canMinute(S, ME, { series: s.id }) ? '<button class="btn p sm" data-act="m-plan" data-s="' + esc(s.id) + '" data-d="' + esc(nm.date) + '">Plan ' + esc(W.fmt(nm.date, 'dm')) + '</button>' : '')) +
        '</div><div class="sc-past mini">' + past + ' past meeting' + (past === 1 ? '' : 's') + (last ? ' · last ' + esc(W.fmt(last.date, 'dm')) : '') + '</div></div>';
    }).join('') + '</div>';

    const ms = S.meetings.filter(function (m) { return E.canSeeMeeting(S, ME, m); })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    h += '<div class="card"><div class="card-h"><h3>All meetings</h3><span class="note">' + ms.length + '</span></div><div class="card-b tight"><div class="tscroll">' +
      '<table class="t mtab"><thead><tr><th>Date</th><th>Meeting</th><th>Status</th><th class="num">Present</th><th class="num">New actions</th>' +
      '<th class="num">Decisions</th><th class="num">Moved</th><th class="num">Done at meeting</th></tr></thead><tbody>' +
      ms.map(function (m) {
        const s0 = S.seriesMap[m.series];
        const made = S.items.filter(function (it) { return it.meeting === m.id; });
        let moved = 0, doneAt = 0;
