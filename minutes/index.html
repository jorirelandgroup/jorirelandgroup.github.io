    const chains = [];                 // { tab, row, item, open }
    const links = tabs.map(function (t) { return t.items.map(function () { return null; }); });
    tabs.forEach(function (t, ti) {
      const taken = {};
      t.items.forEach(function (it, ri) {
        if (it.kind !== 'action') return;
        let best = null;
        chains.forEach(function (c, ci) {
          if (taken[ci] || c.tab >= ti) return;
          const p = similar(it.point, c.item.point);
          /* Against every task the chain has had, not only its latest: a row kept
             "from previous minutes" can repeat an earlier task word for word. */
          const k = c.items.reduce(function (a, x) { return Math.max(a, similar(it.task || it.point, x.task || x.point)); }, 0);
          const score = 0.65 * p + 0.35 * k;
          const ok = p >= 0.6 && (c.open || k >= 0.35);
          if (ok && (!best || score > best.score)) best = { ci: ci, score: score };
        });
        if (best) {
          taken[best.ci] = 1;
          const c = chains[best.ci];
          links[ti][ri] = { tab: c.firstTab, row: c.firstRow, score: Math.round(best.score * 100) / 100, prevTab: c.tab, prevRow: c.row };
          c.tab = ti; c.row = ri; c.item = it; c.items.push(it); c.open = it.status !== 'done';
        } else {
          chains.push({ tab: ti, row: ri, item: it, items: [it], open: it.status !== 'done', firstTab: ti, firstRow: ri });
        }
      });
    });
    return links;
  }

  /* A row copied forward from an older tab. The action was marked complete
     on an earlier tab, and this row says nothing new: the same words as a
     row from before it was done (or none), and no new date. The office
     pastes old rows into a new tab; that isn't the action reopening. */
  function staleCopies(tabs, links) {
    const out = {};
    const words = function (s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); };
    tabs.forEach(function (t, ti) {
      t.items.forEach(function (it, ri) {
        const ln = links[ti] && links[ti][ri];
        if (!ln || it.kind !== 'action' || it.status === 'done') return;
        const chain = [];
        let p = { tab: ln.prevTab, row: ln.prevRow }, guard = 0;
        while (p && guard++ < 60) {
          chain.push({ it: tabs[p.tab].items[p.row], ti: p.tab });
          const l2 = links[p.tab] && links[p.tab][p.row];
          p = l2 ? { tab: l2.prevTab, row: l2.prevRow } : null;
        }
        const d = chain.findIndex(function (x) { return x.it.status === 'done'; });
        if (d < 0) return;
        const before = chain.slice(d + 1);
        const w = words(it.update);
        const sameWords = !w || before.some(function (x) { return words(x.it.update) === w; });
        const sameDate = !it.due || it.due === chain[d].it.due || before.some(function (x) { return x.it.due === it.due; });
        if (sameWords && sameDate) out[ti + ':' + ri] = { doneOn: tabs[chain[d].ti].date, doneTab: tabs[chain[d].ti].label || tabs[chain[d].ti].sheet };
      });
    });
    return out;
  }

  /* ══ A Word document of procedures ═════════════════════════════════════
     A .docx is a zip too; word/document.xml holds its paragraphs. What
     matters is each paragraph's words, whether it's a bullet (and how far
     in), and whether it's bold. Headings are bold lines that start with a
     number: "1. Group Registration" is a section, "1.1 Initial Group
     Registration" a procedure in it. A line ending in a colon ("If the
     client has not yet made a decision:") starts one case of a procedure,
     and the bullets under it are that case's steps. */

  async function readDocument(buf, inflate) {
    const z = unzip(buf, inflate || inflateBrowser);
    const xml = await z.read('word/document.xml');
    if (!xml) throw new Error('That file is not a Word document (.docx).');
    const paras = [];
    xml.replace(/<w:p\b[^>]*>([\s\S]*?)<\/w:p>/g, function (m, p) {
      let text = '', bold = true, any = false, some = false;
      p.replace(/<w:r\b[^>]*>([\s\S]*?)<\/w:r>/g, function (m2, r) {
        let t = '';
        r.replace(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:(tab|br)\b[^>]*\/>/g, function (m3, tt, br) { t += br ? ' ' : ent(tt); return m3; });
        if (!t.trim()) { text += t; return m2; }
        any = true;
        const rpr = (r.match(/<w:rPr>([\s\S]*?)<\/w:rPr>/) || ['', ''])[1];
        if (/<w:b\/>|<w:b w:val="(1|true|on)"\/>/.test(rpr)) some = true; else bold = false;
        text += t;
        return m2;
      });
      const style = (p.match(/<w:pStyle w:val="([^"]+)"/) || ['', ''])[1];
      const lvl = p.match(/<w:numPr>[\s\S]*?<\/w:numPr>/) ? +((p.match(/<w:ilvl w:val="(\d+)"/) || ['', '0'])[1]) : -1;
      text = text.replace(/\s+/g, ' ').trim();
      if (text) paras.push({ text: text, bold: any && bold, some: some, heading: /heading|title/i.test(style), lvl: lvl });
      return m;
    });
    return { paras: paras };
  }

  function lcFirst(s) { return /^[A-Z][a-z]/.test(s) ? s[0].toLowerCase() + s.slice(1) : s; }

  function parseProcedures(doc) {
    const HEADNUM = /^(\d{1,2}(?:\.\d{1,2}){0,2})\.?\s+(\S.{1,160})$/;
    const out = [];
    let title = '', lead = '', sec = null, cur = null;
    const branch = function () { return cur.br[cur.br.length - 1]; };
    const start = function (no, name) {
      cur = { no: no, name: name, sec: sec ? sec.name : '', about: sec ? sec.about : '', intro: '', br: [{ when: '', steps: [] }] };
      out.push(cur);
    };
    doc.paras.forEach(function (p) {
      const t = p.text;
      const hm = p.lvl < 0 && (p.bold || p.heading) && t.match(HEADNUM);
      if (hm && !/[.:;]$/.test(hm[2].trim())) {
        const no = hm[1], name = hm[2].trim();
        if (no.indexOf('.') < 0) { sec = { no: no, name: name, about: '' }; cur = null; start(no, name); cur.top = true; return; }
        if (cur && cur.top && !steps(cur)) { sec.about = [sec.about, cur.intro].filter(Boolean).join(' '); out.pop(); }
        start(no, name);
        return;
      }
      if (!cur) { if (!title && (p.bold || p.heading)) title = t; else lead = [lead, t].filter(Boolean).join(' '); return; }
      const b = branch();
      if (p.lvl >= 0) {
        const step = { t: t, key: p.some, sub: [] };
        const last = b.steps[b.steps.length - 1];
        if (p.lvl > 0 && last) last.sub.push({ t: t, key: p.some }); else b.steps.push(step);
      } else if (/:\s*$/.test(t)) {
        if (!b.steps.length && !b.when) b.when = t; else cur.br.push({ when: t, steps: [] });
      } else if (!steps(cur)) cur.intro = [cur.intro, t].filter(Boolean).join(' ');
      else b.steps.push({ t: t, key: p.some, sub: [] });
    });
    const list = out.filter(function (x) {
      x.br = x.br.filter(function (b) { return b.steps.length; });
      delete x.top;
      return x.br.length;
    });
    return { title: title, lead: lead, procs: list };
  }
  function steps(p) { return p.br.reduce(function (a, b) { return a + b.steps.length; }, 0); }

  /* One case of a procedure as the steps of a to-do. "The group is:" over
     three bullets becomes "The group is added to the quote window", and so
     on, one to tick each. */
  function checklist(branch) {
    const list = [];
    branch.steps.forEach(function (s) {
      if (s.sub.length && /:\s*$/.test(s.t)) {
        const lead = s.t.replace(/\s*:\s*$/, '');
        s.sub.forEach(function (c) { list.push(lead + ' ' + lcFirst(c.t.replace(/\s*[;,]\s*(?:or|and)?\s*$/i, '.'))); });
      } else {
        list.push(s.t);
        s.sub.forEach(function (c) { list.push('– ' + c.t); });
      }
    });
    return list;
  }

  const Importer = { unzip: unzip, inflateBrowser: inflateBrowser, readWorkbook: readWorkbook,
    parseSheet: parseSheet, splitSheet: splitSheet, parseBook: parseBook, markers: markers,
    findHeader: findHeader, meetingDate: meetingDate, cellText: cellText, isList: isList,
    thread: thread, similar: similar, staleCopies: staleCopies, readDocument: readDocument, parseProcedures: parseProcedures, checklist: checklist };
  if (typeof module !== 'undefined' && module.exports) module.exports = Importer;
  else root.Importer = Importer;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* seed.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the starting state
   The real team and the management meeting, and nothing else: no invented
   actions. The register fills from the minutes workbook (Settings → Bring
   the spreadsheet across) and from the meetings held in the app.
   ═══════════════════════════════════════════════════════════════════════ */

window.JOR_MIN_SEED = (function () {
  'use strict';

  const D = window.JOR_MIN_DATA;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function realToday() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function build() {
    return {
      people: clone(D.PEOPLE), series: clone(D.SERIES), topics: clone(D.TOPICS),
      meetings: [], items: [], today: realToday(), fixedToday: null,
      log: [], seq: { A: 0, D: 0, N: 0, I: 0, M: 0 }, prefs: {}, rev: 0
    };
  }

  return { build: build, realToday: realToday };
})();

</script>
<script>/* sync.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — putting two copies back together
   Once the server is connected, each computer keeps working on its own
   copy and sends it to the server after every change. If someone else has
   saved in between, the server puts the two together here rather than one
   overwriting the other: every person, meeting, action and set of email
   choices carries the time it last changed (`u`), and the newer one wins,
   thing by thing. Two people ticking off two different actions at the
   same moment both stick.

   Two things need care: something deleted on one side (kept as a note in
   `gone` so it doesn't come back), and two computers both numbering a new
   action A-0142 at once (the later one is renumbered). No DOM, so the
   server runs the same code.
   ═══════════════════════════════════════════════════════════════════════ */

(function (root) {
  'use strict';

  const COLS = ['people', 'series', 'meetings', 'items'];
  const LOCAL_ONLY = { fixedToday: true };

  function snap(s) {
    const o = {};
    COLS.forEach(function (c) { (s[c] || []).forEach(function (x) { o[c + ':' + x.id] = JSON.stringify(x); }); });
    Object.keys(s.prefs || {}).forEach(function (pid) { o['prefs:' + pid] = JSON.stringify(s.prefs[pid]); });
    return o;
  }

  /* After a change: stamp what changed, note what went, and say which
     things they were (keys like 'items:i1', 'prefs:p03', 'gone:items:i1'),
     so only those are sent to the server. */
  function stamp(s, before, now) {
    const seen = {}, changed = [];
    COLS.forEach(function (c) {
      (s[c] || []).forEach(function (x) {
        const k = c + ':' + x.id;
        seen[k] = true;
        if (before[k] !== JSON.stringify(x)) { x.u = now; changed.push(k); }
      });
    });
    s.prefs = s.prefs || {};
    Object.keys(s.prefs).forEach(function (pid) {
      const k = 'prefs:' + pid;
      seen[k] = true;
      if (before[k] !== JSON.stringify(s.prefs[pid])) { s.prefs[pid].u = now; changed.push(k); }
    });
    s.gone = s.gone || {};
    Object.keys(before).forEach(function (k) { if (!seen[k]) { s.gone[k] = now; changed.push('gone:' + k); } });
    return changed;
  }

  function newer(a, b) { return String(a.u || '') > String(b.u || '') ? a : b; }

  /* `a` is what the server has, `b` what has just arrived. On a tie the
     arrival wins: it is the more recent intention. */
  function merge(a, b) {
    if (!a) return b;
    if (!b) return a;
    const out = {};
    Object.keys(a).concat(Object.keys(b)).forEach(function (k) { if (!(k in out)) out[k] = b[k] !== undefined ? b[k] : a[k]; });
    const gone = Object.assign({}, a.gone || {});
    Object.keys(b.gone || {}).forEach(function (k) { if (!gone[k] || b.gone[k] > gone[k]) gone[k] = b.gone[k]; });
    out.gone = gone;

    COLS.forEach(function (c) {
      const map = {}, order = [];
      (a[c] || []).forEach(function (x) { map[x.id] = x; order.push(x.id); });
      (b[c] || []).forEach(function (x) {
        if (map[x.id]) map[x.id] = newer(map[x.id], x) === x || String(x.u || '') === String(map[x.id].u || '') ? x : map[x.id];
        else { map[x.id] = x; order.push(x.id); }
      });
      out[c] = order.map(function (id) { return map[id]; }).filter(function (x) {
        const g = gone[c + ':' + x.id];
        return !g || String(x.u || '') > g;
      });
    });

    out.prefs = {};
    [a.prefs || {}, b.prefs || {}].forEach(function (p) {
      Object.keys(p).forEach(function (pid) { out.prefs[pid] = out.prefs[pid] ? newer(out.prefs[pid], p[pid]) : p[pid]; });
    });

    const seenLog = {};
    out.log = (a.log || []).concat(b.log || []).filter(function (l) {
      const k = l.at + '|' + l.by + '|' + l.what;
      if (seenLog[k]) return false;
      seenLog[k] = true; return true;
    }).sort(function (x, y) { return x.at < y.at ? 1 : x.at > y.at ? -1 : 0; }).slice(0, 800);

    out.seq = {};
    ['A', 'D', 'N', 'I', 'M'].forEach(function (k) { out.seq[k] = Math.max((a.seq || {})[k] || 0, (b.seq || {})[k] || 0); });
    renumber(out);
    Object.keys(LOCAL_ONLY).forEach(function (k) { out[k] = b[k]; });
    out.rev = Math.max(a.rev || 0, b.rev || 0) + 1;
    return out;
  }

  /* Two computers gave different actions the same reference: the one
     raised first keeps it. */
  function renumber(s) {
    const byRef = {};
    s.items.slice().sort(function (x, y) { return x.on < y.on ? -1 : x.on > y.on ? 1 : (x.id < y.id ? -1 : 1); }).forEach(function (it) {
      if (!byRef[it.ref]) { byRef[it.ref] = it.id; return; }
      if (byRef[it.ref] === it.id) return;
      const k = it.kind === 'action' ? 'A' : it.kind === 'decision' ? 'D' : 'N';
      s.seq[k] = (s.seq[k] || 0) + 1;
      it.ref = k + '-' + String(s.seq[k]).padStart(4, '0');
      byRef[it.ref] = it.id;
    });
  }

  /* The state as it is sent: no look-up maps, nothing that belongs to one computer. */
  function plain(s, fields) {
    const o = {};
    fields.forEach(function (k) { if (!LOCAL_ONLY[k]) o[k] = s[k]; });
    o.gone = s.gone || {};
    return JSON.parse(JSON.stringify(o));
  }

  const Sync = { snap: snap, stamp: stamp, merge: merge, renumber: renumber, plain: plain };
  if (typeof module !== 'undefined' && module.exports) module.exports = Sync;
  else root.Sync = Sync;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* mail.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the daily and weekly emails
   Builds each person's email from the register: what's on for today,
   what's overdue, what's coming, what was finished, and — for Bernard and
   Iain, if they want it — how everyone below them is getting on.

   Written for email clients, not browsers: tables, inline styles, web-safe
   fonts, the JOR green, the logo attached to the email itself (cid:) so it
   shows without anyone having to "download pictures". No DOM in here: the
   same code draws the preview in the app and the real email on the server.
   ═══════════════════════════════════════════════════════════════════════ */

(function (root) {
  'use strict';

  const W = root.When, E = root.Engine;
  const GREEN = '#00A66E', DEEP = '#00875A', INK = '#13251E', INK2 = '#41564D', INK3 = '#72877D', LINE = '#DBE7E1',
    MIST = '#F5FAF8', GOLD = '#B08D2E', RED = '#B3261E', AMBER = '#9A6209', ORANGE = '#C2550F';
  const SANS = "'Segoe UI', Arial, Helvetica, sans-serif", SERIF = "Cambria, Georgia, 'Times New Roman', serif";

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function defaults(p) {
    return { daily: false, dailyHour: 8, weekly: false, weekly_when: 'mon', team: p && p.access !== 'staff' };
  }
  function prefsOf(S, pid) { return Object.assign(defaults(S.personMap[pid]), (S.prefs || {})[pid] || {}); }

  /* ══ What goes in ══════════════════════════════════════════════════════ */

  function mine(S, pid) {
    return S.items.filter(function (it) {
      if (it.kind !== 'action') return false;
      const p = E.myPart(it, pid);
      return p === 'owner' || p === 'part' || p === 'partdone';
    });
  }
  function openForMe(it, pid) {
    const p = E.myPart(it, pid);
    if (p === 'partdone') return false;
    if (p === 'part') return it.status !== 'done' && it.status !== 'dropped';
    return E.isOpen(it);
  }

  function gather(S, pid, today, days) {
    const list = mine(S, pid);
    const open = list.filter(function (it) { return openForMe(it, pid); });
    const since = W.add(today, -days);
    const sun = W.sundayOf(today);
    const out = {
      open: open.length,
      today: open.filter(function (it) { return it.focus === today || it.due === today; }),
      overdue: open.filter(function (it) { return it.due && it.due < today && it.focus !== today; }),
      week: open.filter(function (it) { return it.due && it.due > today && it.due <= (days > 1 ? W.add(today, 7) : sun) && it.focus !== today; }),
      waiting: open.filter(function (it) { return it.status === 'waiting'; }),
      done: list.filter(function (it) {
        const d = E.myPart(it, pid) === 'partdone' ? it.parts[pid] : it.status === 'done' ? it.doneOn : null;
        return d && d >= since && d < today;
      }),
      moved: open.filter(function (it) {
        return (it.hist || []).some(function (h) { return h.k === 'due' && h.on >= since && h.from && h.to > h.from; });
      })
    };
    const by = function (a, b) { return (a.due || '9999') < (b.due || '9999') ? -1 : 1; };
    ['today', 'overdue', 'week', 'waiting'].forEach(function (k) { out[k].sort(by); });
    out.overdue = out.overdue.filter(function (it) { return it.status !== 'waiting'; });
    out.week = out.week.filter(function (it) { return it.status !== 'waiting'; });
    /* Meetings coming up in the next week where their actions will be read. */
    out.meetings = S.series.map(function (s) {
      const nm = E.nextMeeting(S, s.id, today);
      if (!nm || W.diff(today, nm.date) > 7 || W.diff(today, nm.date) < 0) return null;
      const last = E.lastClosed(S, s.id);
      const since2 = last ? last.date : '0000';
      const theirs = open.filter(function (it) { return it.series === s.id; });
      if (!theirs.length) return null;
      const quiet = theirs.filter(function (it) { return !(it.hist || []).some(function (h) { return h.on > since2 && h.by === pid; }); }).length;
      return { name: s.name, date: nm.date, n: theirs.length, quiet: quiet };
    }).filter(Boolean);
    return out;
  }

  /* ══ Pieces of the email ═══════════════════════════════════════════════ */

  function source(S, it) {
    const m = it.meeting && S.meetingMap[it.meeting];
    if (m) { const s0 = S.seriesMap[m.series]; return (s0 ? s0.short : 'Meeting') + ' · ' + W.fmt(m.date, 'dm'); }
    if (it.by && it.by !== it.owner && S.personMap[it.by]) return 'From ' + S.personMap[it.by].first;
    return '';
  }

  function dueWord(it, today) {
    if (!it.due) return it.ongoing ? 'Ongoing' : '';
    const n = W.diff(today, it.due);
    if (n < 0) return (-n === 1 ? '1 day' : -n + ' days') + ' over';
    if (n === 0) return 'Today';
    if (n === 1) return 'Tomorrow';
    return W.fmt(it.due, n < 7 ? 'short' : 'dm');
  }

  function row(S, it, today, tone) {
    const src = source(S, it);
    const lu = E.lastUpdate(it);
    const colour = tone === 'red' ? RED : tone === 'amber' ? AMBER : tone === 'done' ? DEEP : INK2;
    return '<tr><td style="padding:9px 0;border-bottom:1px solid ' + LINE + ';vertical-align:top;width:18px">' +
      '<div style="width:8px;height:8px;border-radius:4px;background:' + (tone === 'red' ? RED : tone === 'done' ? GREEN : tone === 'amber' ? '#E1A200' : '#B7C8C0') + ';margin-top:6px"></div></td>' +
      '<td style="padding:9px 8px 9px 0;border-bottom:1px solid ' + LINE + ';vertical-align:top;font-family:' + SANS + ';font-size:14px;color:' + INK + ';line-height:1.4">' +
      '<b style="font-weight:600">' + esc(it.title) + '</b>' +
      (it.detail && it.detail !== it.title ? '<div style="font-size:12.5px;color:' + INK2 + ';margin-top:2px">' + esc(it.detail) + '</div>' : '') +
      (src || (lu && tone !== 'done') ? '<div style="font-size:12px;color:' + INK3 + ';margin-top:3px">' + esc(src) +
        (lu && lu.t && tone !== 'done' ? (src ? ' · ' : '') + '“' + esc(lu.t.length > 90 ? lu.t.slice(0, 88) + '…' : lu.t) + '”' : '') + '</div>' : '') + '</td>' +
      '<td style="padding:9px 0;border-bottom:1px solid ' + LINE + ';vertical-align:top;text-align:right;white-space:nowrap;font-family:' + SANS + ';font-size:12.5px;font-weight:600;color:' + colour + '">' +
      esc(tone === 'done' ? 'Done ' + W.fmt(it.doneOn || today, 'dm') : dueWord(it, today)) + '</td></tr>';
  }

  function section(title, items, S, today, tone, max) {
    if (!items.length) return '';
    max = max || 12;
    return '<tr><td style="padding:22px 32px 0">' +
      '<div style="font-family:' + SANS + ';font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:' + (tone === 'red' ? RED : DEEP) + ';padding-bottom:4px;border-bottom:2px solid ' + (tone === 'red' ? RED : GREEN) + '">' +
      esc(title) + ' <span style="color:' + INK3 + '">' + items.length + '</span></div>' +
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">' +
      items.slice(0, max).map(function (it) { return row(S, it, today, tone); }).join('') +
      (items.length > max ? '<tr><td colspan="3" style="padding:8px 0;font-family:' + SANS + ';font-size:12px;color:' + INK3 + '">and ' + (items.length - max) + ' more</td></tr>' : '') +
      '</table></td></tr>';
  }

  function stats(cells) {
    return '<tr><td style="padding:18px 32px 0"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid ' + LINE + ';border-radius:8px;border-collapse:separate"><tr>' +
      cells.map(function (c, i) {
        return '<td width="' + Math.floor(100 / cells.length) + '%" align="center" style="padding:12px 4px;' + (i ? 'border-left:1px solid ' + LINE + ';' : '') + '">' +
          '<div style="font-family:' + SERIF + ';font-size:26px;font-weight:700;line-height:1;color:' + (c.tone === 'red' && c.v ? RED : c.tone === 'good' && c.v ? DEEP : INK) + '">' + c.v + '</div>' +
          '<div style="font-family:' + SANS + ';font-size:11px;color:' + INK3 + ';margin-top:5px">' + esc(c.k) + '</div></td>';
      }).join('') + '</tr></table></td></tr>';
  }

  function button(url, label) {
    if (!url) return '';
    return '<tr><td style="padding:26px 32px 4px" align="left"><table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td bgcolor="' + GREEN + '" style="border-radius:8px"><a href="' + esc(url) + '" style="display:inline-block;padding:12px 22px;font-family:' + SANS +
      ';font-size:14px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:8px">' + esc(label) + ' &rarr;</a></td></tr></table></td></tr>';
  }

  function teamTable(S, pid, today) {
    const people = E.below(S, pid);
    if (!people.length) return '';
    const rows = people.map(function (p) {
      const st = E.personStats(S, p.id, today);
      return { p: p, st: st, h: E.health(st) };
    }).sort(function (a, b) {
      const r = { behind: 0, watch: 1, ok: 2, clear: 3 };
      return r[a.h.k] - r[b.h.k] || b.st.overdue - a.st.overdue || a.p.name.localeCompare(b.p.name);
    });
    const dot = { ok: GREEN, watch: '#E1A200', behind: RED, clear: '#B7C8C0' };
    const th = function (t, al) { return '<td style="padding:6px 6px;font-family:' + SANS + ';font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:' + INK3 + ';border-bottom:1px solid ' + LINE + '" align="' + (al || 'left') + '">' + t + '</td>'; };
    const td = function (t, al, c) { return '<td style="padding:8px 6px;font-family:' + SANS + ';font-size:13px;color:' + (c || INK) + ';border-bottom:1px solid ' + LINE + '" align="' + (al || 'left') + '">' + t + '</td>'; };
    return '<tr><td style="padding:26px 32px 0">' +
      '<div style="font-family:' + SANS + ';font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:' + DEEP + ';padding-bottom:4px;border-bottom:2px solid ' + GREEN + '">' +
      (S.personMap[pid].access === 'owner' ? 'Everyone' : 'Your team') + '</div>' +
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' + th('') + th('Open', 'center') + th('Overdue', 'center') + th('Done this week', 'center') + th('How they’re doing') + '</tr>' +
      rows.map(function (x) {
        return '<tr>' + td('<b style="font-weight:600">' + esc(x.p.name) + '</b>') + td(x.st.open, 'center') + td(x.st.overdue || '–', 'center', x.st.overdue ? RED : INK3) +
          td(x.st.done7 || '–', 'center', x.st.done7 ? DEEP : INK3) +
          td('<span style="display:inline-block;width:8px;height:8px;border-radius:4px;background:' + dot[x.h.k] + ';margin-right:6px"></span>' + esc(x.h.t), 'left', INK2) + '</tr>';
      }).join('') + '</table></td></tr>';
  }

  function frame(o) {
    const logo = o.logo ? '<img src="' + esc(o.logo) + '" alt="JOR Ireland" height="30" style="display:block;height:30px;border:0">' :
      '<span style="font-family:' + SERIF + ';font-size:20px;font-weight:700;color:#ffffff">JOR Ireland</span>';
    return '<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<meta name="color-scheme" content="light"><title>' + esc(o.subject) + '</title></head>' +
      '<body style="margin:0;padding:0;background:#ECF1EF">' +
      '<div style="display:none;max-height:0;overflow:hidden;opacity:0">' + esc(o.preheader || '') + '</div>' +
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ECF1EF"><tr><td align="center" style="padding:24px 12px">' +
      '<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background:#ffffff;border-radius:10px;overflow:hidden">' +
      '<tr><td bgcolor="' + GREEN + '" style="background:' + GREEN + ';padding:18px 32px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td align="left">' + logo + '</td><td align="right" style="font-family:' + SERIF + ';font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#ffffff">' + esc(o.kicker) + '</td></tr></table></td></tr>' +
      '<tr><td style="padding:26px 32px 0"><div style="font-family:' + SERIF + ';font-size:26px;font-weight:700;color:' + INK + ';line-height:1.2">' + esc(o.hello) + '</div>' +
      '<div style="font-family:' + SANS + ';font-size:14px;color:' + INK2 + ';margin-top:6px;line-height:1.5">' + o.lede + '</div></td></tr>' +
      o.body +
      '<tr><td style="padding:30px 32px 26px"><div style="border-top:1px solid ' + LINE + ';padding-top:14px;font-family:' + SANS + ';font-size:11.5px;color:' + INK3 + ';line-height:1.6">' +
      'Sent by JOR Minutes &amp; To-Do because you asked for ' + esc(o.why) + '. Change it on your to-do list, under <b>Email me</b>.<br>JOR Ireland · Cork</div></td></tr>' +
      '</table></td></tr></table></body></html>';
  }

  function hello(p, hour) {
    const h = hour == null ? 8 : hour;
    return (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ', ' + p.first;
  }

  /* ══ The two emails ════════════════════════════════════════════════════ */

  function build(S, pid, kind, today, opts) {
    opts = opts || {};
    const p = S.personMap[pid];
    const pr = prefsOf(S, pid);
    if (kind === 'weekly') return weekly(S, p, pr, today, opts);
    const g = gather(S, pid, today, 1);
    const nothing = !g.open && !g.done.length;
    const subject = 'Your day — ' + (g.today.length ? g.today.length + ' for today' : g.open + ' open') +
      (g.overdue.length ? ', ' + g.overdue.length + ' overdue' : '') + ' · ' + W.fmt(today, 'short');
    let body = stats([{ k: 'For today', v: g.today.length }, { k: 'Overdue', v: g.overdue.length, tone: 'red' },
      { k: 'Due this week', v: g.week.length }, { k: 'Done yesterday', v: g.done.length, tone: 'good' }]);
    body += section('Today', g.today, S, today, '');
    body += section('Overdue', g.overdue, S, today, 'red');
    body += section('Later this week', g.week, S, today, '');
    body += section('Waiting on someone', g.waiting, S, today, 'amber');
    body += meetingsBlock(g.meetings, today);
    if (!g.today.length && g.open) body += note('Nothing picked for today yet. Open your list and tap the sun on what you mean to finish.');
    body += button(opts.appUrl, 'Open my to-do list');
    return {
      subject: subject, empty: nothing,
      html: frame({ subject: subject, kicker: 'Your day', logo: opts.logo, hello: hello(p, opts.hour), why: 'a morning email',
        preheader: g.today.map(function (it) { return it.title; }).slice(0, 3).join(' · '),
        lede: W.fmt(today, 'long') + ' · ' + g.open + ' open' + (g.overdue.length ? ', <b style="color:' + RED + '">' + g.overdue.length + ' overdue</b>' : ''), body: body }),
      text: textVersion(p, 'day', today, g)
    };
  }

  function weekly(S, p, pr, today, opts) {
    const g = gather(S, p.id, today, 7);
    const monday = W.dow(today) === 1 || W.dow(today) === 0 || W.dow(today) === 6;
    const subject = 'Your week — ' + g.done.length + ' done, ' + (g.week.length + g.today.length) + ' due' +
      (g.overdue.length ? ', ' + g.overdue.length + ' overdue' : '') + ' · ' + (monday ? 'w/c ' + W.fmt(W.mondayOf(W.add(today, W.dow(today) === 1 ? 0 : 2)), 'dm') : W.fmt(today, 'short'));
    let body = stats([{ k: 'Done last 7 days', v: g.done.length, tone: 'good' }, { k: 'Due next 7 days', v: g.week.length + g.today.length },
      { k: 'Overdue', v: g.overdue.length, tone: 'red' }, { k: 'Open', v: g.open }]);
    body += section('Coming up', g.today.concat(g.week), S, today, '');
    body += section('Overdue', g.overdue, S, today, 'red');
    body += section('Dates that moved this week', g.moved, S, today, 'amber', 6);
    body += section('Finished in the last 7 days', g.done, S, today, 'done', 10);
    body += meetingsBlock(g.meetings, today);
    if (pr.team && p.access !== 'staff') body += teamTable(S, p.id, today);
    body += button(opts.appUrl, 'Open my to-do list');
    return {
      subject: subject, empty: false,
      html: frame({ subject: subject, kicker: 'Your week', logo: opts.logo, hello: hello(p, opts.hour), why: 'a weekly email',
        preheader: g.done.length + ' finished, ' + (g.week.length + g.today.length) + ' coming up',
        lede: 'The week to ' + W.fmt(today, 'long') + (g.done.length ? ' — <b style="color:' + DEEP + '">' + g.done.length + ' finished</b>' : ''), body: body }),
      text: textVersion(p, 'week', today, g)
    };
  }

  function meetingsBlock(ms, today) {
    if (!ms.length) return '';
    return '<tr><td style="padding:22px 32px 0">' + ms.map(function (m) {
      return '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FBF6E8;border:1px solid #E7D9AE;border-radius:8px"><tr>' +
        '<td style="padding:12px 14px;font-family:' + SANS + ';font-size:13.5px;color:#4F3F10;line-height:1.5"><b>' + esc(m.name) + '</b> is on ' + esc(W.fmt(m.date, 'long')) + '. ' +
        'You have ' + m.n + ' action' + (m.n === 1 ? '' : 's') + ' from it' + (m.quiet ? ', and ' + m.quiet + ' ' + (m.quiet === 1 ? 'has' : 'have') + ' no update from you since the last one. A line each before the meeting saves it asking.' : '.') +
        '</td></tr></table>';
    }).join('<div style="height:8px"></div>') + '</td></tr>';
  }

  function note(t) {
    return '<tr><td style="padding:16px 32px 0;font-family:' + SANS + ';font-size:13px;color:' + INK2 + ';line-height:1.5">' + esc(t) + '</td></tr>';
  }

  function textVersion(p, word, today, g) {
    const L = ['Your ' + word + ', ' + W.fmt(today, 'long'), ''];
    const list = function (t, a) { if (!a.length) return; L.push(t.toUpperCase()); a.forEach(function (it) { L.push('- ' + it.title + (it.due ? ' (' + W.fmt(it.due, 'dm') + ')' : '')); }); L.push(''); };
    list('Today', g.today); list('Overdue', g.overdue); list('This week', g.week); list('Done', g.done);
    return L.join('\n');
  }

  const Mail = { build: build, prefsOf: prefsOf, defaults: defaults, gather: gather };
  if (typeof module !== 'undefined' && module.exports) module.exports = Mail;
  else root.Mail = Mail;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* xlsx.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — writing an Excel workbook
   A real .xlsx, made here with no library: a zip (stored, not squeezed)
   of the handful of XML parts Excel needs. Used to hand the minutes back
   in the office's own sheet layout, so anyone who prefers Excel still has
   it — with the columns where they always were.

   write({ sheets: [{ name, cols, rows, merges, freeze }] }) → Uint8Array
   A cell is a string, a number, null, or { v, s } where s names a style
   below; a date is { v: 'YYYY-MM-DD', s: 'date' }.
   ═══════════════════════════════════════════════════════════════════════ */

(function (root) {
  'use strict';

  /* ══ The zip ═══════════════════════════════════════════════════════════ */

  const CRC = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  function zip(files) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let off = 0;
    const dosTime = 0, dosDate = ((2026 - 1980) << 9) | (1 << 5) | 1;
    files.forEach(function (f) {
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true);
      c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), name);
      off += 30 + name.length + data.length;
    });
    const cdSize = central.reduce(function (a, p) { return a + p.length; }, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
    const all = parts.concat(central, [new Uint8Array(e.buffer)]);
    const out = new Uint8Array(all.reduce(function (a, p) { return a + p.length; }, 0));
    let p = 0;
    all.forEach(function (x) { out.set(x, p); p += x.length; });
    return out;
  }

  /* ══ The workbook ══════════════════════════════════════════════════════ */

  function x(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  }

  /* The styles, by name. The green is the house green from the A4 template. */
  const STYLES = ['plain', 'title', 'head', 'wrap', 'date', 'pct', 'point', 'muted', 'band', 'done', 'moved', 'over'];
  const S = {}; STYLES.forEach(function (k, i) { S[k] = i; });

  const stylesXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts>' +
    '<fonts count="7">' +
    '<font><sz val="11"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="16"/><color rgb="FF00875A"/><name val="Cambria"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><name val="Calibri"/></font>' +
    '<font><i/><sz val="10"/><color rgb="FF72877D"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FF0A7A4E"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FFB3261E"/><name val="Calibri"/></font>' +
    '</fonts>' +
    '<fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FF00A66E"/><bgColor indexed="64"/></patternFill></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FFE8F3EE"/><bgColor indexed="64"/></patternFill></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FFFCEFE6"/><bgColor indexed="64"/></patternFill></fill>' +
    '</fills>' +
    '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>' +
    '<border><left/><right/><top/><bottom style="thin"><color rgb="FFDBE7E1"/></bottom><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="' + STYLES.length + '">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +                                                                                   // plain
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +                                                                      // title
    '<xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' + // head
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +      // wrap
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="top"/></xf>' + // date
    '<xf numFmtId="9" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>' + // pct
    '<xf numFmtId="0" fontId="3" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' + // point
    '<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +          // muted
    '<xf numFmtId="0" fontId="3" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +                                                       // band
    '<xf numFmtId="9" fontId="5" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>' + // done
    '<xf numFmtId="164" fontId="0" fillId="4" borderId="1" xfId="0" applyNumberFormat="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="top"/></xf>' + // moved
    '<xf numFmtId="164" fontId="6" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="top"/></xf>' + // over
    '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  function colName(i) { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  function serial(iso) { const p = iso.split('-'); return Math.round((Date.UTC(+p[0], +p[1] - 1, +p[2]) - Date.UTC(1899, 11, 30)) / 864e5); }

  function sheetXml(sh) {
    let rows = '';
    sh.rows.forEach(function (r, ri) {
      if (!r) return;
      let cells = '';
      r.forEach(function (c, ci) {
        if (c == null || c === '') return;
        const ref = colName(ci) + (ri + 1);
        const o = typeof c === 'object' ? c : { v: c };
        const st = S[o.s || 'plain'] || 0;
        if (o.s === 'date' || o.s === 'moved' || o.s === 'over') {
          if (/^\d{4}-\d{2}-\d{2}$/.test(o.v)) { cells += '<c r="' + ref + '" s="' + st + '"><v>' + serial(o.v) + '</v></c>'; return; }
          cells += '<c r="' + ref + '" s="' + S.wrap + '" t="inlineStr"><is><t>' + x(o.v) + '</t></is></c>';
          return;
        }
        if (typeof o.v === 'number') cells += '<c r="' + ref + '" s="' + st + '"><v>' + o.v + '</v></c>';
        else cells += '<c r="' + ref + '" s="' + st + '" t="inlineStr"><is><t xml:space="preserve">' + x(o.v) + '</t></is></c>';
      });
      rows += '<row r="' + (ri + 1) + '"' + (sh.heights && sh.heights[ri] ? ' ht="' + sh.heights[ri] + '" customHeight="1"' : '') + '>' + cells + '</row>';
    });
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0" showGridLines="0">' +
      (sh.freeze ? '<pane ySplit="' + sh.freeze + '" topLeftCell="A' + (sh.freeze + 1) + '" activePane="bottomLeft" state="frozen"/>' : '') +
      '</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>' +
      (sh.cols ? '<cols>' + sh.cols.map(function (w, i) { return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>'; }).join('') + '</cols>' : '') +
      '<sheetData>' + rows + '</sheetData>' +
      (sh.merges && sh.merges.length ? '<mergeCells count="' + sh.merges.length + '">' + sh.merges.map(function (m) { return '<mergeCell ref="' + m + '"/>'; }).join('') + '</mergeCells>' : '') +
      '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>' +
      '<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>';
  }

  function safeName(n, used) {
    let s = String(n || 'Sheet').replace(/[\\\/\?\*\[\]:]/g, '-').slice(0, 31) || 'Sheet';
    let k = s, i = 2;
    while (used[k.toLowerCase()]) { k = s.slice(0, 28) + ' ' + i++; }
    used[k.toLowerCase()] = true;
    return k;
  }

  function write(book) {
    const used = {};
    const sheets = book.sheets.map(function (s) { return Object.assign({}, s, { name: safeName(s.name, used) }); });
    const files = [
      { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        sheets.map(function (s, i) { return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; }).join('') +
        '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>' },
      { name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>' },
      { name: 'docProps/core.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
        '<dc:title>' + x(book.title || 'JOR minutes') + '</dc:title><dc:creator>JOR Minutes &amp; To-Do</dc:creator></cp:coreProperties>' },
      { name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
        sheets.map(function (s, i) { return '<sheet name="' + x(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>'; }).join('') + '</sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        sheets.map(function (s, i) { return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>'; }).join('') +
        '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
      { name: 'xl/styles.xml', data: stylesXml }
    ].concat(sheets.map(function (s, i) { return { name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: sheetXml(s) }; }));
    return zip(files);
  }

  const XLSX = { write: write, zip: zip, crc32: crc32 };
  if (typeof module !== 'undefined' && module.exports) module.exports = XLSX;
  else root.XLSXW = XLSX;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* sheet.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the minutes, in the office's own sheet layout
   One tab per meeting, laid out the way the minutes workbook always was:
   a "Meeting Notes - dd/mm/yy" title, then Action Point, Completion Date,
   Completion %, Task, Update and Assigned To? — the same columns, in the
   same order as the latest tab. The difference is that it is written from
   the register, so it is right, and the old dates are in the Update
   column as "moved from … because …" rather than lost.
   ═══════════════════════════════════════════════════════════════════════ */

(function (root) {
  'use strict';

  const W = root.When, E = root.Engine;

  function initials(S, r) {
    if ((r.everyone || []).length) return 'ALL';
    return [r.owner].concat(r.helpers || []).filter(Boolean).map(function (id) { return S.personMap[id] ? S.personMap[id].initials : ''; }).filter(Boolean).join(' / ');
  }

  function words(r) {
    const bits = [];
    if (r.done) bits.push('Done.');
    if (r.dropped) bits.push('Dropped — ' + r.dropped + '.');
    if (r.slip && r.slip.from && r.slip.to && r.slip.to > r.slip.from) bits.push('Moved from ' + W.fmt(r.slip.from, 'num') + (r.slip.why ? ' — ' + r.slip.why : '') + '.');
    if (r.reassigned) bits.push('Passed on at this meeting.');
    if (r.waiting) bits.push('Waiting on ' + r.waiting + '.');
    if (r.update) bits.push(r.update);
    return bits.join(' ');
  }

  function build(S, m, mm) {
    const rows = [], merges = [], heights = [];
    const put = function (r, h) { rows.push(r); heights.push(h || null); };
    const title = (S.seriesMap[mm.series] ? '' : mm.title + ' — ') + 'Meeting Notes - ' + W.fmt(mm.date, 'num');
    put(null);
    put([null, { v: title, s: 'title' }], 24); merges.push('B2:G2');
    const who = function (ids) { return ids.map(function (id) { return S.personMap[id] ? S.personMap[id].initials : ''; }).filter(Boolean).join(', '); };
    put([null, { v: (S.seriesMap[mm.series] ? S.seriesMap[mm.series].name + ' · ' : '') + 'Chair ' + who([mm.chair]) + ' · Present ' + who(mm.present) +
      (mm.apologies.length ? ' · Apologies ' + who(mm.apologies) : '') + (mm.summary ? '  —  ' + mm.summary : ''), s: 'muted' }], mm.summary ? 45 : null);
    merges.push('B3:G3');
    put([null, { v: 'Action Point', s: 'head' }, { v: 'Completion Date', s: 'head' }, { v: 'Completion %', s: 'head' },
      { v: 'Task', s: 'head' }, { v: 'Update', s: 'head' }, { v: 'Assigned To?', s: 'head' }], 20);

    const band = function (t) { put([null, { v: t, s: 'band' }, { v: '', s: 'band' }, { v: '', s: 'band' }, { v: '', s: 'band' }, { v: '', s: 'band' }, { v: '', s: 'band' }]); };
    const line = function (r, update) {
      const open = !r.done && r.status !== 'done' && !r.dropped;
      const dateStyle = r.slip && r.slip.from && r.slip.to > r.slip.from ? 'moved' : open && r.due && r.due < mm.date ? 'over' : 'date';
      const same = !r.detail || r.detail === r.title;
      put([null, { v: r.title, s: 'point' }, { v: r.due || (r.ongoing ? 'Ongoing' : ''), s: dateStyle },
        r.done || r.status === 'done' ? { v: 1, s: 'done' } : { v: (r.progress || 0) / 100, s: 'pct' },
        { v: same ? '' : r.detail, s: 'wrap' }, { v: update, s: 'wrap' }, { v: initials(S, r), s: 'wrap' }]);
    };

    if (mm.actions.length) { band('New at this meeting'); mm.actions.forEach(function (r) { line(r, r.update || 'New.'); }); }
    if (mm.reviewed.length) { band('Reviewed at this meeting'); mm.reviewed.forEach(function (r) { line(r, words(r) || 'On track — no change.'); }); }
    if (mm.carried.length) {
      band('Still open — not reached');
      mm.carried.forEach(function (r) { line(r, (r.last ? r.last + ' (' + W.fmt(r.lastOn, 'num') + ')' : '') + (r.slips ? (r.last ? ' ' : '') + 'Moved ' + r.slips + '× so far.' : '')); });
    }
    if (mm.completed.length) { band('Done since the last meeting'); mm.completed.forEach(function (r) { r.done = true; line(r, (r.update ? r.update + ' ' : '') + 'Done ' + W.fmt(r.doneOn, 'num') + '.'); }); }
    if (mm.decisions.length) {
      band('Decisions');
      mm.decisions.forEach(function (d) { put([null, { v: d.detail || 'Decision', s: 'point' }, { v: mm.date, s: 'date' }, { v: 'Agreed', s: 'wrap' }, { v: d.title, s: 'wrap' }, null, null]); });
    }
    if (mm.notes.length || mm.agenda.length) {
      band('Notes');
      mm.notes.forEach(function (x) { put([null, { v: 'Note', s: 'point' }, null, null, { v: x.title, s: 'wrap' }, null, null]); });
      mm.agenda.forEach(function (g) { put([null, { v: g.t, s: 'point' }, null, null, { v: g.note, s: 'wrap' }, null, null]); });
    }
    if (mm.next) { put(null); put([null, { v: 'Next meeting ' + W.fmt(mm.next, 'long'), s: 'muted' }]); }

    return { name: 'Minutes ' + W.fmt(mm.date, 'num').replace(/\//g, '-'), cols: [2.5, 34, 15, 12, 50, 64, 13], rows: rows, merges: merges, heights: heights, freeze: 4 };
  }

  const Sheet = { build: build };
  if (typeof module !== 'undefined' && module.exports) module.exports = Sheet;
  else root.MinutesSheet = Sheet;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* core.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — shared core
   Storage, sign-in, the audit trail and live sync between open windows.
   Every change goes through mutate(), which writes the record and the
   trail together; there is no other way to change anything.

   Two ways to run:
     server   the real thing. The server (server/Code.gs) keeps the shared
              copy and decides who sees what; this computer keeps only the
              signed-in person's part of it, plus a note of what they have
              changed that hasn't reached the server yet. Signing out
              clears both.
     local    everything on this one computer, for trying the app out.
              Codes are checked here, so it is never used for real work,
              and the build that goes online can't run this way.
   ═══════════════════════════════════════════════════════════════════════ */

window.Core = (function () {
  'use strict';

  const E = window.Engine, D = window.JOR_MIN_DATA;
  const KEY = 'jor.minutes.v2';                 // local: everything
  const CACHE = 'jor.minutes.cache';            // server: this person's part
  const PENDING = 'jor.minutes.pending';        // server: changes not sent yet
  const SESS = 'jor.minutes.session';
  const FIELDS = ['people', 'series', 'topics', 'meetings', 'items', 'today', 'fixedToday', 'log', 'seq', 'prefs', 'rev', 'gone'];
  const C = { S: null, me: null, mode: 'local', pid: null, pend: { dirty: {}, log: [], n: 0 } };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function del(k) { try { localStorage.removeItem(k); } catch (e) { } }

  /* ══ State ═════════════════════════════════════════════════════════════ */

  function fresh() {
    const s = window.JOR_MIN_SEED.build();
    s.people.forEach(function (p) { p.pinHash = sha256('jormin:' + D.DEMO_PINS[p.access]); });
    return s;
  }

  function empty() {
    return { people: [], series: [], topics: D.TOPICS.slice(), meetings: [], items: [], today: null, fixedToday: null,
      log: [], seq: { A: 0, D: 0, N: 0, I: 0, M: 0 }, prefs: {}, rev: 0, gone: {} };
  }

  function hydrate(s) { return E.hydrate(s); }

  function tidy(d) {
    const s = {};
    FIELDS.forEach(function (k) { s[k] = d[k]; });
    s.people = s.people || []; s.items = s.items || []; s.meetings = s.meetings || []; s.series = s.series || [];
    s.log = s.log || []; s.seq = s.seq || { A: 0, D: 0, N: 0, I: 0, M: 0 };
    s.prefs = s.prefs || {}; s.rev = s.rev || 0; s.gone = s.gone || {}; s.topics = s.topics || D.TOPICS.slice();
    return s;
  }

  function load() {
    if (C.mode === 'server') return loadCache();
    const raw = get(KEY);
    if (!raw) { C.S = hydrate(fresh()); save(); if (C.me) C.me = C.S.personMap[C.me.id] || null; return C.S; }
    try {
      const s = tidy(JSON.parse(raw));
      if (!s.items || !s.people.length) throw new Error('incomplete');
      C.S = hydrate(s);
    } catch (e) {
      C.S = hydrate(fresh());
    }
    C.S.today = C.S.fixedToday || window.JOR_MIN_SEED.realToday();
    if (C.me) C.me = C.S.personMap[C.me.id] || null;
    return C.S;
  }

  /* Server mode: this person's part as last fetched, so the app opens at
     once and carries on without a connection; and what's still to send. */
  function loadCache() {
    let s = null;
    try {
      const d = JSON.parse(get(CACHE) || 'null');
      if (d && d.pid === C.pid) s = tidy(d.state);
    } catch (e) { s = null; }
    C.S = hydrate(s || empty());
    C.S.today = C.S.fixedToday || window.JOR_MIN_SEED.realToday();
    try {
      const p = JSON.parse(get(PENDING) || 'null');
      C.pend = p && p.pid === C.pid ? { dirty: p.dirty || {}, log: p.log || [], n: p.n || 0 } : { dirty: {}, log: [], n: 0 };
    } catch (e) { C.pend = { dirty: {}, log: [], n: 0 }; }
    C.me = C.S.personMap[C.pid] || null;
    return C.S;
  }

  let saveFailed = false;
  function save() {
    const out = {};
    FIELDS.forEach(function (k) { out[k] = C.S[k]; });
    const ok = C.mode === 'server'
      ? put(CACHE, JSON.stringify({ pid: C.pid, state: out })) && put(PENDING, JSON.stringify({ pid: C.pid, dirty: C.pend.dirty, log: C.pend.log, n: C.pend.n }))
      : put(KEY, JSON.stringify(out));
    /* A full or blocked store must never stop the app, but it must be said. */
    if (!ok && !saveFailed && window.UI) window.UI.toast('Could not save on this computer — changes will be lost on reload.', 'bad', 8000);
    saveFailed = !ok;
  }

  /* ══ What changed here and hasn't reached the server ═══════════════════ */

  function mark(keys) {
    if (C.mode !== 'server') return;
    keys.forEach(function (k) { C.pend.dirty[k] = ++C.pend.n; });
  }

  /* The changes to send: each changed thing as it is now, what was deleted,
     the trail entries, and the counters. `mark` is kept so that anything
     changed again while this is on its way is sent again next time. */
  function delta() {
    const S = C.S, d = { people: [], series: [], meetings: [], items: [], prefs: {}, gone: {}, log: C.pend.log.slice(), seq: clone(S.seq || {}) };
    const at = {};
    Object.keys(C.pend.dirty).forEach(function (k) {
      at[k] = C.pend.dirty[k];
      if (k === 'topics') { d.topics = clone(S.topics); return; }
      if (k.indexOf('gone:') === 0) { const g = k.slice(5); if (S.gone[g]) d.gone[g] = S.gone[g]; return; }
      const i = k.indexOf(':'), col = k.slice(0, i), id = k.slice(i + 1);
      if (col === 'prefs') { if (S.prefs[id]) d.prefs[id] = clone(S.prefs[id]); return; }
      const x = (S[col] || []).find(function (y) { return y.id === id; });
      if (x && d[col]) d[col].push(clone(x));
    });
    return { delta: d, at: at, logN: C.pend.log.length, empty: !Object.keys(at).length && !C.pend.log.length };
  }

  /* The server has what was sent: forget it, unless it changed again since. */
  function sent(snap) {
    Object.keys(snap.at).forEach(function (k) { if (C.pend.dirty[k] === snap.at[k]) delete C.pend.dirty[k]; });
    C.pend.log = C.pend.log.slice(snap.logN);
  }
  function hasPending() { return Object.keys(C.pend.dirty).length > 0 || C.pend.log.length > 0; }

  /* Take the server's copy, keeping anything changed here that it hasn't
     had yet (it arrives with the next sync). */
  function replace(view) {
    const s = tidy(view);
    const S0 = C.S;
    if (S0 && C.mode === 'server') {
      Object.keys(C.pend.dirty).forEach(function (k) {
        if (k === 'topics') { s.topics = S0.topics; return; }
        if (k.indexOf('gone:') === 0) {
          const g = k.slice(5), i = g.indexOf(':'), col = g.slice(0, i), id = g.slice(i + 1);
          s.gone[g] = S0.gone[g];
          if (s[col]) s[col] = s[col].filter(function (y) { return y.id !== id; });
          return;
        }
        const i = k.indexOf(':'), col = k.slice(0, i), id = k.slice(i + 1);
        if (col === 'prefs') { s.prefs[id] = S0.prefs[id]; return; }
        const mine = (S0[col] || []).find(function (y) { return y.id === id; });
        if (!mine || !s[col]) return;
        const at = s[col].findIndex(function (y) { return y.id === id; });
        if (at >= 0) s[col][at] = mine; else s[col].push(mine);
      });
      s.log = C.pend.log.concat(s.log);
    }
    s.fixedToday = S0 ? S0.fixedToday : null;
    C.S = hydrate(s);
    C.S.today = C.S.fixedToday || window.JOR_MIN_SEED.realToday();
    if (C.mode === 'server') C.me = C.S.personMap[C.pid] || null;
    else if (C.me) C.me = C.S.personMap[C.me.id] || null;
    save();
    return C.S;
  }

  /* Local mode, sending everything up once (Settings → Server). */
  function exportState() { return window.Sync.plain(C.S, FIELDS); }

  function reset() {
    del(KEY);
    return load();
  }

  /* Switch this computer to the server for one person, or back. */
  function useServer(pid) {
    if (C.pid && C.pid !== pid) forget();
    C.mode = 'server'; C.pid = pid;
    return loadCache();
  }
  function forget() {
    del(CACHE); del(PENDING);
    C.pend = { dirty: {}, log: [], n: 0 };
    C.S = null; C.me = null; C.pid = null;
  }
  function useLocal() { C.mode = 'local'; C.pid = null; return load(); }

  /* ══ Changing anything ═════════════════════════════════════════════════ */

  function mutate(entry, fn) {
    const before = window.Sync.snap(C.S);
    const topics = JSON.stringify(C.S.topics || []);
    const r = fn(C.S);
    const changed = window.Sync.stamp(C.S, before, new Date().toISOString());
    if (JSON.stringify(C.S.topics || []) !== topics) changed.push('topics');
    const l = { on: C.S.today, at: new Date().toISOString(), by: C.me ? C.me.id : 'system', what: entry.what, ref: entry.ref || null, kind: entry.kind || 'edit' };
    C.S.log.unshift(l);
    if (C.S.log.length > 800) C.S.log.length = 800;
    C.S.rev = (C.S.rev || 0) + 1;
    mark(changed);
    if (C.mode === 'server') C.pend.log.push(l);
    hydrate(C.S);
    save();
    if (C.onSaved) C.onSaved();
    return r;
  }

  /* A change made outside mutate() (a transcript line, the assistant's
     progress): stamp it so it travels to the server, then save. */
  function touch(x) {
    if (x) {
      x.u = new Date().toISOString();
      ['meetings', 'items', 'series', 'people'].some(function (col) {
        if ((C.S[col] || []).indexOf(x) >= 0) { mark([col + ':' + x.id]); return true; }
        return false;
      });
    }
    save();
    if (C.onSaved) C.onSaved();
  }

  /* ══ Live sync ═════════════════════════════════════════════════════════
     Another window wrote something: reload and tell the app, so the chair
     and an owner looking at the same action see the same thing.          */

  function onSync(cb) {
    window.addEventListener('storage', function (ev) {
      if (ev.key !== (C.mode === 'server' ? CACHE : KEY)) return;
      const before = C.S && C.S.log.length ? C.S.log[0].at : null;
      load();
      const top = C.S.log.length ? C.S.log[0] : null;
      cb(top && top.at !== before ? top : null);
    });
  }

  /* ══ Sign-in ═══════════════════════════════════════════════════════════
     Local mode only: codes hashed here and checked here. In server mode
     the server checks the code and this just takes the person it names. */

  function signIn(personId, pin) {
    const p = C.S.personMap[personId];
    if (!p || p.gone) return { ok: false, why: 'Pick your name from the list.' };
    if (p.pinHash !== sha256('jormin:' + pin)) return { ok: false, why: 'That code is not right.' };
    C.me = p;
    try { sessionStorage.setItem(SESS, p.id); } catch (e) { }
    return { ok: true, person: p };
  }

  function resume() {
    let id = null;
    try { id = sessionStorage.getItem(SESS); } catch (e) { }
    if (id && C.S.personMap[id] && !C.S.personMap[id].gone) { C.me = C.S.personMap[id]; return C.me; }
    return null;
  }

  function signOut() {
    C.me = null;
    try { sessionStorage.removeItem(SESS); } catch (e) { }
    if (C.mode === 'server') forget();
  }

  /* ══ sha256 ════════════════════════════════════════════════════════════ */

  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    const str = unescape(encodeURIComponent(ascii));
    const K = [], H = [];
    let primes = 0;
    const isComposite = {};
    for (let c = 2; primes < 64; c++) {
      if (!isComposite[c]) {
        for (let i = 0; i < 313; i += c) isComposite[i] = c;
        H[primes] = (Math.pow(c, 0.5) * 4294967296) | 0;
        K[primes++] = (Math.pow(c, 1 / 3) * 4294967296) | 0;
      }
    }
    const hash = H.slice(0, 8);
    const words = [];
    const bitLen = str.length * 8;
    let s = str + '\x80';
    while (s.length % 64 - 56) s += '\x00';
    for (let i = 0; i < s.length; i++) {
      const j = s.charCodeAt(i);
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = (bitLen / 4294967296) | 0;
    words[words.length] = bitLen;
    for (let j = 0; j < words.length;) {
      const w = words.slice(j, j += 16);
      const old = hash.slice(0);
      for (let i = 0; i < 64; i++) {
        const w15 = w[i - 15], w2 = w[i - 2];
        const a = hash[0], e = hash[4];
        const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + K[i] +
          (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] +
            (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash.unshift((t1 + t2) | 0);
        hash[4] = (hash[4] + t1) | 0;
        hash.pop();
      }
      for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
    }
    let out = '';
    for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) {
      const b = (hash[i] >> (j * 8)) & 255;
      out += (b < 16 ? '0' : '') + b.toString(16);
    }
    return out;
  }

  /* ══ Small helpers ═════════════════════════════════════════════════════ */

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  return {
    KEY: KEY, FIELDS: FIELDS, load: load, save: save, reset: reset, hydrate: hydrate, mutate: mutate, onSync: onSync,
    touch: touch, exportState: exportState, replace: replace, delta: delta, sent: sent, hasPending: hasPending,
    useServer: useServer, useLocal: useLocal, forget: forget,
    signIn: signIn, resume: resume, signOut: signOut, sha256: sha256, esc: esc, el: el, clone: clone,
    get state() { return C.S; },
    get who() { return C.me; },
    set who(p) { C.me = p; },
    get mode() { return C.mode; },
    set onSaved(f) { C.onSaved = f; },
    _C: C
  };
})();

</script>
<script>/* ui.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the pieces the screens are built from
   Chips, avatars, dialogs, toasts. Nothing here changes a record.
   ═══════════════════════════════════════════════════════════════════════ */

window.UI = (function () {
  'use strict';
  const BOT = (window.JOR_MIN_DATA && window.JOR_MIN_DATA.BOT) || 'O’Reilly AI';   // the assistant's name on screen (data.js)

  const C = window.Core, E = window.Engine, W = window.When;
  const esc = C.esc;

  const DEPT_TINT = { lead: '#00875A', ops: '#0E8C8C', res: '#4E6E8E', mice: '#8A6D1F', sales: '#6C63B5',
    trans: '#C2703D', fin: '#5F6E70', mkt: '#A8527A' };

  function S() { return C.state; }
  function person(id) { return S().personMap[id]; }
  function name(id) { const p = person(id); return p ? p.name : '—'; }
  function first(id) { const p = person(id); return p ? p.first : '—'; }

  function avatar(id, cls) {
    const p = person(id);
    if (!p) return '<span class="av ' + (cls || 'sm') + '" style="background:#B8C6BF">?</span>';
    const T = window.JOR_MIN_DATA.TINTS;
    const ix = S().people.indexOf(p);
    return '<span class="av ' + (cls || 'sm') + '" style="background:' + T[(ix < 0 ? 0 : ix) % T.length] + '" title="' +
      esc(p.name + (p.role ? ' · ' + p.role : '')) + '">' + esc(p.initials) + '</span>';
  }

  function avatars(ids, max) {
    max = max || 6;
    const shown = ids.slice(0, max).map(function (id) { return avatar(id, 'xs'); }).join('');
    return '<span class="avs">' + shown + (ids.length > max ? '<span class="av xs more">+' + (ids.length - max) + '</span>' : '') + '</span>';
  }

  /* ══ Chips ═════════════════════════════════════════════════════════════ */

  function dueChip(it, today) {
    if (it.status === 'done') return '<span class="due done" title="Done ' + esc(W.fmt(it.doneOn, 'med')) + '">✓ ' + esc(W.fmt(it.doneOn, 'dm')) + '</span>';
    if (it.status === 'dropped') return '<span class="due none">Dropped</span>';
    if (!it.due) return '<span class="due none">' + (it.ongoing ? 'Ongoing' : 'No date') + '</span>';
    const cls = it.due < today ? 'over' : it.due === today ? 'today' : it.due <= W.sundayOf(today) ? 'week' : 'later';
    const n = W.diff(today, it.due);
    const txt = n < 0 ? W.fmt(it.due, 'dm') : n < 7 ? W.rel(it.due, today).replace(/^(\w)/, function (c) { return c.toUpperCase(); }) : W.fmt(it.due, 'short');
    return '<span class="due ' + cls + '" title="Due ' + esc(W.fmt(it.due, 'long')) + (n < 0 ? ' — ' + esc(W.rel(it.due, today)) : '') + '">' + esc(txt) + '</span>';
  }

  function flagChips(flags, skip) {
    return flags.filter(function (f) { return !skip || skip.indexOf(f.k) < 0; }).map(function (f) {
      return '<span class="fl k-' + f.k + '"' + (f.d ? ' title="' + esc(f.d) + '"' : '') + '>' + esc(f.t) + '</span>';
    }).join('');
  }

  /* Where an action came from, in the words the office uses. */
  function source(it, me) {
    if (it.meeting && S().meetingMap[it.meeting]) {
      const m = S().meetingMap[it.meeting], s0 = S().seriesMap[m.series];
      return '<span class="src" style="--t:' + tint(s0 && s0.tint) + '" title="Raised at the ' + esc(s0 ? s0.name : 'meeting') +
        ' on ' + esc(W.fmt(m.date, 'long')) + '">' + esc(s0 ? s0.short : 'Meeting') + ' · ' + esc(W.fmt(m.date, 'dm')) + '</span>';
    }
    if (it.series && S().seriesMap[it.series] && S().seriesMap[it.series].kind === 'plan') {
      const pl = S().seriesMap[it.series];
      return '<span class="src" style="--t:' + tint(pl.tint) + '" title="From the plan: ' + esc(pl.name) + (it.topic ? ' — ' + esc(topicName(it.topic)) : '') + '">' + esc(pl.short) + '</span>';
    }
    if (it.private) return '<span class="src priv" title="Only you can see this">Private</span>';
    if (it.src === 'email' && me && it.by === me.id && it.owner === me.id) return '<span class="src ask" title="Emailed in, and turned into a to-do by ' + BOT + '">By email</span>';
    if (me && it.by && it.by !== it.owner) {
      if (it.owner === me.id) return '<span class="src ask">From ' + esc(first(it.by)) + '</span>';
      if (it.by === me.id) return '<span class="src ask">Asked of ' + esc(first(it.owner)) + '</span>';
    }
    return '';
  }

  function pbar(p, wide) {
    p = Math.max(0, Math.min(100, Math.round(+p) || 0));
    if (!p) return '';
    return '<span class="pb' + (wide ? ' wide' : '') + '" title="' + p + '% done"><i style="width:' + p + '%"></i></span>';
  }

  function kindPill(k) {
    k = k === 'decision' || k === 'note' ? k : 'action';
    return '<span class="kp k-' + k + '">' + (k === 'action' ? 'Action' : k === 'decision' ? 'Decision' : 'Note') + '</span>';
  }

  /* A meeting's colour, only if it really is one. */
  function tint(t, dflt) { return /^#[0-9a-f]{3,8}$/i.test(String(t || '')) ? t : (dflt || '#5F6E70'); }

  function topicName(id) { const t = S().topicMap[id]; return t ? t.name : ''; }

  function micBtn(target, label) {
    return '<button type="button" class="mic" data-act="dictate" data-target="' + esc(target) + '" title="' +
      esc(label || 'Speak instead of typing') + '" aria-label="Dictate"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">' +
      '<rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>';
  }

  /* The sun that puts something on today's list. Drawn, not an emoji. */
  function sun(on) {
    return '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="' + (on ? 'currentColor' : 'none') +
      '" stroke="currentColor" stroke-width="1.9"/><g stroke="currentColor" stroke-width="1.9" stroke-linecap="round">' +
      '<path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M5.3 18.7l1.5-1.5M17.2 6.8l1.5-1.5"/></g></svg>';
  }

  function icon(k) {
    const P = {
      check: '<path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
      cal: '<rect x="4" y="5.5" width="16" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M9 3.5v4M15 3.5v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      clock: '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      people: '<circle cx="9" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16.5" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 13.2c2.4 0 4 1.5 4.6 4.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
      list: '<path d="M9 7h11M9 12h11M9 17h11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="4.8" cy="7" r="1.3" fill="currentColor"/><circle cx="4.8" cy="12" r="1.3" fill="currentColor"/><circle cx="4.8" cy="17" r="1.3" fill="currentColor"/>',
      gavel: '<path d="M13.5 4.5l6 6M11 7l6 6M12.3 5.7l-4.6 4.6M18.3 11.7l-4.6 4.6M10.5 12.5L4 19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
      gear: '<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      print: '<path d="M7 9V4h10v5M7 17H5a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 5 9h14a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 19 17h-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="7" y="14" width="10" height="6" fill="none" stroke="currentColor" stroke-width="1.8"/>',
      mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
      copy: '<rect x="8" y="8" width="11" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      down: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>',
      play: '<path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/>',
      stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/>',
      plus: '<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
      arrow: '<path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
      wave: '<path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 11v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
      camera: '<path d="M4 8.5h3.2l1.6-2.5h6.4l1.6 2.5H20v10.5H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.6" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/>',
      upload: '<path d="M12 16V4.5M7 9l5-5 5 5M5 20h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>'
    };
    return '<svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">' + (P[k] || '') + '</svg>';
  }

  /* ══ Dialogs ═══════════════════════════════════════════════════════════ */

  let closer = null;

  function modal(o) {
    close();
    /* A toast that was pointing at this dialog has done its job, and one left
       in the corner would sit over the dialog's buttons. */
    if (tray) tray.innerHTML = '';
    const wrap = C.el('<div class="scrim"><div class="dlg" role="dialog" aria-modal="true"></div></div>');
    const m = wrap.firstElementChild;
    m.innerHTML =
      '<div class="dlg-h">' + (o.head || '<h3>' + esc(o.title) + '</h3>') +
      (o.sub ? '<div class="dlg-sub">' + o.sub + '</div>' : '') +
      '<button class="x" data-close aria-label="Close">✕</button></div>' +
      '<div class="dlg-b">' + o.body + '</div>' +
      (o.foot ? '<div class="dlg-f">' + o.foot + '</div>' : '');
    if (o.wide) m.classList.add('wide');
    if (o.cls) m.classList.add(o.cls);
    document.body.appendChild(wrap);
    wrap.addEventListener('mousedown', function (ev) {
      if (ev.target === wrap) wrap._down = true;
    });
    wrap.addEventListener('click', function (ev) {
      if ((ev.target === wrap && wrap._down) || ev.target.closest('[data-close]')) close();
      wrap._down = false;
    });
    const esckey = function (ev) { if (ev.key === 'Escape' && !ev.defaultPrevented) close(); };
    document.addEventListener('keydown', esckey);
    closer = function () {
      document.removeEventListener('keydown', esckey);
      wrap.remove(); closer = null;
      if (o.onClose) o.onClose();
    };
    const focus = m.querySelector('[data-focus]');
    if (focus) setTimeout(function () { focus.focus(); }, 30);
    if (o.on) o.on(m);
    return m;
  }

  function close() { if (closer) closer(); }
  function isOpen() { return !!closer; }

  function confirm(o) {
    return new Promise(function (res) {
      let answered = false;
      modal({
        title: o.title,
        body: '<div class="conf ' + (o.tone || '') + '">' + o.body + '</div>',
        foot: '<button class="btn" data-close>' + esc(o.no || 'Cancel') + '</button>' +
          '<button class="btn ' + (o.tone === 'danger' ? 'dngr-solid' : 'p') + '" data-yes>' + esc(o.yes || 'Confirm') + '</button>',
        on: function (m) {
          m.querySelector('[data-yes]').addEventListener('click', function () { answered = true; close(); res(true); });
        },
        onClose: function () { if (!answered) res(false); }
      });
    });
  }

  /* ══ Toast ═════════════════════════════════════════════════════════════ */

  let tray = null;
  function toast(msg, kind, ms, action) {
    if (!tray || !document.body.contains(tray)) { tray = C.el('<div class="toasts"></div>'); document.body.appendChild(tray); }
    const t = C.el('<div class="toast ' + (kind || '') + '"><span>' + msg + '</span></div>');
    if (action) {
      const b = C.el('<button class="tact">' + esc(action.label) + '</button>');
      b.addEventListener('click', function () { action.fn(); gone(); });
      t.appendChild(b);
    }
    tray.appendChild(t);
    /* Three at a time is plenty; the oldest makes way. */
    while (tray.children.length > 3) tray.removeChild(tray.firstChild);
    setTimeout(function () { t.classList.add('go'); }, 10);
    let timer = setTimeout(gone, ms || 4200);
    function gone() {
      clearTimeout(timer);
      t.classList.remove('go');
      setTimeout(function () { t.remove(); }, 260);
    }
  }

  function clearToasts() { if (tray) tray.innerHTML = ''; }

  /* ══ Forms ═════════════════════════════════════════════════════════════ */

  function field(label, inner, hint) {
