<script>/* server.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the connection to the server
   The server is a Google Apps Script (server/Code.gs). It keeps the one
   shared copy of the minutes and actions, decides what each person may
   see and change, sends the daily and weekly emails, turns emailed lists
   into to-dos, and talks to Gemini with a key only it holds.

   A device is set up once with the office code: the last ten characters
   of the server's link, before /exec. The page holds only the start of
   the link, so it can't reach the server until the code is typed; the
   whole link is then kept in this browser only. Each person then
   signs in with their own code, checked by the server, which hands back a
   session. The app works on its own copy of that person's part — so it is
   quick and carries on if the connection drops — sends what changed a
   couple of seconds after each change, and checks for everyone else's
   changes every half minute while it's open.
   ═══════════════════════════════════════════════════════════════════════ */

window.Server = (function () {
  'use strict';

  const LS = 'jor.minutes.server';
  const C = window.Core;
  let timer = null, poll = null, busy = false, again = false, status = { t: '', at: null, bad: false };
  let inbox = '';

  function cfg() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } }
  function setCfg(patch) { const c = Object.assign(cfg(), patch); try { localStorage.setItem(LS, JSON.stringify(c)); } catch (e) { } return c; }
  /* Set up: this device knows the server's whole link. */
  function ready() { const c = cfg(); return !!c.url; }
  /* Signed in: someone is using the server now. */
  function connected() { const c = cfg(); return !!(c.url && c.token && C.mode === 'server'); }

  function goodUrl(u) { return /^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+|macros)\/s\/[\w-]+\/exec$/.test(u) || /^http:\/\/(127\.0\.0\.1|localhost):\d+\/?/.test(u); }

  /* The whole link from what was typed: the office code on the end of the
     start the page was built with, or a whole link pasted in. */
  function linkFrom(typed) {
    const t = String(typed || '').trim();
    if (/\/exec\/?$/.test(t) || /^https?:\/\//.test(t)) return t.replace(/\/$/, '');
    const start = window.JOR_MIN_SERVER_START || '';
    if (!start) throw new Error('Paste the server’s whole link (it ends in /exec).');
    if (!/^[A-Za-z0-9_-]{10}$/.test(t)) throw new Error('That office code isn’t right — check each letter; capitals count.');
    return start + t + '/exec';
  }

  async function call(action, data, override) {
    const c = override || cfg();
    if (!c.url) throw new Error('This device isn’t set up for the server yet.');
    let res;
    try {
      /* text/plain keeps it a "simple" request, which Apps Script can answer across origins. */
      res = await fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ token: c.token || '', action: action }, data || {})) });
    } catch (e) {
      const err = new Error(override && override.fromCode ? 'That office code isn’t right — or this device is offline.' : 'Couldn’t reach the server — is this device online?');
      err.offline = true;
      throw err;
    }
    let j;
    try { j = await res.json(); } catch (e) { throw new Error('The server answered with something that isn’t the app’s server (check the address).'); }
    if (!j.ok) {
      const err = new Error(j.error || 'The server said no.');
      err.signin = !!j.signin;
      if (err.signin && action !== 'signin') lost(err.message);
      throw err;
    }
    return j;
  }

  /* The session ended (expired, code changed elsewhere, marked as left):
     back to the sign-in, keeping the device set up. */
  function lost(msg) {
    setCfg({ token: '' });
    stop();
    if (window.App && window.App.signedOut) window.App.signedOut(msg);
  }

  /* ══ Setting a device up, and signing in ═══════════════════════════════ */

  /* Typed: the office code (or, where the page wasn't built with the
     start of the link, the whole link). The server answering is the test. */
  async function setup(typed) {
    if (!String(typed || '').trim()) throw new Error(window.JOR_MIN_SERVER_START ? 'Enter the office code.' : 'Paste the server’s link.');
    const url = linkFrom(typed);
    if (!goodUrl(url)) throw new Error('That doesn’t look like the server’s link (it ends in /exec).');
    const j = await call('ping', {}, { url: url, fromCode: !/^https?:/.test(String(typed).trim()) });
    setCfg({ url: url, token: '', inbox: j.inbox || '', meetInbox: j.meetInbox || '', minutesFrom: j.minutesFrom || '' });
    return j;
  }

  async function roster() {
    const j = await call('roster');
    setCfg({ roster: j.people });
    return j.people;
  }

  async function signin(pid, pin, keep) {
    const j = await call('signin', { pid: pid, pin: pin, keep: !!keep });
    setCfg({ token: j.token, pid: j.me, keep: !!keep, must: !!j.must, last: pid });
    C.useServer(j.me);
    await sync(true);
    return { must: j.must };
  }

  async function signout() {
    try { if (C.hasPending()) await sync(true); } catch (e) { }
    const had = C.hasPending();
    try { await call('signout'); } catch (e) { }
    setCfg({ token: '', must: false });
    stop();
    return { lostChanges: had };
  }

  function forgetDevice() { stop(); try { localStorage.removeItem(LS); } catch (e) { } C.forget(); }

  async function setPin(pid, pin, old) {
    await call('setPin', { pid: pid, pin: pin, old: old || '' });
    if (pid === cfg().pid) setCfg({ must: false });
  }
  async function pinStatus() { return (await call('pinStatus')).status; }

  /* ══ Keeping in step ═══════════════════════════════════════════════════ */

  function note(t, bad) { status = { t: t, at: new Date(), bad: !!bad }; const el = document.getElementById('sv-status'); if (el) el.textContent = t; }

  /* Send what changed here (if anything), take back this person's part. */
  async function sync(quiet) {
    if (!connected()) return;
    if (busy) { again = true; return; }
    busy = true;
    const snap = C.delta();
    try {
      const j = await call('sync', { delta: snap.empty ? null : snap.delta });
      C.sent(snap);
      const beforeRev = C.state && C.state.rev;
      const beforeTop = C.state && C.state.log.length ? C.state.log[0].at : null;
      C.replace(j.view);
      inbox = j.inbox || '';
      setCfg({ inbox: inbox, meetInbox: j.meetInbox || '', minutesFrom: j.minutesFrom || '', must: !!j.must });
      note(j.refused ? 'Saved — ' + j.refused + ' change' + (j.refused === 1 ? '' : 's') + ' you aren’t allowed to make were left out' : 'Up to date');
      if (j.refused && !quiet && window.UI) window.UI.toast(j.refused + ' change' + (j.refused === 1 ? ' wasn’t' : 's weren’t') + ' saved: only the people it belongs to can make ' + (j.refused === 1 ? 'it' : 'them') + '.', 'bad', 7000);
      const top = C.state.log.length ? C.state.log[0] : null;
      if (window.App && window.App.ME && (beforeRev !== C.state.rev || (top && top.at !== beforeTop))) {
        window.App.render();
        if (window.App.itemOpen) window.App.openItem(window.App.itemOpen, true);
        if (!quiet && top && top.at !== beforeTop && top.by !== window.App.ME.id && top.kind !== 'focus' && window.UI) {
          window.UI.toast('<b>' + C.esc(window.UI.name(top.by)) + '</b> — ' + C.esc(top.what), 'sync', 5000);
        }
      }
    } catch (e) {
      if (!e.signin) note('Not saved to the server yet: ' + e.message, true);
      throw e;
    } finally {
      busy = false;
      if (again || C.hasPending()) { again = false; if (connected()) schedule(); }
    }
  }

  function schedule() {
    if (!connected()) return;
    clearTimeout(timer);
    timer = setTimeout(function () { sync(false).catch(function () { }); }, 1800);
  }

  function start() {
    C.onSaved = schedule;
    clearInterval(poll);
    poll = setInterval(function () { if (!document.hidden && connected()) sync(false).catch(function () { }); }, 30000);
  }
  function stop() { clearTimeout(timer); clearInterval(poll); timer = null; poll = null; }

  document.addEventListener('visibilitychange', function () { if (!document.hidden && connected()) sync(false).catch(function () { }); });

  /* On opening, signed in already: show what's here, then catch up. */
  async function boot() {
    start();
    try { await sync(true); } catch (e) { if (!e.signin) note('Working on this device for now: ' + e.message, true); }
  }

  /* ══ Gemini, through the server ════════════════════════════════════════ */

  async function gemini(path, body) {
    const j = await call('gemini', { path: path, body: body });
    if (j.status >= 400) {
      const msg = (j.body && j.body.error && j.body.error.message) || '';
      const busy = j.status === 503 || j.status === 429 || /overloaded|high demand/i.test(msg);
      const e = new Error(busy ? 'Google’s AI is very busy just now' + (j.tried > 1 ? ' (' + j.tried + ' models tried)' : '') + '. Nothing is lost — try again in a few minutes.' :
        /schema/i.test(msg) && j.status === 400 ? 'schema' : 'Gemini said: ' + (msg || 'error ' + j.status));
      e.status = j.status; e.schema = e.message === 'schema';
      throw e;
    }
    return j.body;
  }
  async function geminiModels() { return (await call('geminiModels')).models; }
  async function geminiUpload(blob, mime, onStage) {
    onStage && onStage('uploading');
    const data = await new Promise(function (res, rej) {
      const r = new FileReader();
      r.onload = function () { res(String(r.result).replace(/^data:[^,]*,/, '')); };
      r.onerror = function () { rej(new Error('Couldn’t read the file.')); };
      r.readAsDataURL(blob);
    });
    return (await call('geminiUpload', { mime: mime, data: data })).part;
  }

  /* ══ Settings → Server ═════════════════════════════════════════════════ */

  function settings() {
    const c = cfg(), U = window.UI, esc = C.esc;
    if (connected()) {
      return '<div class="grid g2"><div class="card"><div class="card-h"><h3>Server</h3><span class="pill">Connected</span></div><div class="card-b">' +
        '<p>Everything is kept on JOR’s server. This device holds only ' + esc(window.App.ME.first || window.App.ME.name) + '’s part, and sends changes as they’re made.</p>' +
        (inbox || c.inbox ? '<p class="mini">To-do lists emailed to <b>' + esc(inbox || c.inbox) + '</b> are added for the sender.</p>' : '<p class="mini">Emailing lists in is off (no TODO_INBOX set on the server).</p>') +
        '<div class="row"><button class="btn" data-act="sv-pull">Fetch the latest now</button></div>' +
        '<p class="mini" id="sv-status">' + esc(status.t || 'Up to date.') + '</p></div></div>' +
        '<div class="card"><div class="card-h"><h3>Who can see what</h3></div><div class="card-b why-gem">' +
        '<p><b>Checked by the server, not the browser.</b> Each person is sent only what they may see, and a change they aren’t allowed to make is refused, however it was sent.</p>' +
        '<p><b>Bernard</b> sees everything. <b>Iain</b> sees everyone who reports to him. <b>Everyone else</b> sees their own list, what they asked of others or help with, and the meetings they sit in.</p>' +
        '<p><b>Private to-dos</b> are their owner’s alone. A manager above the owner is sent them only as blanks, to count.</p>' +
        '<p><b>Sign-in codes</b> are each person’s own, stored hashed on the server. Five wrong tries locks that name for fifteen minutes.</p></div></div></div>';
    }
    return '<p class="hint">The server is a small Google Apps Script that keeps one shared copy of everything, decides who sees what, sends the daily and weekly emails, turns emailed lists into to-dos and holds the Gemini key. ' +
      'Setting it up takes about ten minutes — the steps are in <b>server/SETUP.md</b> beside the app.</p>' +
      '<div class="card"><div class="card-h"><h3>Use the server on this device</h3><span class="pill grey">This computer only for now</span></div><div class="card-b">' +
      U.field('Server link', '<input class="in" id="sv-url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(c.url || '') + '" autocomplete="off" spellcheck="false">', 'The web-app link from Deploy in Apps Script. Kept on this device only.') +
      '<div class="row"><button class="btn p" data-act="sv-connect">Use the server</button></div>' +
      '<p class="mini">After this, everyone signs in with their own code. What’s on this computer now stays here and isn’t sent.</p>' +
      '<p class="mini" id="sv-status">' + esc(status.t || '') + '</p></div></div>';
  }

  if (window.App) {
    window.App.on['sv-connect'] = function () {
      const url = document.getElementById('sv-url').value;
      note('Checking…');
      setup(url).then(function () { window.App.toServer(); })
        .catch(function (e) { note(e.message, true); window.UI.toast(C.esc(e.message), 'bad', 7000); });
    };
    window.App.on['sv-pull'] = function () {
      sync(true).then(function () { window.App.render(); window.UI.toast('Brought up to date.', 'good'); }).catch(function (e) { window.UI.toast(C.esc(e.message), 'bad'); });
    };
  }

  return { cfg: cfg, setCfg: setCfg, ready: ready, connected: connected, goodUrl: goodUrl, linkFrom: linkFrom, call: call, setup: setup, roster: roster,
    signin: signin, signout: signout, forgetDevice: forgetDevice, setPin: setPin, pinStatus: pinStatus,
    boot: boot, sync: sync, schedule: schedule, start: start, stop: stop, settings: settings,
    gemini: gemini, geminiModels: geminiModels, geminiUpload: geminiUpload,
    get inbox() { return inbox || cfg().inbox || ''; },
    get meetInbox() { return cfg().meetInbox || ''; },
    get minutesFrom() { return cfg().minutesFrom || ''; } };
})();

</script>
<script>/* register.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the register
   What the spreadsheet tabs were, as one searchable list: every action
   with its owner, date, how often it has moved and the last word on it,
   and every decision the company has taken, findable in a second instead
   of by opening tabs.
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  'use strict';

  const App = window.App, C = window.Core, E = window.Engine, W = window.When, U = window.UI;
  const esc = C.esc;

  const f = { tab: 'action', q: '', series: 'all', owner: 'all', status: 'open', topic: 'all', group: 'none' };

  App.views.register = { render: render };

  function visible() {
    const S = App.S, ME = App.ME;
    return S.items.filter(function (it) { return E.canSee(S, ME, it); });
  }

  function matches(it, T) {
    if (f.series === 'own' && it.series) return false;
    if (f.series !== 'all' && f.series !== 'own' && it.series !== f.series) return false;
    if (f.owner !== 'all' && it.owner !== f.owner && (it.helpers || []).indexOf(f.owner) < 0 && (it.everyone || []).indexOf(f.owner) < 0) return false;
    if (f.topic !== 'all' && it.topic !== f.topic) return false;
    if (it.kind === 'action') {
      const open = E.isOpen(it);
      switch (f.status) {
        case 'open': if (!open) return false; break;
        case 'overdue': if (!open || !it.due || it.due >= T) return false; break;
        case 'moved': if (!open || E.slips(it) < 2) return false; break;
        case 'waiting': if (it.status !== 'waiting') return false; break;
        case 'stale': { const lt = E.lastTouch(it); if (!open || !lt || W.diff(lt, T) < 14) return false; break; }
        case 'done': if (it.status !== 'done') return false; break;
        case 'dropped': if (it.status !== 'dropped') return false; break;
      }
    }
    if (f.q) {
      const lu = E.lastUpdate(it);
      const hay = E.norm([it.ref, it.title, it.detail, U.name(it.owner), lu ? lu.t : '', it.waitingOn].join(' '));
      if (E.norm(f.q).split(/\s+/).some(function (w) { return w && hay.indexOf(w) < 0; })) return false;
    }
    return true;
  }

  function render() {
    const S = App.S, T = App.today, ME = App.ME;
    const all = visible();
    const count = function (k) { return all.filter(function (it) { return it.kind === k; }).length; };
    const rows = all.filter(function (it) { return it.kind === f.tab && matches(it, T); });

    let h = App.head('Register', 'Every action, decision and note in one place, from every meeting you sit in and your own list. ' +
      'Nothing here was copied from one meeting to the next.',
      '<div class="seg">' + [['action', 'Actions'], ['decision', 'Decisions'], ['note', 'Notes']].map(function (x) {
        return '<button class="' + (f.tab === x[0] ? 'on' : '') + '" data-act="rg-tab" data-t="' + x[0] + '">' + x[1] + ' <small>' + count(x[0]) + '</small></button>';
      }).join('') + '</div>');

    const series = S.series.filter(function (s) { return E.isAdmin(ME) || s.members.indexOf(ME.id) >= 0; });
    h += '<div class="card"><div class="card-h filters">' +
      '<div class="srch">' + U.icon('list') + '<input class="in" id="rg-q" data-in="rg-q" placeholder="' + (f.tab === 'decision' ? 'Search decisions — words or a reference' : 'Search — words, a name or a reference') + '" value="' + esc(f.q) + '"></div>' +
      U.selectOf('series', [{ v: 'all', t: 'All meetings' }].concat(series.map(function (s) { return { v: s.id, t: s.name }; }))
        .concat(f.tab === 'action' ? [{ v: 'own', t: 'Personal to-dos' }] : []), f.series, 'data-ch="rg-series"') +
      (f.tab === 'action' ? U.selectOf('owner', [{ v: 'all', t: 'Anyone' }].concat(U.peopleOptions()), f.owner, 'data-ch="rg-owner"') +
        U.selectOf('status', [{ v: 'open', t: 'Open' }, { v: 'overdue', t: 'Overdue' }, { v: 'moved', t: 'Moved twice or more' }, { v: 'waiting', t: 'Waiting on someone' },
          { v: 'stale', t: 'No update for 2 weeks' }, { v: 'done', t: 'Done' }, { v: 'dropped', t: 'Dropped' }, { v: 'all', t: 'Everything' }], f.status, 'data-ch="rg-status"') : '') +
      U.selectOf('topic', [{ v: 'all', t: 'All topics' }].concat(U.topicOptions()), f.topic, 'data-ch="rg-topic"') +
      (f.tab === 'action' ? U.selectOf('group', [{ v: 'none', t: 'No grouping' }, { v: 'owner', t: 'By owner' }, { v: 'topic', t: 'By topic' }, { v: 'series', t: 'By meeting' }], f.group, 'data-ch="rg-group"') : '') +
      '<span class="rowend"><span class="note">' + rows.length + '</span><button class="btn sm" data-act="rg-csv">' + U.icon('down') + 'CSV</button></span></div>';

    if (!rows.length) {
      h += '<div class="empty"><b>Nothing matches.</b>Try fewer words or a wider filter.</div></div>';
      return h;
    }
    if (f.tab !== 'action') {
      h += '<div class="card-b tight"><div class="declist">' + rows.sort(function (a, b) { return a.on < b.on ? 1 : -1; }).slice(0, 400).map(function (it) {
        const m = S.meetingMap[it.meeting], s0 = m && S.seriesMap[m.series];
        return '<div class="decrow" data-open="' + esc(it.id) + '" tabindex="0"><div class="dr-d"><b>' + esc(W.fmt(it.on, 'dm')) + '</b><span>' + esc(it.on.slice(0, 4)) + '</span></div>' +
          '<div class="dr-m"><div class="dr-t">' + hl(it.title) + '</div><div class="mini">' + (s0 ? '<i class="tdot" style="background:' + U.tint(s0.tint) + '"></i>' + esc(s0.name) : '') +
          ' · ' + esc(U.topicName(it.topic)) + ' · ' + esc(it.ref) + '</div></div></div>';
      }).join('') + '</div></div></div>';
      return h;
    }

    const sorted = rows.sort(function (a, b) {
      const ao = E.isOpen(a), bo = E.isOpen(b);
      if (ao !== bo) return ao ? -1 : 1;
      return (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0;
    });
    const groups = {};
    const keyOf = function (it) {
      if (f.group === 'owner') return U.name(it.owner);
      if (f.group === 'topic') return U.topicName(it.topic) || 'No topic';
      if (f.group === 'series') return it.series ? S.seriesMap[it.series].name : 'Personal to-dos';
      return '';
    };
    sorted.slice(0, 600).forEach(function (it) { const k = keyOf(it); (groups[k] = groups[k] || []).push(it); });
    h += '<div class="card-b tight"><div class="tscroll tall"><table class="t reg"><thead><tr><th>Ref</th><th>Action</th><th>Owner</th><th>Due</th>' +
      '<th class="num">Moved</th><th>Progress</th><th>Last update</th><th>Raised</th></tr></thead><tbody>' +
      Object.keys(groups).sort().map(function (k) {
        return (k ? '<tr class="grp"><td colspan="8">' + esc(k) + ' <span class="mini">' + groups[k].length + '</span></td></tr>' : '') +
          groups[k].map(function (it) {
            const lu = E.lastUpdate(it), n = E.slips(it), m = S.meetingMap[it.meeting], s0 = m && S.seriesMap[m.series];
            return '<tr class="clk' + (E.isOpen(it) ? '' : ' dim') + '" data-open="' + esc(it.id) + '"><td class="nw ref">' + esc(it.ref) + '</td>' +
              '<td><b>' + hl(it.title) + '</b>' + (it.status === 'waiting' ? ' <span class="fl k-waiting">Waiting on ' + esc(it.waitingOn) + '</span>' : '') +
              (it.private ? ' <span class="src priv">Private</span>' : '') + '</td>' +
              '<td class="nw">' + ((it.everyone || []).length ? '<span class="mini">Everyone</span>' : U.avatar(it.owner, 'xs') + ' ' + esc(U.first(it.owner))) + '</td>' +
              '<td class="nw">' + U.dueChip(it, T) + '</td>' +
              '<td class="num">' + (n ? '<span class="fl k-' + (n >= 2 ? 'moved2' : 'moved') + '" title="First due ' + esc(W.fmt(E.firstDue(it), 'med')) + '">' + n + '×</span>' : '') + '</td>' +
              '<td>' + (E.isOpen(it) ? U.pbar(it.progress, true) : '') + '</td>' +
              '<td class="lu-c">' + (lu && lu.t ? '<span title="' + esc(W.fmt(lu.on, 'med')) + '">' + hl(lu.t) + '</span>' : '<span class="mini">—</span>') + '</td>' +
              '<td class="nw mini">' + (s0 ? '<i class="tdot" style="background:' + U.tint(s0.tint) + '"></i>' + esc(s0.short) + ' ' : '') + esc(W.fmt(it.on, 'dm')) + '</td></tr>';
          }).join('');
      }).join('') + '</tbody></table></div>' + (rows.length > 600 ? '<div class="mini pad">Showing the first 600 — narrow the filter to see the rest.</div>' : '') + '</div></div>';
    return h;
  }

  function hl(s) {
    const t = esc(s);
    if (!f.q.trim()) return t;
    const words = f.q.trim().split(/\s+/).filter(function (w) { return w.length > 1; }).map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
    if (!words.length) return t;
    return t.replace(new RegExp('(' + words.join('|') + ')', 'gi'), '<mark>$1</mark>');
  }

  App.on['rg-tab'] = function (b) { f.tab = b.getAttribute('data-t'); if (f.tab !== 'action' && f.series === 'own') f.series = 'all'; App.render(); };
  let qt = null;
  App.onInput['rg-q'] = function (el) { f.q = el.value; clearTimeout(qt); qt = setTimeout(App.render, 140); };
  ['series', 'owner', 'status', 'topic', 'group'].forEach(function (k) {
    App.onChange['rg-' + k] = function (el) { f[k] = el.value; App.render(); };
  });

  App.on['rg-csv'] = function () {
    const S = App.S, T = App.today;
    const rows = visible().filter(function (it) { return it.kind === f.tab && matches(it, T); });
    const q = function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const out = [['Ref', 'Type', 'Title', 'Detail', 'Owner', 'Due', 'First due', 'Times moved', 'Status', 'Progress %', 'Waiting on', 'Last update', 'Last update on', 'Meeting', 'Raised on', 'Topic']];
    rows.forEach(function (it) {
      const lu = E.lastUpdate(it), m = S.meetingMap[it.meeting], s0 = m && S.seriesMap[m.series];
      out.push([it.ref, it.kind, it.title, it.detail, (it.everyone || []).length ? 'Everyone' : U.name(it.owner), it.due || (it.ongoing ? 'Ongoing' : ''),
        E.firstDue(it) || '', E.slips(it), it.status, it.progress, it.waitingOn, lu ? lu.t : '', lu ? lu.on : '', s0 ? s0.name : (it.series ? '' : 'Personal'),
        it.on, U.topicName(it.topic)]);
    });
    U.download('JOR register ' + T + '.csv', '﻿' + out.map(function (r) { return r.map(q).join(','); }).join('\r\n'), 'text/csv;charset=utf-8');
  };
})();

</script>
<script>/* team.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the dashboard, for Bernard and Iain
   Who is getting through their list and who is stuck, how long things take
   from being raised to being done, how far each plan has got, and where
   actions are getting stuck. Read from the lists people keep anyway rather
   than a separate report to fill in. Bernard sees everyone; Iain everyone
   who reports to him. A private to-do is counted, never shown.
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  'use strict';

  const App = window.App, C = window.Core, E = window.Engine, W = window.When, U = window.UI;
  const esc = C.esc;
  let sortBy = 'need';
  let tsort = { k: 'need', dir: 1 };

  /* ══ How fast things get done ══════════════════════════════════════════ */

  function median(a) {
    if (!a.length) return null;
    const s = a.slice().sort(function (x, y) { return x - y; }), m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  function days(n) {
    if (n == null) return '—';
    n = Math.round(n);
    return n < 1 ? 'same day' : n === 1 ? '1 day' : n < 21 ? n + ' days' : Math.round(n / 7) + ' weeks';
  }

  /* One person's pace: finished in 30 days, how long those took (raised to
     done, last 90 days), and how old their oldest open action is. */
  function pace(S, pid, T) {
    const q = W.add(T, -90), m30 = W.add(T, -29);
    const out = { done30: 0, took: [], ages: [], oldest: null };
    E.listFor(S, pid).forEach(function (it) {
      const part = E.myPart(it, pid);
      if (part === 'helper') return;
      const doneOn = part === 'partdone' ? it.parts[pid] : it.status === 'done' ? it.doneOn : null;
      if (doneOn && doneOn >= m30) out.done30++;
      /* Brought across already done: when it started isn't known, so it says nothing about pace. */
      if (doneOn && doneOn >= q && it.on && !(it.imported && doneOn <= it.on)) out.took.push(Math.max(0, W.diff(it.on, doneOn)));
      const open = (part === 'part' || part === 'owner') && E.isOpen(it);
      if (open && it.on) { const age = Math.max(0, W.diff(it.on, T)); out.ages.push(age); if (out.oldest == null || age > out.oldest) out.oldest = age; }
    });
    out.typical = median(out.took);
    return out;
  }

  const BUCKETS = [['Within a week', 7], ['1–2 weeks', 14], ['2–4 weeks', 28], ['1–3 months', 91], ['Longer', Infinity]];
  function buckets(list) {
    const n = BUCKETS.map(function () { return 0; });
    list.forEach(function (d) { for (let i = 0; i < BUCKETS.length; i++) if (d <= BUCKETS[i][1]) { n[i]++; return; } });
    return n;
  }
  /* Single-hue bars with the count written beside each, so nothing rests on colour. */
  function hbars(labels, values, colour, unit) {
    const max = Math.max.apply(null, values.concat([1]));
    return '<div class="bars">' + labels.map(function (l, i) {
      return '<div class="bar" title="' + esc(l + ': ' + values[i] + ' ' + unit) + '"><div class="bl">' + esc(l) + '</div><div class="bt"><i style="width:' + (100 * values[i] / max).toFixed(1) + '%;background:' + colour + '"></i></div><div class="bv">' + values[i] + '</div></div>';
    }).join('') + '</div>';
  }

  /* Each plan: how far it has got, department by department. */
  function plans(S, T) {
    const list = S.series.filter(function (s) { return s.kind === 'plan'; });
    if (!list.length) return '';
    return list.map(function (pl) {
      const acts = S.items.filter(function (it) { return it.series === pl.id && it.kind === 'action' && !it.private && it.status !== 'dropped'; });
      const by = {};
      acts.forEach(function (it) { const k = it.topic || ''; (by[k] = by[k] || []).push(it); });
      const row = function (label, list2) {
        const done = list2.filter(function (it) { return it.status === 'done'; }).length;
        const over = list2.filter(function (it) { return E.isOpen(it) && it.due && it.due < T; }).length;
        const pc = list2.length ? Math.round(100 * done / list2.length) : 0;
        return '<div class="pl-row" title="' + esc(label + ': ' + done + ' of ' + list2.length + ' done' + (over ? ', ' + over + ' overdue' : '')) + '">' +
          '<div class="pl-l">' + esc(label) + '</div><div class="pl-b"><i style="width:' + pc + '%"></i></div>' +
          '<div class="pl-v"><b>' + pc + '%</b> <span class="mini">' + done + '/' + list2.length + '</span>' + (over ? ' <span class="fl k-overdue">' + over + ' overdue</span>' : '') + '</div></div>';
      };
      return '<div class="card"><div class="card-h"><h3>' + esc(pl.name) + '</h3><span class="note">how far each department has got</span></div><div class="card-b">' +
        row('Whole plan', acts) + '<div class="pl-sep"></div>' +
        Object.keys(by).sort(function (a, b) { return U.topicName(a).localeCompare(U.topicName(b)); }).map(function (k) { return row(U.topicName(k) || 'Other', by[k]); }).join('') +
        '</div></div>';
    }).join('');
  }

  App.views.team = { render: render, after: wire, mgmt: true };

  /* Who this person oversees: Bernard everyone, Iain everyone below him. */
  function scope() {
    return E.below(App.S, App.ME.id);
  }

  function render() {
    const S = App.S, T = App.today, ME = App.ME;
    const people = scope();
    if (!people.length) {
      return App.head('Overview', '') + '<div class="empty"><b>Nobody reports to you yet.</b>Set who reports to whom under Settings → People.</div>';
    }
    const owners = {};
    people.forEach(function (p) { owners[p.id] = true; });
    const stats = people.map(function (p) { const s = E.personStats(S, p.id, T); return { p: p, s: s, h: E.health(s) }; });
    const acts = S.items.filter(function (it) { return it.kind === 'action' && !it.private && owners[it.owner]; });
    const open = acts.filter(E.isOpen);
    const over = open.filter(function (it) { return it.due && it.due < T; }).length;
    const moved = open.filter(function (it) { return E.slips(it) >= 2; }).length;
    const wk = W.add(T, -6);
    const doneWk = acts.filter(function (it) { return it.status === 'done' && it.doneOn >= wk; }).length;
    let on = 0, dn = 0;
    stats.forEach(function (x) { on += x.s.ontimeN; dn += x.s.ontimeD; });
    const count = { ok: 0, watch: 0, behind: 0, clear: 0 };
    stats.forEach(function (x) { count[x.h.k]++; });

    const paces = {};
    stats.forEach(function (x) { paces[x.p.id] = pace(S, x.p.id, T); });
    const allTook = [], allAges = [];
    let done30 = 0;
    stats.forEach(function (x) { const pc = paces[x.p.id]; done30 += pc.done30; allTook.push.apply(allTook, pc.took); allAges.push.apply(allAges, pc.ages); });
    const typical = median(allTook);

    let h = App.head('Dashboard',
      (ME.access === 'owner' ? 'Everyone in the company' : 'Everyone who reports to you') + ': who’s getting through their list, how long things take, and where they get stuck — read from the lists people keep anyway. ' +
      'Private to-dos are counted, never shown.');
    h += '<div class="tiles">' +
      tile('Open actions', open.length, people.length + ' people' + (moved ? ' · ' + moved + ' moved twice or more' : '')) +
      tile('Overdue', over, 'past their date today', over ? 'danger' : '') +
      tile('Done in 30 days', done30, doneWk + ' in the last 7 days') +
      tile('Typical time to finish', days(typical), 'raised to done, last 90 days — half take longer') +
      tile('On time', dn ? Math.round(100 * on / dn) + '%' : '—', 'of actions finished in 90 days, against their first date') + '</div>';

    /* Who's getting through: one line each, sortable. */
    const cols = [['name', 'Person'], ['open', 'Open'], ['over', 'Overdue'], ['done', 'Done, 30 days'], ['typ', 'Typical time to finish'], ['old', 'Oldest open'], ['ontime', 'On time'], ['last', 'Last update'], ['need', 'How they’re doing']];
    const rankT = { behind: 0, watch: 1, ok: 2, clear: 3 };
    const val = function (x, k) {
      const pc = paces[x.p.id];
      return k === 'name' ? x.p.name : k === 'open' ? x.s.open : k === 'over' ? x.s.overdue : k === 'done' ? pc.done30 : k === 'typ' ? (pc.typical == null ? 1e9 : pc.typical) :
        k === 'old' ? (pc.oldest == null ? -1 : pc.oldest) : k === 'ontime' ? (x.s.ontime == null ? -1 : x.s.ontime) : k === 'last' ? (x.s.lastActive || '') : rankT[x.h.k] * 1000 - x.s.overdue;
    };
    const rows = stats.slice().sort(function (a, b) {
      const va = val(a, tsort.k), vb = val(b, tsort.k);
      const c = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
      return c * tsort.dir || a.p.name.localeCompare(b.p.name);
    });
    h += '<div class="card"><div class="card-h"><h3>Who’s getting through</h3><span class="note">tap a heading to sort · tap a name to see their list</span></div><div class="card-b tight"><div class="tscroll"><table class="t pace"><thead><tr>' +
      cols.map(function (c) {
        return '<th><button class="thsort' + (tsort.k === c[0] ? ' on' : '') + '" data-act="tm-tsort" data-k="' + c[0] + '">' + esc(c[1]) + (tsort.k === c[0] ? (tsort.dir > 0 ? ' ▲' : ' ▼') : '') + '</button></th>';
      }).join('') + '</tr></thead><tbody>' +
      rows.map(function (x) {
        const pc = paces[x.p.id], s0 = x.s;
        return '<tr class="clk" data-act="tm-person" data-p="' + esc(x.p.id) + '"><td class="nw">' + U.avatar(x.p.id, 'xs') + ' <b>' + esc(x.p.name) + '</b></td>' +
          '<td class="num">' + s0.open + '</td><td class="num' + (s0.overdue ? ' badc' : '') + '">' + s0.overdue + '</td>' +
          '<td class="num' + (pc.done30 ? ' goodc' : '') + '">' + pc.done30 + '</td><td class="nw">' + days(pc.typical) + '</td>' +
          '<td class="nw' + (pc.oldest > 60 ? ' warnc' : '') + '">' + (pc.oldest == null ? '—' : pc.oldest < 1 ? 'raised today' : days(pc.oldest)) + '</td>' +
          '<td class="num">' + (s0.ontime == null ? '—' : s0.ontime + '%') + '</td>' +
          '<td class="nw mini">' + (s0.lastActive ? esc(W.rel(s0.lastActive, T)) : '—') + '</td>' +
          '<td><span class="hpill k-' + x.h.k + '">' + esc(x.h.t) + '</span></td></tr>';
      }).join('') + '</tbody></table></div></div></div>';

    /* How long things take: finished work by time taken; open work by age. */
    h += '<div class="grid g2"><div class="card"><div class="card-h"><h3>How long things take</h3><span class="note">finished in the last 90 days · ' + allTook.length + ' actions</span></div><div class="card-b">' +
      (allTook.length ? hbars(BUCKETS.map(function (b) { return b[0]; }), buckets(allTook), '#00875A', 'finished') : '<p class="mini">Nothing finished in the last 90 days yet.</p>') + '</div></div>' +
      '<div class="card"><div class="card-h"><h3>How old the open work is</h3><span class="note">since it was raised · ' + allAges.length + ' open</span></div><div class="card-b">' +
      (allAges.length ? hbars(BUCKETS.map(function (b) { return b[0]; }), buckets(allAges), '#B08D2E', 'open') : '<p class="mini">Nothing open.</p>') + '</div></div></div>';

    h += plans(S, T);

    /* One card per person, grouped by who they report to. */
    const groups = {};
    stats.forEach(function (x) { (groups[x.p.reportsTo || ''] = groups[x.p.reportsTo || ''] || []).push(x); });
    const order = Object.keys(groups).sort(function (a, b) {
      if (a === ME.id) return -1; if (b === ME.id) return 1;
      return U.name(a).localeCompare(U.name(b));
    });
    h += '<div class="card"><div class="card-h"><h3>How everyone is doing</h3>' +
      '<span class="hsum"><span class="hdot k-ok"></span>' + count.ok + ' on top of it<span class="hdot k-watch"></span>' + count.watch + ' some slipping' +
      '<span class="hdot k-behind"></span>' + count.behind + ' need a hand</span>' +
      '<div class="rowend"><span class="mini">Sort</span><div class="seg sm">' + [['need', 'Needs attention'], ['name', 'Name'], ['done', 'Done']].map(function (x) {
        return '<button class="' + (sortBy === x[0] ? 'on' : '') + '" data-act="tm-sort" data-s="' + x[0] + '">' + x[1] + '</button>';
      }).join('') + '</div></div></div><div class="card-b">';
    const rank = { behind: 0, watch: 1, ok: 2, clear: 3 };
    order.forEach(function (boss) {
      const list = groups[boss].slice().sort(function (a, b) {
        if (sortBy === 'done') return b.s.done7 - a.s.done7 || a.p.name.localeCompare(b.p.name);
        if (sortBy === 'name') return a.p.name.localeCompare(b.p.name);
        return rank[a.h.k] - rank[b.h.k] || b.s.overdue - a.s.overdue || a.p.name.localeCompare(b.p.name);
      });
      h += '<div class="pgroup"><div class="lbl">' + (boss === ME.id ? 'Reporting to you' : 'Reporting to ' + esc(U.name(boss))) + ' · ' + list.length + '</div><div class="pcards">' +
        list.map(card).join('') + '</div></div>';
    });
    h += '</div></div>';

    h += '<div class="grid g2">';
    h += '<div class="card"><div class="card-h"><h3>Raised and done, week by week</h3><span class="note">last 12 weeks · actions from meetings</span></div>' +
      '<div class="card-b">' + weekChart(E.weekly(S, T, 12, owners)) + '</div></div>';
    const reasons = E.slipReasons(S, W.add(T, -90), owners);
    const rmax = Math.max.apply(null, reasons.map(function (r) { return r.v; }).concat([1]));
    h += '<div class="card"><div class="card-h"><h3>Why dates move</h3><span class="note">meeting actions, last 90 days · ' + reasons.reduce(function (a, r) { return a + r.v; }, 0) + ' moves</span></div>' +
      '<div class="card-b">' + (reasons.length ? '<div class="bars">' + reasons.map(function (r) {
        return '<div class="bar" title="' + esc(r.k + ': ' + r.v) + '"><div class="bl">' + esc(r.k) + '</div><div class="bt"><i style="width:' + (100 * r.v / rmax).toFixed(1) + '%;background:#8A6D1F"></i></div><div class="bv">' + r.v + '</div></div>';
      }).join('') + '</div><p class="mini" style="margin:12px 0 0">Waiting on people outside JOR is a supplier question. “Other work came first” is a workload question.</p>'
        : '<p class="mini">No dates have moved in the last 90 days.</p>') + '</div></div>';
    h += '</div>';

    const oldest = open.filter(function (it) { return it.series; }).sort(function (a, b) { return a.on < b.on ? -1 : 1; }).slice(0, 8);
    if (oldest.length) {
      h += '<div class="card"><div class="card-h"><h3>Longest open</h3><span class="note">meeting actions</span></div><div class="card-b tight"><table class="t"><tbody>' +
        oldest.map(function (it) {
          return '<tr class="clk" data-open="' + esc(it.id) + '"><td class="ref nw">' + esc(it.ref) + '</td><td><b>' + esc(it.title) + '</b>' + (it.detail ? '<div class="mini">' + esc(it.detail) + '</div>' : '') + '</td><td class="nw">' + U.avatar(it.owner, 'xs') + ' ' + esc(U.first(it.owner)) + '</td>' +
            '<td class="nw mini">raised ' + esc(W.fmt(it.on, 'dm')) + ' · ' + W.diff(it.on, T) + ' days</td><td class="num">' + (E.slips(it) ? '<span class="fl k-moved2">' + E.slips(it) + '×</span>' : '') + '</td><td>' + U.dueChip(it, T) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }
    return h;
  }

  function card(x) {
    const s = x.s, p = x.p, T = App.today;
    const shown = s.todayList.filter(function (it) { return !it.private; });
    return '<div class="pcard h-' + x.h.k + '" data-act="tm-person" data-p="' + esc(p.id) + '" role="button" tabindex="0">' +
      '<div class="pc-h">' + U.avatar(p.id, '') + '<div class="pc-n"><b>' + esc(p.name) + '</b><span>' + esc(p.role || p.initials) + '</span></div>' +
      '<span class="hpill k-' + x.h.k + '">' + esc(x.h.t) + '</span></div>' +
      '<div class="pc-s">' +
      '<div><b>' + s.open + '</b><span>open</span></div>' +
      '<div class="' + (s.overdue ? 'bad' : '') + '"><b>' + s.overdue + '</b><span>overdue</span></div>' +
      '<div class="' + (s.done7 ? 'good' : '') + '"><b>' + s.done7 + '</b><span>done this week</span></div>' +
      '<div><b>' + (s.ontime == null ? '—' : s.ontime + '%') + '</b><span>on time</span></div></div>' +
      '<div class="pc-t">' + (shown.length ? '<span class="sun on sm">' + U.sun(true) + '</span>' + esc(shown[0].title) + (shown.length > 1 ? ' <span class="mini">+' + (shown.length - 1) + '</span>' : '')
        : '<span class="mini">Nothing on today’s list</span>') + '</div>' +
      '<div class="pc-f mini">' + (s.lastActive ? 'Last update ' + esc(W.rel(s.lastActive, T)) : 'No updates yet') +
      (s.moved2 ? ' · <span class="warnc">' + s.moved2 + ' moved 2+ times</span>' : '') + (s.stale ? ' · ' + s.stale + ' quiet 2 weeks' : '') + '</div></div>';
  }

  function tile(k, v, s, tone) {
    return '<div class="tile ' + (tone || '') + '"><div class="tl">' + esc(k) + '</div><div class="tv">' + esc(v) + '</div><div class="ts">' + esc(s) + '</div></div>';
  }

  /* Grouped bars: raised (gold) beside done (green), one pair per week.
     Colours checked for colour-blind separation against the white card. */
  function weekChart(wk) {
    const Wd = 640, Hh = 210, pl = 30, pr = 8, pt = 12, pb = 28;
    const iw = Wd - pl - pr, ih = Hh - pt - pb;
    const max = Math.max.apply(null, wk.map(function (x) { return Math.max(x.raised, x.closed); }).concat([4]));
    const top = Math.ceil(max / 5) * 5;
    const Y = function (v) { return pt + ih - (v / top) * ih; };
    const slot = iw / wk.length, bw = Math.min(16, (slot - 10) / 2);
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const v = top * i / 4, y = Y(v).toFixed(1);
      g += '<line x1="' + pl + '" x2="' + (Wd - pr) + '" y1="' + y + '" y2="' + y + '" class="gl"/><text x="' + (pl - 6) + '" y="' + (+y + 3.5) + '" text-anchor="end" class="ax">' + Math.round(v) + '</text>';
    }
    const bar = function (x, v, c) {
      if (!v) return '';
      const y = Y(v), hgt = pt + ih - y, r = Math.min(4, hgt / 2, bw / 2);
      return '<path d="M' + x + ' ' + (pt + ih) + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + 'H' + (x + bw - r) + 'Q' + (x + bw) + ' ' + y + ' ' + (x + bw) + ' ' + (y + r) + 'V' + (pt + ih) + 'Z" fill="' + c + '"/>';
    };
    wk.forEach(function (x, i) {
      const cx = pl + slot * i + slot / 2;
      g += bar(cx - bw - 1, x.raised, '#B08D2E') + bar(cx + 1, x.closed, '#00875A');
      if (i % 2 === 0 || i === wk.length - 1) g += '<text x="' + cx.toFixed(1) + '" y="' + (Hh - 9) + '" text-anchor="middle" class="ax">' + esc(W.fmt(x.from, 'dm')) + '</text>';
      g += '<rect x="' + (pl + slot * i).toFixed(1) + '" y="' + pt + '" width="' + slot.toFixed(1) + '" height="' + ih + '" fill="transparent" class="hit" data-tip="' +
        esc('<b>Week of ' + W.fmt(x.from, 'dm') + '</b><br><i style="background:#B08D2E"></i>Raised ' + x.raised + '<br><i style="background:#00875A"></i>Done ' + x.closed + (x.moved ? '<br>Dates moved ' + x.moved : '')) + '"/>';
    });
    return '<div class="chartwrap"><div class="legend-row"><span><i style="background:#B08D2E"></i>Raised</span><span><i style="background:#00875A"></i>Done</span></div>' +
      '<svg viewBox="0 0 ' + Wd + ' ' + Hh + '" class="chart wkchart" role="img" aria-label="Actions raised and done per week">' + g + '</svg><div class="tip" hidden></div></div>';
  }

  function wire() {
    document.querySelectorAll('.chartwrap').forEach(function (wrap) {
      const tip = wrap.querySelector('.tip');
      wrap.addEventListener('mousemove', function (ev) {
        const t = ev.target.closest('.hit');
        wrap.querySelectorAll('.hit.on').forEach(function (x) { if (x !== t) x.classList.remove('on'); });
        if (!t) { tip.hidden = true; return; }
        t.classList.add('on');
        tip.innerHTML = t.getAttribute('data-tip');
        tip.hidden = false;
        const r = wrap.getBoundingClientRect(), z = parseFloat(getComputedStyle(document.body).zoom) || 1;
        let x = (ev.clientX - r.left * z) / z + 14, y = (ev.clientY - r.top * z) / z - 10;
        if (x + 150 > wrap.clientWidth) x -= 170;
        tip.style.left = x + 'px'; tip.style.top = y + 'px';
      });
      wrap.addEventListener('mouseleave', function () { tip.hidden = true; wrap.querySelectorAll('.hit.on').forEach(function (x) { x.classList.remove('on'); }); });
    });
  }

  App.on['tm-sort'] = function (b) { sortBy = b.getAttribute('data-s'); App.render(); };
  App.on['tm-tsort'] = function (b) {
    const k = b.getAttribute('data-k');
    tsort = tsort.k === k ? { k: k, dir: -tsort.dir } : { k: k, dir: /^(open|over|done|old|typ)$/.test(k) ? -1 : 1 };
    App.render();
  };

  /* One person's list, as they see it, less anything private. */
  App.on['tm-person'] = function (b) {
    const S = App.S, T = App.today, pid = b.getAttribute('data-p'), p = S.personMap[pid];
    const list = E.listFor(S, pid).filter(function (it) { return !it.private; });
    const open = list.filter(function (it) { const pt = E.myPart(it, pid); return pt !== 'partdone' && E.isOpen(it); })
      .sort(function (a, c) { return (a.focus === T ? 0 : 1) - (c.focus === T ? 0 : 1) || ((a.due || '9') < (c.due || '9') ? -1 : 1); });
    const done = list.filter(function (it) { return it.status === 'done' && it.doneOn >= W.add(T, -6); });
    const priv = E.listFor(S, pid).filter(function (it) { return it.private && E.isOpen(it); }).length;
    const row = function (it) {
      return '<div class="agl" data-open="' + esc(it.id) + '" tabindex="0">' + (it.focus === T ? '<span class="sun on sm">' + U.sun(true) + '</span>' : '<span class="sun-sp sm"></span>') +
        '<span class="agl-t">' + esc(it.title) + '</span>' + U.source(it, null) + U.flagChips(E.flags(S, it, T), ['overdue']) + U.dueChip(it, T) + '</div>';
    };
    U.modal({
      head: '<div class="person">' + U.avatar(pid, 'lg') + '<span class="pn"><b style="font-size:18px">' + esc(p.name) + '</b><span>' + esc(p.role || p.initials) + '</span></span></div>',
      wide: true,
      body: '<div class="lbl">Open — today’s list first</div>' + (open.map(row).join('') || '<div class="mini">Nothing open.</div>') +
        (priv ? '<div class="mini pad">and ' + priv + ' private to-do' + (priv === 1 ? '' : 's') + '</div>' : '') +
        (done.length ? '<div class="lbl" style="margin-top:14px">Done in the last 7 days</div>' + done.map(row).join('') : ''),
      foot: '<button class="btn p" data-close>Close</button>'
    });
  };
})();

</script>
<script>/* admin.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — settings, for management
   People (with the initials the office writes and the way speech-to-text
   spells their names), the meetings the company runs, bringing the old
   spreadsheet across, and the demo's date and trail.
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  'use strict';
  const BOT = (window.JOR_MIN_DATA && window.JOR_MIN_DATA.BOT) || 'O’Reilly AI';   // the assistant's name on screen (data.js)

  const App = window.App, C = window.Core, E = window.Engine, W = window.When, U = window.UI, A = window.Actions, D = window.JOR_MIN_DATA;
  const esc = C.esc;
  let tab = 'people';
  const imp = { tabs: null, links: null, name: '', keep: {}, kind: {}, link: {}, map: {}, newName: {}, series: 's1', busy: false, err: '', closeMissing: true, openTab: -1,
    plan: false, planName: '', planChair: '', skipped: [] };

  App.views.admin = { render: render, mgmt: true };

    let h = '<p class="hint">Pick the minutes workbook the office keeps now. Each meeting in it comes across as a meeting — one per tab, or several in a tab under “Minutes - date” rows — ' +
      'and an action that runs across meetings comes across as one action with its history, every moved date included. ' +
      'A plan in the same layout (one tab per department, no dates on the tabs) comes across as a plan: every row onto its owner’s list. ' +
      'A department’s to-do list (a row per job, with Name, Date added, Priority, client, reference) comes across the same way, every column kept. ' +
      'A Word document of procedures comes across as checklists to add to a to-do. The file is read here, on this computer, and sent nowhere.</p>';
    h += '<div class="card"><div class="card-b"><label class="drop" id="drop"><input type="file" accept=".xlsx,.docx" id="imp-file" data-ch="imp-file" hidden>' +
      U.icon('upload') + '<b>' + (imp.name ? esc(imp.name) : 'Choose the minutes, a plan or a to-do list (.xlsx), or procedures (.docx)') + '</b>' +
      '<span class="mini">' + (imp.busy ? 'Reading…' : imp.name ? 'Choose a different file' : 'or drop it here') + '</span></label>' +
      (imp.err ? '<div class="conf danger" style="margin-top:12px"><p>' + esc(imp.err) + '</p></div>' : '') + '</div></div>';
    if (imp.doc) return h + procPreview();
    if (!imp.tabs) return h + procKept();

    const T = imp.tabs, L = imp.links;
    let nAct = 0, nDec = 0, nNote = 0, nLink = 0, nKeep = 0, nHold = 0, nNow = 0;
    const tokens = {};
    if (imp.list && imp.keeper) tokens[imp.keeper.toUpperCase()] = true;
    T.forEach(function (t, ti) {
      t.items.forEach(function (it, ri) {
        const k = key(ti, ri);
        if (!imp.keep[k]) return;
        nKeep++;
        const kind = imp.kind[k] || it.kind;
        if (kind === 'action') nAct++; else if (kind === 'decision') nDec++; else nNote++;
        if (kind === 'action' && L[ti][ri] && imp.link[k] !== false) nLink++;
        if (it.status === 'waiting') nHold++;
        if (it.now) nNow++;
        it.owners.forEach(function (o) { tokens[o] = true; });
      });
    });

    const skippedNote = imp.skipped.length ? '<p class="mini" style="margin:10px 0 0">Left out: ' + imp.skipped.map(function (x) { return '<b>' + esc(x.sheet) + '</b> (' + esc(x.why.replace(/ \(looked for.*$/, '')) + ')'; }).join('; ') + '.</p>' : '';
    const nTabs = {};
    T.forEach(function (t) { nTabs[t.sheet] = true; });
    h += '<div class="grid imp-grid"><div>';
    if (imp.list) {
      const nPeople = Object.keys(tokens).length;
      h += '<div class="card"><div class="card-h"><h3>A to-do list: ' + nKeep + ' to-do' + (nKeep === 1 ? '' : 's') + '</h3>' +
        '<span class="note">' + (imp.keeper ? 'kept by ' + esc(imp.keeper) : '') + (imp.keeper && imp.asAt ? ' · ' : '') + (imp.asAt ? 'as at ' + esc(W.fmt(imp.asAt, 'med')) : '') + '</span></div><div class="card-b">' +
        '<div class="impsum"><div><b>' + nKeep + '</b>to-dos</div><div><b>' + nPeople + '</b>names</div><div><b>' + nNow + '</b>being worked on</div><div><b>' + nHold + '</b>on hold</div></div>' +
        '<p class="mini" style="margin:10px 0 0">Each row goes onto its owner’s list with everything the sheet says about it: when it went on the list, its priority, the client, ' +
        'the reference, the travel date, and its last comment on the day it was made. Rows under “ON HOLD” come across as waiting. Rows ticked as being worked on go on that ' +
        'person’s list for the day. The list gets weekly check-ins you can run like a meeting.</p>' + skippedNote + '</div></div>';
    } else if (imp.plan) {
      h += '<div class="card"><div class="card-h"><h3>A plan: ' + T.length + ' department' + (T.length === 1 ? '' : 's') + '</h3>' +
        '<span class="note">' + T.map(function (t) { return esc(t.sheet); }).join(' · ') + '</span></div><div class="card-b">' +
        '<div class="impsum"><div><b>' + nAct + '</b>actions</div><div><b>' + T.length + '</b>departments</div><div><b>' + nDec + '</b>decisions</div><div><b>' + nNote + '</b>notes</div></div>' +
        '<p class="mini" style="margin:10px 0 0">No tab has a meeting date, so this is read as a plan. Every row goes onto its owner’s list, marked with the plan’s name, and the plan gets check-ins you can run like a meeting.</p>' + skippedNote + '</div></div>';
    } else {
      h += '<div class="card"><div class="card-h"><h3>' + Object.keys(nTabs).length + ' tab' + (Object.keys(nTabs).length === 1 ? '' : 's') + ' → ' + T.length + ' meeting' + (T.length === 1 ? '' : 's') + '</h3>' +
        '<span class="note">' + T.map(function (t) { return esc(W.fmt(t.date, 'dm')); }).join(' · ') + '</span></div><div class="card-b">' +
        '<div class="impsum"><div><b>' + nAct + '</b>actions</div><div><b>' + nLink + '</b>carry on from an earlier meeting</div><div><b>' + nDec + '</b>decisions</div><div><b>' + nNote + '</b>notes</div></div>' +
        '<label class="chk" style="margin-top:12px"><input type="checkbox" data-ch="imp-close"' + (imp.closeMissing ? ' checked' : '') + '> ' +
        'Close actions that disappear from the next meeting without being marked complete (they’re closed as “no longer in the minutes”, and can be reopened)</label>' + skippedNote + '</div></div>';
    }

    T.forEach(function (t, ti) {
      const open = imp.openTab === ti;
      h += '<div class="card imptab"><button class="card-h tog" data-act="imp-open" data-i="' + ti + '"><h3>' + esc(t.label || t.sheet) + '</h3>' +
        '<span class="note">' + (imp.list ? 'the list' : imp.plan ? 'department' : (t.label !== t.sheet ? 'in the tab “' + esc(t.sheet) + '” · ' : '') + 'meeting of ' + esc(W.fmt(t.date, 'long'))) + ' · ' + t.items.length + ' rows</span><span class="chev rowend">' + (open ? '▾' : '▸') + '</span></button>';
      if (open && imp.list) {
        h += '<div class="card-b tight"><div class="tscroll tall"><table class="t imp"><thead><tr><th></th><th>Who</th><th>To-do</th><th>Added</th><th>Due</th><th>State</th></tr></thead><tbody>' +
          t.items.map(function (it, ri) {
            const k = key(ti, ri);
            return '<tr class="' + (imp.keep[k] ? '' : 'dim') + '"><td><input type="checkbox" data-ch="imp-keep" data-k="' + k + '"' + (imp.keep[k] ? ' checked' : '') + '></td>' +
              '<td class="nw">' + (it.everyone ? '<span class="pill grey">Everyone</span> ' : '') + esc(it.owners.join(' / ')) + '</td>' +
              '<td><b>' + esc(it.title) + '</b>' + (it.detail ? '<div class="mini">' + esc(it.detail) + '</div>' : '') +
              (it.notes.length ? '<div class="notes mini">' + it.notes.map(esc).join('<br>') + '</div>' : '') + '</td>' +
              '<td class="nw">' + (it.added ? esc(W.fmt(it.added, 'dm')) : '—') + '</td>' +
              '<td class="nw">' + (it.due ? esc(W.fmt(it.due, 'dm')) + (it.checkDate ? ' <span class="fl k-overdue">check</span>' : '') : it.ongoing ? 'Ongoing' : '—') + '</td>' +
              '<td class="nw">' + (it.status === 'waiting' ? '<span class="pill amber">On hold</span> ' : it.status === 'done' ? '<span class="pill">Done</span> ' : '') +
                (it.now ? '<span class="pill">Today</span> ' : '') + (it.high ? '<span class="fl k-high">Priority</span>' : '') + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
      } else if (open) {
        h += '<div class="card-b tight"><div class="tscroll tall"><table class="t imp"><thead><tr><th></th><th>As</th><th>Action point</th><th>Who</th><th>Due</th><th>State</th>' + (imp.plan ? '' : '<th>Carries on from</th>') + '</tr></thead><tbody>' +
          t.items.map(function (it, ri) {
            const k = key(ti, ri), kind = imp.kind[k] || it.kind, ln = L[ti][ri];
            const prev = ln ? T[ln.prevTab].items[ln.prevRow] : null;
            return '<tr class="' + (imp.keep[k] ? '' : 'dim') + '"><td><input type="checkbox" data-ch="imp-keep" data-k="' + k + '"' + (imp.keep[k] ? ' checked' : '') + '></td>' +
              '<td>' + U.selectOf('k', [{ v: 'action', t: 'Action' }, { v: 'decision', t: 'Decision' }, { v: 'note', t: 'Note' }], kind, 'data-ch="imp-kind" data-k="' + k + '" class="in sm"') + '</td>' +
              '<td><b>' + esc(it.title) + '</b>' + (it.detail ? '<div class="mini">' + esc(it.detail) + '</div>' : '') +
              (it.update ? '<div class="mini">“' + esc(it.update.slice(0, 160)) + (it.update.length > 160 ? '…' : '') + '”</div>' : '') +
              (it.notes.length ? '<div class="notes mini">' + it.notes.map(esc).join('<br>') + '</div>' : '') + '</td>' +
              '<td class="nw">' + (it.everyone ? '<span class="pill grey">Everyone</span> ' : '') + esc(it.owners.join(' / ')) + '</td>' +
              '<td class="nw">' + (it.due ? esc(W.fmt(it.due, 'dm')) + (it.yearFixed ? ' <span class="fl k-moved" title="Year corrected">year</span>' : '') +
                (it.checkDate ? ' <span class="fl k-overdue">check</span>' : '') : it.ongoing ? 'Ongoing' : '—') + '</td>' +
              '<td class="nw">' + (kind !== 'action' ? '' : it.status === 'done' ? '<span class="pill">Done</span>' : imp.stale[k] ? '<span class="pill">Stays done</span>' : it.unknown ? '<span class="pill amber">?</span>' : it.progress ? it.progress + '%' : 'Open') + '</td>' +
              (imp.plan ? '' : '<td>' + (kind === 'action' && prev ? '<label class="chk linkchk"><input type="checkbox" data-ch="imp-link" data-k="' + k + '"' + (imp.link[k] !== false ? ' checked' : '') + '> ' +
                '<span><b>' + esc(prev.title) + '</b> <span class="mini">' + esc(W.fmt(T[ln.prevTab].date, 'dm')) + '</span></span></label>' : '<span class="mini">New</span>') + '</td>') + '</tr>';
          }).join('') + '</tbody></table></div></div>';
      }
      h += '</div>';
    });
    h += '</div>';

    const nNew = Object.keys(tokens).filter(function (t) { return imp.map[t] === 'new'; }).length;
    h += '<aside><div class="card"><div class="card-h"><h3>Who is who</h3><span class="note">names and initials in the sheet</span></div><div class="card-b">' +
      (nNew ? '<p class="mini" style="margin:0 0 10px">' + nNew + ' ' + (nNew === 1 ? 'person isn’t' : 'people aren’t') + ' in the app yet and will be added, reporting to Iain. They can sign in once someone gives them a code under Settings → People.</p>' : '') +
      (Object.keys(tokens).length ? Object.keys(tokens).sort().map(function (t) {
        if (imp.map[t] === undefined) {
          const p = E.findPerson(S, t);
          /* A name nobody has (MARLYN) is someone new; unknown initials (MS) are left for a person to say. */
          if (p) imp.map[t] = p.id;
          else if (t.length >= 4 && /^[A-ZÀ-Ý' -]+$/.test(t)) { imp.map[t] = 'new'; imp.newName[t] = imp.newName[t] || t.charAt(0) + t.slice(1).toLowerCase(); }
          else imp.map[t] = '';
        }
        return '<div class="mapr"><b>' + esc(t) + '</b>' + U.selectOf('m', [{ v: '', t: 'Nobody (leave blank)' }, { v: 'new', t: 'Someone new…' }].concat(U.peopleOptions()), imp.map[t], 'data-ch="imp-map" data-t="' + esc(t) + '" class="in sm"') +
          (imp.map[t] === 'new' ? '<input class="in sm" placeholder="Their name" data-ch="imp-new" data-t="' + esc(t) + '" value="' + esc(imp.newName[t] || '') + '">' : '') + '</div>';
      }).join('') : '<p class="mini">No initials in the rows you’ve kept.</p>') + '</div></div>' +
      '<div class="card"><div class="card-h"><h3>Bring it across</h3></div><div class="card-b">' +
      (imp.plan
        ? U.field(imp.list ? 'The list’s name' : 'The plan’s name', '<input class="in" id="imp-plan-name" data-ch="imp-plan-name" value="' + esc(imp.planName) + '">') +
          U.field('Check-ins chaired by', U.selectOf('chair', S.people.filter(function (p) { return !p.gone && E.isAdmin(p); }).map(function (p) { return { v: p.id, t: p.name }; }), imp.planChair || App.ME.id, 'data-ch="imp-plan-chair"'))
        : U.field('As the meeting', U.selectOf('series', S.series.filter(function (s) { return s.kind !== 'plan'; }).map(function (s) { return { v: s.id, t: s.name }; }), imp.series, 'data-ch="imp-series"'))) +
      '<p class="mini">' + nKeep + ' rows. Open actions go onto their owners’ to-do lists; finished ones come across as history.</p>' +
      '<button class="btn p block" data-act="imp-go"' + (nKeep ? '' : ' disabled') + '>' + (imp.list ? 'Bring the list across' : imp.plan ? 'Bring the plan across' : 'Bring ' + T.length + ' meeting' + (T.length === 1 ? '' : 's') + ' across') + '</button></div></div></aside></div>';
    return h;
  }

  /* The procedures each department has in the app. */
  function procKept() {
    const have = (App.S.topics || []).filter(function (t) { return (t.procs || []).length; });
    if (!have.length) return '';
    return '<div class="card"><div class="card-h"><h3>Procedures in the app</h3><span class="note">added to a to-do as its steps</span></div><div class="card-b">' +
      have.map(function (t) {
        return '<div class="procrow"><div><b>' + esc(t.name) + '</b> · ' + t.procs.length + ' procedure' + (t.procs.length === 1 ? '' : 's') +
          '<div class="mini">' + esc(t.procTitle || '') + (t.procFrom ? ' — from ' + esc(t.procFrom) : '') + (t.procOn ? ', ' + esc(W.fmt(t.procOn, 'med')) : '') + '</div></div>' +
          '<button class="btn sm dngr" data-act="proc-remove" data-t="' + esc(t.id) + '">Remove</button></div>';
      }).join('') + '</div></div>';
  }

  /* A procedures document, read: every procedure and case, as the steps
     it would give a to-do, before anything is kept. */
  function procPreview() {
    const d = imp.doc, S = App.S, I = window.Importer;
    const nCases = d.procs.reduce(function (a, p) { return a + p.br.length; }, 0);
    const nSteps = d.procs.reduce(function (a, p) { return a + p.br.reduce(function (b, x) { return b + I.checklist(x).length; }, 0); }, 0);
    const t = (S.topics || []).find(function (x) { return x.id === imp.docTopic; });
    const replacing = t && (t.procs || []).length;
    let h = '<div class="grid imp-grid"><div>' +
      '<div class="card"><div class="card-h"><h3>' + esc(d.title || 'Procedures') + '</h3><span class="note">' + esc(imp.name) + '</span></div><div class="card-b">' +
      '<div class="impsum"><div><b>' + d.procs.length + '</b>procedures</div><div><b>' + nCases + '</b>cases</div><div><b>' + nSteps + '</b>steps</div></div>' +
      '<p class="mini" style="margin:10px 0 0">Procedures, not to-dos: nothing goes on anyone’s list. Each procedure and case below becomes a checklist that can be added ' +
      'to a to-do as its steps — open the to-do and choose it under Steps. The ones that match the to-do’s words are suggested first.</p>' +
      (d.lead ? '<p class="mini">' + esc(d.lead) + '</p>' : '') + '</div></div>';
    d.procs.forEach(function (p, pi) {
      const open = imp.openProc === pi;
      h += '<div class="card imptab"><button class="card-h tog" data-act="proc-open" data-i="' + pi + '"><h3>' + esc(p.no + ' ' + p.name) + '</h3>' +
        '<span class="note">' + (p.sec && p.sec !== p.name ? esc(p.sec) + ' · ' : '') + p.br.length + ' case' + (p.br.length === 1 ? '' : 's') + '</span>' +
        '<span class="chev rowend">' + (open ? '▾' : '▸') + '</span></button>';
      if (open) {
        h += '<div class="card-b">' + (p.about ? '<p class="mini">' + esc(p.about) + '</p>' : '') + (p.intro ? '<p>' + esc(p.intro) + '</p>' : '') +
          p.br.map(function (b) {
            return (b.when ? '<div class="lbl">' + esc(b.when) + '</div>' : '') +
              '<ol class="procsteps">' + I.checklist(b).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
          }).join('') + '</div>';
      }
      h += '</div>';
    });
    h += '</div><aside><div class="card"><div class="card-h"><h3>Keep them</h3></div><div class="card-b">' +
      U.field('The department’s topic', U.selectOf('topic', U.topicOptions(), imp.docTopic, 'data-ch="proc-topic"')) +
      (replacing ? '<p class="mini">' + esc(t.name) + ' already has ' + t.procs.length + ' procedures' + (t.procFrom ? ' from ' + esc(t.procFrom) : '') +
        '. These replace them; steps already added to to-dos stay as they are.</p>' : '') +
      '<button class="btn p block" data-act="proc-keep">Keep ' + d.procs.length + ' procedures</button>' +
      '<button class="btn block" data-act="proc-cancel" style="margin-top:8px">Not these</button></div></div></aside></div>';
    return h;
  }

  function guessTopic(words) {
    const n = String(words).toLowerCase(), S = App.S;
    const guess = /reserv|hotel|contract/.test(n) ? 'res' : /transport|guide|coach/.test(n) ? 'guides' : /\bhr\b|people|staff|office/.test(n) ? 'office' :
      /operat/.test(n) ? 'ops' : /sales/.test(n) ? 'sales' : /market/.test(n) ? 'mkt' : /financ|account/.test(n) ? 'fin' :
      /show|travel/.test(n) ? 'shows' : /system|report/.test(n) ? 'systems' : null;
    const list = S.topics || [];
    return guess && list.some(function (t) { return t.id === guess; }) ? guess : (list[0] || {}).id || '';
  }

  App.on['proc-open'] = function (b) { const i = +b.getAttribute('data-i'); imp.openProc = imp.openProc === i ? -1 : i; App.render(); };
  App.onChange['proc-topic'] = function (el) { imp.docTopic = el.value; App.render(); };
  App.on['proc-cancel'] = function () { Object.assign(imp, { doc: null, name: '', docTopic: '' }); App.render(); };
  App.on['proc-keep'] = function () {
    if (!imp.docTopic) { U.toast('Choose the department’s topic.', 'bad'); return; }
    const t = A.saveProcedures(imp.docTopic, imp.doc, imp.name);
    U.toast(imp.doc.procs.length + ' procedures kept for ' + esc(t ? t.name : '') + '. Open a to-do and choose one under Steps.', 'good', 7000);
    Object.assign(imp, { doc: null, name: '', docTopic: '' });
    App.render();
  };
  App.on['proc-remove'] = function (b) {
    const id = b.getAttribute('data-t'), t = (App.S.topics || []).find(function (x) { return x.id === id; });
    if (!t) return;
    U.confirm({ title: 'Remove ' + t.name + '’s procedures?', body: '<p>They can no longer be added to to-dos. Steps already added stay where they are.</p>', yes: 'Remove', tone: 'danger' })
      .then(function (y) { if (y) { A.removeProcedures(id); App.render(); } });
  };

  App.onChange['imp-file'] = function (el) { if (el.files && el.files[0]) readFile(el.files[0]); };

  function readFile(file) {
    imp.busy = true; imp.err = ''; imp.name = file.name; imp.doc = null; App.render();
    if (/\.docx$/i.test(file.name)) {
      file.arrayBuffer().then(function (buf) { return window.Importer.readDocument(buf); }).then(function (doc) {
        const pr = window.Importer.parseProcedures(doc);
        if (!pr.procs.length) throw new Error('No numbered procedures with steps in that document (it looks for bold headings like “1.1 …” with bullet points under them).');
        Object.assign(imp, { busy: false, tabs: null, doc: pr, docTopic: guessTopic(pr.title + ' ' + file.name), openProc: 0 });
        App.render();
      }).catch(function (e) {
        imp.busy = false; imp.doc = null; imp.err = (e && e.message) || 'Could not read that file.'; App.render();
      });
      return;
    }
    file.arrayBuffer().then(function (buf) { return window.Importer.readWorkbook(buf); }).then(function (wb) {
      const book = window.Importer.parseBook(wb, { year: +App.today.slice(0, 4), today: App.today });
      const tabs = book.tabs;
      if (!tabs.length) throw new Error('No tab in that workbook looks like the minutes, a plan or a to-do list (a row with “Action Point” or “Task” or “Action”, and “Update”, “Assigned To” or “Name”).');
      Object.assign(imp, { busy: false, tabs: tabs, plan: book.plan, list: !!book.list, keeper: book.keeper || '', asAt: book.asAt || null, skipped: book.skipped,
        links: book.plan ? tabs.map(function (t) { return t.items.map(function () { return null; }); }) : window.Importer.thread(tabs),
        stale: {},
        planName: file.name.replace(/\.xlsx$/i, '').replace(/^copy of\s+/i, '').trim(), planChair: App.ME.id,
        keep: {}, kind: {}, link: {}, map: {}, newName: {}, openTab: book.plan ? 0 : tabs.length - 1 });
      tabs.forEach(function (t, ti) { t.items.forEach(function (it, ri) { imp.keep[key(ti, ri)] = true; }); });
      /* Old rows pasted into a later tab: said so, and they don't reopen what was finished. */
      if (!book.plan) {
        imp.stale = window.Importer.staleCopies(tabs, imp.links);
        Object.keys(imp.stale).forEach(function (k) {
          const p = k.split(':'), it = tabs[+p[0]].items[+p[1]];
          it.notes.push('The same as an older row. It was marked complete on ' + W.fmt(imp.stale[k].doneOn, 'med') + ', so it stays done');
        });
      }
      App.render();
    }).catch(function (e) {
      imp.busy = false; imp.tabs = null; imp.err = (e && e.message) || 'Could not read that file.'; App.render();
    });
  }

  App.on['imp-open'] = function (b) { const i = +b.getAttribute('data-i'); imp.openTab = imp.openTab === i ? -1 : i; App.render(); };
  App.onChange['imp-keep'] = function (el) { imp.keep[el.getAttribute('data-k')] = el.checked; App.render(); };
  App.onChange['imp-kind'] = function (el) { imp.kind[el.getAttribute('data-k')] = el.value; App.render(); };
  App.onChange['imp-link'] = function (el) { imp.link[el.getAttribute('data-k')] = el.checked; App.render(); };
  App.onChange['imp-close'] = function (el) { imp.closeMissing = el.checked; };
  App.onChange['imp-map'] = function (el) { imp.map[el.getAttribute('data-t')] = el.value; App.render(); };
  App.onChange['imp-new'] = function (el) { imp.newName[el.getAttribute('data-t')] = el.value.trim(); };
  App.onChange['imp-series'] = function (el) { imp.series = el.value; };
  App.onChange['imp-plan-name'] = function (el) { imp.planName = el.value.trim(); };
  App.onChange['imp-plan-chair'] = function (el) { imp.planChair = el.value; };

  App.on['imp-go'] = function () {
    const S = App.S, T = imp.tabs, L = imp.links;
    const missing = Object.keys(imp.map).filter(function (t) { return imp.map[t] === 'new' && !imp.newName[t]; });
    if (missing.length) { U.toast('Give a name for ' + esc(missing.join(', ')) + ', or choose “Nobody”.', 'bad'); return; }
    if (imp.plan && !imp.planName) { U.toast(imp.list ? 'Give the list a name.' : 'Give the plan a name.', 'bad'); return; }
    const fresh = Object.keys(imp.map).filter(function (t) { return imp.map[t] === 'new'; });
    if (fresh.length) {
      A.addPeople(fresh.map(function (t) { return { name: imp.newName[t], from: t, reportsTo: 'p02' }; })).forEach(function (p, i) { imp.map[fresh[i]] = p.id; });
    }
    const s0 = imp.plan ? { chair: imp.planChair || App.ME.id } : S.seriesMap[imp.series];
    /* A list's "Whole Team" is the people on the list, and its to-do is the keeper's to run. */
    const team = [];
    Object.keys(imp.map).forEach(function (t) { const v = imp.map[t]; if (v && v !== 'new' && team.indexOf(v) < 0) team.push(v); });
    const keeperId = imp.list && imp.keeper ? imp.map[imp.keeper.toUpperCase()] || null : null;
    const tabs = T.map(function (t, ti) {
      const rows = [];
      t.items.forEach(function (it, ri) {
        const k = key(ti, ri);
        if (!imp.keep[k]) return;
        const kind = imp.kind[k] || it.kind;
        const ids = it.owners.map(function (x) { return imp.map[x]; }).filter(Boolean);
        const ln = L[ti][ri];
        rows.push({ key: k, stale: !!imp.stale[k], link: kind === 'action' && ln && imp.link[k] !== false && imp.keep[key(ln.tab, ln.row)] ? key(ln.tab, ln.row) : null,
          kind: kind, title: it.title, detail: it.detail, update: it.update,
          owner: kind === 'action' ? (ids[0] || (it.everyone ? keeperId || s0.chair : null)) : null, helpers: ids.slice(1),
          everyone: kind === 'action' && it.everyone ? (imp.list ? team.slice() : S.people.filter(function (p) { return !p.gone; }).map(function (p) { return p.id; })) : [],
          on: it.added || null, said: it.said || null, high: !!it.high, waitingOn: it.waitingOn || '',
          focus: it.now ? imp.asAt || App.today : null,
          due: kind === 'action' ? it.due : null, ongoing: it.ongoing, progress: it.progress, status: it.status, slips: it.slips, topic: 'office',
          update: [it.update, it.check ? 'Check-in: ' + it.check : ''].filter(Boolean).join(' — ') });
      });
      return { sheet: t.sheet, date: t.date, rows: rows };
    });
    if (imp.plan) {
      const plan = A.importPlan({ name: imp.planName, chair: imp.planChair || App.ME.id, file: imp.name, tabs: tabs, list: imp.list });
      const n = S.items.filter(function (it) { return it.series === plan.id && it.kind === 'action' && E.isOpen(it); });
      const owners = {};
      n.forEach(function (it) { if (it.owner) owners[it.owner] = true; });
      U.toast('The ' + (imp.list ? 'list' : 'plan') + ' is across: ' + n.length + ' open ' + (imp.list ? 'to-dos' : 'actions') + ' on ' + Object.keys(owners).length + ' people’s lists.', 'good', 7000);
      Object.assign(imp, { tabs: null, links: null, name: '', keep: {}, kind: {}, link: {}, map: {}, newName: {}, plan: false, list: false, keeper: '', asAt: null, skipped: [] });
      App.go('register');
      return;
    }
    const m = A.importBook({ series: imp.series, present: s0.members.slice(), chair: s0.chair, closeMissing: imp.closeMissing, tabs: tabs });
    const open = S.items.filter(function (it) { return it.imported && it.kind === 'action' && E.isOpen(it) && it.series === imp.series; }).length;
    U.toast(tabs.length + ' meeting' + (tabs.length === 1 ? '' : 's') + ' brought across. ' + open + ' actions are open and on their owners’ lists.', 'good', 7000);
    Object.assign(imp, { tabs: null, links: null, name: '', keep: {}, kind: {}, link: {}, map: {}, newName: {}, skipped: [] });
    App.go('meeting', m.id);
  };

  /* Drop a file anywhere on the drop zone. */
  document.addEventListener('dragover', function (ev) { if (ev.target.closest && ev.target.closest('#drop')) { ev.preventDefault(); ev.target.closest('#drop').classList.add('over'); } });
  document.addEventListener('dragleave', function (ev) { const d = ev.target.closest && ev.target.closest('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', function (ev) {
    const d = ev.target.closest && ev.target.closest('#drop');
    if (!d) return;
    ev.preventDefault();
    if (ev.dataTransfer.files[0]) readFile(ev.dataTransfer.files[0]);
  });

  /* ══ Demo & trail ══════════════════════════════════════════════════════ */

  function demo() {
    const S = App.S;
    /* On the shared server there's no pretending it's another day, and no
       clearing everything: only the trail. */
    if (window.Core.mode === 'server') return trail(S);
    return '<div class="grid g2"><div class="card"><div class="card-h"><h3>Today’s date</h3></div><div class="card-b">' +
      '<p class="mini">' + (S.fixedToday ? 'The app is pretending it is <b>' + esc(W.fmt(S.fixedToday, 'long')) + '</b>.' : 'The app uses the computer’s date.') + ' Pretending it’s another day is only for trying things out.</p>' +
      '<div class="row"><input class="in" type="date" id="dm-d" value="' + esc(S.today) + '" style="width:auto"><button class="btn sm" data-act="dm-set">Set</button>' +
      '<button class="btn sm" data-act="dm-real">Today’s real date</button></div></div></div>' +
      '<div class="card"><div class="card-h"><h3>Start again</h3></div><div class="card-b"><p class="mini">Clears every meeting and action kept on this computer and goes back to the team with nothing in it — for after trying things out. ' +
      'People and their settings stay.</p><button class="btn dngr" data-act="dm-reset">Clear the meetings and actions</button></div></div></div>' + trail(S);
  }

  function trail(S) {
    return '<div class="card"><div class="card-h"><h3>Trail</h3><span class="note">every change, who made it and when</span></div><div class="card-b tight"><div class="tscroll tall"><table class="t"><thead><tr><th>When</th><th>Who</th><th>What</th></tr></thead><tbody>' +
      (S.log.length ? S.log.slice(0, 300).map(function (l) {
        return '<tr><td class="nw mini">' + esc(W.fmt(l.on, 'dm')) + ' ' + esc(String(l.at).slice(11, 16)) + '</td><td class="nw">' + U.avatar(l.by, 'xs') + ' ' + esc(U.first(l.by)) + '</td><td>' + esc(l.what) + '</td></tr>';
      }).join('') : '<tr><td colspan="3" class="mini">Nothing changed yet.</td></tr>') + '</tbody></table></div></div></div>';
  }
  App.on['dm-set'] = function () { const v = document.getElementById('dm-d').value; if (v) { A.setToday(v); App.render(); } };
  App.on['dm-real'] = function () { A.setToday(null); App.render(); };
  App.on['dm-reset'] = function () {
    U.confirm({ title: 'Clear every meeting and action?', body: '<p>All meetings, actions, decisions and notes on this computer are removed. The team, meetings set-up and email settings stay. This can’t be undone.</p>', yes: 'Clear them', tone: 'danger' })
      .then(function (y) { if (y) { A.clearRecords(); App.go('todo'); U.toast('Cleared. Bring the spreadsheet across, or start a meeting.', 'good'); } });
  };
})();

</script>
<script>App.boot();</script>
