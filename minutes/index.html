        S.items.forEach(function (it) { (it.hist || []).forEach(function (hh) { if (hh.m === m.id) { if (hh.k === 'due' && hh.from && hh.to > hh.from) moved++; if (hh.k === 'done') doneAt++; } }); });
        const st = m.status === 'live' ? '<span class="pill live-p"><span class="livedot"></span>Live</span>' :
          m.status === 'planned' ? '<span class="pill grey">Planned</span>' :
            m.circulated ? '<span class="pill">Minutes sent</span>' : '<span class="pill amber">Minutes not sent</span>';
        return '<tr class="clk" data-go="meeting/' + esc(m.id) + '"><td class="nw">' + esc(W.fmt(m.date, 'short')) + ' <span class="mini">' + esc(String(m.date).slice(0, 4)) + '</span></td>' +
          '<td><i class="tdot" style="background:' + (s0 ? s0.tint : '#999') + '"></i>' + esc(s0 ? s0.name : m.title) + (m.imported ? ' <span class="mini">imported</span>' : '') + '</td><td>' + st + '</td>' +
          '<td class="num">' + (m.status === 'planned' ? '—' : m.present.length) + '</td>' +
          '<td class="num">' + (made.filter(function (x) { return x.kind === 'action'; }).length || '—') + '</td>' +
          '<td class="num">' + (made.filter(function (x) { return x.kind === 'decision'; }).length || '—') + '</td>' +
          '<td class="num">' + (moved || '—') + '</td><td class="num">' + (doneAt || '—') + '</td></tr>';
      }).join('') + '</tbody></table></div></div></div>';
    return h;
  }

  /* The first time in: nothing yet, so say how to begin. */
  function welcome() {
    const admin = E.isAdmin(App.ME);
    return '<div class="card welcome"><div class="card-b"><h3>Nothing here yet</h3><div class="wl">' +
      (admin ? '<div><b>Bring the minutes workbook across.</b><p>Every tab comes in as the meeting it recorded, each action with its history and on its owner’s list.</p>' +
        '<button class="btn p" data-go="admin/import">' + U.icon('upload') + 'Bring it across</button></div>' : '') +
      '<div><b>Or start the next meeting.</b><p>Write the minutes as you go, record the meeting for ' + BOT + ' to write up, or add a recording, photos of the notes, or typed notes afterwards.</p>' +
      '<button class="btn" data-act="m-new">' + U.icon('plus') + 'New meeting</button></div></div></div></div>';
  }

  App.on['m-xlsx'] = function () { window.Minutes.workbook(null); };

  App.on['m-plan'] = function (b) {
    const m = A.createMeeting({ series: b.getAttribute('data-s'), date: b.getAttribute('data-d') });
    App.go('meeting', m.id);
  };

  App.on['m-new'] = function () {
    const S = App.S, ME = App.ME, T = App.today;
    const series = S.series.filter(function (s) { return ME.access === 'owner' || s.members.indexOf(ME.id) >= 0 || E.isAdmin(ME); });
    U.modal({
      title: 'New meeting',
      body: U.field('Which meeting', U.selectOf('series', series.map(function (s) { return { v: s.id, t: s.name }; }).concat([{ v: '', t: 'A one-off meeting…' }]), series[0] ? series[0].id : '', 'id="nm-s"')) +
        '<div id="nm-one" hidden>' + U.field('Title', '<input class="in" id="nm-t" placeholder="What the meeting is called">') + '</div>' +
        '<div class="grid g2">' + U.field('Date', '<input class="in" type="date" id="nm-d" value="' + T + '">') +
        U.field('Time', '<input class="in" type="time" id="nm-time" value="10:00">') + '</div>',
      foot: '<button class="btn" data-close>Cancel</button><button class="btn p" data-act="m-new-go">Create</button>',
      on: function (m) {
        const sel = m.querySelector('#nm-s');
        const upd = function () {
          m.querySelector('#nm-one').hidden = !!sel.value;
          const s0 = S.seriesMap[sel.value];
          if (s0) { m.querySelector('#nm-d').value = E.nextMeeting(S, s0.id, T).date; m.querySelector('#nm-time').value = s0.time; }
        };
        sel.addEventListener('change', upd); upd();
      }
    });
  };
  App.on['m-new-go'] = function () {
    const sid = document.getElementById('nm-s').value;
    const t = (document.getElementById('nm-t') || {}).value || '';
    if (!sid && !t.trim()) { U.toast('Give the one-off meeting a title.', 'bad'); return; }
    const m = A.createMeeting({ series: sid || null, title: sid ? '' : t.trim(), date: document.getElementById('nm-d').value || App.today,
      time: document.getElementById('nm-time').value, present: sid ? null : [App.ME.id] });
    U.close();
    App.go('meeting', m.id);
  };

  /* ══ One meeting ═══════════════════════════════════════════════════════ */

  function one(id) {
    const S = App.S, m = S.meetingMap[id];
    if (!m || !E.canSeeMeeting(S, App.ME, m)) return '<div class="empty"><b>That meeting isn’t one you can open.</b><button class="btn" data-go="meetings">All meetings</button></div>';
    if (m.status === 'closed') { A.inMeeting(null); return window.Minutes.page(m); }
    if (m.status === 'live' && E.canMinute(S, App.ME, m)) { A.inMeeting(m.id); return roomView(m); }
    A.inMeeting(null);
    return prepView(m);
  }

  function after(id) {
    const m = App.S.meetingMap[id];
    if (m && m.status === 'live') {
      window.Assist.after(m);
      paintTranscript(m);
      const cur = room.cur && document.getElementById('ic-' + room.cur);
      if (cur && room.scrollTo) { cur.scrollIntoView({ block: 'center', behavior: 'smooth' }); room.scrollTo = false; }
    }
  }

  function titleOf(m) { const s0 = App.S.seriesMap[m.series]; return s0 ? s0.name : (m.title || 'Meeting'); }

  /* ══ Preparing ═════════════════════════════════════════════════════════ */

  function prepView(m) {
    const S = App.S, T = App.today;
    const r = E.review(S, m, T);
    const s0 = S.seriesMap[m.series];
    let h = '<div class="pagehead"><div class="ph-row"><div><div class="ph-date">' + esc(W.fmt(m.date, 'long')) + (m.time ? ' · ' + esc(m.time) : '') +
      (m.place ? ' · ' + esc(m.place) : '') + '</div><h2>' + esc(titleOf(m)) + '</h2>' +
      (m.status === 'live' ? '<p><span class="livedot"></span> <b>On now</b> — ' + esc(U.first(m.taker)) + ' is taking the minutes. Your actions update here as they’re recorded.</p>' :
        '<p>The agenda below is built from the register. Nothing needs to be copied from last time.</p>') + '</div>' +
      (E.canMinute(S, App.ME, m) && m.status !== 'live' ? '<div class="rowend ph-btns"><button class="btn g big" data-act="m-start">' + U.icon('play') + 'Start the meeting</button>' +
      '<button class="btn ghostw" data-act="m-writeup">' + U.icon('upload') + 'Write it up from a recording, photos or notes</button></div>' : '') + '</div></div>';

    h += '<div class="prep-grid"><div>';
    h += '<div class="card"><div class="card-h"><h3>Agenda</h3><span class="note">' + (r.done.length + r.discuss.length + r.ontrack.length) + ' actions, ' +
      (r.standing.length + r.raised.length) + ' items</span></div><div class="card-b agenda">';
    h += agendaBlock('1', 'Done since the last meeting', r.done.length, 'Read out, no discussion needed',
      r.done.map(function (it) { return mini(it, '<span class="fl k-ok">' + U.icon('check') + ' ' + esc(W.fmt(it.doneOn, 'dm')) + '</span>'); }).join(''));
    h += agendaBlock('2', 'Needs the meeting', r.discuss.length, 'Overdue, moved, waiting, no update, or asked for',
      r.discuss.map(function (x) { return mini(x.it, x.why.map(function (w) { return '<span class="fl k-' + w.k + '">' + esc(w.t) + '</span>'; }).join('')); }).join(''));
    h += agendaBlock('3', 'On track', r.ontrack.length, 'Nodded through unless someone speaks up',
      r.ontrack.map(function (x) { return mini(x.it, ''); }).join(''));
    h += agendaBlock('4', 'Standing items', r.standing.length, '', r.standing.map(function (g) { return agendaLine(m, g); }).join(''));
    h += agendaBlock('5', 'Raised by the team', r.raised.length, '', r.raised.map(function (g) { return agendaLine(m, g); }).join('') +
      '<div class="addg"><input class="in" id="ag-new" data-key="ag-new" placeholder="Add something to the agenda and press Enter">' + U.micBtn('#ag-new') + '</div>');
    h += '</div></div>';
    h += '</div><aside>';

    /* Who is coming. */
    const members = s0 ? s0.members : m.present.concat(m.apologies);
    h += '<div class="card"><div class="card-h"><h3>Who’s coming</h3><span class="note">' + m.present.length + ' of ' + members.length + '</span></div><div class="card-b att">' +
      members.map(function (pid) {
        const st = m.present.indexOf(pid) >= 0 ? 'present' : m.apologies.indexOf(pid) >= 0 ? 'apology' : 'none';
        return '<div class="atr"><span class="person">' + U.avatar(pid, 'sm') + '<span class="pn"><b>' + esc(U.name(pid)) + '</b></span></span>' +
          '<div class="seg sm">' + [['present', 'Here'], ['apology', 'Apologies']].map(function (x) {
            return '<button class="' + (st === x[0] ? 'on' : '') + '" data-act="m-att" data-p="' + esc(pid) + '" data-st="' + (st === x[0] ? 'none' : x[0]) + '">' + x[1] + '</button>';
          }).join('') + '</div></div>';
      }).join('') + '</div></div>';

    /* Owners' updates before the meeting. */
    const notUpd = r.open.filter(function (it) {
      return !(it.hist || []).some(function (hh) { return hh.on > r.since && hh.k !== 'noted'; }) && it.on <= r.since;
    });
    const byOwner = {};
    notUpd.forEach(function (it) { (byOwner[it.owner] = byOwner[it.owner] || []).push(it); });
    h += '<div class="card"><div class="card-h"><h3>Owners’ updates</h3></div><div class="card-b">' +
      '<div class="bigstat"><b>' + r.updatedSince + '</b> of ' + r.open.length + ' open actions updated since ' + esc(r.prev ? W.fmt(r.prev.date, 'dm') : 'they were raised') + '</div>' +
      '<div class="pbar-l"><i style="width:' + (r.open.length ? (100 * r.updatedSince / r.open.length).toFixed(0) : 0) + '%"></i></div>' +
      (Object.keys(byOwner).length ? '<p class="mini">Still to say where theirs stand:</p>' + Object.keys(byOwner).map(function (pid) {
        return '<div class="nudge"><span class="person">' + U.avatar(pid, 'xs') + ' <b>' + esc(U.first(pid)) + '</b> <span class="mini">' + byOwner[pid].length + '</span></span>' +
          '<button class="btn sm" data-act="m-nudge" data-p="' + esc(pid) + '">' + U.icon('mail') + 'Ask</button></div>';
      }).join('') : '<p class="mini">Everyone has updated. This will be a short meeting.</p>') +
      '</div></div>';

    if (r.prev) {
      h += '<div class="card"><div class="card-h"><h3>Last time</h3><span class="note">' + esc(W.fmt(r.prev.date, 'short')) + '</span></div><div class="card-b">' +
        '<button class="btn sm" data-go="meeting/' + esc(r.prev.id) + '">Open the minutes of ' + esc(W.fmt(r.prev.date, 'dm')) + '</button></div></div>';
    }
    h += '</aside></div>';
    return h;
  }

  function agendaBlock(n, title, count, hint, inner) {
    return '<div class="ag"><div class="ag-h"><span class="ag-n">' + n + '</span><h4>' + esc(title) + '</h4><span class="n">' + count + '</span>' +
      (hint ? '<span class="mini">' + esc(hint) + '</span>' : '') + '</div>' + (inner ? '<div class="ag-b">' + inner + '</div>' : '') + '</div>';
  }

  function mini(it, right) {
    return '<div class="agl" data-open="' + esc(it.id) + '" tabindex="0"><span class="ref">' + esc(it.ref) + '</span><span class="agl-t">' + esc(it.title) + '</span>' +
      U.avatar(it.owner, 'xs') + (right || U.dueChip(it, App.today)) + '</div>';
  }

  function agendaLine(m, g) {
    return '<div class="agl g"><span class="agl-t">' + esc(g.t) + '</span><span class="mini">' + esc(g.kind === 'standing' ? 'standing' : U.first(g.by)) + '</span>' +
      '<button class="xs-x" data-act="ag-x" data-g="' + esc(g.id) + '" title="Take it off this agenda">✕</button></div>';
  }

  App.onKey['ag-new'] = function (el, ev) {
    if (ev.key !== 'Enter' || !el.value.trim()) return;
    A.addAgenda(App.param, el.value.trim(), 'raised');
    App.render();
    const n = document.getElementById('ag-new'); if (n) n.focus();
  };
  App.on['ag-x'] = function (b) { A.removeAgenda(App.param, b.getAttribute('data-g')); App.render(); };
  App.on['m-att'] = function (b) { A.attend(App.param, b.getAttribute('data-p'), b.getAttribute('data-st')); App.render(); };

  /* A reminder to update, written out; the person sending it presses send. */
  App.on['m-nudge'] = function (b) {
    const S = App.S, m = S.meetingMap[App.param], pid = b.getAttribute('data-p'), p = S.personMap[pid];
    const r = E.review(S, m, App.today);
    const items = r.open.filter(function (it) { return it.owner === pid && !(it.hist || []).some(function (hh) { return hh.on > r.since && hh.k !== 'noted'; }); });
    const body = 'Hi ' + p.first + ',\n\nBefore the ' + titleOf(m) + ' on ' + W.fmt(m.date, 'long') + ', could you put a line on these in JOR Minutes & To-Do so we can take them quickly?\n\n' +
      items.map(function (it) { return '• ' + it.ref + ' ' + it.title + (it.due ? ' (due ' + W.fmt(it.due, 'dm') + ')' : ''); }).join('\n') + '\n\nThanks,\n' + App.ME.first;
    U.modal({ title: 'Ask ' + p.first + ' for an update',
      body: '<textarea class="in" rows="10" id="nudge-t">' + esc(body) + '</textarea>',
      foot: '<button class="btn" data-act="nudge-copy">' + U.icon('copy') + 'Copy</button>' +
        '<a class="btn p" href="mailto:' + esc(p.email) + '?subject=' + encodeURIComponent('Update before the ' + titleOf(m)) + '&body=' + encodeURIComponent(body) + '">' + U.icon('mail') + 'Open in email</a>' });
  };
  App.on['nudge-copy'] = function () { U.copyText(document.getElementById('nudge-t').value).then(function (ok) { U.toast(ok ? 'Copied.' : 'Copy blocked — select the text instead.', ok ? 'good' : 'bad'); }); };

  App.on['m-start'] = function () {
    const m = App.S.meetingMap[App.param];
    U.modal({
      title: 'Start the ' + titleOf(m),
      body: '<p class="lede">' + m.present.length + ' here' + (m.apologies.length ? ', apologies from ' + m.apologies.map(function (x) { return esc(U.first(x)); }).join(', ') : '') + '. ' +
        'You’ll be taking the minutes. Every change you make to an action from now until you close the meeting goes into them.</p>' +
        '<div class="consent"><label class="chk"><input type="checkbox" id="st-tx"> Record the meeting, for ' + BOT + ' to write up</label>' +
        '<label class="chk sub"><input type="checkbox" id="st-ok" disabled> Everyone here has agreed to the meeting being recorded</label>' +
        '<p class="mini">The recording stays on this computer until you ask ' + BOT + ' to write up the minutes. You can also start it later from inside the meeting, or add a phone recording afterwards.</p></div>',
      foot: '<button class="btn" data-close>Not yet</button><button class="btn p" data-act="m-start-go">Start</button>',
      on: function (mm) {
        const tx = mm.querySelector('#st-tx'), okb = mm.querySelector('#st-ok');
        tx.addEventListener('change', function () { okb.disabled = !tx.checked; if (!tx.checked) okb.checked = false; });
      }
    });
  };
  /* The meeting happened without the app open: start it, then add the
     phone recording or the notes. */
  App.on['m-writeup'] = function () {
    A.start(App.param, false);
    Object.assign(room, { cur: null, sugg: [], showTx: false, capText: '', capOwner: '', capDue: '', ownerSet: false, dueSet: false, kind: 'action' });
    App.render();
    setTimeout(function () { App.on['as-add'](); }, 60);
  };

  App.on['m-start-go'] = function () {
    const tx = document.getElementById('st-tx').checked, ok = document.getElementById('st-ok').checked;
    if (tx && !ok) { U.toast('Recording needs everyone’s agreement first.', 'bad'); return; }
    A.start(App.param, tx && ok);
    U.close();
    Object.assign(room, { cur: null, sugg: [], showTx: false, capText: '', capOwner: '', capDue: '', ownerSet: false, dueSet: false, kind: 'action' });
    App.render();
    if (tx && ok) App.on['as-record']();
  };

  /* ══ The meeting room ══════════════════════════════════════════════════ */

  function roomView(m) {
    const S = App.S, T = App.today;
    const r = E.review(S, m, T);
    const rev = m.reviewed || {};
    const nDiscussed = r.discuss.filter(function (x) { return rev[x.it.id]; }).length;
    const nOn = r.ontrack.filter(function (x) { return rev[x.it.id]; }).length;

    let h = '<div class="roombar"><div class="rb-l"><span class="livepill"><span class="livedot"></span>Live <b id="room-clock">' + clock(m) + '</b></span>' +
      '<div class="rb-t"><b>' + esc(titleOf(m)) + '</b><span>' + esc(W.fmt(m.date, 'short')) + ' · minutes by ' + esc(U.first(m.taker)) + '</span></div>' +
      '<button class="rb-p" data-act="r-att" title="Who is here">' + U.avatars(m.present, 7) + '</button></div>' +
      '<div class="rb-r">' + window.Assist.bar(m) +
      '<button class="btn g" data-act="r-finish">Finish &amp; write minutes' + U.icon('arrow') + '</button></div></div>';

    h += '<div class="room with-tx">';

    /* The rail. */
    h += '<nav class="rail">' +
      railItem('done', '1', 'Done since last', r.done.length, '') +
      railItem('discuss', '2', 'Needs discussion', r.discuss.length, nDiscussed + ' of ' + r.discuss.length + ' taken') +
      railItem('ontrack', '3', 'On track', r.ontrack.length, nOn ? nOn + ' noted' : '') +
      railItem('standing', '4', 'Standing items', r.standing.length, '') +
      railItem('raised', '5', 'Raised by the team', r.raised.length, '') +
      railItem('new', '6', 'New today', r.created.length, '') +
      '<div class="rail-prog"><div class="mini">Taken so far</div><div class="pbar-l"><i style="width:' +
      ((r.discuss.length + r.ontrack.length) ? (100 * (nDiscussed + nOn) / (r.discuss.length + r.ontrack.length)).toFixed(0) : 100) + '%"></i></div></div>' +
      '</nav>';

    /* The body. */
    h += '<div class="rmain"><div class="rscroll" id="rscroll">';
    h += rsec('done', '1', 'Done since the last meeting', r.done.length ? '<div class="donelist">' + r.done.map(function (it) {
      const lu = E.lastUpdate(it);
      return '<div class="dl" data-open="' + esc(it.id) + '" tabindex="0"><span class="fl k-ok">' + U.icon('check') + '</span><span class="ref">' + esc(it.ref) + '</span>' +
        '<b>' + esc(it.title) + '</b>' + U.avatar(it.owner, 'xs') + '<span class="mini">' + esc(W.fmt(it.doneOn, 'dm')) + (lu && lu.t ? ' — “' + esc(lu.t) + '”' : '') + '</span></div>';
    }).join('') + '</div>' : '<div class="mini pad">Nothing finished since last time.</div>');
    h += rsec('discuss', '2', 'Needs the meeting', r.discuss.length ? r.discuss.map(function (x) { return card(m, x.it, x.why); }).join('') : '<div class="mini pad">Nothing is overdue, stuck or waiting. Good.</div>');
    h += rsec('ontrack', '3', 'On track', r.ontrack.length ? r.ontrack.map(function (x) {
      return room.cur === x.it.id || rev[x.it.id] ? card(m, x.it, []) : slim(m, x.it);
    }).join('') : '<div class="mini pad">Nothing else open.</div>',
      r.ontrack.some(function (x) { return !rev[x.it.id]; }) ? '<button class="btn sm" data-act="r-noteall">Note all as on track</button>' : '');
    h += rsec('standing', '4', 'Standing items', r.standing.map(function (g) { return gcard(m, g); }).join('') || '<div class="mini pad">None.</div>');
    h += rsec('raised', '5', 'Raised by the team', r.raised.map(function (g) { return gcard(m, g); }).join('') +
      '<div class="addg"><input class="in" id="ag-new" data-key="ag-new" placeholder="Something else to discuss? Add it and press Enter">' + U.micBtn('#ag-new') + '</div>');
    h += rsec('new', '6', 'New at this meeting', r.created.length ? '<div class="newlist">' + r.created.slice().reverse().map(function (it) { return newRow(m, it); }).join('') + '</div>'
      : '<div class="mini pad">Actions, decisions and notes you add below appear here.</div>');
    h += '<div class="rs-end"></div></div>';

    /* The capture bar. */
    h += capture(m);
    h += '</div>';

    h += '<aside class="tx">' + window.Assist.panel(m) + captions(m) + '</aside>';
    h += '</div>';
    return h;
  }

  function clock(m) {
    if (!m.startedAt) return '0:00';
    const s = Math.max(0, Math.floor((Date.now() - Date.parse(m.startedAt)) / 1000));
    const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
    return (hh ? hh + ':' + String(mm).padStart(2, '0') : mm) + ':' + String(ss).padStart(2, '0');
  }
  setInterval(function () {
    const el = document.getElementById('room-clock');
    if (!el) return;
    const m = App.S && App.S.meetingMap[App.param];
    if (m && m.status === 'live') el.textContent = clock(m);
  }, 1000);

  function railItem(k, n, t, count, sub) {
    return '<button class="ri" data-act="r-jump" data-s="' + k + '"><span class="ri-n">' + n + '</span><span class="ri-t">' + esc(t) +
      (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span><span class="n">' + count + '</span></button>';
  }

  function rsec(k, n, t, inner, right) {
    return '<section class="rsec" id="rs-' + k + '"><div class="rsec-h"><span class="ag-n">' + n + '</span><h3>' + esc(t) + '</h3>' +
      (right ? '<span class="rowend">' + right + '</span>' : '') + '</div>' + inner + '</section>';
  }

  /* What has already happened to this action at this meeting. */
  function hereNow(m, it) {
    const hs = (it.hist || []).filter(function (hh) { return hh.m === m.id; });
    const bits = [];
    hs.forEach(function (hh) {
      if (hh.k === 'upd') bits.push('“' + esc(hh.t) + '”');
      if (hh.k === 'due') bits.push('<b>moved ' + (hh.from ? esc(W.fmt(hh.from, 'dm')) : '—') + ' → ' + (hh.to ? esc(W.fmt(hh.to, 'dm')) : 'ongoing') + '</b>' + (hh.why ? ' (' + esc(hh.why) + ')' : ''));
      if (hh.k === 'done') bits.push('<b class="ok">done</b>');
      if (hh.k === 'prog') bits.push((+hh.to || 0) + '%');
      if (hh.k === 'wait') bits.push('waiting on ' + esc(hh.t));
      if (hh.k === 'unwait') bits.push('no longer waiting');
      if (hh.k === 'owner') bits.push('passed to ' + esc(U.first(hh.to)));
      if (hh.k === 'drop') bits.push('<b>dropped</b> — ' + esc(hh.why));
      if (hh.k === 'noted') bits.push('noted, no change');
    });
    return bits.length ? '<div class="herenow">' + U.icon('check') + ' In the minutes: ' + bits.join(' · ') + '</div>' : '';
  }

  function card(m, it, why) {
    const T = App.today;
    const cur = room.cur === it.id;
    const rev = (m.reviewed || {})[it.id];
    const lu = E.lastUpdate(it);
    const closed = !E.isOpen(it);
    return '<div class="icard' + (cur ? ' cur' : '') + (rev ? ' rev' : '') + (closed ? ' closed' : '') + '" id="ic-' + it.id + '" data-act="r-cur" data-id="' + esc(it.id) + '">' +
      '<div class="ic-h"><span class="ref">' + esc(it.ref) + '</span><b class="ic-t" data-open="' + esc(it.id) + '">' + esc(it.title) + '</b>' +
      '<span class="ic-o">' + U.avatar(it.owner, 'xs') + esc(U.first(it.owner)) + '</span>' + U.dueChip(it, T) + '</div>' +
      (why.length ? '<div class="ic-why">' + why.map(function (w) { return '<span class="fl k-' + w.k + '">' + esc(w.t) + '</span>'; }).join('') + '</div>' : '') +
      (it.detail && cur ? '<div class="ic-d">' + esc(it.detail) + '</div>' : '') +
      (lu && lu.t ? '<div class="ic-last"><span class="mini">' + esc(W.fmt(lu.on, 'dm')) + ', ' + esc(U.first(lu.by)) + ':</span> “' + esc(lu.t) + '”</div>' : '<div class="ic-last mini">No update yet.</div>') +
      hereNow(m, it) +
      (closed ? '' : '<div class="ic-ctl">' +
        '<button class="btn sm ok" data-act="r-done" data-id="' + esc(it.id) + '">' + U.icon('check') + 'Done</button>' +
        '<div class="seg sm">' + [25, 50, 75].map(function (p) { return '<button data-act="r-prog" data-id="' + esc(it.id) + '" data-p="' + p + '" class="' + (it.progress === p ? 'on' : '') + '">' + p + '%</button>'; }).join('') + '</div>' +
        '<button class="btn sm" data-act="r-move" data-id="' + esc(it.id) + '">' + U.icon('cal') + 'Move date</button>' +
        (it.status === 'waiting' ? '<button class="btn sm" data-act="r-unwait" data-id="' + esc(it.id) + '">No longer waiting</button>' : '<button class="btn sm" data-act="r-wait" data-id="' + esc(it.id) + '">Waiting on…</button>') +
        '<button class="btn sm" data-act="r-pass" data-id="' + esc(it.id) + '">Pass to…</button>' +
        '<button class="btn sm dngr" data-act="r-drop" data-id="' + esc(it.id) + '">Drop</button>' +
        (rev ? '' : '<button class="btn sm ghost" data-act="r-noted" data-id="' + esc(it.id) + '">No change</button>') + '</div>') +
      (cur && !closed ? '<div class="ic-upd inmic"><textarea class="in" id="ru-' + it.id + '" rows="2" data-key="ru" data-id="' + esc(it.id) + '" placeholder="What was said — Enter to save"></textarea>' +
        U.micBtn('#ru-' + it.id) + '<button class="btn p sm" data-act="r-upd" data-id="' + esc(it.id) + '">Save</button></div>' : '') +
      '</div>';
  }

  function slim(m, it) {
    const lu = E.lastUpdate(it);
    return '<div class="islim" data-act="r-cur" data-id="' + esc(it.id) + '"><span class="ref">' + esc(it.ref) + '</span><b>' + esc(it.title) + '</b>' +
      U.avatar(it.owner, 'xs') + U.pbar(it.progress) + U.dueChip(it, App.today) +
      '<span class="mini lu">' + (lu && lu.t ? '“' + esc(lu.t) + '”' : '') + '</span>' +
      '<button class="btn sm ghost" data-act="r-noted" data-id="' + esc(it.id) + '">On track</button></div>';
  }

  function gcard(m, g) {
    const cur = room.cur === g.id;
    return '<div class="gcard' + (cur ? ' cur' : '') + '" data-act="r-cur" data-id="' + esc(g.id) + '"><div class="gc-h"><b>' + esc(g.t) + '</b>' +
      '<span class="mini">' + esc(g.kind === 'standing' ? 'Standing item' : 'Raised by ' + U.first(g.by)) + '</span></div>' +
      '<div class="inmic"><textarea class="in" rows="' + (g.note ? 3 : 1) + '" id="gn-' + g.id + '" data-ch="g-note" data-g="' + esc(g.id) + '" placeholder="Notes for the minutes">' + esc(g.note || '') + '</textarea>' +
      U.micBtn('#gn-' + g.id) + '</div></div>';
  }

  function newRow(m, it) {
    const T = App.today;
    return '<div class="nr k-' + (it.kind === 'decision' || it.kind === 'note' ? it.kind : 'action') + '">' + U.kindPill(it.kind) + '<span class="ref">' + esc(it.ref) + '</span>' +
      '<b class="nr-t" data-open="' + esc(it.id) + '">' + esc(it.title) + '</b>' +
      (it.kind === 'action' ? U.selectOf('o', U.whoOptions(m.present, 'Who?'), it.owner || '', 'data-ch="nr-owner" data-id="' + esc(it.id) + '" class="in sm"') +
        '<input class="in sm" type="date" value="' + esc(it.due || '') + '" data-ch="nr-due" data-id="' + esc(it.id) + '"' + (it.due ? '' : ' style="border-color:var(--clash)"') + '>' : '') +
      '<button class="xs-x" data-act="nr-x" data-id="' + esc(it.id) + '" title="Remove">✕</button></div>';
  }

  /* ══ The capture bar: say or type what was agreed ══════════════════════ */

  function capture(m) {
    const nm = E.nextAfter(App.S, m);
    return '<div class="cap"><div class="cap-top"><div class="seg sm kinds">' + [['action', 'Action'], ['decision', 'Decision'], ['note', 'Note']].map(function (k) {
      return '<button data-act="cap-kind" data-k="' + k[0] + '" class="' + (room.kind === k[0] ? 'on' : '') + '">' + k[1] + '</button>';
    }).join('') + '</div><span class="mini" id="cap-hint">' + capHint() + '</span></div>' +
      '<div class="cap-row"><div class="inmic grow"><input class="in" id="cap-in" data-in="cap" data-key="cap" autocomplete="off" value="' + esc(room.capText) + '" placeholder="' +
      (room.kind === 'decision' ? 'What was decided' : room.kind === 'note' ? 'Something to record' : 'Type or say the action') + '">' +
      U.micBtn('#cap-in') + '</div>' +
      (room.kind === 'action' ? U.selectOf('o', U.whoOptions(m.present, 'Who?'), room.capOwner, 'id="cap-owner" data-ch="cap-owner" class="in cap-o"') +
        '<input class="in cap-d" type="date" id="cap-due" data-ch="cap-due" value="' + esc(room.capDue) + '">' : '') +
      '<button class="btn p" data-act="cap-add">Add</button></div>' +
      (room.kind === 'action' ? '<div class="cap-chips">' + U.dateChips(App.today, nm, 'data-act="cap-date" data-d') + '</div>' : '') + '</div>';
  }

  function capHint() {
    const t = room.capText.trim();
    if (!t) return room.kind === 'action' ? 'Names and dates in what you type fill in the owner and the date.' : '';
    const p = capParse(t);
    if (!p) return '';
    const bits = [];
    if (p.kind === 'decision' && room.kind === 'action') bits.push('<b>Sounds like a decision</b> — switch with the buttons if so');
    if (p.owner) bits.push('Owner: <b>' + esc(U.first(p.owner)) + '</b>');
    if (p.due) bits.push('Due: <b>' + esc(W.fmt(p.due, 'short')) + '</b>');
    if (p.title && p.title !== t) bits.push('Saved as “' + esc(p.title) + '”');
    return bits.join(' · ');
  }

  function capParse(t) {
    const m = App.S.meetingMap[App.param];
    const s = window.Extract.suggest([{ t: t }], { people: App.S.people, present: m.present, today: App.today,
      nextMeeting: E.nextAfter(App.S, m) });
    return s[0] || null;
  }

  App.onInput.cap = function (el) {
    room.capText = el.value;
    const p = capParse(el.value.trim());
    if (p && room.kind === 'action') {
      const o = document.getElementById('cap-owner'), d = document.getElementById('cap-due');
      if (o && p.owner && !room.ownerSet) { o.value = p.owner; room.capOwner = p.owner; }
      if (d && p.due && !room.dueSet) { d.value = p.due; room.capDue = p.due; }
    }
    const hEl = document.getElementById('cap-hint'); if (hEl) hEl.innerHTML = capHint();
  };
  App.onKey.cap = function (el, ev) { if (ev.key === 'Enter') { ev.preventDefault(); App.on['cap-add'](); } };
  App.onChange['cap-owner'] = function (el) { room.capOwner = el.value; room.ownerSet = !!el.value; };
  App.onChange['cap-due'] = function (el) { room.capDue = el.value; room.dueSet = !!el.value; };
  App.on['cap-date'] = function (b) {
    room.capDue = b.getAttribute('data-d'); room.dueSet = true;
    const d = document.getElementById('cap-due'); if (d) d.value = room.capDue;
  };
  App.on['cap-kind'] = function (b) {
    room.kind = b.getAttribute('data-k'); App.render();
    const i = document.getElementById('cap-in'); if (i) i.focus();
  };

  App.on['cap-add'] = function () {
    const m = App.S.meetingMap[App.param];
    const t = room.capText.trim() || ((document.getElementById('cap-in') || {}).value || '').trim();
    if (!t) { const i = document.getElementById('cap-in'); if (i) i.focus(); return; }
    Voice.stopDictation();
    const p = capParse(t);
    const cur = room.cur && App.S.itemMap[room.cur];
    const topic = cur ? cur.topic : 'office';
    if (room.kind === 'action') {
      const owner = room.capOwner || (p && p.owner) || '';
      const due = room.capDue || (p && p.due) || null;
      const title = p && p.kind === 'action' && p.title ? p.title : t;
      A.create({ kind: 'action', title: title, owner: owner || null, due: due, series: m.series, meeting: m.id, topic: topic });
      U.toast(owner ? 'On ' + esc(U.first(owner)) + '’s list' + (due ? ', due ' + esc(W.fmt(due, 'short')) : ' — no date yet') + '.' : 'Added — it still needs an owner.', owner ? 'good' : '');
    } else {
      const title = room.kind === 'decision' && p && p.kind === 'decision' && p.title ? p.title : t;
      A.create({ kind: room.kind, title: title, series: m.series, meeting: m.id, topic: topic, owner: null });
      U.toast(room.kind === 'decision' ? 'Decision recorded.' : 'Note recorded.', 'good');
    }
    Object.assign(room, { capText: '', capOwner: '', capDue: '', ownerSet: false, dueSet: false });
    App.render();
    const i = document.getElementById('cap-in'); if (i) i.focus();
  };

  App.onChange['nr-owner'] = function (el) {
    const it = App.S.itemMap[el.getAttribute('data-id')];
    if (!it.owner) { A.edit(it.id, { owner: el.value }); it.hist[0] && it.hist[0].to && (it.hist[0].to.owner = el.value); C.save(); }
    else A.reassign(it.id, el.value);
    App.render();
  };
  App.onChange['nr-due'] = function (el) {
    const it = App.S.itemMap[el.getAttribute('data-id')];
    /* A date set in the meeting that raised it is the first date, not a slip. */
    A.edit(it.id, { due: el.value || null });
    if (it.hist[0] && it.hist[0].k === 'new') { it.hist[0].to.due = el.value || null; C.save(); }
    App.render();
  };
  App.on['nr-x'] = function (b) {
    const it = App.S.itemMap[b.getAttribute('data-id')];
    U.confirm({ title: 'Remove ' + it.ref + '?', body: '<p>“' + esc(it.title) + '” was only just added. Removing it takes it out of the minutes altogether.</p>', yes: 'Remove', tone: 'danger' })
      .then(function (y) { if (y) { A.remove(it.id); App.render(); } });
  };

  /* ══ Room buttons ══════════════════════════════════════════════════════ */

  App.on['r-cur'] = function (b, ev) {
    const o = ev.target.closest('[data-open]');
    if (o) { App.openItem(o.getAttribute('data-open')); return; }
    if (ev.target.closest('button,textarea,input,select')) return;
    const id = b.getAttribute('data-id');
    if (room.cur === id) return;
    room.cur = id; App.render();
    const ta = document.getElementById('ru-' + id); if (ta) ta.focus({ preventScroll: true });
  };
  App.on['r-jump'] = function (b) {
    const el = document.getElementById('rs-' + b.getAttribute('data-s'));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  App.on['r-done'] = function (b) {
    const id = b.getAttribute('data-id'), ta = document.getElementById('ru-' + id);
    A.done(id, ta ? ta.value : ''); nextCur(id); App.render();
  };
  App.on['r-prog'] = function (b) { A.progress(b.getAttribute('data-id'), +b.getAttribute('data-p')); App.render(); };
  App.on['r-noted'] = function (b) { const id = b.getAttribute('data-id'); A.noted(id); if (room.cur === id) nextCur(id); App.render(); };
  App.on['r-noteall'] = function () {
    const m = App.S.meetingMap[App.param];
    E.review(App.S, m, App.today).ontrack.forEach(function (x) { if (!m.reviewed[x.it.id]) A.noted(x.it.id); });
    App.render();
  };
  App.on['r-upd'] = function (b) {
    const id = b.getAttribute('data-id'), ta = document.getElementById('ru-' + id);
    if (!ta || !ta.value.trim()) { ta && ta.focus(); return; }
    Voice.stopDictation(); A.update(id, ta.value); App.render();
  };
  App.onKey.ru = function (el, ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); if (el.value.trim()) { A.update(el.getAttribute('data-id'), el.value); App.render(); } }
  };
  App.on['r-unwait'] = function (b) { A.unwait(b.getAttribute('data-id')); App.render(); };
  App.onChange['g-note'] = function (el) { A.agendaNote(App.param, el.getAttribute('data-g'), el.value.trim()); };

  /* After dealing with one, move to the next one that needs the meeting. */
  function nextCur(id) {
    const m = App.S.meetingMap[App.param];
    const r = E.review(App.S, m, App.today);
    const order = r.discuss.map(function (x) { return x.it.id; });
    const i = order.indexOf(id);
    const next = order.slice(i + 1).concat(order.slice(0, Math.max(0, i))).find(function (x) { return !m.reviewed[x]; });
    room.cur = next || null; room.scrollTo = !!next;
  }

  App.on['r-move'] = function (b) {
    const it = App.S.itemMap[b.getAttribute('data-id')];
    const m = App.S.meetingMap[App.param];
    const nm = E.nextAfter(App.S, m);
    let to = null;
    U.modal({
      title: 'Move ' + it.ref,
      sub: '<span class="mini">' + esc(it.title) + ' — due ' + esc(it.due ? W.fmt(it.due, 'long') : 'no date') + (E.slips(it) ? ', already moved ' + E.slips(it) + '×' : '') + '</span>',
      body: U.field('New date', '<div class="row"><input class="in" type="date" id="mv-d" value="' + esc(it.due || '') + '">' + U.dateChips(App.today, nm, 'data-act="mv-date" data-d') + '</div>') +
        '<div class="lbl">Why</div><div class="whys" id="mv-why">' + D.SLIP.map(function (r) { return '<button class="dchip" data-act="mv-why" data-why="' + esc(r.t) + '">' + esc(r.t) + '</button>'; }).join('') + '</div>' +
        '<p class="mini">The old date stays in the history, and the minutes say it moved and why.</p>',
      foot: '<button class="btn" data-close>Cancel</button>',
      on: function (mm) {
        mm.querySelector('#mv-d').addEventListener('change', function (e) { to = e.target.value; });
      }
    });
    App.on['mv-date'] = function (bb) { document.getElementById('mv-d').value = bb.getAttribute('data-d'); to = bb.getAttribute('data-d'); };
    App.on['mv-why'] = function (bb) {
      const v = document.getElementById('mv-d').value || to;
      if (!v) { U.toast('Pick the new date first.', 'bad'); return; }
      if (it.due && v <= it.due) { A.move(it.id, v, ''); }
      else A.move(it.id, v, bb.getAttribute('data-why'));
      U.close(); nextCur(it.id); App.render();
    };
  };

  App.on['r-wait'] = function (b) {
    const it = App.S.itemMap[b.getAttribute('data-id')];
    U.modal({ title: 'Waiting on whom?', sub: '<span class="mini">' + esc(it.title) + '</span>',
      body: '<input class="in" id="wt-in" data-focus data-key="wt" placeholder="Who or what it’s waiting on">',
      foot: '<button class="btn" data-close>Cancel</button><button class="btn p" data-act="wt-go">Save</button>' });
    App.on['wt-go'] = function () {
      const v = document.getElementById('wt-in').value.trim();
      if (!v) return;
      A.wait(it.id, v); U.close(); App.render();
    };
    App.onKey.wt = function (el, ev) { if (ev.key === 'Enter') App.on['wt-go'](); };
  };

  App.on['r-pass'] = function (b) {
    const it = App.S.itemMap[b.getAttribute('data-id')];
    const m = App.S.meetingMap[App.param];
    U.modal({ title: 'Pass ' + it.ref + ' to…', sub: '<span class="mini">' + esc(it.title) + ' — now with ' + esc(U.name(it.owner)) + '</span>',
      body: '<div class="passlist">' + m.present.concat((App.S.seriesMap[m.series] || { members: [] }).members).filter(function (x, i, a) { return a.indexOf(x) === i && x !== it.owner; })
        .map(function (pid) { return '<button class="pass" data-act="pass-go" data-p="' + esc(pid) + '">' + U.avatar(pid, 'sm') + '<span>' + esc(U.name(pid)) + '</span></button>'; }).join('') + '</div>',
      foot: '<button class="btn" data-close>Cancel</button>' });
    App.on['pass-go'] = function (bb) { A.reassign(it.id, bb.getAttribute('data-p')); U.close(); App.render(); };
  };

  App.on['r-drop'] = function (b) {
    const it = App.S.itemMap[b.getAttribute('data-id')];
    U.modal({ title: 'Drop ' + it.ref + '?', sub: '<span class="mini">' + esc(it.title) + '</span>',
      body: '<div class="whys">' + D.DROP.map(function (r) { return '<button class="dchip" data-act="dr-go" data-why="' + esc(r) + '">' + esc(r) + '</button>'; }).join('') + '</div>',
      foot: '<button class="btn" data-close>Keep it</button>' });
    App.on['dr-go'] = function (bb) { A.drop(it.id, bb.getAttribute('data-why')); U.close(); nextCur(it.id); App.render(); };
  };

  App.on['r-att'] = function () {
    const m = App.S.meetingMap[App.param], s0 = App.S.seriesMap[m.series];
    const people = (s0 ? s0.members : []).concat(m.present, m.apologies).filter(function (x, i, a) { return a.indexOf(x) === i; });
    U.modal({ title: 'Who is here', body: '<div class="att">' + people.map(function (pid) {
      const st = m.present.indexOf(pid) >= 0 ? 'present' : m.apologies.indexOf(pid) >= 0 ? 'apology' : 'none';
      return '<div class="atr"><span class="person">' + U.avatar(pid, 'sm') + '<span class="pn"><b>' + esc(U.name(pid)) + '</b></span></span><div class="seg sm">' +
        [['present', 'Here'], ['apology', 'Apologies'], ['none', 'Not expected']].map(function (x) {
          return '<button class="' + (st === x[0] ? 'on' : '') + '" data-act="att2" data-p="' + esc(pid) + '" data-st="' + x[0] + '">' + x[1] + '</button>';
        }).join('') + '</div></div>';
    }).join('') + '</div>', foot: '<button class="btn p" data-close>Done</button>' });
  };
  App.on.att2 = function (b) {
    A.attend(App.param, b.getAttribute('data-p'), b.getAttribute('data-st'));
    b.parentNode.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    App.render();
  };

  /* ══ Finishing ═════════════════════════════════════════════════════════ */

  App.on['r-finish'] = function () {
    const S = App.S, m = S.meetingMap[App.param];
    const r = E.review(S, m, App.today);
    const nm = E.nextAfter(S, m);
    const notTaken = r.discuss.filter(function (x) { return !m.reviewed[x.it.id]; }).length + r.ontrack.filter(function (x) { return !m.reviewed[x.it.id]; }).length;
    const acts = r.created.filter(function (it) { return it.kind === 'action'; });
    const noOwner = acts.filter(function (it) { return !it.owner; });
    const noDate = acts.filter(function (it) { return !it.due && !it.ongoing; });
    const pend = room.sugg.filter(function (s) { return !s.done; }).length;
    const ai = m.ai || {};
    const recNow = window.Recorder.state() && window.Recorder.state().mid === m.id;
    U.modal({
      title: 'Finish the meeting',
      body: '<div class="fin">' +
        '<div><b>' + acts.length + '</b><span>new actions</span></div>' +
        '<div><b>' + r.created.filter(function (it) { return it.kind === 'decision'; }).length + '</b><span>decisions</span></div>' +
        '<div><b>' + Object.keys(m.reviewed).length + '</b><span>actions taken</span></div>' +
        '<div class="' + (notTaken ? 'warn' : '') + '"><b>' + notTaken + '</b><span>not reached</span></div></div>' +
        (notTaken ? '<p class="mini">The ones not reached carry forward unchanged and are listed as such in the minutes.</p>' : '') +
        (noOwner.length ? '<div class="conf danger"><p><b>' + noOwner.length + ' new action' + (noOwner.length === 1 ? ' has' : 's have') + ' no owner:</b> ' +
          noOwner.map(function (it) { return esc(it.title); }).join('; ') + '. Give ' + (noOwner.length === 1 ? 'it' : 'them') + ' one under “New at this meeting” first.</p></div>' : '') +
        (noDate.length ? '<label class="chk"><input type="checkbox" id="fin-nd" checked> Give the ' + noDate.length + ' new action' + (noDate.length === 1 ? '' : 's') + ' without a date the next meeting’s date</label>' : '') +
        (pend ? '<p class="mini">' + pend + ' caption suggestion' + (pend === 1 ? ' is' : 's are') + ' still waiting to be accepted or dismissed.</p>' : '') +
        (recNow ? '<div class="conf"><p><b>Still recording.</b> Closing stops it; the recording is kept, and ' + BOT + ' can still write it up into these minutes afterwards.</p></div>' : '') +
        (window.Assist.busy(m.id) ? '<div class="conf"><p><b>' + BOT + ' is still working on the recording.</b> Better to wait for its draft, then close.</p></div>' : '') +
        (ai.status === 'ready' && !ai.applied ? '<div class="conf danger"><p><b>' + BOT + '’s draft hasn’t been added yet.</b> <button class="btn sm" data-act="as-review">Review it first</button></p></div>' : '') +
        U.field('Next meeting', '<input class="in" type="date" id="fin-next" value="' + esc(nm) + '">', m.series ? 'The next one is set up with the same people and standing items.' : '') +
        '</div>',
      foot: '<button class="btn" data-close>Back to the meeting</button><button class="btn p" data-act="fin-go"' + (noOwner.length ? ' disabled' : '') + '>Close and write the minutes</button>'
    });
  };
  App.on['fin-go'] = function () {
    const S = App.S, m = S.meetingMap[App.param];
    const next = document.getElementById('fin-next').value || null;
    const nd = document.getElementById('fin-nd');
    if (nd && nd.checked && next) {
      S.items.filter(function (it) { return it.meeting === m.id && it.kind === 'action' && !it.due && !it.ongoing; }).forEach(function (it) {
        A.edit(it.id, { due: next });
        if (it.hist[0] && it.hist[0].k === 'new') it.hist[0].to.due = next;
      });
    }
    stopAll();
    window.Assist.stopRecordingFor(m.id);
    A.close(m.id, next);
    U.close();
    room.cur = null; room.sugg = [];
    App.render();
    U.toast('Minutes written. Every action is already on its owner’s list.', 'good', 6000);
  };

  /* ══ The transcript ════════════════════════════════════════════════════ */

  /* The browser's own live captions: free and needs no key, but only as
     good as Chrome's speech recognition. Gemini, from a recording, is the
     better route; this stays for when there is no key or no signal. */
  function captions(m) {
    const n = (m.transcript || []).length;
    const on = room.listening || room.showTx;
    if (!on) {
      return '<div class="capt"><button class="btn sm ghost" data-act="r-listen">' + U.icon('wave') + 'Live captions instead</button>' +
        '<span class="mini">Free, no key — the browser writes down what it hears as you go.</span></div>';
    }
    return '<div class="capt on"><div class="as-row"><b>Live captions</b>' +
      (room.listening ? '<span class="lis"><span class="livedot"></span>Listening</span><button class="btn sm" data-act="r-listen">Stop</button>'
        : '<button class="btn sm" data-act="r-listen">Start again</button>') + '</div>' +
      (n ? '' : '<div class="tx-l" id="tx-l"></div>') +
      '<div class="tx-go"><button class="btn block" data-act="tx-suggest"' + (n ? '' : ' disabled') + '>Suggest actions from the captions</button></div>' +
      '<div class="tx-sg" id="tx-sg">' + suggHtml(m) + '</div></div>';
  }

  function paintTranscript(m) {
    const box = document.getElementById('tx-l');
    if (!box) return;
    const lines = m.transcript || [];
    box.innerHTML = lines.map(lineHtml).join('') + (room.interim ? '<div class="txl interim"><span class="ts">…</span><span class="tt">' + esc(room.interim) + '</span></div>' : '') +
      (lines.length || room.interim ? '' : '<div class="mini pad">' + (room.listening ? 'Listening — start talking.' : 'Nothing yet.') + '</div>');
    box.scrollTop = box.scrollHeight;
  }

  function lineHtml(l) {
    const S = App.S;
    const at = l.at && (S.itemMap[l.at] ? S.itemMap[l.at].ref : (S.meetingMap[App.param].agenda.find(function (g) { return g.id === l.at; }) || {}).t);
    const mm = Math.floor(l.s / 60), ss = l.s % 60;
    /* "Name: words" — the speaker picked out, and marked when Gemini couldn't tell who it was. */
    const x = String(l.t || '').match(/^([^:\[\]()]{1,40}):\s*([\s\S]*)$/);
    const tt = x ? '<b class="spk-n' + (/^(speaker|person|voice)\s*\d+$/i.test(x[1].trim()) ? ' unk' : '') + '">' + esc(x[1]) + '</b> ' + esc(x[2]) : esc(l.t);
    return '<div class="txl"><span class="ts">' + mm + ':' + String(ss).padStart(2, '0') + '</span><span class="tt">' + tt + '</span>' +
      (at ? '<span class="tag">' + esc(String(at).slice(0, 24)) + '</span>' : '') + '</div>';
  }

  /* Lines belong to the meeting that was being transcribed, even if the
     chair glances at another screen for a moment. */
  function heard(text) {
    const m = App.S.meetingMap[room.mid];
    if (!m || m.status !== 'live') { stopAll(); return; }
    const s = m.startedAt ? Math.max(0, Math.floor((Date.now() - Date.parse(m.startedAt)) / 1000)) : 0;
    A.hear(m.id, { s: s, t: text, at: room.cur || null });
    room.interim = '';
    if (App.param === m.id) {
      paintTranscript(m);
      const g = document.querySelector('[data-act="tx-suggest"]'); if (g) g.disabled = false;
    }
  }

  function interim(t) {
    room.interim = t;
    const m = App.S.meetingMap[room.mid];
    if (m && App.param === m.id) paintTranscript(m);
  }

  function startListening() {
    room.showTx = true;
    room.mid = App.param;
    room.listening = Voice.meeting({
      onLine: heard, onInterim: interim,
      onState: function (st, msg) {
        if (st === 'denied' || st === 'unsupported') { room.listening = null; U.toast(esc(msg), 'bad', 8000); App.render(); }
        else if (st === 'warn' && msg) U.toast(esc(msg), '', 4000);
      }
    });
    App.render();
  }

  function stopAll() {
    if (room.listening) { room.listening.stop(); room.listening = null; }
    if (room.playing) { clearTimeout(room.playing.t); room.playing = null; }
    room.interim = '';
  }

  App.on['r-listen'] = function () {
    const m = App.S.meetingMap[App.param];
    if (room.listening) { stopAll(); App.render(); return; }
    if (!Voice.ok) { U.toast(esc(Voice.unsupported()), 'bad', 8000); return; }
    if (!m.consent) {
      U.confirm({ title: 'Live captions?', body: '<p>Only if everyone here agrees. The words are kept as text in the meeting record; no sound is kept.</p>' +
        '<p class="mini">Chrome and Edge send the sound to their own speech service to turn it into words.</p>', yes: 'Everyone agrees — start' })
        .then(function (y) { if (y) { A.editMeeting(m.id, { consent: true }, 'Everyone agreed to transcription'); startListening(); } });
      return;
    }
    startListening();
  };
  App.on['tx-hide'] = function () { stopAll(); room.showTx = false; const m = App.S.meetingMap[App.param]; if (m && m.transcript.length) U.toast('Transcript kept with the meeting.', ''); App.render(); };

  /* Signing out or closing the meeting stops the microphone. */
  window.MeetRoom = { stop: stopAll };

  /* ══ Suggestions ═══════════════════════════════════════════════════════ */

  App.on['tx-suggest'] = function () {
    const S = App.S, m = S.meetingMap[App.param];
    const seen = {};
    room.sugg.forEach(function (s) { seen[s.kind + '|' + s.src] = true; });
    const out = window.Extract.suggest(m.transcript, { people: S.people, present: m.present, today: App.today,
      nextMeeting: E.nextAfter(S, m), items: S.items.filter(function (it) { return it.series === m.series; }) });
    let added = 0;
    out.forEach(function (s) {
      if (seen[s.kind + '|' + s.src]) return;
      s.id = 'sg' + Date.now().toString(36) + (added++);
      room.sugg.push(s);
    });
    const box = document.getElementById('tx-sg'); if (box) box.innerHTML = suggHtml(m);
    U.toast(added ? added + ' suggestion' + (added === 1 ? '' : 's') + ' to check.' : 'Nothing new to suggest.', added ? 'good' : '');
  };

  function suggHtml(m) {
    const list = room.sugg.filter(function (s) { return !s.done; });
    if (!list.length) return '';
    const S = App.S;
    return '<div class="sg-h"><b>' + list.length + ' to check</b><button class="btn sm" data-act="sg-all">Accept all with an owner</button></div>' +
      list.map(function (s) {
        const it = s.item && S.itemMap[s.item];
        return '<div class="sg k-' + s.kind + '" data-sg="' + esc(s.id) + '">' +
          '<div class="sg-top">' + (s.kind === 'update' ? '<span class="kp k-update">Update</span><span class="ref">' + esc(it ? it.ref : '') + '</span>' : U.kindPill(s.kind)) +
          '<button class="xs-x" data-act="sg-x" data-id="' + esc(s.id) + '" title="Dismiss">✕</button></div>' +
          '<textarea class="in sm" rows="2" data-ch="sg-t" data-id="' + esc(s.id) + '">' + esc(s.title) + '</textarea>' +
          (s.kind === 'action' ? '<div class="sg-row">' + U.selectOf('o', U.whoOptions(m.present, s.self ? 'Who said it?' : 'Who?'), s.owner || '', 'class="in sm" data-ch="sg-o" data-id="' + esc(s.id) + '"') +
            '<input class="in sm" type="date" value="' + esc(s.due || '') + '" data-ch="sg-d" data-id="' + esc(s.id) + '"></div>' : '') +
          '<div class="sg-src">“' + esc(s.src) + '”</div>' +
          '<button class="btn p sm" data-act="sg-ok" data-id="' + esc(s.id) + '"' + (s.kind === 'action' && !s.owner ? ' disabled title="Pick who it is for"' : '') + '>' +
          (s.kind === 'update' ? 'Add to ' + esc(it ? it.ref : 'the action') : 'Add to the minutes') + '</button></div>';
      }).join('');
  }

  function sg(id) { return room.sugg.find(function (s) { return s.id === id; }); }
  App.onChange['sg-t'] = function (el) { sg(el.getAttribute('data-id')).title = el.value.trim(); };
  App.onChange['sg-o'] = function (el) {
    const s = sg(el.getAttribute('data-id')); s.owner = el.value || null;
    const b = el.closest('.sg').querySelector('[data-act="sg-ok"]'); if (b) b.disabled = !s.owner;
  };
  App.onChange['sg-d'] = function (el) { sg(el.getAttribute('data-id')).due = el.value || null; };
  App.on['sg-x'] = function (b) {
    sg(b.getAttribute('data-id')).done = true;
    const m = App.S.meetingMap[App.param]; document.getElementById('tx-sg').innerHTML = suggHtml(m);
  };
  function accept(s) {
    const m = App.S.meetingMap[App.param];
    const at = s.at && App.S.itemMap[s.at];
    if (s.kind === 'update') { if (s.item) A.update(s.item, s.title); }
    else A.create({ kind: s.kind, title: s.title, owner: s.kind === 'action' ? s.owner : null, due: s.kind === 'action' ? s.due : null,
      series: m.series, meeting: m.id, topic: at ? at.topic : 'office' });
    s.done = true;
  }
  App.on['sg-ok'] = function (b) {
    const s = sg(b.getAttribute('data-id'));
    if (s.kind === 'action' && !s.owner) return;
    accept(s); App.render();
  };
  App.on['sg-all'] = function () {
    let n = 0;
    room.sugg.forEach(function (s) { if (!s.done && (s.kind !== 'action' || s.owner)) { accept(s); n++; } });
    App.render();
    U.toast(n + ' added to the minutes.', 'good');
  };
})();

</script>
<script>/* minutes.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the minutes themselves
   The document is an output, not the place the work is kept. It is drawn
   from what the meeting did to each action, frozen when the meeting
   closed, and handed on as:
     a PDF, laid out for A4 with the JOR band, numbered pages and a
       running footer (print → Save as PDF);
     an Excel workbook in the office's own minutes-sheet layout;
     plain text for an email, or each owner's own list.
   ═══════════════════════════════════════════════════════════════════════ */

window.Minutes = (function () {
  'use strict';
  const BOT = (window.JOR_MIN_DATA && window.JOR_MIN_DATA.BOT) || 'O’Reilly AI';   // the assistant's name on screen (data.js)

  const App = window.App, C = window.Core, E = window.Engine, W = window.When, U = window.UI, A = window.Actions;
  const esc = C.esc;
  let withTx = false;

  function model(m) {
    const mm = m.snap ? Object.assign({}, m.snap) : E.minutes(App.S, m);
    if (m.summary != null) mm.summary = m.summary;
    return mm;
  }

  function titleOf(mm) {
    const s0 = App.S.seriesMap[mm.series];
    return s0 ? s0.name : mm.title;
  }

  function names(ids) { return ids.map(function (id) { return U.name(id); }).join(', '); }
  function ini(id) { const p = App.S.personMap[id]; return p ? p.initials : ''; }

  function dueTxt(r) { return r.due ? W.fmt(r.due, 'dm') : r.ongoing ? 'Ongoing' : '—'; }

  function owner(r) {
    if ((r.everyone || []).length) return '<span class="d-who">Everyone</span>';
    if (!r.owner) return '<span class="muted">—</span>';
    return '<span class="d-who"><i>' + esc(ini(r.owner)) + '</i>' + esc(U.first(r.owner)) + '</span>' +
      ((r.helpers || []).length ? '<span class="muted d-help">+ ' + r.helpers.map(U.first).map(esc).join(', ') + '</span>' : '');
  }

  /* The state of an action after this meeting, as a coloured word. */
  function state(r, mm, kind) {
    if (r.done || r.status === 'done') return '<span class="st st-done">Done</span>';
    if (r.dropped || r.status === 'dropped') return '<span class="st st-drop">Dropped</span>';
    if (kind === 'new') return '<span class="st st-new">New</span>';
    if (r.slip && r.slip.from && r.slip.to > r.slip.from) return '<span class="st st-moved">Moved</span>';
    if (r.waiting || r.status === 'waiting') return '<span class="st st-wait">Waiting</span>';
    if (r.due && r.due < mm.date) return '<span class="st st-over">Overdue</span>';
    if (kind === 'carried') return '<span class="st st-nr">Not reached</span>';
    return '<span class="st st-ok">' + (r.progress ? (+r.progress || 0) + '%' : 'On track') + '</span>';
  }

  function update(r, kind) {
    if (kind === 'new') return r.update ? esc(r.update) : '<span class="muted">New at this meeting.</span>';
    if (kind === 'carried') return r.last ? esc(r.last) + ' <span class="muted">' + esc(W.fmt(r.lastOn, 'dm')) + '</span>' : '<span class="muted">—</span>';
    const bits = [];
    if (r.slip && r.slip.from && r.slip.to) bits.push('<b class="mv">' + esc(W.fmt(r.slip.from, 'dm')) + ' → ' + esc(W.fmt(r.slip.to, 'dm')) + '</b>' + (r.slip.why ? ' <span class="muted">' + esc(r.slip.why) + '.</span>' : ''));
    if (r.reassigned) bits.push('Passed from ' + esc(U.first(r.reassigned.from)) + ' to ' + esc(U.first(r.reassigned.to)) + '.');
    if (r.waiting) bits.push('Waiting on ' + esc(r.waiting) + '.');
    if (r.dropped) bits.push(esc(r.dropped) + '.');
    if (r.update) bits.push(esc(r.update));
    return bits.length ? bits.join(' ') : '<span class="muted">No change.</span>';
  }

  /* ══ The document ══════════════════════════════════════════════════════ */

  function doc(m) {
    const mm = model(m);
    const logo = window.JOR_MARKS ? window.JOR_MARKS.logo : '';
    let n = 0;
    const sec = function (title, count, inner, cls) {
      if (!count) return '';
      n++;
      return '<section class="d-sec ' + (cls || '') + '"><h2><span>' + n + '</span>' + esc(title) + '</h2>' + inner + '</section>';
    };
    const doneN = mm.reviewed.filter(function (r) { return r.done; }).length + mm.completed.length;
    const movedN = mm.reviewed.filter(function (r) { return r.slip && r.slip.to && r.slip.from && r.slip.to > r.slip.from; }).length;
    const openN = mm.reviewed.filter(function (r) { return !r.done && !r.dropped; }).length + mm.carried.length + mm.actions.length;

    let h = '<article class="doc" id="doc">';
    h += '<header class="d-band"><img src="' + logo + '" alt="JOR Ireland"><div class="d-kick">Minutes</div></header>';
    h += '<div class="d-title"><div class="d-over">' + esc(W.fmt(mm.date, 'long')) + (mm.time ? ' · ' + esc(mm.time) : '') + (mm.place ? ' · ' + esc(mm.place) : '') + '</div>' +
      '<h1>' + esc(titleOf(mm)) + '</h1></div>';
    h += '<div class="d-meta"><div><span>Chair</span><b>' + esc(U.name(mm.chair)) + '</b></div><div><span>Minutes</span><b>' + esc(U.name(mm.taker)) + '</b></div>' +
      '<div class="wide"><span>Present</span><b>' + esc(names(mm.present)) + '</b></div>' +
      (mm.apologies.length ? '<div class="wide"><span>Apologies</span><b>' + esc(names(mm.apologies)) + '</b></div>' : '') + '</div>';

    if (mm.summary) h += '<div class="d-brief"><div class="d-brief-k">In brief</div><p>' + esc(mm.summary) + '</p></div>';

    h += '<div class="d-sum">' +
      '<div><b>' + mm.decisions.length + '</b>decision' + (mm.decisions.length === 1 ? '' : 's') + '</div>' +
      '<div><b>' + mm.actions.length + '</b>new to-do' + (mm.actions.length === 1 ? '' : 's') + '</div>' +
      '<div class="good"><b>' + doneN + '</b>done</div>' +
      '<div class="' + (movedN ? 'warn' : '') + '"><b>' + movedN + '</b>moved</div>' +
      '<div><b>' + openN + '</b>open after</div></div>';

    h += sec('Decisions', mm.decisions.length, '<div class="d-decs">' + mm.decisions.map(function (d) {
      return '<div class="d-dec"><span class="d-ref">' + esc(d.ref) + '</span><div><b>' + esc(d.title) + '</b>' + (d.detail ? '<div class="muted">' + esc(d.detail) + '</div>' : '') + '</div></div>';
    }).join('') + '</div>');

    /* The actions, in the minutes sheet's own columns. */
    const rows = [];
    mm.actions.forEach(function (r) { rows.push({ r: r, k: 'new' }); });
    mm.reviewed.forEach(function (r) { rows.push({ r: r, k: 'rev' }); });
    mm.carried.forEach(function (r) { rows.push({ r: r, k: 'carried' }); });
    const group = function (k, label) {
      const list = rows.filter(function (x) { return x.k === k; });
      if (!list.length) return '';
      return '<tr class="d-grp"><td colspan="6">' + esc(label) + ' <span>' + list.length + '</span></td></tr>' + list.map(function (x) {
        const r = x.r;
        return '<tr><td class="c-ap"><b>' + esc(r.title) + '</b><span class="d-ref">' + esc(r.ref) + '</span></td>' +
          '<td class="c-task">' + (r.detail && r.detail !== r.title ? esc(r.detail) : '<span class="muted">—</span>') + '</td>' +
          '<td class="c-upd">' + update(r, x.k) + '</td><td class="c-who">' + owner(r) + '</td>' +
          '<td class="c-due">' + esc(dueTxt(r)) + '</td><td class="c-st">' + state(r, mm, x.k) + '</td></tr>';
      }).join('');
    };
    h += sec('Actions', rows.length, '<table class="d-t d-acts"><thead><tr><th>Action point</th><th class="c-task">Task</th><th>Update</th><th>Assigned to</th><th>Date</th><th>Status</th></tr></thead><tbody>' +
      group('new', 'New at this meeting') + group('rev', 'Reviewed') + group('carried', 'Still open — not reached') + '</tbody></table>');

    /* Everyone's to-dos after the meeting, person by person. */
    const by = {};
    rows.forEach(function (x) {
      const r = x.r;
      if (r.done || r.dropped || r.status === 'done' || r.status === 'dropped') return;
      const ids = (r.everyone || []).length ? r.everyone : [r.owner];
      ids.forEach(function (pid) { if (pid) (by[pid] = by[pid] || []).push(x); });
    });
    const people = Object.keys(by).sort(function (a, b) { return U.name(a).localeCompare(U.name(b)); });
    h += sec('To-dos, person by person', people.length, '<div class="d-people">' + people.map(function (pid) {
      const list = by[pid].slice().sort(function (a, b) { return (a.r.due || '9') < (b.r.due || '9') ? -1 : 1; });
      return '<div class="d-person"><div class="d-ph"><i>' + esc(ini(pid)) + '</i><b>' + esc(U.name(pid)) + '</b><span>' + list.length + '</span></div>' +
        '<ul>' + list.map(function (x) {
          const over = x.r.due && x.r.due < mm.date;
          return '<li><span class="d-li">' + esc(x.r.title) + (x.k === 'new' ? ' <em>new</em>' : '') + '</span><span class="d-ld' + (over ? ' over' : '') + '">' + esc(dueTxt(x.r)) + '</span></li>';
        }).join('') + '</ul></div>';
    }).join('') + '</div>', 'd-sec-people');

    h += sec('Done since the last meeting', mm.completed.length, '<table class="d-t d-done"><tbody>' + mm.completed.map(function (r) {
      return '<tr><td class="c-ap"><b>' + esc(r.title) + '</b><span class="d-ref">' + esc(r.ref) + '</span></td><td>' + (r.update ? esc(r.update) : '') + '</td>' +
        '<td class="c-who">' + owner(r) + '</td><td class="c-due">' + esc(W.fmt(r.doneOn, 'dm')) + '</td></tr>';
    }).join('') + '</tbody></table>');

    const notes = mm.notes.map(function (x) { return '<li>' + esc(x.title) + '</li>'; }).concat(mm.agenda.map(function (g) {
      return '<li><b>' + esc(g.t) + '.</b> ' + esc(g.note) + '</li>';
    }));
    h += sec('Notes', notes.length, '<ul class="d-notes">' + notes.join('') + '</ul>');

    h += sec('For the next meeting', (mm.forNext || []).length, '<ul class="d-notes">' + (mm.forNext || []).map(function (g) {
      return '<li>' + esc(g.t) + ' <span class="muted">— ' + esc(U.first(g.by)) + ', ' + esc(W.fmt(g.date, 'dm')) + '</span></li>';
    }).join('') + '</ul>');

    if (withTx && (m.transcript || []).length) {
      h += sec('Transcript', 1, '<div class="d-tx">' + m.transcript.map(function (l) {
        return '<p><span>' + Math.floor(l.s / 60) + ':' + String(l.s % 60).padStart(2, '0') + '</span>' + esc(l.t) + '</p>';
      }).join('') + '</div>', 'd-sec-tx');
    }

    h += '<footer class="d-foot">' + (mm.next ? '<div class="d-next"><span>Next meeting</span><b>' + esc(W.fmt(mm.next, 'long')) + '</b></div>' : '') +
      '<div class="muted">' + (mm.consent ? 'Recorded with the agreement of those present. ' : '') + (m.ai && m.ai.applied ? 'Drafted from ' + (window.Assist ? window.Assist.fromWhat(m.ai) : 'the notes') + ' by ' + BOT + ' and checked by ' + esc(U.first(mm.taker)) + '. ' : '') +
      'Written by JOR Minutes &amp; To-Do from the action register' + (m.closedAt ? ', ' + esc(W.fmt(m.closedAt, 'med')) : '') + '. Every action above is on its owner’s to-do list.</div></footer>';
    h += '</article>';
    return h;
  }

  /* ══ The page around it ════════════════════════════════════════════════ */

  function page(m) {
    const ME = App.ME;
    const prev = E.prevClosed(App.S, m);
    const next = App.S.meetings.filter(function (x) { return x.series === m.series && x.date > m.date && x.id !== m.id; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0];
    let h = '<div class="mtool"><div class="row">' +
      '<button class="btn" data-go="meetings">← Meetings</button>' +
      (prev ? '<button class="btn sm ghost" data-go="meeting/' + esc(prev.id) + '">‹ ' + esc(W.fmt(prev.date, 'dm')) + '</button>' : '') +
      (next ? '<button class="btn sm ghost" data-go="meeting/' + esc(next.id) + '">' + esc(W.fmt(next.date, 'dm')) + ' ›</button>' : '') +
      '</div><div class="row">' +
      '<button class="btn p" data-act="mn-print">' + U.icon('print') + 'Save as PDF</button>' +
      '<button class="btn" data-act="mn-xlsx">' + U.icon('down') + 'Excel, in the minutes-sheet layout</button>' +
      '<button class="btn" data-act="mn-copy">' + U.icon('copy') + 'Copy for email</button>' +
      '<button class="btn" data-act="mn-owners">' + U.icon('mail') + 'Each owner’s actions</button>' +
      '</div></div>';
    h += '<div class="mstate">' + (m.imported ? '<span class="pill grey">From the minutes workbook, tab “' + esc(m.imported) + '”</span>' : '') +
      (m.circulated ? '<span class="pill">Sent ' + esc(W.fmt(m.circulated, 'dm')) + '</span>' :
        '<span class="pill amber">Not sent yet</span><button class="btn sm" data-act="mn-sent">Mark as sent</button>') +
      (E.isAdmin(ME) ? '<button class="btn sm ghost" data-act="mn-sum">' + (model(m).summary ? 'Edit the summary' : 'Add a summary') + '</button>' : '') +
      ((m.transcript || []).length ? '<label class="chk"><input type="checkbox" data-ch="mn-tx"' + (withTx ? ' checked' : '') + '> Include the transcript (' + m.transcript.length + ' lines)</label>' : '') +
      (E.isAdmin(ME) && !m.imported ? '<button class="btn sm ghost" data-act="mn-reopen" title="Open the meeting again to correct something">Reopen</button>' : '') +
      '</div>';
    h += window.Assist ? window.Assist.waiting(m) : '';
    h += '<div class="desk">' + doc(m) + '</div>';
    return h;
  }

  /* ══ Getting it out ════════════════════════════════════════════════════ */

  function current() { return App.S.meetingMap[App.param]; }

  App.onChange['mn-tx'] = function (el) { withTx = el.checked; App.render(); };
  App.on['mn-sent'] = function () { A.circulate(App.param); App.render(); };
  App.on['mn-reopen'] = function () {
    U.confirm({ title: 'Reopen this meeting?', body: '<p>The minutes will be written again when you close it. Use it to correct something, not to hold a second meeting.</p>', yes: 'Reopen' })
      .then(function (y) { if (y) { A.reopenMeeting(App.param); App.render(); } });
  };
  App.on['mn-sum'] = function () {
    const m = current();
    U.modal({ title: 'Summary', sub: '<span class="mini">Three to five sentences at the top of the minutes.</span>',
      body: '<div class="inmic"><textarea class="in" id="mn-sum-t" rows="6">' + esc(model(m).summary || '') + '</textarea>' + U.micBtn('#mn-sum-t') + '</div>',
      foot: '<button class="btn" data-close>Cancel</button><button class="btn p" data-act="mn-sum-go">Save</button>' });
  };
  App.on['mn-sum-go'] = function () {
    A.editMeeting(App.param, { summary: document.getElementById('mn-sum-t').value.trim() }, 'Summary of the minutes');
    U.close(); App.render();
  };

  /* A4, the green band kept, pages numbered "Page 2 of 3" with the meeting
     in the running footer (page margin boxes, Chrome and Edge). */
  App.on['mn-print'] = function () {
    const m = current(), mm = model(m);
    const old = document.title;
    /* Into a CSS string: nothing that could end it. */
    const foot = ('JOR Ireland · ' + titleOf(mm) + ' · ' + W.fmt(mm.date, 'med')).replace(/["\\\n\r{}<>;]/g, ' ');
    document.title = titleOf(mm) + ' — minutes ' + W.fmt(mm.date, 'num').replace(/\//g, '-');
    const st = document.createElement('style');
    st.id = 'print-page';
    st.textContent = '@page{size:A4;margin:12mm 13mm 16mm;@bottom-left{content:"' + foot + '";font:8pt "Segoe UI",Arial,sans-serif;color:#72877D}' +
      '@bottom-right{content:"Page " counter(page) " of " counter(pages);font:8pt "Segoe UI",Arial,sans-serif;color:#72877D}}' +
      '@page:first{margin-top:0}';
    document.head.appendChild(st);
    document.body.classList.add('printing');
    const done = function () { document.body.classList.remove('printing'); document.title = old; st.remove(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(function () { window.print(); setTimeout(done, 1500); }, 60);
  };

  App.on['mn-xlsx'] = function () {
    const m = current(), mm = model(m);
    const bytes = window.XLSXW.write({ title: titleOf(mm) + ' ' + mm.date, sheets: [window.MinutesSheet.build(App.S, m, mm)] });
    U.download(titleOf(mm) + ' ' + W.fmt(mm.date, 'num').replace(/\//g, '-') + '.xlsx', bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  };

  /* Every closed meeting of a series, newest tab first — the old workbook, rebuilt. */
  function workbook(sid) {
    const S = App.S;
    const ms = S.meetings.filter(function (m) { return m.status === 'closed' && (!sid || m.series === sid) && E.canSeeMeeting(S, App.ME, m); })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    if (!ms.length) { U.toast('No closed meetings yet.', 'bad'); return; }
    const bytes = window.XLSXW.write({ title: 'JOR minutes', sheets: ms.map(function (m) { return window.MinutesSheet.build(S, m, model(m)); }) });
    U.download('JOR minutes ' + App.today + '.xlsx', bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }

  function text(m) {
    const mm = model(m);
    const L = [];
    const plain = function (s) { return String(s || '').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&rarr;|→/g, '→'); };
    L.push(titleOf(mm) + ' — ' + W.fmt(mm.date, 'long'));
    L.push('Present: ' + names(mm.present));
    if (mm.apologies.length) L.push('Apologies: ' + names(mm.apologies));
    L.push('');
    if (mm.summary) { L.push(mm.summary); L.push(''); }
    if (mm.decisions.length) { L.push('DECISIONS'); mm.decisions.forEach(function (d) { L.push('• ' + d.title + '  [' + d.ref + ']'); }); L.push(''); }
    if (mm.actions.length) {
      L.push('NEW TO-DOS');
      mm.actions.forEach(function (r) { L.push('• ' + r.title + (r.detail && r.detail !== r.title ? ': ' + r.detail : '') + ' — ' + (r.owner ? U.name(r.owner) : 'no owner') + ', ' + (r.due ? 'by ' + W.fmt(r.due, 'short') : dueTxt(r)) + '  [' + r.ref + ']'); });
      L.push('');
    }
    if (mm.reviewed.length) {
      L.push('ACTIONS REVIEWED');
      mm.reviewed.forEach(function (r) { L.push('• ' + r.title + ' (' + U.first(r.owner) + '): ' + plain(state(r, mm, 'rev')) + '. ' + plain(update(r, 'rev')) + '  [' + r.ref + ']'); });
      L.push('');
    }
    if (mm.carried.length) { L.push('STILL OPEN'); mm.carried.forEach(function (r) { L.push('• ' + r.title + ' — ' + U.first(r.owner) + ', ' + dueTxt(r)); }); L.push(''); }
    if (mm.completed.length) { L.push('DONE SINCE THE LAST MEETING'); mm.completed.forEach(function (r) { L.push('• ' + r.title + ' (' + U.first(r.owner) + ')'); }); L.push(''); }
    if (mm.notes.length || mm.agenda.length) {
      L.push('NOTES');
      mm.notes.forEach(function (x) { L.push('• ' + x.title); });
      mm.agenda.forEach(function (g) { L.push('• ' + g.t + ': ' + g.note); });
      L.push('');
    }
    if (mm.next) L.push('Next meeting: ' + W.fmt(mm.next, 'long'));
    return L.join('\n');
  }

  App.on['mn-copy'] = function () {
    U.copyText(text(current())).then(function (ok) {
      U.toast(ok ? 'Minutes copied — paste them into an email.' : 'Copy was blocked by the browser.', ok ? 'good' : 'bad');
    });
  };

  /* Each owner gets only their own actions: new, reviewed and still open. */
  App.on['mn-owners'] = function () {
    const m = current(), mm = model(m);
    const by = {};
    const add = function (pid, line) { if (!pid) return; (by[pid] = by[pid] || []).push(line); };
    mm.actions.forEach(function (r) { (r.everyone.length ? r.everyone : [r.owner]).forEach(function (p) { add(p, '• NEW — ' + r.title + (r.due ? ', by ' + W.fmt(r.due, 'short') : '') + ' [' + r.ref + ']'); }); });
    mm.reviewed.forEach(function (r) { if (!r.done && !r.dropped) add(r.owner, '• ' + r.title + (r.due ? ', by ' + W.fmt(r.due, 'short') : '') + (r.slip ? ' (moved)' : '') + ' [' + r.ref + ']'); });
    mm.carried.forEach(function (r) { add(r.owner, '• ' + r.title + (r.due ? ', by ' + W.fmt(r.due, 'short') : '') + ' [' + r.ref + ']'); });
    const ids = Object.keys(by).sort(function (a, b) { return U.name(a).localeCompare(U.name(b)); });
    U.modal({
      title: 'Each owner’s actions', wide: true,
      sub: '<span class="mini">Everything below is already on each person’s to-do list in the app. This is for anyone who prefers it in their inbox.</span>',
      body: '<div class="owners">' + ids.map(function (pid) {
        const p = App.S.personMap[pid];
        const body = 'Hi ' + p.first + ',\n\nYour actions after the ' + titleOf(mm) + ' on ' + W.fmt(mm.date, 'long') + ':\n\n' + by[pid].join('\n') +
          '\n\nThey are all on your list in JOR Minutes & To-Do.\n\n' + App.ME.first;
        return '<div class="ow"><div class="ow-h">' + U.avatar(pid, 'sm') + '<b>' + esc(p.name) + '</b><span class="mini">' + by[pid].length + '</span>' +
          '<a class="btn sm rowend" href="mailto:' + esc(p.email || '') + '?subject=' + encodeURIComponent('Your actions — ' + titleOf(mm) + ', ' + W.fmt(mm.date, 'dm')) +
          '&body=' + encodeURIComponent(body) + '">' + U.icon('mail') + 'Email</a></div>' +
          '<pre class="ow-b">' + esc(by[pid].join('\n')) + '</pre></div>';
      }).join('') + '</div>',
      foot: '<button class="btn p" data-close>Close</button>'
    });
  };

  return { page: page, doc: doc, text: text, model: model, workbook: workbook };
})();

</script>
<script>/* assist.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the minutes assistant
   The right-hand panel of the meeting room, and the ways in:

     Record the meeting   — the app records it, saved to this computer as
                            it goes;
     Add a recording      — a voice memo from a phone, or any audio file;
     Add photos           — photos (or a scanned PDF) of handwritten notes;
     Paste notes          — rough typed notes, or a Teams transcript.

   Any mix of them. Gemini works on it in the background — the meeting can
   carry on, or the chair can go and do something else — and comes back
   with a draft: updates to the open actions, new to-dos for each person,
   decisions, notes and a summary. The chair ticks what is right and it
   goes into the minutes and onto everyone's to-do list.
   ═══════════════════════════════════════════════════════════════════════ */

window.Assist = (function () {
  'use strict';
  const BOT = (window.JOR_MIN_DATA && window.JOR_MIN_DATA.BOT) || 'O’Reilly AI';   // the assistant's name on screen (data.js)

  const App = window.App, C = window.Core, E = window.Engine, W = window.When, U = window.UI, A = window.Actions, D = window.JOR_MIN_DATA;
  const esc = C.esc;
  const jobs = {};                 // meeting id → running promise
  const kept = {};                 // meeting id → { bytes, secs } of a saved recording
  const files = {};                // meeting id → the audio file last added, kept for a retry
  const pics = {};                 // meeting id → the photos last added, kept for a retry
  let ticker = null;

  const STAGES = [
    ['preparing', 'Getting the recording ready'], ['uploading', 'Sending it to Gemini'],
    ['transcribing', BOT + ' is listening and writing the transcript'], ['reading', BOT + ' is reading the handwriting'],
    ['writing', BOT + ' is sorting it into the minutes'],
    ['ready', 'Draft ready']
  ];

  function S() { return App.S; }
  function mt(mid) { return S().meetingMap[mid]; }
  function titleOf(m) { const s0 = S().seriesMap[m.series]; return s0 ? s0.name : (m.title || 'Meeting'); }

  function setAI(mid, patch) {
    const m = mt(mid);
    if (!m) return;
    m.ai = Object.assign(m.ai || {}, patch);
    C.touch(m);
    if (App.view === 'meeting' && App.param === mid) App.render();
  }

  function mmss(s) {
    s = Math.max(0, Math.round(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  }
  function mb(b) { return (b / 1048576).toFixed(b > 10485760 ? 0 : 1) + ' MB'; }

  /* "[01:05] Iain: …" in a later part, moved on by where that part started. */
  function shiftTimes(text, by) {
    if (!by) return text;
    return String(text).replace(/^\[(\d{1,2}):(\d{2})(?::(\d{2}))?\]/gm, function (m0, a, b, c) {
      const s = (c != null ? (+a) * 3600 + (+b) * 60 + (+c) : (+a) * 60 + (+b)) + Math.round(by);
      return '[' + mmss(s) + ']';
    });
  }
  function size(b) { return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : mb(b); }

  /* What a draft was written from. Older drafts only say 'notes' or 'recording'. */
  function partsOf(ai) { return (ai && ai.parts) || [ai && ai.source === 'notes' ? 'notes' : 'recording']; }
  function fromWhat(ai) {
    const p = partsOf(ai), w = [];
    if (p.indexOf('recording') >= 0 || p.indexOf('file') >= 0) w.push('the recording');
    if (p.indexOf('photos') >= 0) w.push('the handwritten notes');
    if (p.indexOf('notes') >= 0) w.push(w.length ? 'the typed notes' : 'the notes');
    return w.length > 1 ? w.slice(0, -1).join(', ') + ' and ' + w[w.length - 1] : w[0];
  }
  function stagesFor(ai) {
    const p = partsOf(ai), audio = p.indexOf('recording') >= 0 || p.indexOf('file') >= 0;
    return STAGES.filter(function (s) {
      if (s[0] === 'ready') return false;
      if (s[0] === 'writing') return true;
      if (s[0] === 'reading') return p.indexOf('photos') >= 0;
      return audio;
    });
  }
  function canRetry(m) {
    const ai = m.ai || {}, p = partsOf(ai);
    return !!((p.indexOf('recording') >= 0 && kept[m.id]) || (p.indexOf('file') >= 0 && files[m.id]) ||
      (p.indexOf('photos') >= 0 && (ai.handwriting || pics[m.id])) || (p.indexOf('notes') >= 0 && ai.notes));
  }

  /* ══ The buttons in the meeting's top bar ══════════════════════════════ */

  function bar(m) {
    const st = window.Recorder.state();
    const mine = st && st.mid === m.id;
    let h = '';
    if (mine) {
      h += '<span class="recpill' + (st.paused ? ' paused' : '') + '"><span class="recdot"></span><b id="rec-time">' + mmss(st.secs) + '</b>' +
        '<i class="lvl"><i id="rec-lvl" style="width:' + Math.round(st.level * 100) + '%"></i></i></span>' +
        (st.paused ? '<button class="btn" data-act="as-resume">' + U.icon('play') + 'Carry on</button>' : '<button class="btn" data-act="as-pause" title="Pause for anything off the record">Pause</button>') +
        '<button class="btn" data-act="as-stop">' + U.icon('stop') + 'Stop</button>';
    } else {
      h += '<button class="btn rec" data-act="as-record" title="Record the meeting for ' + BOT + ' to write up">' + '<span class="recdot"></span>Record the meeting</button>';
    }
    h += '<button class="btn" data-act="as-add" title="A recording, photos of handwritten notes, or typed notes">' + U.icon('upload') + 'Add recording, photos or notes</button>';
    return h;
  }

  /* ══ The panel ═════════════════════════════════════════════════════════ */

  function panel(m) {
    const ai = m.ai || {};
    const st = window.Recorder.state();
    const rec = st && st.mid === m.id;
