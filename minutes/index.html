    return '<label class="f"><span>' + esc(label) + '</span>' + inner + (hint ? '<em class="fh">' + hint + '</em>' : '') + '</label>';
  }

  function selectOf(name, rows, val, attrs) {
    /* A class passed in the attributes joins "in" rather than being ignored as a second class attribute. */
    let cls = 'in';
    attrs = String(attrs || '').replace(/\s*class="([^"]*)"/, function (m, c) { cls = c.indexOf('in') === 0 ? c : 'in ' + c; return ''; });
    const opt = function (r) { return '<option value="' + esc(r.v) + '"' + (String(r.v) === String(val) ? ' selected' : '') + '>' + esc(r.t) + '</option>'; };
    return '<select class="' + cls + '" name="' + esc(name) + '" ' + attrs + '>' + rows.map(function (r) {
      return r.group ? (r.rows.length ? '<optgroup label="' + esc(r.group) + '">' + r.rows.map(opt).join('') + '</optgroup>' : '') : opt(r);
    }).join('') + '</select>';
  }

  /* Choosing someone: the people at hand first (at the meeting, in the
     series), then everyone else, then — for those who may — someone new,
     added on the spot with their initials worked out. */
  function whoOptions(first, blank, opts) {
    opts = opts || {};
    const live = S().people.filter(function (p) { return !p.gone; });
    const row = function (p) { return { v: p.id, t: p.name + ' (' + p.initials + ')' }; };
    const byName = function (a, b) { return a.name.localeCompare(b.name); };
    const top = (first || []).filter(function (id, i, a) { return id && a.indexOf(id) === i; }).map(person).filter(function (p) { return p && !p.gone; }).sort(byName);
    const rest = live.filter(function (p) { return top.indexOf(p) < 0; }).sort(byName);
    let rows = blank ? [{ v: '', t: blank }] : [];
    if (top.length && rest.length) rows = rows.concat([{ group: opts.firstLabel || 'At the meeting', rows: top.map(row) }, { group: 'Everyone else', rows: rest.map(row) }]);
    else rows = rows.concat(top.concat(rest).map(row));
    if (opts.allowNew !== false && window.Engine.canAddPeople(window.App && window.App.ME)) rows.push({ v: '__new', t: '+ Someone new…' });
    return rows;
  }

  function peopleOptions(ids, blank) {
    const list = (ids || S().people.filter(function (p) { return !p.gone; }).map(function (p) { return p.id; }))
      .map(function (id) { return person(id); }).filter(Boolean)
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
    return (blank ? [{ v: '', t: blank }] : []).concat(list.map(function (p) { return { v: p.id, t: p.name + ' (' + p.initials + ')' }; }));
  }

  function topicOptions() {
    return S().topics.map(function (t) { return { v: t.id, t: t.name }; });
  }

  /* Quick dates beside a date box: the ones people actually pick. */
  function dateChips(today, nextMeeting, attr) {
    const chips = [
      { t: 'Fri', d: W.fridayOf(today) <= today ? W.add(W.fridayOf(today), 7) : W.fridayOf(today) },
      { t: 'Next week', d: W.add(W.fridayOf(today), W.dow(today) === 0 || W.dow(today) === 6 ? 0 : 7) },
      { t: 'End of month', d: W.workBack(W.monthEnd(today)) }
    ];
    if (nextMeeting) chips.splice(2, 0, { t: 'Next meeting', d: nextMeeting });
    return '<span class="dchips">' + chips.map(function (c) {
      return '<button type="button" class="dchip" ' + (attr || 'data-date') + '="' + esc(c.d) + '" title="' + esc(W.fmt(c.d, 'long')) + '">' + esc(c.t) + '</button>';
    }).join('') + '</span>';
  }

  function copyText(text) {
    return new Promise(function (res) {
      const fallback = function () {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        ta.remove(); res(ok);
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { res(true); }, fallback);
      else fallback();
    });
  }

  function download(name, text, type) {
    const blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  return {
    esc: esc, person: person, name: name, first: first, avatar: avatar, avatars: avatars, DEPT_TINT: DEPT_TINT,
    dueChip: dueChip, flagChips: flagChips, source: source, pbar: pbar, kindPill: kindPill, topicName: topicName, whoOptions: whoOptions, tint: tint,
    micBtn: micBtn, sun: sun, icon: icon, modal: modal, close: close, isOpen: isOpen, confirm: confirm, toast: toast, clearToasts: clearToasts,
    field: field, selectOf: selectOf, peopleOptions: peopleOptions, topicOptions: topicOptions, dateChips: dateChips,
    copyText: copyText, download: download
  };
})();

<script>/* voice.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — speaking instead of typing
   Two uses of the browser's own speech recognition (Chrome and Edge; set
   to Irish English):

   dictate()  — the microphone beside any box. Talk, and the words land in
                the box. For updates typed on a phone or at a desk.
   meeting()  — the whole meeting transcribed as it happens, a sentence
                at a time, each sentence tagged with the action on screen
                when it was said. The transcript is text only; no audio is
                kept. The chair then asks for suggestions from it.

   The browser sends the sound to its speech service (Google for Chrome,
   Microsoft for Edge) to be turned into words, so it needs an internet
   connection, and it cannot tell voices apart — "I'll do it" comes back
   without a name, which is why a suggested action can arrive without an
   owner. On any Windows box, Win + H does the same dictation anywhere.
   ═══════════════════════════════════════════════════════════════════════ */

window.Voice = (function () {
  'use strict';

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const ok = !!SR;
  const LANG = 'en-IE';
  let dict = null;

  const WHY = {
    'not-allowed': 'The microphone is blocked. Allow it in the address bar (the camera/mic icon) and try again.',
    'service-not-allowed': 'This browser won’t allow speech here. Chrome or Edge on a normal (not private) window works.',
    'audio-capture': 'No microphone found.',
    'network': 'Speech needs an internet connection — the browser sends the sound to its speech service.',
    'language-not-supported': 'Irish English isn’t available here; switch to Chrome or Edge.'
  };

  function unsupported() {
    return 'Speech needs Chrome or Edge. In any other app, Windows dictation (Win + H) does the same job.';
  }

  function join(a, b) {
    a = a || ''; b = (b || '').trim();
    if (!b) return a;
    if (!a.trim()) return b[0].toUpperCase() + b.slice(1);
    return a.replace(/\s*$/, '') + (/[.!?]$/.test(a.trim()) ? ' ' + b[0].toUpperCase() + b.slice(1) : ' ' + b);
  }

  /* ══ The microphone beside a box ═══════════════════════════════════════ */

  function dictate(el, btn, onError) {
    if (!ok) { onError && onError(unsupported()); return; }
    if (dict) {
      const same = dict.el === el;
      stopDictation();
      if (same) return;
    }
    const rec = new SR();
    rec.lang = LANG; rec.interimResults = true; rec.continuous = true;
    const base = el.value;
    let fin = '';
    rec.onresult = function (e) {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) fin += (fin ? ' ' : '') + r[0].transcript.trim();
        else interim += r[0].transcript;
      }
      el.value = join(base, (fin + ' ' + interim).trim());
      el.dispatchEvent(new Event('input', { bubbles: true }));
    };
    rec.onerror = function (e) { if (e.error !== 'no-speech' && e.error !== 'aborted') onError && onError(WHY[e.error] || 'Speech stopped: ' + e.error); };
    rec.onend = function () {
      if (btn) btn.classList.remove('on');
      if (dict && dict.rec === rec) dict = null;
      el.dispatchEvent(new Event('change', { bubbles: true }));
    };
    try { rec.start(); } catch (e) { onError && onError('Could not start the microphone.'); return; }
    if (btn) btn.classList.add('on');
    dict = { rec: rec, el: el, btn: btn };
  }

  function stopDictation() {
    if (!dict) return;
    try { dict.rec.stop(); } catch (e) { }
    if (dict.btn) dict.btn.classList.remove('on');
    dict = null;
  }

  /* ══ The whole meeting ═════════════════════════════════════════════════
     The browser ends a recognition session after a pause; while we are
     meant to be listening it is simply started again.                    */

  function meeting(o) {
    if (!ok) { o.onState('unsupported', unsupported()); return null; }
    let active = true, rec = null, restarts = 0;
    function begin() {
      rec = new SR();
      rec.lang = LANG; rec.interimResults = true; rec.continuous = true;
      rec.onresult = function (e) {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (r.isFinal) { const t = r[0].transcript.trim(); if (t) o.onLine(t); }
          else interim += r[0].transcript;
        }
        o.onInterim(interim.trim());
      };
      rec.onerror = function (e) {
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') {
          active = false; o.onState('denied', WHY[e.error]);
        } else o.onState('warn', WHY[e.error] || e.error);
      };
      rec.onend = function () {
        if (!active) { o.onState('stopped'); return; }
        restarts++;
        setTimeout(function () { if (active) { try { begin(); } catch (e) { o.onState('warn', 'Reconnecting…'); } } }, restarts > 20 ? 1500 : 150);
      };
      rec.start();
    }
    try { begin(); o.onState('listening'); }
    catch (e) { o.onState('denied', 'Could not start the microphone.'); return null; }
    return { stop: function () { active = false; try { rec.stop(); } catch (e) { } o.onInterim(''); } };
  }

  return { ok: ok, dictate: dictate, stopDictation: stopDictation, meeting: meeting, unsupported: unsupported };
})();

</script>
<script>/* gemini.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — Gemini
   Three jobs, done in the background while the meeting carries on:

   1. transcribe()  a recording of the meeting → who said what, with times.
      readNotes()   photos of handwritten notes → the words on each page.
   2. draft()       a transcript, handwritten or typed notes → the minutes sorted
                    under the headings the office already uses (Action
                    Point, Task, Completion %, Update, Completion Date,
                    Assigned To): updates to the actions already open,
                    new to-dos for each person, decisions, notes, and a
                    short summary.

   Nothing Gemini returns goes into the minutes by itself. It comes back
   as a draft; the person taking the minutes ticks what is right.

   Where the key lives: once the Google Apps Script server is connected,
   every call goes through it and the key never reaches a browser. Before
   that, the key is pasted in Settings → Gemini and kept on that computer
   only (localStorage), never in this file.

   Data: Google's terms give users in the EEA and the UK the paid-service
   protections even on the free tier — prompts and recordings are not used
   to improve Google's products. (ai.google.dev/gemini-api/terms)
   ═══════════════════════════════════════════════════════════════════════ */

window.Gemini = (function () {
  'use strict';
  const BOT = (window.JOR_MIN_DATA && window.JOR_MIN_DATA.BOT) || 'O’Reilly AI';   // the assistant's name on screen (data.js)

  const LS = 'jor.minutes.ai';
  const GOOGLE = 'https://generativelanguage.googleapis.com';
  const INLINE_MAX = 14 * 1024 * 1024;    // base64 grows by a third; the whole request must stay under 20 MB
  /* Only used until the key's own list of models has been read. Google
     retires models, so the newest Flash the key can use is looked up,
     and looked up again when a model is retired. */
  const FALLBACK_MODEL = 'gemini-3.8-flash';

  function cfg() {
    try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; }
  }
  function setCfg(patch) {
    const c = Object.assign(cfg(), patch);
    try { localStorage.setItem(LS, JSON.stringify(c)); } catch (e) { }
    return c;
  }
  function viaServer() { return !!(window.Server && window.Server.connected()); }
  function ready() { return viaServer() || !!cfg().key; }
  function model() { const c = cfg(); return c.model || c.auto || FALLBACK_MODEL; }
  function base() { return cfg().base || GOOGLE; }

  /* ══ Talking to the API ════════════════════════════════════════════════ */

  function friendly(status, body, tries) {
    const msg = (body && body.error && body.error.message) || '';
    const e = new Error(
      busy(status, body) ? 'Google’s AI is very busy just now' + (tries > 1 ? ' (' + tries + ' models tried)' : '') + '. Nothing is lost — try again in a few minutes.' :
      status === 400 && /api key/i.test(msg) ? 'Gemini didn’t accept the key. Check it in Settings → ' + BOT + '.' :
      status === 400 && /schema|response_schema|responseSchema/i.test(msg) ? 'schema' :
      status === 403 ? 'This key isn’t allowed to use Gemini (check it has the Generative Language API enabled).' :
      status === 404 || /no longer available|not found|deprecated|retired/i.test(msg) ? 'Google has retired the model “' + model() + '”. Pick another in Settings → ' + BOT + '.' :
      status === 413 ? 'That’s too big to send in one go.' :
      status === 429 ? 'Gemini’s free allowance is used up for the moment. Try again in a minute or two.' :
      status >= 500 ? 'Gemini is having trouble at the moment (' + status + '). Try again shortly.' :
      'Gemini said: ' + (msg || 'error ' + status));
    e.status = status; e.schema = e.message === 'schema';
    return e;
  }

  function retired(status, j) {
    const msg = String((j && j.error && j.error.message) || '');
    return status === 404 || ((status === 400 || status === 403) && /no longer available|not found|not supported|deprecated|retired/i.test(msg));
  }

  /* Google is overloaded ("high demand"), or this model's allowance is used up for now. */
  function busy(status, j) {
    const msg = String((j && j.error && j.error.message) || '');
    return status === 503 || status === 429 || (status >= 500 && /overload|high demand|unavailable|try again/i.test(msg)) || /overloaded|high demand/i.test(msg);
  }

  /* The next model to try: older Flash models first (steadier, less asked
     for), then newer ones; never one already tried or retired. */
  function nextModel(list, current, tried) {
    const free = function (n) { return tried.indexOf(n) < 0 && (cfg().retired || []).indexOf(n) < 0; };
    const at = list.indexOf(current);
    const older = at >= 0 ? list.slice(at + 1) : list.slice();
    const newer = at >= 0 ? list.slice(0, at).reverse() : [];
    return older.concat(newer).filter(free)[0] || null;
  }

  async function post(path, body) {
    if (viaServer()) return window.Server.gemini(path, body);             // the server chooses the model itself
    const c = cfg();
    if (!c.key) throw new Error('Add a Gemini key in Settings → ' + BOT + ' first.');
    const gen = /\/models\/[^:\/]+:/.test(path);
    let name = gen ? path.match(/\/models\/([^:\/]+):/)[1] : '';
    /* Nothing chosen yet: the steady Flash, one behind the newest. */
    if (gen && !c.model && !c.auto) {
      const m0 = await models().catch(function () { return null; });
      if (m0 && m0.best) { setCfg({ auto: m0.best }); name = m0.best; }
    }
    const tried = [];
    let list = null, again = false, last = null;
    for (let i = 0; i < 6; i++) {
      const p = gen ? path.replace(/\/models\/[^:\/]+:/, '/models/' + name + ':') : path;
      let res;
      try {
        res = await fetch(base() + p, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': c.key }, body: JSON.stringify(body)
        });
      } catch (e) { throw new Error('Couldn’t reach Gemini — is this computer online?'); }
      const j = await res.json().catch(function () { return {}; });
      if (res.ok) {
        if (gen && !cfg().model && cfg().auto !== name) setCfg({ auto: name });     // remember the one that answered
        return j;
      }
      last = { status: res.status, j: j, tried: tried.length + 1 };
      if (!gen) break;
      const ret = retired(res.status, j), bz = !ret && busy(res.status, j);
      if (!ret && !bz) break;
      /* Busy: a moment's pause and once more, before trying another model. */
      if (bz && !again) { again = true; await new Promise(function (r) { setTimeout(r, 2500); }); continue; }
      tried.push(name);
      if (ret) { const cc = cfg(); setCfg({ retired: (cc.retired || []).concat([name]), model: cc.model === name ? '' : cc.model, auto: cc.auto === name ? '' : cc.auto }); }
      if (!list) { const m = await models().catch(function () { return null; }); list = m ? m.flash : []; }
      const next = nextModel(list, name, tried);
      if (!next) break;
      name = next;
    }
    throw friendly(last.status, last.j, last.tried);
  }

  function textOf(j) {
    const c = j && j.candidates && j.candidates[0];
    if (!c) {
      const why = j && j.promptFeedback && j.promptFeedback.blockReason;
      throw new Error(why ? 'Gemini refused this (' + why + ').' : 'Gemini sent nothing back.');
    }
    const t = ((c.content && c.content.parts) || []).map(function (p) { return p.text || ''; }).join('');
    if (!t && c.finishReason && c.finishReason !== 'STOP') throw new Error('Gemini stopped early (' + c.finishReason + ').');
    return t;
  }

  /* Which models this key can use, newest Flash first. */
  async function models() {
    let names;
    if (viaServer()) names = await window.Server.geminiModels();
    else {
      const c = cfg();
      if (!c.key) throw new Error('Paste the key first.');
      let res;
      try { res = await fetch(base() + '/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': c.key } }); }
      catch (e) { throw new Error('Couldn’t reach Gemini — is this computer online?'); }
      const j = await res.json().catch(function () { return {}; });
      if (!res.ok) throw friendly(res.status, j);
      names = (j.models || []).filter(function (m) {
        return (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0;
      }).map(function (m) { return String(m.name).replace(/^models\//, ''); });
    }
    const ver = function (n) { const m = n.match(/gemini-(\d+(?:\.\d+)?)/); return m ? +m[1] : 0; };
    /* Released Flash models only (no previews, "lite" or experiments), newest first, less any Google has retired. */
    const gone = cfg().retired || [];
    const flash = names.filter(function (n) { return /^gemini-[\d.]+-flash$/.test(n) && gone.indexOf(n) < 0; }).sort(function (a, b) { return ver(b) - ver(a); });
    const others = names.filter(function (n) { return /^gemini-/.test(n) && flash.indexOf(n) < 0 && !/(tts|image|embedding|live|audio-dialog|native)/.test(n); });
    /* The best choice is one step behind the newest: just as good for minutes, and
       not the one everyone is using this month, so far less often "in high demand". */
    return { best: flash[1] || flash[0] || others[0] || FALLBACK_MODEL, flash: flash, all: flash.concat(others) };
  }

  /* ══ Getting the sound to Gemini ═══════════════════════════════════════ */

  function mimeOf(blob, name) {
    let t = String(blob.type || '').split(';')[0].toLowerCase();
    const ext = String(name || '').toLowerCase().split('.').pop();
    const byExt = { m4a: 'audio/m4a', mp3: 'audio/mp3', wav: 'audio/wav', webm: 'audio/webm', ogg: 'audio/ogg', opus: 'audio/opus',
      aac: 'audio/aac', flac: 'audio/flac', aiff: 'audio/aiff', aif: 'audio/aiff', mp4: 'audio/m4a' };
    if (!t || t === 'application/octet-stream') t = byExt[ext] || 'audio/webm';
    if (t === 'audio/x-m4a' || t === 'audio/mp4' || t === 'video/mp4') t = 'audio/m4a';
    if (t === 'audio/mpeg') t = 'audio/mp3';
    if (t === 'audio/x-wav' || t === 'audio/wave') t = 'audio/wav';
    if (t === 'video/webm') t = 'audio/webm';
    return t;
  }

  function b64(blob) {
    return new Promise(function (res, rej) {
      const r = new FileReader();
      r.onload = function () { res(String(r.result).replace(/^data:[^,]*,/, '')); };
      r.onerror = function () { rej(new Error('Couldn’t read the file on this computer.')); };
      r.readAsDataURL(blob);
    });
  }

  /* Big recordings (and big piles of photos) go up through the Files API
     first; Gemini keeps them 48 hours and then deletes them. */
  async function upload(blob, mime, onStage) {
    if (viaServer()) return window.Server.geminiUpload(blob, mime, onStage);
    const c = cfg();
    onStage && onStage('uploading');
    let res;
    try {
      res = await fetch(base() + '/upload/v1beta/files', {
        method: 'POST',
        headers: { 'x-goog-api-key': c.key, 'X-Goog-Upload-Protocol': 'resumable', 'X-Goog-Upload-Command': 'start',
          'X-Goog-Upload-Header-Content-Length': String(blob.size), 'X-Goog-Upload-Header-Content-Type': mime, 'Content-Type': 'application/json' },
        body: JSON.stringify({ file: { display_name: 'JOR meeting ' + new Date().toISOString().slice(0, 16) } })
      });
    } catch (e) { throw new Error('Couldn’t reach Gemini to send it.'); }
    if (!res.ok) throw friendly(res.status, await res.json().catch(function () { return {}; }));
    const url = res.headers.get('x-goog-upload-url');
    if (!url) throw new Error(/^audio/.test(mime)
      ? 'The recording is over 14 MB, and this browser can’t upload that size to Gemini directly. Connect the server (Settings → Server), or record at the meeting in the app, which keeps files small.'
      : 'The photos come to over 14 MB, and this browser can’t upload that much to Gemini directly. Connect the server (Settings → Server), or send fewer pages at a time.');
    const up = await fetch(url, { method: 'POST', headers: { 'X-Goog-Upload-Offset': '0', 'X-Goog-Upload-Command': 'upload, finalize' }, body: blob });
    const uj = await up.json().catch(function () { return {}; });
    if (!up.ok) throw friendly(up.status, uj);
    let file = uj.file || uj;
    for (let i = 0; i < 90 && file.state && file.state !== 'ACTIVE'; i++) {
      if (file.state === 'FAILED') throw new Error('Gemini couldn’t open that file.');
      await new Promise(function (r) { setTimeout(r, 2000); });
      const g = await fetch(base() + '/v1beta/' + file.name, { headers: { 'x-goog-api-key': c.key } });
      file = await g.json();
    }
    return { fileData: { mimeType: mime, fileUri: file.uri } };
  }

  /* ══ 1. The transcript ═════════════════════════════════════════════════ */

  function peopleLines(ctx) {
    return ctx.people.map(function (p) {
      return '- ' + p.initials + ' — ' + p.name + (p.role ? ' (' + p.role + ')' : '') + ((p.says || []).length ? '; may sound like ' + p.says.join(', ') : '');
    }).join('\n');
  }

  /* The prompts are kept apart from the calls, so the server sends the
     same ones for a meeting emailed in. */
  function transcribePrompt(ctx) {
    return 'Transcribe this recording of a JOR Ireland meeting word for word, in Irish/British English. JOR Ireland is a destination ' +
      'management company in Cork that runs tours, incentives and conferences in Ireland for overseas travel agents.\n\n' +
      'The people who may speak or be mentioned:\n' + peopleLines(ctx) + '\n\n' +
      'Write a new line every time the speaker changes, like this:\n[mm:ss] Name: what they said\n\n' +
      'Use the person\'s full name, as written above, only when it is clear who is speaking (people often address each other by name). ' +
      'Otherwise write Speaker 1, Speaker 2 and so on, consistently — the same voice is always the same Speaker number. ' +
      'Spell names, companies and places the way they are written above. ' +
      'Do not summarise, tidy up or leave anything out. Write [inaudible] for anything you cannot make out.';
  }

  async function transcribe(blob, ctx, onStage) {
    const mime = mimeOf(blob, blob.name);
    let part;
    if (blob.size <= INLINE_MAX) {
      onStage && onStage('preparing');
      part = { inlineData: { mimeType: mime, data: await b64(blob) } };
    } else part = await upload(blob, mime, onStage);
    onStage && onStage('transcribing');
    const j = await post('/v1beta/models/' + model() + ':generateContent', {
      contents: [{ role: 'user', parts: [{ text: transcribePrompt(ctx) }, part] }],
      generationConfig: { temperature: 0.1, maxOutputTokens: 65536 }
    });
    return textOf(j).trim();
  }

  /* The transcript as lines the meeting can keep: seconds, speaker, words. */
  function lines(text) {
    const out = [];
    String(text || '').split(/\r?\n/).forEach(function (ln) {
      ln = ln.trim();
      if (!ln) return;
      const m = ln.match(/^\[?(\d{1,2}):(\d{2})(?::(\d{2}))?\]?\s*(.*)$/);
      if (m) {
        const s = m[3] != null ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) : (+m[1]) * 60 + (+m[2]);
        out.push({ s: s, t: m[4], at: null });
      } else if (out.length) out[out.length - 1].t += ' ' + ln;
      else out.push({ s: 0, t: ln, at: null });
    });
    return out;
  }

  /* ══ 1b. Handwritten notes, from photos ════════════════════════════════ */

  /* Phone photos are 3–5 MB each. Shrunk to 2400 px on the long side they
     are still sharp enough to read and a fraction of the size, and the
     phone's rotation is applied. HEIC (iPhone) and scanned PDFs can't be
     drawn in most browsers, so they go as they are — Gemini reads both. */
  const PAGE_MAX = 2400;

  function pageMime(file) {
    const t = String(file.type || '').toLowerCase();
    const ext = String(file.name || '').toLowerCase().split('.').pop();
    if (t === 'application/pdf' || ext === 'pdf') return 'application/pdf';
    if (/heic/.test(t) || ext === 'heic') return 'image/heic';
    if (/heif/.test(t) || ext === 'heif') return 'image/heif';
    if (/^image\/(jpeg|jpg|png|webp)$/.test(t)) return t === 'image/jpg' ? 'image/jpeg' : t;
    return ({ jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp' })[ext] || '';
  }

  async function prepPage(file) {
    const mime = pageMime(file);
    if (!mime) throw new Error('“' + file.name + '” isn’t a photo or a PDF.');
    if (!/^image\/(jpeg|png|webp)$/.test(mime) || typeof createImageBitmap === 'undefined') return { blob: file, mime: mime };
    try {
      const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
      const k = Math.min(1, PAGE_MAX / Math.max(bmp.width, bmp.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
      const g = cv.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);        // a see-through PNG reads as white paper
      g.drawImage(bmp, 0, 0, cv.width, cv.height);
      if (bmp.close) bmp.close();
      const blob = await new Promise(function (r) { cv.toBlob(r, 'image/jpeg', 0.85); });
      return blob && blob.size < file.size ? { blob: blob, mime: 'image/jpeg' } : { blob: file, mime: mime };
    } catch (e) { return { blob: file, mime: mime }; }
  }

  async function readNotes(files, ctx, onStage) {
    onStage && onStage('reading');
    const pages = [];
    for (let i = 0; i < files.length; i++) pages.push(await prepPage(files[i]));
    const total = pages.reduce(function (a, p) { return a + p.blob.size; }, 0);
    const parts = [];
    for (let i = 0; i < pages.length; i++) {
      parts.push({ text: 'Page ' + (i + 1) + ':' });
      parts.push(total <= INLINE_MAX ? { inlineData: { mimeType: pages[i].mime, data: await b64(pages[i].blob) } }
        : await upload(pages[i].blob, pages[i].mime, null));
    }
    const j = await post('/v1beta/models/' + model() + ':generateContent', {
      contents: [{ role: 'user', parts: [{ text: readPrompt(ctx) }].concat(parts) }],
      generationConfig: { temperature: 0.1, maxOutputTokens: 32768 }
    });
    return textOf(j).trim();
  }

  function readPrompt(ctx) {
    const heads = ctx.open.slice(0, 80).map(function (it) { return it.title; }).join('; ');
    return 'These are photos of handwritten notes taken at a JOR Ireland meeting (' + ctx.title + ', ' + window.When.fmt(ctx.date, 'long') + '), ' +
      'in page order. JOR Ireland is a destination management company in Cork that runs tours, incentives and conferences in Ireland ' +
      'for overseas travel agents.\n\n' +
      'Write out exactly what is written, page by page, in reading order.\n\n' +
      'The people the notes may mention. Handwritten notes often use their initials:\n' + peopleLines(ctx) + '\n\n' +
      (heads ? 'Headings of actions already open, which may appear in the notes: ' + heads + '\n\n' : '') +
      'Rules:\n' +
      '- Start each page with a line: --- Page N ---\n' +
      '- One line for each written line. Keep bullets, dashes, arrows (→), ticks (✓), numbers, amounts and dates exactly as written.\n' +
      '- Keep initials and abbreviations as written; do not expand them.\n' +
      '- Leave out anything crossed out.\n' +
      '- Write [?] for a word you cannot read. If you are unsure between two readings, write the likelier one followed by [?].\n' +
      '- Read pages that are sideways or upside down as well.\n' +
      '- Write nothing else: no commentary, no summary, no headings of your own.';
  }

  /* ══ 2. The minutes, under the office's own headings ═══════════════════ */

  const SCHEMA = {
    type: 'OBJECT',
    properties: {
      summary: { type: 'STRING' },
      updates: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
        ref: { type: 'STRING' }, update: { type: 'STRING' }, completion: { type: 'INTEGER' },
        status: { type: 'STRING', enum: ['open', 'done', 'waiting', 'dropped'] },
        newDate: { type: 'STRING' }, dateReason: { type: 'STRING' }, waitingOn: { type: 'STRING' },
        owner: { type: 'STRING' }, evidence: { type: 'STRING' }
      }, required: ['ref', 'update', 'status'] } },
      actions: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
        actionPoint: { type: 'STRING' }, task: { type: 'STRING' }, owner: { type: 'STRING' },
        helpers: { type: 'ARRAY', items: { type: 'STRING' } }, due: { type: 'STRING' },
        completion: { type: 'INTEGER' }, update: { type: 'STRING' }, evidence: { type: 'STRING' },
        ongoing: { type: 'BOOLEAN' }, priority: { type: 'BOOLEAN' }, discussNext: { type: 'BOOLEAN' }
      }, required: ['actionPoint', 'task', 'owner', 'due'] } },
      decisions: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
        text: { type: 'STRING' }, actionPoint: { type: 'STRING' }, evidence: { type: 'STRING' }
      }, required: ['text'] } },
      notes: { type: 'ARRAY', items: { type: 'OBJECT', properties: { text: { type: 'STRING' } }, required: ['text'] } },
      discuss: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
        text: { type: 'STRING' }, owner: { type: 'STRING' }, evidence: { type: 'STRING' }
      }, required: ['text'] } },
      nextMeeting: { type: 'STRING' }
    },
    required: ['summary', 'updates', 'actions', 'decisions', 'notes']
  };

  function prompt(input, ctx) {
    const W = window.When;
    const open = ctx.open.map(function (it) {
      return '- ' + it.ref + ' | Action Point: ' + it.title + ' | Task: ' + (it.detail || '—') + ' | Assigned To: ' + (it.owner || '—') +
        ' | Completion Date: ' + (it.due || (it.ongoing ? 'Ongoing' : '—')) + ' | Completion %: ' + it.progress +
        (it.last ? ' | Last update: ' + it.last : '');
    }).join('\n');
    const src = [];
    if (input.transcript) src.push('TRANSCRIPT OF THE RECORDING:\n' + input.transcript);
    if (input.handwriting) src.push('HANDWRITTEN NOTES, as read from photos of the pages ([?] marks a word that could not be read; do not guess what it was):\n' + input.handwriting);
    if (input.notes) src.push('NOTES:\n' + input.notes);
    const what = [input.transcript ? 'transcript' : '', input.handwriting ? 'handwritten notes' : '', input.notes ? 'notes' : '']
      .filter(Boolean).join(' and ') || 'notes';
    return 'You are taking the minutes of a JOR Ireland meeting. JOR Ireland is a destination management company in Cork ' +
      '(tours, incentives and conferences in Ireland for overseas travel agents).\n\n' +
      'Meeting: ' + ctx.title + ', ' + W.fmt(ctx.date, 'long') + ' (' + ctx.date + '). The next meeting is on ' + ctx.next + '.\n\n' +
      'The team. Use these initials, exactly, whenever you name who does something:\n' + peopleLines(ctx) + '\n\n' +
      'Actions already open on the minutes. When one of these is discussed, give an update to it by its ref — do not create a new action for it:\n' +
      (open || '(none)') + '\n\n' +
      'The minutes sheet has these headings: Action Point (a short heading, a few words), Task (what has to be done), ' +
      'Completion % (0, 25, 50, 75 or 100), Update (what was said about it, one or two plain sentences), ' +
      'Completion Date (YYYY-MM-DD), Assigned To (initials).\n\n' +
      'From the ' + what + ' below, give:\n' +
      '1. updates — for every open action above that was discussed: its ref, the update, completion %, status (open, done, waiting or dropped), ' +
      'newDate only if a new date was agreed, dateReason if the date moved (one of: ' + ctx.reasons.join('; ') + '), waitingOn if it is waiting on someone, ' +
      'owner only if it was handed to someone else.\n' +
      '2. actions — every new to-do that was agreed: actionPoint, task, owner (initials; if someone said "I\'ll do it", that person; ' +
      'leave it empty only if truly nobody took it), helpers (initials), due (turn "Friday", "next week", "end of the month", ' +
      '"before the next meeting" into a date counting from ' + ctx.date + '; if no date was said, use ' + ctx.next + '), ' +
      'completion (0 unless it was said to be under way), update (anything said about progress), ' +
      'ongoing (true for work with no end date that is looked at every meeting; then due is empty), ' +
      'priority (true if it is marked a priority, urgent, or listed as a priority for the next meeting), ' +
      'discussNext (true if it is to come back to the next meeting: "to discuss", "full discussion next week", "priority for next week").\n' +
      '   A list of projects (current, ongoing, or for later): each project is an action with ongoing true. actionPoint is the project, ' +
      'task what has to happen next (or the project itself if nothing more is said), update its status as written, owner the team member ' +
      'named against it, or the chair (' + (ctx.chair || 'the chair') + ') if nobody is. A project on a list for later, not started, still ' +
      'comes across, with an update saying it is not started. Someone outside the team (a supplier, a developer) is never the owner: ' +
      'the owner is the team member who has to do something.\n' +
      '3. decisions — anything agreed as a rule, a price, a choice or a policy, one sentence each.\n' +
      '4. notes — anything worth recording that is neither an action nor a decision.\n' +
      '5. summary — the meeting in three to five plain sentences.\n' +
      '6. nextMeeting — the date of the next meeting if one was set, as YYYY-MM-DD, otherwise empty.\n' +
      '7. discuss — each point put off to the next meeting that is not already an action or an update above ' +
      '(a proposal "to discuss", "full discussion next week with a plan"), one short line each, with owner (initials) if someone is to lead it.\n\n' +
      'Rules: Irish/British English. Nothing that is not in the ' + what + '. Keep each item short and specific. For each update, action and ' +
      'decision, evidence is a short quote (under 20 words) of what was said or written.\n\n' +
      src.join('\n\n');
  }

  function parseJSON(t) {
    t = String(t || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
    try { return JSON.parse(t); } catch (e) {
      const a = t.indexOf('{'), b = t.lastIndexOf('}');
      if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e2) { } }
      throw new Error('Gemini’s answer wasn’t in the expected shape. Try again.');
    }
  }

  async function draft(input, ctx, onStage) {
    onStage && onStage('writing');
    const body = {
      contents: [{ role: 'user', parts: [{ text: prompt(input, ctx) }] }],
      generationConfig: { temperature: 0.2, responseMimeType: 'application/json', responseSchema: SCHEMA, maxOutputTokens: 32768 }
    };
    let j;
    try { j = await post('/v1beta/models/' + model() + ':generateContent', body); }
    catch (e) {
      if (!e.schema) throw e;
      delete body.generationConfig.responseSchema;          // an older or newer API that wants the schema another way
      j = await post('/v1beta/models/' + model() + ':generateContent', body);
    }
    return tidy(parseJSON(textOf(j)), ctx);
  }

  /* Check everything that came back against what the app knows: refs that
     exist, owners who are real people, dates that are dates. */
  function tidy(d, ctx) {
    const E = window.Engine, W = window.When, S = ctx.S;
    const valid = function (x) { return W.valid(String(x || '').slice(0, 10)) ? String(x).slice(0, 10) : null; };
    const who = function (x) {
      if (!x) return null;
      const p = E.findPerson(S, String(x).replace(/[()]/g, '').trim(), ctx.present);
      return p ? p.id : null;
    };
    const pct = function (n) { n = +n || 0; return n >= 100 ? 100 : Math.max(0, Math.min(75, Math.round(n / 25) * 25)); };
    const refs = {};
    ctx.open.forEach(function (it) { refs[it.ref] = it.id; });
    /* A "new" to-do that is really one already open, under the same heading
       and either the same task or the same person. It is kept back, unticked,
       so the review can turn it into an update instead of a second copy. */
    const sim = window.Importer && window.Importer.similar;
    const bare = function (x) { return String(x || '').replace(/['’]/g, ''); };
    const already = function (ap, task, pid) {
      if (!sim) return null;
      const ini = pid && S.personMap[pid] ? S.personMap[pid].initials : '';
      return ctx.open.find(function (o) {
        return sim(bare(o.title), bare(ap)) >= 0.6 && (sim(bare(o.detail), bare(task)) >= 0.35 || (ini && o.owner === ini));
      }) || null;
    };
    const out = { summary: String(d.summary || '').trim(), updates: [], actions: [], decisions: [], notes: [], discuss: [], nextMeeting: valid(d.nextMeeting) };
    (d.updates || []).forEach(function (u) {
      const id = refs[String(u.ref || '').trim().toUpperCase()];
      if (!id) return;
      out.updates.push({ id: id, ref: u.ref, update: String(u.update || '').trim(), completion: pct(u.completion),
        status: ['open', 'done', 'waiting', 'dropped'].indexOf(u.status) >= 0 ? u.status : 'open',
        newDate: valid(u.newDate), dateReason: ctx.reasons.indexOf(u.dateReason) >= 0 ? u.dateReason : (u.dateReason || ''),
        waitingOn: String(u.waitingOn || '').trim(), owner: who(u.owner), evidence: String(u.evidence || '').trim(), keep: true });
    });
    (d.actions || []).forEach(function (a) {
      const task = String(a.task || '').trim();
      if (!task) return;
      const ap = String(a.actionPoint || task).trim(), owner = who(a.owner);
      const dup = already(ap, task, owner);
      const ongoing = a.ongoing === true && !valid(a.due);
      out.actions.push({ actionPoint: ap, task: task, owner: owner,
        ownerSaid: String(a.owner || '').trim(), helpers: (a.helpers || []).map(who).filter(Boolean),
        due: ongoing ? null : valid(a.due) || ctx.next, dueSaid: !!valid(a.due), ongoing: ongoing,
        priority: a.priority === true, discussNext: a.discussNext === true,
        completion: pct(a.completion), update: String(a.update || '').trim(),
        evidence: String(a.evidence || '').trim(), dup: dup ? dup.id : null, keep: !dup });
    });
    (d.decisions || []).forEach(function (x) { if (x.text) out.decisions.push({ text: String(x.text).trim(), actionPoint: x.actionPoint || '', evidence: x.evidence || '', keep: true }); });
    (d.notes || []).forEach(function (x) { if (x.text) out.notes.push({ text: String(x.text).trim(), keep: true }); });
    (d.discuss || []).forEach(function (x) {
      const t = String(x.text || '').trim();
      if (t) out.discuss.push({ text: t, owner: who(x.owner), evidence: String(x.evidence || '').trim(), keep: true });
    });
    return out;
  }

  /* What Gemini is told about a meeting: who's there, who's on the team,
     and the actions still open that it may be updating. The app and the
     server (for a meeting emailed in) build it the same way. */
  function contextFor(S, m, today) {
    const E = window.Engine, D = window.JOR_MIN_DATA;
    const open = S.items.filter(function (it) {
      return it.kind === 'action' && !it.private && E.isOpen(it) && (it.series === m.series || (m.present || []).indexOf(it.owner) >= 0) && it.meeting !== m.id;
    }).map(function (it) {
      const lu = E.lastUpdate(it);
      return { id: it.id, ref: it.ref, title: it.title, detail: it.detail, owner: it.owner && S.personMap[it.owner] ? S.personMap[it.owner].initials : '',
        due: it.due, ongoing: it.ongoing, progress: it.progress, last: lu ? lu.t : '' };
    });
    const s0 = S.seriesMap[m.series];
    return { S: S, title: s0 ? s0.name : (m.title || 'Meeting'), date: m.date || today, next: E.nextAfter(S, m),
      people: S.people.filter(function (p) { return !p.gone; }), present: m.present || [],
      chair: m.chair && S.personMap[m.chair] ? S.personMap[m.chair].initials : '',
      open: open, reasons: D.SLIP.map(function (r) { return r.t; }) };
  }

  return { cfg: cfg, setCfg: setCfg, ready: ready, viaServer: viaServer, model: model, models: models,
    transcribe: transcribe, lines: lines, readNotes: readNotes, pageMime: pageMime, draft: draft, prompt: prompt, SCHEMA: SCHEMA, mimeOf: mimeOf, INLINE_MAX: INLINE_MAX,
    transcribePrompt: transcribePrompt, readPrompt: readPrompt, tidy: tidy, parseJSON: parseJSON, contextFor: contextFor };
})();

</script>
<script>/* recorder.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — recording the meeting
   Records from the microphone in speech-quality pieces (mono Opus at
   24 kbps — about 11 MB an hour) and writes each piece to this computer's
   IndexedDB every 5 seconds, so a crash, a closed tab or a flat battery
   loses at most the last few seconds. What was recorded is there when the
   meeting is opened again, and more can be recorded on after it.

   Each start of the microphone is its own part ("session"): a recording
   file can't simply be glued onto another, so the parts are kept apart
   and written up one after the other.

   While recording, the screen is kept awake (where the browser allows it),
   closing the page asks first, and the browser is asked not to clear what
   is stored. The sound never leaves this computer until someone presses
   "Write the minutes", and can be deleted from the meeting at any time.
   ═══════════════════════════════════════════════════════════════════════ */

window.Recorder = (function () {
  'use strict';

  const DB = 'jor-minutes-audio', STORE = 'chunks';
  const PIECE_MS = 5000;
  const supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  let cur = null;          // the recording in progress
  let wake = null;         // the screen wake lock, while recording
  let persisted = null;    // whether the browser agreed to keep what's stored

  /* ══ IndexedDB ═════════════════════════════════════════════════════════ */

  function open() {
    return new Promise(function (res, rej) {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () {
        const s = r.result.createObjectStore(STORE, { keyPath: ['mid', 'seq'] });
        s.createIndex('mid', 'mid');
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  async function put(row) {
    const db = await open();
    return new Promise(function (res, rej) {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(row);
      tx.oncomplete = function () { db.close(); res(); };
      tx.onerror = function () { db.close(); rej(tx.error); };
      tx.onabort = function () { db.close(); rej(tx.error || new Error('aborted')); };
    });
  }
  async function all(mid) {
    const db = await open();
    return new Promise(function (res, rej) {
      const tx = db.transaction(STORE, 'readonly');
      const q = tx.objectStore(STORE).index('mid').getAll(mid);
      q.onsuccess = function () { db.close(); res((q.result || []).sort(function (a, b) { return a.seq - b.seq; })); };
      q.onerror = function () { db.close(); rej(q.error); };
    });
  }
  async function clear(mid) {
    const rows = await all(mid);
    const db = await open();
    return new Promise(function (res) {
      const tx = db.transaction(STORE, 'readwrite');
      rows.forEach(function (r) { tx.objectStore(STORE).delete([r.mid, r.seq]); });
      tx.oncomplete = function () { db.close(); res(); };
      tx.onerror = function () { db.close(); res(); };
    });
  }

  /* The parts of a meeting's recording, each a whole file of its own. Pieces
     saved before parts were kept apart all count as one part. */
  async function segments(mid) {
    const rows = await all(mid);
    const out = [], by = {};
    rows.forEach(function (r) {
      const k = r.sess || 'one';
      if (!by[k]) { by[k] = { sess: k, rows: [], secs: 0, bytes: 0, mime: r.mime }; out.push(by[k]); }
      by[k].rows.push(r); by[k].secs += r.secs || 0; by[k].bytes += r.blob.size;
    });
    return out.map(function (g, i) {
      const b = new Blob(g.rows.map(function (r) { return r.blob; }), { type: g.mime });
      b.name = 'meeting' + (out.length > 1 ? '-part' + (i + 1) : '') + '.' + (/mp4/.test(g.mime) ? 'm4a' : 'webm');
      return { blob: b, secs: Math.round(g.secs), bytes: g.bytes, mime: g.mime };
    });
  }

  /* What is kept for a meeting: size, length and how many parts. */
  async function saved(mid) {
    try {
      const rows = await all(mid);
      if (!rows.length) return null;
      const bytes = rows.reduce(function (a, r) { return a + r.blob.size; }, 0);
      const secs = Math.round(rows.reduce(function (a, r) { return a + (r.secs || 0); }, 0));
      const sessions = {};
      rows.forEach(function (r) { sessions[r.sess || 'one'] = true; });
      return { bytes: bytes, secs: secs, mime: rows[0].mime, parts: rows.length, seq: rows[rows.length - 1].seq + 1, sessions: Object.keys(sessions).length };
    } catch (e) { return null; }
  }
  /* One part: the whole recording. More: the first, for anything that
     wants a single file; the write-up uses segments(). */
  async function blob(mid) {
    const s = await segments(mid);
    return s.length ? s[0].blob : null;
  }

  /* ══ Staying awake, and not being closed by accident ═══════════════════ */

  async function keepAwake() {
    if (!('wakeLock' in navigator) || document.hidden || wake) return;
    try {
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', function () { wake = null; });
    } catch (e) { wake = null; }
  }
  function letSleep() { if (wake) { try { wake.release(); } catch (e) { } wake = null; } }
  document.addEventListener('visibilitychange', function () { if (cur && !document.hidden) keepAwake(); });
  window.addEventListener('beforeunload', function (ev) {
    if (!cur) return;
    ev.preventDefault();
    ev.returnValue = 'A meeting is being recorded. Leave anyway?';
    return ev.returnValue;
  });

  /* ══ Recording ═════════════════════════════════════════════════════════ */

  function pickMime() {
    const list = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm', 'audio/mp4'];
    for (let i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported(list[i])) return list[i];
    return '';
  }

  async function start(mid, onTrouble) {
    if (!supported) throw new Error('This browser can’t record. Use Chrome or Edge, or record on a phone and add the file.');
    if (cur) throw new Error('Already recording.');
    try { await open(); } catch (e) { throw new Error('This browser won’t let the app save a recording (a private window?). Use a normal window, or record on a phone and add the file afterwards.'); }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    } catch (e) {
      throw new Error(e && e.name === 'NotAllowedError' ? 'The microphone is blocked. Allow it from the icon in the address bar and try again.' :
        e && e.name === 'NotFoundError' ? 'No microphone found.' : 'Couldn’t start the microphone.');
    }
    const mime = pickMime();
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 });
    const before = await saved(mid);
    const c = { mid: mid, rec: rec, stream: stream, sess: 's' + Date.now().toString(36), seq: before ? before.seq : 0, started: Date.now(), pausedMs: 0, pausedAt: 0,
      bytes: before ? before.bytes : 0, prevSecs: before ? before.secs : 0, mime: rec.mimeType || mime || 'audio/webm', counted: 0,
      writes: Promise.resolve(), savedAt: null, failed: 0, trouble: '', onTrouble: onTrouble || function () { } };
    rec.ondataavailable = function (ev) {
      if (!ev.data || !ev.data.size) return;
      /* Each piece is credited with the time actually recorded since the
         last one, so a pause in the middle of a piece isn't counted, and
         the time before it isn't lost either. */
      const heard = activeMs(c);
      const secs = Math.round((heard - c.counted) / 100) / 10;
      c.counted = heard;
      c.bytes += ev.data.size;
      const row = { mid: mid, seq: c.seq++, sess: c.sess, blob: ev.data, mime: c.mime, secs: secs, at: new Date().toISOString() };
      c.writes = c.writes.then(function () { return put(row); }).then(function () { c.savedAt = Date.now(); c.failed = 0; })
        .catch(function () {
          c.failed++;
          c.trouble = 'Couldn’t save the last part of the recording to this computer (is the disk full?). Keep this page open, and use Keep a copy when you stop.';
          c.onTrouble(c.trouble);
        });
    };
    /* A microphone unplugged, or taken away by the laptop going to sleep:
       stop cleanly, keep what's saved, and say so. */
    const lost = function (why) {
      if (cur !== c) return;
      c.trouble = why;
      stop().then(function () { c.onTrouble(why, true); });
    };
    stream.getAudioTracks().forEach(function (t) { t.addEventListener('ended', function () { lost('The microphone stopped (unplugged, or the laptop slept). What was recorded is saved — press Record the meeting to carry on.'); }); });
    rec.onerror = function () { lost('The recording stopped with an error. What was recorded is saved — press Record the meeting to carry on.'); };
    /* A level meter, so it's obvious the microphone is hearing the room. */
    try {
      c.ctx = new (window.AudioContext || window.webkitAudioContext)();
      c.analyser = c.ctx.createAnalyser();
      c.analyser.fftSize = 512;
      c.ctx.createMediaStreamSource(stream).connect(c.analyser);
      c.buf = new Uint8Array(c.analyser.fftSize);
    } catch (e) { c.analyser = null; }
    rec.start(PIECE_MS);
    cur = c;
    keepAwake();
    if (persisted === null && navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(function (p) { persisted = !!p; }).catch(function () { persisted = false; });
    }
    return c;
  }

  function pause() {
    if (!cur || cur.rec.state !== 'recording') return;
    cur.rec.pause(); cur.pausedAt = Date.now();
  }
  function resume() {
    if (!cur || cur.rec.state !== 'paused') return;
    cur.pausedMs += Date.now() - cur.pausedAt; cur.pausedAt = 0;
    cur.rec.resume();
  }

  function stop() {
    return new Promise(function (res) {
      if (!cur) { res(null); return; }
      const c = cur;
      c.rec.onstop = function () {
        c.stream.getTracks().forEach(function (t) { t.stop(); });
        try { c.ctx && c.ctx.close(); } catch (e) { }
        cur = null;
        letSleep();
        c.writes.then(function () { return saved(c.mid); }).then(res);
      };
      try { c.rec.stop(); } catch (e) { cur = null; letSleep(); res(null); }
    });
  }

  function activeMs(c) {
    const now = Date.now();
    return Math.max(0, now - c.started - c.pausedMs - (c.pausedAt ? now - c.pausedAt : 0));
  }

  function state() {
    if (!cur) return null;
    const secs = cur.prevSecs + Math.round(activeMs(cur) / 1000);
    let level = 0;
    if (cur.analyser && !cur.pausedAt) {
      cur.analyser.getByteTimeDomainData(cur.buf);
      let peak = 0;
      for (let i = 0; i < cur.buf.length; i++) peak = Math.max(peak, Math.abs(cur.buf[i] - 128));
      level = Math.min(1, peak / 64);
    }
    return { mid: cur.mid, secs: secs, bytes: cur.bytes, paused: !!cur.pausedAt, level: level,
      savedAgo: cur.savedAt ? Math.round((Date.now() - cur.savedAt) / 1000) : null, trouble: cur.trouble,
      awake: !!wake, canWake: 'wakeLock' in navigator, persisted: persisted };
  }

  return { supported: supported, start: start, pause: pause, resume: resume, stop: stop, state: state, saved: saved,
    blob: blob, segments: segments, clear: clear, PIECE_MS: PIECE_MS };
})();

</script>
<script>/* actions.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — every change to a record
   The screens call these and nothing else writes to the state. Each one
   keeps the action's own history (`hist`) as well as the company trail,
   because the history is what the minutes, the "moved 3×" badge and the
   Team page are all read from.

   While a meeting is live, changes made from the meeting room carry that
   meeting's id, which is how the minutes know what happened *at* the
   meeting as opposed to on someone's to-do list in between.
   ═══════════════════════════════════════════════════════════════════════ */

window.Actions = (function () {
  'use strict';

  const C = window.Core, E = window.Engine, W = window.When;
  let room = null;                         // the live meeting the changes belong to

  function S() { return C.state; }
  function me() { return C.who; }
  function today() { return C.state.today; }
  function get(id) { return C.state.itemMap[id]; }

  function inMeeting(mid) { room = mid || null; }
  function meetingNow() { return room; }

  function H(it, h) {
    h.on = today(); h.by = me() ? me().id : 'system';
    if (h.m === undefined) h.m = room;
    it.hist.push(h);
    if (room && S().meetingMap[room]) S().meetingMap[room].reviewed[it.id] = true;
  }

  function nextRef(kind) {
    const k = kind === 'action' ? 'A' : kind === 'decision' ? 'D' : 'N';
    S().seq[k] = (S().seq[k] || 0) + 1;
    return k + '-' + String(S().seq[k]).padStart(4, '0');
  }
  /* Ids are made on whichever computer is in use, so they carry the time
     and a little chance rather than a count two computers could share. */
  function nextId(p) {
    const k = p === 'm' ? 'M' : 'I';
    S().seq[k] = (S().seq[k] || 0) + 1;
    return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* ══ Actions, decisions, notes ═════════════════════════════════════════ */

  function create(o) {
    return C.mutate({ what: 'Added ' + (o.kind || 'action') + ': ' + o.title, kind: 'new' }, function (s) {
      const it = {
        id: nextId('i'), ref: nextRef(o.kind || 'action'), kind: o.kind || 'action',
        title: String(o.title || '').trim(), detail: String(o.detail || '').trim(), topic: o.topic || 'ops',
        owner: o.owner || (me() && me().id), helpers: o.helpers || [], everyone: o.everyone || [], parts: {},
        due: o.due || null, ongoing: !!o.ongoing, status: 'open', progress: 0, waitingOn: '', high: !!o.high,
        series: o.series || null, meeting: o.meeting || null, private: !!o.private,
        by: me() ? me().id : 'system', on: today(), doneOn: null, focus: o.focus || null, agenda: null,
        steps: (o.steps || []).map(function (t) { return { t: t, done: false }; }), hist: []
      };
      if (it.kind === 'action') {
        it.hist.push({ on: today(), by: it.by, m: o.meeting || room, k: 'new',
          to: { due: it.due, owner: it.owner, ongoing: it.ongoing } });
      }
      s.items.push(it);
      return it;
    });
  }

  function edit(id, patch, what) {
    const it = get(id);
    return C.mutate({ what: what || 'Edited ' + it.ref, ref: it.ref }, function () {
      Object.keys(patch).forEach(function (k) { it[k] = patch[k]; });
      return it;
    });
  }

  function update(id, text) {
    const it = get(id);
    text = String(text || '').trim();
    if (!text) return it;
    return C.mutate({ what: 'Update on ' + it.ref + ': ' + text.slice(0, 80), ref: it.ref, kind: 'update' }, function () {
      H(it, { k: 'upd', t: text });
      return it;
    });
  }

  function progress(id, p) {
    const it = get(id);
    if (p >= 100) return done(id);
    return C.mutate({ what: it.ref + ' now ' + p + '%', ref: it.ref }, function () {
      if (it.status === 'done') { H(it, { k: 'reopen' }); it.status = 'open'; it.doneOn = null; }
      H(it, { k: 'prog', from: it.progress, to: p });
      it.progress = p;
      return it;
    });
  }

  function done(id, text) {
    const it = get(id);
    const pid = me().id;
    /* Everyone has a part: tick off mine; the action closes when all are in. */
    if ((it.everyone || []).indexOf(pid) >= 0 && it.owner !== pid) return part(id, pid);
    return C.mutate({ what: 'Done: ' + it.ref + ' ' + it.title, ref: it.ref, kind: 'done' }, function () {
      H(it, { k: 'done', t: text ? String(text).trim() : '' });
      it.status = 'done'; it.doneOn = today(); it.progress = 100; it.focus = null; it.agenda = null;
      if (it.waitingOn) it.waitingOn = '';
      it.steps.forEach(function (s) { s.done = true; });
      return it;
    });
  }

  function part(id, pid) {
    const it = get(id);
    return C.mutate({ what: 'Did their part of ' + it.ref, ref: it.ref, kind: 'done' }, function () {
      it.parts[pid] = today();
      H(it, { k: 'part', t: S().personMap[pid] ? S().personMap[pid].name : pid });
      if (it.everyone.every(function (x) { return it.parts[x]; })) {
        H(it, { k: 'done', t: 'Everyone has done their part.' });
        it.status = 'done'; it.doneOn = today(); it.progress = 100;
      } else {
        it.progress = Math.round(100 * Object.keys(it.parts).length / it.everyone.length / 25) * 25;
        if (it.progress >= 100) it.progress = 75;
      }
      return it;
    });
  }

  function undoPart(id, pid) {
    const it = get(id);
    return C.mutate({ what: 'Took back their part of ' + it.ref, ref: it.ref }, function () {
      delete it.parts[pid];
      if (it.status === 'done') { H(it, { k: 'reopen' }); it.status = 'open'; it.doneOn = null; }
      it.progress = Math.min(75, Math.round(100 * Object.keys(it.parts).length / it.everyone.length / 25) * 25);
      return it;
    });
  }

  function reopen(id) {
    const it = get(id);
    return C.mutate({ what: 'Reopened ' + it.ref, ref: it.ref }, function () {
      H(it, { k: 'reopen' });
      it.status = 'open'; it.doneOn = null; it.progress = Math.min(it.progress, 75);
      return it;
    });
  }

  /* A date only moves forward with a reason, and the old date is kept. */
  function move(id, to, why) {
    const it = get(id);
    return C.mutate({ what: it.ref + ' moved to ' + (to ? W.fmt(to, 'dm') : 'no date') + (why ? ' — ' + why : ''), ref: it.ref, kind: 'move' }, function () {
      H(it, { k: 'due', from: it.due, to: to || null, why: why || '', ongoing: !to });
      it.due = to || null; it.ongoing = !to;
      return it;
    });
  }

  function wait(id, onWhom) {
    const it = get(id);
    return C.mutate({ what: it.ref + ' waiting on ' + onWhom, ref: it.ref }, function () {
      H(it, { k: 'wait', t: onWhom });
      it.status = 'waiting'; it.waitingOn = onWhom;
      return it;
    });
  }

  function unwait(id) {
    const it = get(id);
    return C.mutate({ what: it.ref + ' no longer waiting', ref: it.ref }, function () {
      H(it, { k: 'unwait' });
      it.status = 'open'; it.waitingOn = '';
      return it;
    });
  }

  function drop(id, why) {
    const it = get(id);
    return C.mutate({ what: 'Dropped ' + it.ref + ' — ' + why, ref: it.ref, kind: 'drop' }, function () {
      H(it, { k: 'drop', why: why });
      it.status = 'dropped'; it.focus = null; it.agenda = null;
      return it;
    });
  }

  function reassign(id, to) {
    const it = get(id);
    return C.mutate({ what: it.ref + ' passed to ' + (S().personMap[to] || {}).name, ref: it.ref }, function () {
      H(it, { k: 'owner', from: it.owner, to: to });
      it.owner = to; it.focus = null;
      it.helpers = it.helpers.filter(function (h) { return h !== to; });
      return it;
    });
  }

  function focus(id, on) {
    const it = get(id);
    return C.mutate({ what: (on ? 'Put ' : 'Took ') + it.ref + (on ? ' on' : ' off') + ' today’s list', ref: it.ref, kind: 'focus' }, function () {
      it.focus = on ? today() : null;
      return it;
    });
  }

  function carryToday(ids) {
    return C.mutate({ what: 'Carried ' + ids.length + ' to today’s list', kind: 'focus' }, function (s) {
      ids.forEach(function (id) { if (s.itemMap[id]) s.itemMap[id].focus = today(); });
    });
  }

  /* Ask for it to be discussed at the next meeting of its series. */
  function raise(id, sid) {
    const it = get(id);
    return C.mutate({ what: (sid ? 'Asked to discuss ' : 'No longer asking to discuss ') + it.ref, ref: it.ref }, function () {
      it.agenda = sid || null;
      return it;
    });
  }

  function steps(id, list) {
    const it = get(id);
    return C.mutate({ what: 'Steps on ' + it.ref, ref: it.ref }, function () {
      it.steps = list;
      const n = list.length ? list.filter(function (s) { return s.done; }).length : 0;
      if (list.length && it.status !== 'done') {
        const p = Math.min(75, Math.floor((100 * n / list.length) / 25) * 25);
        if (p !== it.progress) { H(it, { k: 'prog', from: it.progress, to: p }); it.progress = p; }
      }
      return it;
    });
  }

  function remove(id) {
    const it = get(id);
    return C.mutate({ what: 'Deleted own to-do: ' + it.title, ref: it.ref, kind: 'delete' }, function (s) {
      s.items = s.items.filter(function (x) { return x.id !== id; });
    });
  }

  function noted(id) {
    const it = get(id);
    return C.mutate({ what: it.ref + ' noted at the meeting', ref: it.ref, kind: 'noted' }, function () {
      H(it, { k: 'noted' });
      return it;
    });
  }

  /* ══ Meetings ══════════════════════════════════════════════════════════ */

  function createMeeting(o) {
    const s0 = S().seriesMap[o.series] || null;
    return C.mutate({ what: 'Planned ' + (s0 ? s0.name : o.title) + ' for ' + W.fmt(o.date, 'med'), kind: 'meeting' }, function (s) {
      const m = {
        id: nextId('m'), series: o.series || null, title: o.title || '', date: o.date,
        time: o.time || (s0 ? s0.time : '10:00'), place: o.place || (s0 ? s0.place : ''), status: 'planned',
        chair: o.chair || (s0 ? s0.chair : me().id), taker: me().id,
        present: (o.present || (s0 ? s0.members : [me().id])).slice(), apologies: [], guests: '',
        reviewed: {}, transcript: [], consent: false,
        agenda: (s0 ? s0.standing : []).map(function (t, i) { return { id: 'g' + i, t: t, kind: 'standing', by: s0.chair, note: '' }; })
      };
      s.meetings.push(m);
      return m;
    });
  }

  function editMeeting(mid, patch, what) {
    const m = S().meetingMap[mid];
    return C.mutate({ what: what || 'Changed the meeting of ' + W.fmt(m.date, 'dm'), kind: 'meeting' }, function () {
      Object.keys(patch).forEach(function (k) { m[k] = patch[k]; });
      return m;
    });
  }

  function attend(mid, pid, state) {
    const m = S().meetingMap[mid];
    return C.mutate({ what: (S().personMap[pid] || {}).name + (state === 'present' ? ' present' : state === 'apology' ? ' sent apologies' : ' not attending'), kind: 'meeting' }, function () {
      m.present = m.present.filter(function (x) { return x !== pid; });
      m.apologies = m.apologies.filter(function (x) { return x !== pid; });
      if (state === 'present') m.present.push(pid);
      if (state === 'apology') m.apologies.push(pid);
      return m;
    });
  }

  /* "Speaker 1" in a transcript is someone: their name wherever the label
     was — the transcript, the text Gemini wrote it up from, and the to-dos
     in a draft not yet added that were given to "Speaker 1". */
  function renameSpeaker(mid, from, pid) {
    const m = S().meetingMap[mid], p = S().personMap[pid];
    if (!m || !p || !from) return null;
    const q = String(from).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return C.mutate({ what: from + ' in the transcript is ' + p.name, kind: 'meeting' }, function () {
      const line = new RegExp('^' + q + '\\s*:');
      (m.transcript || []).forEach(function (l) { if (line.test(l.t)) l.t = l.t.replace(line, p.name + ':'); });
      if (m.ai) {
        if (m.ai.transcript) {
          const raw = new RegExp('^(\\[?[\\d:]+\\]?\\s*)' + q + '\\s*:', 'gm');
          m.ai.transcript = String(m.ai.transcript).replace(raw, '$1' + p.name + ':');
        }
        if (m.ai.draft && !m.ai.applied) {
          (m.ai.draft.actions || []).forEach(function (a) { if (!a.owner && String(a.ownerSaid || '').trim() === from) { a.owner = p.id; a.ownerSaid = p.name; } });
        }
      }
      return m;
    });
  }

  /* `by`: who is to lead it, when that isn't whoever adds it; `from`: the
     meeting that put it off to this one. */
  function addAgenda(mid, text, kind, by, from) {
    const m = S().meetingMap[mid];
    return C.mutate({ what: 'Added to the agenda: ' + text, kind: 'meeting' }, function () {
      const n = m.agenda.reduce(function (a, g) { return Math.max(a, +String(g.id).replace(/\D/g, '') || 0); }, 0) + 1;
      const g = { id: 'g' + n, t: text, kind: kind || 'raised', by: by || me().id, note: '' };
      if (from) g.from = from;
      m.agenda.push(g);
      return m;
    });
  }

  function agendaNote(mid, gid, note) {
    const m = S().meetingMap[mid];
    return C.mutate({ what: 'Notes on an agenda item', kind: 'meeting' }, function () {
      const g = m.agenda.find(function (x) { return x.id === gid; });
      if (g) g.note = note;
      return m;
    });
  }

  function removeAgenda(mid, gid) {
    const m = S().meetingMap[mid];
    return C.mutate({ what: 'Took an item off the agenda', kind: 'meeting' }, function () {
      m.agenda = m.agenda.filter(function (x) { return x.id !== gid; });
      return m;
    });
  }

  function start(mid, consent) {
    const m = S().meetingMap[mid];
    return C.mutate({ what: 'Started the ' + ((S().seriesMap[m.series] || {}).name || m.title), kind: 'meeting' }, function () {
      m.status = 'live'; m.startedAt = new Date().toISOString(); m.taker = me().id;
      if (m.date !== today()) m.date = today();
      m.consent = !!consent;
      return m;
    });
  }

  /* Transcript lines arrive a sentence at a time; saving each one through
     the trail would bury it, so they are written straight to the meeting. */
  function hear(mid, line) {
    const m = S().meetingMap[mid];
    m.transcript.push(line);
    C.touch(m);
  }

  function close(mid, nextDate) {
    const m = S().meetingMap[mid];
    const snap = E.minutes(S(), m);
    return C.mutate({ what: 'Closed the meeting and wrote the minutes', kind: 'meeting' }, function (s) {
      m.status = 'closed'; m.closedAt = today(); m.next = nextDate || null;
      m.snap = Object.assign(snap, { next: nextDate || null });
      /* Owners asked for it to be discussed; it has been. */
      s.items.forEach(function (it) { if (it.agenda === m.series && m.reviewed[it.id]) it.agenda = null; });
      if (nextDate && m.series) {
        const exists = s.meetings.some(function (x) { return x.series === m.series && x.status !== 'closed' && x.id !== m.id; });
        if (!exists) {
          const s0 = s.seriesMap[m.series];
          s.meetings.push({
            id: nextId('m'), series: m.series, title: '', date: nextDate, time: m.time, place: m.place, status: 'planned',
            chair: m.chair, taker: m.taker, present: s0.members.slice(), apologies: [], guests: '', reviewed: {},
            transcript: [], consent: false,
            agenda: s0.standing.map(function (t, i) { return { id: 'g' + i, t: t, kind: 'standing', by: s0.chair, note: '' }; })
          });
        }
      }
      return m;
    });
  }

  function circulate(mid) {
    const m = S().meetingMap[mid];
    return C.mutate({ what: 'Minutes of ' + W.fmt(m.date, 'dm') + ' marked as sent', kind: 'meeting' }, function () {
      m.circulated = today();
      return m;
    });
  }

  function reopenMeeting(mid) {
    const m = S().meetingMap[mid];
    return C.mutate({ what: 'Reopened the meeting of ' + W.fmt(m.date, 'dm'), kind: 'meeting' }, function () {
      m.status = 'live'; m.snap = null;
      return m;
    });
  }

  /* ══ People, meetings, settings ════════════════════════════════════════ */

  function savePerson(p, pin) {
    return C.mutate({ what: (p.id ? 'Changed ' : 'Added ') + p.name, kind: 'people' }, function (s) {
      let x = p.id ? s.personMap[p.id] : null;
      if (!x) {
        x = { id: 'p' + String(s.people.reduce(function (a, q) { return Math.max(a, +q.id.slice(1) || 0); }, 0) + 1).padStart(2, '0'),
          aliases: [], says: [] };
        s.people.push(x);
      }
      ['name', 'role', 'access', 'initials', 'aliases', 'says', 'email', 'reportsTo', 'minutes'].forEach(function (k) { if (p[k] !== undefined) x[k] = p[k]; });
      if (x.access !== 'staff') delete x.minutes;
      x.first = x.name.split(' ')[0];
      x.initials = x.initials || window.JOR_MIN_DATA.initialsOf(x.name);
      x.email = x.email || '';
      x.aliases = x.aliases || []; x.says = x.says || [];
      if (x.reportsTo === undefined) x.reportsTo = 'p02';
      x.access = x.access || 'staff';
      /* On this computer only (no server): the code is kept hashed here. With
         the server connected, codes are set and checked there, never here. */
      if (pin && !(window.Server && window.Server.connected())) x.pinHash = C.sha256('jormin:' + pin);
      return x;
    });
  }

  function retirePerson(pid) {
    const p = S().personMap[pid];
    return C.mutate({ what: p.name + ' marked as left', kind: 'people' }, function () { p.gone = true; return p; });
  }

  function saveSeries(o) {
    return C.mutate({ what: 'Changed the ' + o.name, kind: 'meeting' }, function (s) {
      let x = s.seriesMap[o.id];
      if (!x) {
        x = { id: 's' + (s.series.reduce(function (a, q) { return Math.max(a, +q.id.slice(1) || 0); }, 0) + 1), tint: '#4E6E8E' };
        s.series.push(x);
      }
      ['name', 'short', 'every', 'day', 'time', 'place', 'chair', 'members', 'standing'].forEach(function (k) { if (o[k] !== undefined) x[k] = o[k]; });
      return x;
    });
  }

  function clearRecords() {
    return C.mutate({ what: 'Cleared every meeting and action', kind: 'settings' }, function (s) {
      s.meetings = []; s.items = []; s.seq = { A: 0, D: 0, N: 0, I: 0, M: 0 };
    });
  }

  function setToday(d) {
    return C.mutate({ what: d ? 'Pretending today is ' + W.fmt(d, 'med') : 'Back to today’s real date', kind: 'settings' }, function (s) {
      s.fixedToday = d || null; s.today = d || window.JOR_MIN_SEED.realToday();
    });
  }

  /* ══ Bringing the spreadsheet in ═══════════════════════════════════════
     `rows` are the importer's rows the user kept, with `owner`/`helpers`
     already resolved to people. Makes one closed meeting holding them.  */

  /* One tab per meeting, oldest first. A row that continues an action from
     an earlier tab (`link`, the key of the row that first raised it) is
     applied to that action at this meeting — a new date becomes a move,
     a new owner a hand-over, "Complete" closes it — so the history reads
     the way the meetings went. With `closeMissing`, an action that drops
     off the next tab without being marked complete is closed there, with
     that said plainly, rather than left open for ever. */
  function importBook(o) {
    const nRows = o.tabs.reduce(function (a, t) { return a + t.rows.length; }, 0);
    return C.mutate({ what: 'Brought ' + o.tabs.length + ' meeting' + (o.tabs.length === 1 ? '' : 's') + ' (' + nRows + ' rows) across from the minutes workbook', kind: 'import' }, function (s) {
      const s0 = s.seriesMap[o.series] || null;
      const who = me().id;
      const byKey = {}, lastSeen = {};
      const made = [];
      o.tabs.forEach(function (tab, ti) {
        const m = {
          id: nextId('m'), series: o.series || null, title: s0 ? '' : 'Imported meeting', date: tab.date, time: '', place: '',
          status: 'closed', chair: o.chair || who, taker: who, present: (o.present || []).slice(), apologies: [], guests: '',
          reviewed: {}, transcript: [], consent: false, agenda: [], closedAt: tab.date, imported: tab.sheet, circulated: tab.date
        };
        s.meetings.push(m);
        made.push(m);
        const at = function (it, h) { h.on = tab.date; h.by = who; h.m = m.id; it.hist.push(h); m.reviewed[it.id] = true; };
        const seen = {};

        tab.rows.forEach(function (r) {
          const prior = r.kind === 'action' && r.link ? byKey[r.link] : null;
          if (prior) {
            const it = prior;
            /* An old row pasted into a later tab doesn't reopen what was finished. */
            if (r.stale && it.status === 'done') { lastSeen[it.id] = ti; seen[it.id] = true; return; }
            const text = [r.detail && r.detail !== it.detail ? r.detail : '', r.update].filter(Boolean).join(' — ');
            if (r.detail && r.detail !== it.detail) it.detail = r.detail;
            if (r.owner && r.owner !== it.owner) { at(it, { k: 'owner', from: it.owner, to: r.owner }); it.owner = r.owner; }
            (r.helpers || []).forEach(function (h) { if (it.helpers.indexOf(h) < 0 && h !== it.owner) it.helpers.push(h); });
            if (r.due && r.due !== it.due) {
              at(it, { k: 'due', from: it.due, to: r.due, why: it.due && r.due > it.due ? 'In the old minutes' : '' });
              it.due = r.due; it.ongoing = false;
            } else if (r.ongoing && !it.ongoing) { at(it, { k: 'due', from: it.due, to: null, ongoing: true, why: '' }); it.due = null; it.ongoing = true; }
            const lu = E.lastUpdate(it);
            if (text && (!lu || lu.t !== text)) at(it, { k: 'upd', t: text });
            if (r.status === 'done' && it.status !== 'done') {
              at(it, { k: 'done', t: '' }); it.status = 'done'; it.doneOn = tab.date; it.progress = 100;
            } else if (r.status !== 'done' && it.status === 'done') {
              at(it, { k: 'reopen' }); it.status = 'open'; it.doneOn = null; it.progress = Math.min(r.progress || 0, 75);
            }
            if (r.status !== 'done' && r.progress && r.progress !== it.progress) { at(it, { k: 'prog', from: it.progress, to: r.progress }); it.progress = r.progress; }
            if (!(it.hist || []).some(function (h) { return h.m === m.id; })) at(it, { k: 'noted' });
            lastSeen[it.id] = ti; seen[it.id] = true;
            return;
          }

          const kind = r.kind;
          const it = {
            id: nextId('i'), ref: nextRef(kind), kind: kind, title: r.title, detail: r.detail || '', topic: r.topic || 'office',
            owner: r.owner || null, helpers: r.helpers || [], everyone: r.everyone || [], parts: {},
            due: r.due || null, ongoing: !!r.ongoing, status: 'open', progress: r.progress || 0, waitingOn: '', high: false,
            series: o.series || null, meeting: m.id, private: false, by: who, on: tab.date, doneOn: null, focus: null,
            agenda: null, steps: [], hist: [], imported: true
          };
          if (kind === 'action') {
            const first = r.slips && r.slips.length && r.slips[0].from ? r.slips[0].from : r.due;
            it.hist.push({ on: tab.date, by: who, m: m.id, k: 'new', to: { due: first, owner: it.owner, ongoing: it.ongoing } });
            (r.slips || []).forEach(function (sl) {
              if (sl.from) it.hist.push({ on: tab.date, by: who, m: m.id, k: 'due', from: sl.from, to: sl.to, why: sl.why });
            });
            if (r.update) it.hist.push({ on: tab.date, by: who, m: m.id, k: 'upd', t: r.update });
            if (r.progress && r.status !== 'done') it.hist.push({ on: tab.date, by: who, m: m.id, k: 'prog', from: 0, to: r.progress });
            if (r.status === 'done') {
              it.hist.push({ on: tab.date, by: who, m: m.id, k: 'done', t: '' });
              it.status = 'done'; it.doneOn = tab.date; it.progress = 100;
            }
            m.reviewed[it.id] = true;
            byKey[r.key] = it;
            lastSeen[it.id] = ti; seen[it.id] = true;
          } else if (r.update) {
            it.detail = (it.detail ? it.detail + ' — ' : '') + r.update;
          }
          s.items.push(it);
        });

        /* Open on the last tab, missing from this one. */
        if (o.closeMissing && ti > 0) {
          s.items.forEach(function (it) {
            if (it.kind !== 'action' || seen[it.id] || lastSeen[it.id] !== ti - 1 || !E.isOpen(it) || it.meeting === m.id) return;
            if (it.series !== (o.series || null)) return;
            at(it, { k: 'drop', why: 'No longer in the minutes' });
            it.status = 'dropped';
          });
        }
      });
      return made[made.length - 1];
    });
  }

  /* Initials nobody else has: a one-word name gets two letters, then three if those are taken. */
  function freeInitials(s, name, want) {
    const taken = {};
    s.people.forEach(function (p) { taken[p.initials] = true; (p.aliases || []).forEach(function (a) { taken[a] = true; }); });
    const letters = String(name).normalize('NFD').replace(/[^A-Za-z]/g, '').toUpperCase();
    /* One name only: two letters read better than one (MA, not M). */
    let first = String(want || window.JOR_MIN_DATA.initialsOf(name)).toUpperCase();
    if (first.length === 1 && letters.length > 1) first = letters.slice(0, 2);
    if (!taken[first]) return first;
    if (letters.length > 2 && !taken[letters[0] + letters[letters.length - 1]]) return letters[0] + letters[letters.length - 1];
    for (let n = 2; n <= Math.min(5, letters.length); n++) if (!taken[letters.slice(0, n)]) return letters.slice(0, n);
