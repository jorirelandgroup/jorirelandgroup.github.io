<title>JOR Minutes &amp; To-Do</title>

<style>/* styles.css */
/* ══════════════════════════════════════════════════════════════════════
   1. TOKENS — the house green from JOR A4 Day Template.docx (fill 00A66E)
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --jor:#00A66E; --jor-dp:#00A66E; --jor-deep:#00875A;
  --on-jor:#FFC81E;
  --gold:#B08D2E; --gold-lt:#D9C27E; --gold-pale:#F3EBD6;
  --mist:#CDE7DC; --mist-2:#E8F3EE; --mist-3:#F5FAF8;
  --ink:#13251E; --ink-2:#41564D; --ink-3:#72877D; --slate:#5F6E70;
  --line:#DBE7E1; --line-2:#EDF4F1; --paper:#fff; --bg:#ECF1EF;
  --err:#B3261E; --err-bg:#FDEDEC; --warn:#9A6209; --warn-bg:#FDF4E3;
  --clash:#C2550F; --clash-bg:#FCEFE6;
  --r:10px;
  --shadow:0 1px 2px rgba(9,40,30,.05),0 10px 28px rgba(9,40,30,.08);
  --shadow-sm:0 1px 2px rgba(9,40,30,.06);
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:Cambria,"Georgia","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--jor-dp)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#c2d4cc;border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#a5bcb2;background-clip:content-box;border:3px solid transparent}

/* ══════════════════════════════════════════════════════════════════════
   2. APP CHROME
   ══════════════════════════════════════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:58px;flex:0 0 58px;
  background:var(--jor);color:#fff;z-index:40;box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.brandmark{display:flex;align-items:center;gap:11px;white-space:nowrap}
.brandmark img{height:30px;width:auto;display:block}
.brandmark .bt{font-family:var(--serif);font-size:15.5px;letter-spacing:.02em;opacity:.92;
  padding-left:11px;border-left:1px solid rgba(217,194,126,.42)}
.tabs{display:flex;gap:2px;margin-left:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:rgba(255,255,255,.72);padding:8px 12px;border-radius:8px;
  cursor:pointer;font-size:13.5px;font-weight:520;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab:hover{background:rgba(255,255,255,.09);color:#fff}
.tab.on{background:rgba(255,255,255,.15);color:#fff;font-weight:600;box-shadow:0 1px 0 var(--gold-lt) inset}
.tab .badge{background:var(--gold);color:#231B04;border-radius:999px;font-size:10.5px;font-weight:800;
  padding:1px 6px;min-width:18px;text-align:center;line-height:1.5}
.tab.on .badge{background:var(--on-jor)}
.spacer{flex:1}
.whoami{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:999px;padding:4px 6px 4px 5px;cursor:pointer;position:relative}
.whoami:hover{background:rgba(255,255,255,.18)}
.whoami .av{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#231B04;display:grid;place-items:center;
  font-size:12px;font-weight:800;letter-spacing:.02em;flex:0 0 auto}
.whoami .wt{line-height:1.15;text-align:left;padding-right:4px}
.whoami .wt b{display:block;font-size:12.5px;font-weight:620;white-space:nowrap}
.whoami .wt span{display:block;font-size:10.5px;opacity:.8;white-space:nowrap}
.whoami select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.rolepill{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 9px;opacity:.95}
/* On a narrower window the tabs matter more than the name badge. */
@media(max-width:1475px){.rolepill{display:none}}
@media(max-width:1550px){.live{display:none}}
@media(max-width:1400px){.whoami .wt{display:none}.whoami{padding:4px}}
@media(max-width:1025px){.brandmark .bt{display:none}}

.tbtn{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.07);color:#fff;padding:7px 12px;
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:520;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.16)}
.tbtn.primary{background:var(--gold);border-color:transparent;font-weight:640;color:#231B04}
.tbtn.primary:hover{background:var(--gold-lt)}

.work{flex:1;overflow-y:auto;overflow-x:hidden;display:none;padding:22px 24px 90px}
.work.on{display:block}
.wrap{max-width:1180px;margin:0 auto}
.wrap.wide{max-width:1500px}
.sechead{display:flex;align-items:baseline;gap:12px;margin:0 0 4px;flex-wrap:wrap}
.sechead h2{margin:0;font-size:21px;font-weight:640;letter-spacing:-.015em;font-family:var(--serif)}
.sechead .rowend{margin-left:auto}
.hint{color:var(--ink-3);font-size:12.5px;margin:0 0 18px;max-width:86ch}

/* ══════════════════════════════════════════════════════════════════════
   3. SURFACES, BUTTONS, FORMS
   ══════════════════════════════════════════════════════════════════════ */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px;font-weight:660;display:flex;align-items:center;gap:8px}
.card-h .note{color:var(--ink-3);font-size:12px}
.card-h .rowend{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.card-b{padding:15px}
.card-b.tight{padding:0}
.card-b.flush{padding:0 15px 15px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media(max-width:1350px){.split{grid-template-columns:1fr}.g4,.g5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:975px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

label.f>span{display:block;font-size:11px;font-weight:660;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
label.f{display:block;margin-bottom:12px}
.in{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;font-size:13.5px}
.in:focus{border-color:var(--jor);box-shadow:0 0 0 3px rgba(0,166,110,.13)}
textarea.in{resize:vertical;min-height:74px;line-height:1.6}
select.in{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2372877D' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}
.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;
  font-size:13px;font-weight:540;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--mist-3);border-color:var(--jor)}
.btn.p{background:var(--jor);color:#fff;border-color:transparent;font-weight:620}
.btn.p:hover{background:var(--jor-deep)}
.btn.g{background:var(--gold);color:#231B04;border-color:transparent;font-weight:620}
.btn.g:hover{background:var(--gold-lt)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.dngr{color:var(--err)}
.btn.dngr:hover{background:var(--err-bg);border-color:var(--err)}
.btn:disabled{opacity:.42;cursor:default;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rowend{margin-left:auto}
.mini{font-size:11.5px;color:var(--ink-3)}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:14px 0}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13px}
.empty b{display:block;color:var(--ink-2);font-size:14px;font-weight:620;margin-bottom:4px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 13px;font-size:12.5px;font-weight:560;cursor:pointer;color:var(--ink-2);
  border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--jor);color:#fff;font-weight:640}
.seg button:not(.on):hover{background:var(--mist-2)}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--mist-2);color:var(--jor-dp);
  border:1px solid var(--mist);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:620;white-space:nowrap}
.pill.gold{background:var(--gold-pale);border-color:#E7D9AE;color:#7A6018}
.pill.grey{background:#F0F3F2;border-color:var(--line);color:var(--ink-3)}
.pill.amber{background:var(--warn-bg);border-color:#EDD9AC;color:var(--warn)}
.pill.red{background:var(--err-bg);border-color:#F0C7C3;color:var(--err)}
.pill.orange{background:var(--clash-bg);border-color:#F2D3BE;color:var(--clash)}
.pill.solid{background:var(--jor);border-color:transparent;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;
  color:#fff;flex:0 0 auto;letter-spacing:.01em}
.av.sm{width:24px;height:24px;font-size:9.5px}
.av.lg{width:46px;height:46px;font-size:16px}
.person{display:flex;align-items:center;gap:9px;min-width:0}
.person .pn{min-width:0}
.person .pn b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .pn span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══════════════════════════════════════════════════════════════════════
   4. STAT TILES & DONUT
   ══════════════════════════════════════════════════════════════════════ */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:16px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-26px;top:-26px;width:70px;height:70px;border-radius:50%;
  background:var(--mist-3);z-index:0}
.tile>*{position:relative;z-index:1}
.tile .tl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.tile .tv{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.tile .tv small{font-size:14px;font-weight:600;color:var(--ink-3);font-family:var(--sans);margin-left:3px}
.tile .ts{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.tile.accent{background:var(--jor);border-color:transparent;color:#fff}
.tile.accent::after{background:rgba(255,255,255,.08)}
.tile.accent .tl{color:rgba(255,255,255,.75)}
.tile.accent .ts{color:rgba(255,255,255,.82)}
.tile.warn .tv{color:var(--clash)}
.tile.danger .tv{color:var(--err)}
.tile.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s}
.tile.clickable:hover{transform:translateY(-1px);box-shadow:var(--shadow)}

.donutwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{flex:0 0 auto;position:relative;width:168px;height:168px}
.donut svg{transform:rotate(-90deg)}
.donut .dmid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.donut .dmid b{font-family:var(--serif);font-size:38px;font-weight:700;display:block;letter-spacing:-.02em}
.donut .dmid span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);display:block;margin-top:3px}
.legend{display:flex;flex-direction:column;gap:9px;min-width:190px;flex:1}
.legend .lr{display:flex;align-items:center;gap:9px;font-size:13px}
.legend .lr b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:660}
.legend .lr .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.legend .lr span{color:var(--ink-2)}

.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:132px 1fr 56px;gap:11px;align-items:center;font-size:12.5px}
.bar .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-weight:560}
.bar .bt{height:9px;border-radius:99px;background:var(--line-2);overflow:hidden;position:relative}
.bar .bt i{display:block;height:100%;border-radius:99px;background:var(--jor)}
.bar .bt em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--clash);opacity:.65}
.bar .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600}

/* ══════════════════════════════════════════════════════════════════════
   5. CHARTS
   ══════════════════════════════════════════════════════════════════════ */
.chart{width:100%;display:block;overflow:visible}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.chart .ax{fill:var(--ink-3);font-size:10px;font-family:var(--sans)}
.chart .lbl{fill:var(--ink-2);font-size:10.5px;font-weight:600;font-family:var(--sans)}
.chart .thr{stroke:var(--clash);stroke-width:1.4;stroke-dasharray:4 3}
.sparkrow{display:flex;gap:2px;align-items:flex-end;height:38px}
.sparkrow i{flex:1;background:var(--mist);border-radius:2px 2px 0 0;min-height:2px}
.sparkrow i.hot{background:var(--clash)}

/* ══════════════════════════════════════════════════════════════════════
   6. CONFLICT PANEL
   ══════════════════════════════════════════════════════════════════════ */
.verdict{border-radius:var(--r);padding:14px 15px;display:flex;gap:13px;align-items:flex-start;margin-bottom:13px;
  border:1px solid transparent}
.verdict .vi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:0 0 auto;
  background:rgba(255,255,255,.6)}
.verdict b{display:block;font-size:15px;font-weight:660;font-family:var(--serif);letter-spacing:-.01em}
.verdict p{margin:3px 0 0;font-size:12.5px;line-height:1.5}
.v-clear{background:var(--mist-2);border-color:var(--mist);color:#0A5C41}
.v-note{background:var(--mist-3);border-color:var(--line);color:var(--ink-2)}
.v-caution{background:var(--warn-bg);border-color:#EDD9AC;color:var(--warn)}
.v-clash{background:var(--clash-bg);border-color:#F2D3BE;color:var(--clash)}
.v-blocked{background:var(--err-bg);border-color:#F0C7C3;color:var(--err)}

.flags{display:flex;flex-direction:column;gap:8px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
  background:#fff;font-size:12.5px}
.flag .fi{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;flex:0 0 auto;
  background:var(--mist-2);color:var(--jor-dp)}
.flag b{display:block;font-size:12.8px;font-weight:640;margin-bottom:2px;color:var(--ink)}
.flag p{margin:0;color:var(--ink-2);line-height:1.5}
.flag.l-caution{background:var(--warn-bg);border-color:#EDD9AC}
.flag.l-caution .fi{background:#F6E4BE;color:var(--warn)}
.flag.l-clash{background:var(--clash-bg);border-color:#F2D3BE}
.flag.l-clash .fi{background:#F6DAC6;color:var(--clash)}
.flag.l-blocked{background:var(--err-bg);border-color:#F0C7C3}
.flag.l-blocked .fi{background:#F7D4D1;color:var(--err)}
.flag.l-note{background:var(--mist-3)}

.coverstrip{display:flex;gap:3px;margin-top:4px}
.coverstrip .cd{flex:1;min-width:0;text-align:center}
.coverstrip .cd .cdl{font-size:9.5px;color:var(--ink-3);font-weight:700;letter-spacing:.04em}
.coverstrip .cd .cdb{height:32px;border-radius:5px;background:var(--mist-2);position:relative;overflow:hidden;
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--jor-dp);margin-top:3px}
.coverstrip .cd.short .cdb{background:var(--clash-bg);color:var(--clash);box-shadow:0 0 0 1px #EFC7AB inset}
.coverstrip .cd.zero .cdb{background:var(--err-bg);color:var(--err);box-shadow:0 0 0 1px #EFBFBA inset}
.coverstrip .cd.off .cdb{background:#F2F5F4;color:#AFC0B8}

.suggest{display:flex;flex-direction:column;gap:7px}
.sugg{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;
  cursor:pointer;font-size:12.5px;text-align:left;width:100%}
.sugg:hover{border-color:var(--jor);background:var(--mist-3)}
.sugg b{font-weight:640}
.sugg .sd{margin-left:auto;color:var(--ink-3);font-size:11.5px;white-space:nowrap}

/* ══════════════════════════════════════════════════════════════════════
   7. CALENDARS
   ══════════════════════════════════════════════════════════════════════ */
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}

  text-align:center;padding:4px 0}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:104px;padding:6px 7px;position:relative;
  display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cell.out{background:#F4F7F6;border-color:var(--line-2)}
.cell.out .cn{color:#B5C5BD}
.cell.we{background:var(--mist-3)}
.cell.today{border-color:var(--jor);box-shadow:0 0 0 2px rgba(0,166,110,.16)}
.cell.hol{background:var(--gold-pale);border-color:#EADFC0}
.cell.short::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--clash)}
.cell .cn{font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.cell .cn .hn{font-size:9.5px;font-weight:700;color:#7A6018;text-transform:uppercase;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cx{margin-left:auto;font-size:9.5px;font-weight:800;color:var(--clash);letter-spacing:.03em}
.chip{display:flex;align-items:center;gap:5px;font-size:11px;padding:2px 6px;border-radius:5px;background:var(--mist-2);
  color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid var(--jor)}
.chip:hover{filter:brightness(.97)}
.chip.pending{background:repeating-linear-gradient(135deg,var(--warn-bg),var(--warn-bg) 5px,#fff 5px,#fff 10px)}

.cell .more{font-size:10.5px;color:var(--ink-3);font-weight:600;cursor:pointer}
.cell .more:hover{color:var(--jor-dp)}

/* Wall planner ─────────────────────────────────────────────────────── */

/* Timeline ─────────────────────────────────────────────────────────── */
.tl{display:flex;flex-direction:column;gap:2px}

  border-bottom:1px solid var(--line);padding-bottom:4px}

  text-align:center;border-left:1px solid var(--line-2);padding:4px 0}

.tlbar{position:absolute;top:3px;bottom:3px;border-radius:5px;display:flex;align-items:center;padding:0 6px;
  font-size:10.5px;font-weight:650;color:#fff;overflow:hidden;white-space:nowrap;cursor:pointer;
  box-shadow:0 1px 2px rgba(9,40,30,.14)}
.tlbar.pend{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.5) 4px,transparent 4px,transparent 8px)}
.tlnow{position:absolute;top:0;bottom:0;width:2px;background:var(--jor);z-index:3;pointer-events:none}

  padding:9px 0 4px;border-top:1px solid var(--line);margin-top:6px}

/* ══════════════════════════════════════════════════════════════════════
   8. LISTS & TABLES
   ══════════════════════════════════════════════════════════════════════ */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);

.tscroll{max-height:64vh;overflow:auto;border-radius:0 0 var(--r) var(--r)}

.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;

.reqcard{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:12px;overflow:hidden;

.reqcard-h{display:flex;align-items:center;gap:11px;padding:12px 14px;background:linear-gradient(180deg,#fff,var(--mist-3));
  flex-wrap:wrap;cursor:pointer}
.reqcard-h .when{font-family:var(--serif);font-size:15px;font-weight:660;letter-spacing:-.01em}
.reqcard-h .wd{font-size:11.5px;color:var(--ink-3)}
.reqcard-b{padding:0 14px 14px;display:none}
.reqcard.open .reqcard-b{display:block}
.reqcard.open .reqcard-h{border-bottom:1px solid var(--line-2)}
.notebox{background:var(--mist-3);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;font-size:12.5px;
  color:var(--ink-2);line-height:1.55;margin:0 0 12px}
.notebox i{color:var(--ink-3);font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  display:block;margin-bottom:3px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--ink-3);white-space:nowrap}
.kv dd{margin:0;font-weight:560}

/* ══════════════════════════════════════════════════════════════════════
   9. MODAL, DRAWER, TOAST
   ══════════════════════════════════════════════════════════════════════ */
#scrim{position:fixed;inset:0;background:rgba(9,32,24,.42);backdrop-filter:blur(2px);z-index:60;display:none}
#scrim.on{display:block}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);
  max-height:86vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(9,40,30,.3);display:none}
.modal.on{display:block}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-family:var(--serif);font-size:18px;font-weight:660;letter-spacing:-.01em}

.modal-b{padding:16px 18px}

  background:var(--mist-3);border-radius:0 0 14px 14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13px;font-weight:560;z-index:80;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:0 10px 30px rgba(9,40,30,.3);max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--err)}
#toast.good{background:var(--jor-deep)}

/* ══════════════════════════════════════════════════════════════════════
   10. WEDGE — the JOR device, used on the page headers
   ══════════════════════════════════════════════════════════════════════ */
.pagehead{position:relative;background:var(--jor);color:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:16px;
  overflow:hidden;box-shadow:var(--shadow)}

  background:rgba(255,255,255,.07);transform:skewX(-18deg)}

.pagehead .ph-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.pagehead .rowend{margin-left:auto}

@media print{
  .topbar,.tabs,#toast,.btn,.tbtn,.seg{display:none!important}
  .work{overflow:visible;height:auto;padding:0}

  .card{break-inside:avoid;box-shadow:none}
}

/* ══════════════════════════════════════════════════════════════════════
   12. A QUARTER BIGGER
   Everything — text, spacing, charts — is drawn at 125%. zoom scales the
   whole layout together; anything sized to the window is divided back by
   the same factor so the app still fits the screen exactly. Change --z to
   make it bigger or smaller. The breakpoints above are already multiplied
   by 1.25 so the layout folds at the same point on screen as before.
   ══════════════════════════════════════════════════════════════════════ */
:root{--z:1.25}
body{zoom:var(--z)}
#app{height:calc(100vh / var(--z))}
.modal{max-height:calc(86vh / var(--z))}
.planner{max-height:calc(70vh / var(--z))}
.tscroll{max-height:calc(64vh / var(--z))}
.gate{min-height:calc(100vh / var(--z))}

.chk input{width:16px;height:16px;accent-color:var(--jor);flex:0 0 auto}
.chk.sub{margin-left:24px;color:var(--ink-2)}
.xs-x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:12px;padding:3px 6px;border-radius:6px;line-height:1}
.xs-x:hover{background:var(--err-bg);color:var(--err)}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:0}
.clk{cursor:pointer}
.dim{opacity:.55}
.av{display:inline-grid;vertical-align:middle}
.nw{white-space:nowrap}
.av.xs{width:20px;height:20px;font-size:8px;letter-spacing:0}
.avs{display:inline-flex;align-items:center}
.avs .av{box-shadow:0 0 0 2px #fff;margin-left:-5px}
.avs .av:first-child{margin-left:0}
.av.more{background:var(--mist)!important;color:var(--jor-deep)}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF4A3A;box-shadow:0 0 0 0 rgba(255,74,58,.6);animation:ld 1.6s infinite;flex:0 0 auto}
@keyframes ld{0%{box-shadow:0 0 0 0 rgba(255,74,58,.55)}70%{box-shadow:0 0 0 7px rgba(255,74,58,0)}100%{box-shadow:0 0 0 0 rgba(255,74,58,0)}}
.pill.live-p{background:#FFECEA;border-color:#F6C4BE;color:#B3261E}
.pbar-l{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;margin:6px 0 10px}
.pbar-l i{display:block;height:100%;background:var(--jor);border-radius:99px}
mark{background:#FFE89A;color:inherit;border-radius:2px;padding:0 1px}

/* ══ 3. Chips ═══════════════════════════════════════════════════════════ */

.due{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;white-space:nowrap;border-radius:6px;padding:2px 7px;
  background:#F1F5F3;color:var(--ink-2);font-variant-numeric:tabular-nums}
.due .ic{width:13px;height:13px}
.due.over{background:var(--risk-bg);color:var(--risk)}
.due.today{background:var(--amber-bg);color:var(--amber)}
.due.week{background:var(--mist-2);color:var(--jor-deep)}
.due.later{background:#F1F5F3;color:var(--ink-2)}
.due.none{background:transparent;color:var(--ink-3);font-weight:560}
.due.done{background:var(--ok-bg);color:var(--ok)}
.fl{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap;
  background:#F1F5F3;color:var(--ink-2);letter-spacing:.01em}
.fl .ic{width:12px;height:12px}
.fl.k-overdue{background:var(--risk-bg);color:var(--risk)}
.fl.k-moved{background:var(--amber-bg);color:var(--amber)}
.fl.k-moved2{background:var(--orange-bg);color:var(--orange)}
.fl.k-stale{background:#EEF1F6;color:#4E5E7E}
.fl.k-waiting{background:#EFECF8;color:#5A4FA0}
.fl.k-high{background:var(--gold-pale);color:var(--gold-ink)}
.fl.k-raised{background:var(--gold-pale);color:var(--gold-ink)}
.fl.k-ok{background:var(--ok-bg);color:var(--ok)}
.src{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--ink-2);
  border-radius:5px;padding:1px 7px 1px 6px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--t,#8A9A93)}
.src.priv{border-left-color:#8A9A93;color:var(--ink-3)}
.src.ask{border-left-color:var(--gold)}
.kp{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2px 7px;background:var(--mist-2);color:var(--jor-deep)}
.kp.k-decision{background:#EFECF8;color:#5A4FA0}
.kp.k-note{background:#F1F5F3;color:var(--ink-2)}
.kp.k-update{background:var(--amber-bg);color:var(--amber)}
.pb{display:inline-block;width:44px;height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;flex:0 0 auto}
.pb.wide{width:70px}
.pb i{display:block;height:100%;background:var(--jor);border-radius:99px}
.stp{font-size:10.5px;color:var(--ink-3);font-weight:650}

.mic{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink-2);cursor:pointer;
  display:grid;place-items:center}
.mic:hover{border-color:var(--jor);color:var(--jor-deep);background:var(--mist-3)}
.mic.on{background:#FF4A3A;color:#fff;border-color:transparent;animation:ld 1.4s infinite}
.inmic{display:flex;gap:6px;align-items:flex-start}
.inmic .in{flex:1;min-width:0}
.inmic.grow{flex:1;min-width:0}

.sun{border:0;background:transparent;color:#C9D6D0;cursor:pointer;padding:3px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
.sun:hover{color:var(--gold);background:var(--gold-pale)}
.sun.on{color:#E1A200}
.sun.sm svg{width:14px;height:14px}
.sun-sp{width:23px;flex:0 0 auto}
.sun-sp.sm{width:18px}

.dchips{display:inline-flex;gap:5px;flex-wrap:wrap}
.dchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:560;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.dchip:hover{border-color:var(--jor);color:var(--jor-deep);background:var(--mist-3)}
.whys{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}

/* ══ 4. My to-do ════════════════════════════════════════════════════════ */

.todohead{padding:16px 22px}
.ph-date{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.82;margin-bottom:3px;position:relative;z-index:1}
.pagehead p b{color:var(--on-jor)}
.qadd{padding:12px 14px;margin-bottom:14px}
.qrow{display:flex;gap:8px;align-items:center}
.qin{font-size:15px;padding:10px 13px}
.qrow .mic{width:40px;height:40px}
.qrow .btn{padding:9px 16px;font-size:14px}
.qprev{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;min-height:22px;font-size:12.5px}
.qp-t{font-weight:640}
.qp-k{margin-left:auto}

.prep{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,var(--gold-pale),#FFFDF6);border:1px solid #E7D9AE;
  border-radius:var(--r);padding:12px 15px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.prep-ic{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--gold-ink);display:grid;place-items:center;flex:0 0 auto}
.prep-t{font-size:13.5px;line-height:1.5;color:#4F3F10;flex:1}

.todo-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media(max-width:1500px){.todo-grid{grid-template-columns:minmax(0,1fr) 280px}}
@media(max-width:1250px){.todo-grid{grid-template-columns:minmax(0,1fr)}}
.sect{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);margin-bottom:12px;overflow:hidden}
.sect-h{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,#fff,var(--mist-3))}
.sect-h h3{margin:0;font-size:14px;font-weight:700}
.sect-h .n{font-size:11.5px;font-weight:800;color:var(--ink-3);background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 8px}
.sect-hint{font-size:12px;color:var(--ink-3);margin-left:4px}
.sect-ic{color:#E1A200;display:grid}
.sect.s-today{border-color:#EAD9A4;box-shadow:0 0 0 3px rgba(225,162,0,.08),var(--shadow-sm)}
.sect.s-today .sect-h{background:linear-gradient(180deg,#FFFCF1,#FFF7DD)}
.sect.s-overdue .sect-h h3{color:var(--risk)}
.sect.s-overdue{border-color:#F0D4D1}
.sect-h.tog{width:100%;border:0;border-bottom:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.sect-h .chev{margin-left:auto;color:var(--ink-3)}
.s-done .rows{border-top:1px solid var(--line-2)}
.carry{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:#FFFBEE;border-bottom:1px solid #F3E8C5;font-size:12.5px;color:#6B5413}
.empty-today{padding:16px 16px 18px;font-size:13px;color:var(--ink-3);line-height:1.55}
.empty-today svg{vertical-align:-3px;color:#E1A200}

.td{display:flex;align-items:center;gap:11px;padding:9px 12px 9px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;min-height:48px;
  border-left:3px solid transparent;transition:background .1s}
.td:last-child{border-bottom:0}
.td:hover{background:var(--mist-3)}
.td:focus-visible{outline:2px solid var(--jor);outline-offset:-2px}
.td.hi{border-left-color:var(--gold)}
.td.closed .td-t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:#B9C7C0}
.ck{width:22px;height:22px;border-radius:7px;border:1.8px solid #B7C8C0;background:#fff;display:grid;place-items:center;cursor:pointer;
  color:transparent;flex:0 0 auto;padding:0;transition:all .12s}
.ck .ic{width:14px;height:14px}
.ck:hover{border-color:var(--jor);color:#9CD8BF}
.ck.on{background:var(--jor);border-color:var(--jor);color:#fff}
.ck.sm{width:18px;height:18px;border-radius:5px}
.ck.sm .ic{width:12px;height:12px}
.ck:disabled{opacity:.5;cursor:default}
.td-who{flex:0 0 22px;display:grid;place-items:center}
.td-m{flex:1;min-width:0}
.td-t{font-size:13.8px;font-weight:600;line-height:1.35}
.td-s{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;min-width:0}
.td-s .lu{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;flex:1 1 180px}
.td-s .lu::before{content:"“"}
.td-s .lu::after{content:"”"}
.td-r{display:flex;align-items:center;gap:8px;flex:0 0 auto}

.todo-side .card{margin-bottom:12px}
.todo-side .card-b{padding:12px 14px}
.todo-side .card-b.tight{padding:0}
.wk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 14px 6px!important}
.wkd{text-align:center}
.wkb{height:54px;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--line)}
.wkb i{width:9px;border-radius:3px 3px 0 0;min-height:2px}
.wkb .bd,.wk-leg .bd{background:#C8D8D1}
.wkb .bn,.wk-leg .bn{background:var(--jor)}
.wkl{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.wkn{font-size:12px;font-weight:700}
.wkd.now .wkl{color:var(--jor-deep)}
.wkd.now .wkb{border-bottom:2px solid var(--jor)}
.wk-leg{display:flex;gap:14px;padding:4px 14px 12px;font-size:11px;color:var(--ink-3)}
.wk-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mm{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
.mm:last-child{border-bottom:0}
.mm:hover{background:var(--mist-3)}
.mm-t{width:4px;align-self:stretch;border-radius:3px}
.mm-m{flex:1;min-width:0}
.mm-m b{display:block;font-size:13px}
.mm-m span{font-size:11.5px;color:var(--ink-3)}
.mm-n{text-align:right;line-height:1.1}
.mm-n b{font-family:var(--serif);font-size:20px;display:block}
.mm-n span{font-size:10.5px;color:var(--ink-3)}
.mm-n em{font-style:normal;color:var(--risk);font-weight:700}
.livetxt{color:#B3261E}
.askrow{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:12.5px}
.askrow:last-child{border-bottom:0}
.askrow:hover{background:var(--mist-3)}
.askrow-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══ 5. The action card ═════════════════════════════════════════════════ */

.dlg.itemdlg{width:min(1020px,calc(96vw / var(--z)))}
.ih{padding-right:30px}
.ih-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ih-title{font-family:var(--serif);font-size:20px;font-weight:660;border-color:transparent;padding:4px 8px;margin-left:-9px;width:calc(100% + 9px);background:transparent}
.ih-title:hover{border-color:var(--line);background:#fff}
.ih h3{margin:0;font-family:var(--serif);font-size:20px}
.icard-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px}
@media(max-width:1100px){.icard-grid{grid-template-columns:1fr}}
.ic-r{border-left:1px solid var(--line-2);padding-left:20px}
@media(max-width:1100px){.ic-r{border-left:0;padding-left:0}}
.ro{font-size:13.5px;line-height:1.55;padding:3px 0}
.ro.person{display:flex;align-items:center;gap:8px}
.updbox{background:var(--mist-3);border:1px solid var(--line);border-radius:10px;padding:11px 12px 10px;margin:0 0 14px}
.updbox label.f{margin-bottom:8px}
.steps{margin:0 0 14px}
.st{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--line-2)}
.st.on span{text-decoration:line-through;color:var(--ink-3)}
.st .xs-x{margin-left:auto;opacity:0}
.st:hover .xs-x{opacity:1}
.st.add{border-bottom:0;padding-top:8px}
.hist{margin-top:4px}
.hr{display:grid;grid-template-columns:46px 22px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;line-height:1.5}
.hr:last-child{border-bottom:0}
.hd{color:var(--ink-3);font-weight:650;font-variant-numeric:tabular-nums;padding-top:1px}
.ht q{quotes:"“" "”";color:var(--ink)}
.ht .at{color:var(--ink-3);font-size:11.5px}
.ht b.mv{color:var(--orange)}
.ht b.ok,.ok{color:var(--ok)}
.why{background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:9px;padding:10px 12px;margin-top:10px}
.why b{font-size:13px;color:#6B4A06}
.why p{margin:3px 0 0}
.seg.prog{display:flex;flex-wrap:wrap}
.seg.prog .done-b{color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.seg.prog .done-b:hover{background:var(--ok-bg)}
.closedbox{background:var(--ok-bg);border-radius:9px;padding:10px 12px;font-weight:650;color:var(--ok);display:flex;align-items:center;gap:10px;margin-bottom:12px}
.toggles{margin:6px 0 12px}
.flrow{display:flex;gap:6px;flex-wrap:wrap}
.parts{display:flex;gap:4px;flex-wrap:wrap}
.pt{opacity:.35;filter:grayscale(1)}
.pt.on{opacity:1;filter:none}
.dlg .row .in[type=date]{width:auto}

/* ══ 6. Meetings list ═══════════════════════════════════════════════════ */

.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-bottom:16px}
.scard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--t);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px 12px;display:flex;flex-direction:column;gap:12px}
.sc-h h3{margin:0;font-family:var(--serif);font-size:19px}
.sc-next{display:flex;align-items:baseline;gap:8px}
.sc-next b{font-size:18px;font-family:var(--serif)}
.sc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--mist-3);border-radius:9px;padding:9px 6px}
.sc-stats div{text-align:center;line-height:1.15}
.sc-stats b{display:block;font-family:var(--serif);font-size:21px}
.sc-stats span{font-size:10.5px;color:var(--ink-3)}
.sc-stats .bad b{color:var(--risk)}
.sc-stats .warn b{color:var(--orange)}
.sc-stats .good b{color:var(--ok)}
.sc-f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sc-past{margin-top:-4px}

/* ══ 7. Preparing a meeting ═════════════════════════════════════════════ */

.prep-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:1350px){.prep-grid{grid-template-columns:1fr}}
.agenda{padding:6px 15px 12px}
.ag{padding:10px 0;border-bottom:1px solid var(--line-2)}
.ag:last-child{border-bottom:0}
.ag-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ag-h h4{margin:0;font-size:14px}
.ag-h .n{font-size:11.5px;font-weight:800;color:var(--ink-3)}
.ag-n{width:22px;height:22px;border-radius:50%;background:var(--jor);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.ag-b{margin:7px 0 0 31px}
.agl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;flex-wrap:wrap}
.agl:hover{background:var(--mist-3)}
.agl.g{cursor:default}
.agl-t{flex:1;min-width:160px;font-weight:560}
.agl .xs-x{opacity:0}
.agl:hover .xs-x{opacity:1}
.addg{display:flex;gap:6px;margin-top:8px}
.addg .in{flex:1}
.att{display:flex;flex-direction:column;gap:6px}
.atr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.atr .pn b{font-size:13px}
.bigstat{font-size:13px;color:var(--ink-2)}
.bigstat b{font-family:var(--serif);font-size:24px;color:var(--ink)}
.nudge{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line-2)}
.nudge:last-child{border-bottom:0}
.nudge .person{gap:7px;font-size:13px}
.consent{background:var(--mist-3);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.consent p{margin:6px 0 0}

/* ══ 8. The meeting room ════════════════════════════════════════════════ */

.roombar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(9,40,30,.06)}
.rb-l,.rb-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.livepill{display:inline-flex;align-items:center;gap:7px;background:#FFECEA;color:#B3261E;font-weight:800;font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;border-radius:999px;padding:5px 12px}
.livepill b{font-variant-numeric:tabular-nums;letter-spacing:0;font-size:13px;color:#7B1810}
.rb-t b{display:block;font-family:var(--serif);font-size:18px;line-height:1.1}
.rb-t span{font-size:12px;color:var(--ink-3)}
.rb-p{border:0;background:transparent;cursor:pointer;padding:4px;border-radius:8px}
.rb-p:hover{background:var(--mist-3)}
.btn.rec.on{background:#FF4A3A;border-color:transparent;color:#fff}

.room{display:grid;grid-template-columns:230px minmax(0,1fr);height:calc(100vh / var(--z) - 58px - 61px);min-height:420px}
.room.with-tx{grid-template-columns:230px minmax(0,1fr) 340px}
.rail{border-right:1px solid var(--line);background:#fff;padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.ri{display:flex;align-items:center;gap:9px;border:0;background:transparent;text-align:left;padding:8px 8px;border-radius:9px;cursor:pointer;font:inherit;color:var(--ink)}
.ri:hover{background:var(--mist-3)}
.ri-n{width:20px;height:20px;border-radius:50%;background:var(--mist-2);color:var(--jor-deep);font-size:11px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.ri-t{flex:1;font-size:13px;font-weight:600;line-height:1.25}
.ri-t small{display:block;font-size:11px;color:var(--ink-3);font-weight:500}
.ri .n{font-size:12px;font-weight:800;color:var(--ink-3)}
.rail-prog{margin-top:auto;padding:12px 8px 4px}
.rmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.rscroll{flex:1;overflow-y:auto;padding:16px 20px 20px;min-height:0}

.rsec{margin-bottom:22px}
.rsec-h{display:flex;align-items:center;gap:9px;margin:0 0 10px}
.rsec-h h3{margin:0;font-family:var(--serif);font-size:18px}
.rs-end{height:30px}
.donelist{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dl{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:13px;flex-wrap:wrap}

.icard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:11px 14px 12px;margin-bottom:9px;cursor:pointer;

.icard.closed{opacity:.75}
.ic-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ic-t{font-size:14.5px;flex:1;min-width:200px;cursor:pointer}
.ic-t:hover{color:var(--jor-deep);text-decoration:underline;text-decoration-color:var(--mist)}
.ic-o{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.ic-why{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ic-d{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.ic-last{font-size:13px;margin-top:7px;color:var(--ink-2);line-height:1.5}
.herenow{margin-top:8px;font-size:12.5px;color:var(--ok);background:var(--ok-bg);border-radius:7px;padding:6px 10px;line-height:1.5}
.herenow .ic{width:13px;height:13px;vertical-align:-2px}
.herenow b{color:#075C3A}
.ic-ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ic-upd{margin-top:10px}
.ic-upd .btn{align-self:stretch}
.islim{display:flex;align-items:center;gap:9px;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:13px}
.islim:hover{border-color:#C9D9D1}
.islim b{font-weight:600}
.islim .lu{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:9px;cursor:pointer}
.gcard.cur{border-color:var(--jor);box-shadow:0 0 0 3px rgba(0,166,110,.13)}
.gc-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.gc-h b{font-size:14px}
.newlist{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.nr{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.nr:last-child{border-bottom:0}
.nr-t{flex:1;min-width:180px;font-size:13.5px;cursor:pointer}
.nr select.in.sm{width:auto;max-width:190px}
.nr input.in.sm{width:auto}

.cap{border-top:1px solid var(--line);background:#fff;padding:10px 20px 12px;box-shadow:0 -6px 18px rgba(9,40,30,.06);flex:0 0 auto}
.cap-top{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.cap-top .mini b{color:var(--ink)}
.cap-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cap-row .in{font-size:14px;padding:9px 12px}
.cap-o{width:auto!important;max-width:200px}
.cap-d{width:auto!important}
.cap-row .mic{width:40px;height:40px}
.cap-row .btn.p{padding:9px 18px;font-size:14px}
.cap-chips{margin-top:7px}

.tx{border-left:1px solid var(--line);background:#FBFCFB;display:flex;flex-direction:column;min-height:0}
.tx-h{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tx-h h3{margin:0;font-size:14px}
.tx-h .xs-x{margin-left:auto}
.lis{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#B3261E}
.tx-note{font-size:11.5px;color:var(--amber);background:var(--amber-bg);padding:6px 14px}
.tx-l{flex:1 1 40%;overflow-y:auto;padding:8px 10px;min-height:120px}
.txl{display:grid;grid-template-columns:38px minmax(0,1fr);gap:2px 6px;padding:5px 4px;font-size:12.5px;line-height:1.45;border-bottom:1px dashed var(--line-2)}
.txl .ts{color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums;padding-top:1px}
.txl .tag{grid-column:2;justify-self:start;font-size:10px;font-weight:700;color:var(--jor-deep);background:var(--mist-2);border-radius:4px;padding:0 5px}

.tx-go{padding:10px 12px;border-top:1px solid var(--line)}
.tx-go p{margin:6px 0 0}
.tx-sg{flex:1 1 60%;overflow-y:auto;padding:0 12px 12px}
.tx-sg:empty{display:none}
.sg-h{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;position:sticky;top:0;background:#FBFCFB;z-index:1}
.sg{background:#fff;border:1px solid var(--line);border-left:3px solid var(--jor);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.sg.k-decision{border-left-color:#6C63B5}
.sg.k-update{border-left-color:var(--amber)}
.sg-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.sg-top .xs-x{margin-left:auto}
.sg textarea{font-size:13px;font-weight:600;min-height:0}
.sg-row{display:flex;gap:6px;margin-top:6px}
.sg-row .in{flex:1;min-width:0}
.sg-src{font-size:11.5px;color:var(--ink-3);margin:6px 0 8px;line-height:1.45}
.fin{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.fin div{background:var(--mist-3);border-radius:9px;padding:10px;text-align:center}
.fin b{display:block;font-family:var(--serif);font-size:24px}
.fin span{font-size:11.5px;color:var(--ink-3)}
.fin .warn b{color:var(--orange)}
.passlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pass{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;font:inherit;text-align:left}
.pass:hover{border-color:var(--jor);background:var(--mist-3)}

/* ══ 9. Minutes ═════════════════════════════════════════════════════════ */

.mtool{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 24px 10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.mstate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 24px 0;max-width:900px;margin:0 auto}
.mstate .chk{margin:0}
.desk{padding:14px 24px 60px}
.doc{background:#fff;max-width:880px;margin:0 auto;box-shadow:0 1px 3px rgba(9,40,30,.08),0 18px 50px rgba(9,40,30,.12);border-radius:4px;overflow:hidden;
  font-size:12.5px;line-height:1.5;color:#1B2B24}
.d-band{background:var(--jor);display:flex;align-items:center;justify-content:space-between;padding:20px 36px;position:relative;overflow:hidden;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-band::after{content:"";position:absolute;right:-40px;top:-30px;width:200px;height:170px;background:rgba(255,255,255,.08);transform:skewX(-18deg)}
.d-band img{height:36px;position:relative;z-index:1}
.d-kick{color:#fff;font-family:var(--serif);font-size:15px;letter-spacing:.24em;text-transform:uppercase;position:relative;z-index:1}
.d-title{padding:24px 36px 4px}
.d-over{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--jor-deep)}
.d-title h1{margin:4px 0 0;font-family:var(--serif);font-size:30px;letter-spacing:-.01em;color:#0E2A1F;line-height:1.1}
.d-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin:16px 36px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.d-meta div{display:flex;gap:10px;align-items:baseline}
.d-meta .wide{grid-column:1/-1}
.d-meta span{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);min-width:76px}
.d-meta b{font-weight:560}
.d-brief{margin:16px 36px 0;background:var(--mist-3);border-left:4px solid var(--jor);border-radius:0 8px 8px 0;padding:12px 16px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-brief-k{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--jor-deep);margin-bottom:3px}
.d-brief p{margin:0;font-size:13.5px;line-height:1.6;color:#23392F}
.d-sum{display:grid;grid-template-columns:repeat(5,1fr);margin:16px 36px 4px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.d-sum div{text-align:center;padding:9px 4px;font-size:10.5px;color:var(--ink-3);border-right:1px solid var(--line-2)}
.d-sum div:last-child{border-right:0}
.d-sum b{display:block;font-family:var(--serif);font-size:23px;color:#0E2A1F;line-height:1.1}
.d-sum .good b{color:var(--ok)}
.d-sum .warn b{color:var(--orange)}
.d-sec{padding:16px 36px 4px}
.d-sec h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:var(--serif);font-size:17px;color:#0E2A1F;
  padding-bottom:6px;border-bottom:2px solid var(--jor);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-sec h2 span{width:22px;height:22px;border-radius:50%;background:var(--jor);color:#fff;font-family:var(--sans);font-size:11px;font-weight:800;display:grid;place-items:center;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-decs{display:grid;gap:6px}
.d-dec{display:flex;gap:12px;align-items:flex-start;border:1px solid #EADFC0;border-left:4px solid var(--gold);background:#FFFCF3;border-radius:0 8px 8px 0;padding:9px 12px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
.d-dec b{font-weight:600;font-size:13px}
.d-ref{font-size:9.5px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.d-t{width:100%;border-collapse:collapse;font-size:11.5px}
.d-t th{text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#fff;background:var(--jor);padding:6px 8px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-t td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.d-t tr{break-inside:avoid}
.d-t thead{display:table-header-group}
.d-grp td{background:var(--mist-2);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--jor-deep);padding:5px 8px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-grp span{color:var(--ink-3);margin-left:4px}
.d-acts .c-ap{width:21%}
.d-acts .c-ap b{display:block;font-weight:650;font-size:12px;line-height:1.35}
.d-acts .c-ap .d-ref{display:block;margin-top:2px}
.d-acts .c-task{width:21%}
.d-acts td.c-task{color:#2C4038}
.d-acts .c-upd{width:30%}
.d-acts .c-who{width:12%;white-space:nowrap}
.d-acts .c-due{width:7%;white-space:nowrap;font-variant-numeric:tabular-nums}
.d-acts .c-st{width:9%;white-space:nowrap}
.d-who{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.d-who i{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.02em;background:var(--mist);color:var(--jor-deep);border-radius:4px;padding:1px 4px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-help{display:block;font-size:10.5px}
.st{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 6px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.st-done{background:var(--ok-bg);color:var(--ok)}
.st-new{background:var(--gold-pale);color:var(--gold-ink)}
.st-moved{background:var(--orange-bg);color:var(--orange)}
.st-wait{background:#EFECF8;color:#5A4FA0}
.st-over{background:var(--risk-bg);color:var(--risk)}
.st-drop{background:#F1F5F3;color:var(--ink-3)}
.st-nr{background:#F1F5F3;color:var(--ink-2)}
.st-ok{background:var(--mist-2);color:var(--jor-deep)}
.d-t b.mv,.mv{color:var(--orange)}
.doc .muted{color:var(--ink-3)}
.d-people{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.d-person{border:1px solid var(--line);border-radius:8px;padding:9px 12px;break-inside:avoid}
.d-ph{display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line-2);margin-bottom:4px}
.d-ph i{font-style:normal;font-size:9.5px;font-weight:800;background:var(--jor);color:#fff;border-radius:5px;padding:2px 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-ph b{font-size:13px}
.d-ph span{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:700}
.d-person ul{list-style:none;margin:0;padding:0}
.d-person li{display:flex;gap:10px;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line-2);font-size:11.5px}
.d-person li:last-child{border-bottom:0}
.d-li em{font-style:normal;font-size:9px;font-weight:800;text-transform:uppercase;color:var(--gold-ink);letter-spacing:.05em}
.d-ld{white-space:nowrap;color:var(--ink-2);font-variant-numeric:tabular-nums}
.d-ld.over{color:var(--risk);font-weight:700}
.d-done .c-ap{width:34%}
.d-notes{margin:0;padding-left:20px}
.d-notes li{margin-bottom:5px}
.d-tx p{margin:0 0 4px;font-size:10.5px}
.d-tx span{display:inline-block;width:40px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.d-foot{break-inside:avoid;margin:20px 36px 28px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;display:grid;gap:8px}
.d-next{display:flex;gap:12px;align-items:baseline;background:var(--jor);color:#fff;border-radius:8px;padding:10px 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-next span{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.d-next b{font-family:var(--serif);font-size:15px}
.owners{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:1100px){.owners{grid-template-columns:1fr}}
.ow{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ow-h{display:flex;align-items:center;gap:8px}
.ow-b{white-space:pre-wrap;font-family:var(--sans);font-size:12px;margin:8px 0 0;color:var(--ink-2);line-height:1.5}
/* Screen only: on paper the page is narrow too, but every column must print. */
@media screen and (max-width:900px){.d-people{grid-template-columns:1fr}.d-acts .c-task{display:none}}

/* ══ 10. Register ═══════════════════════════════════════════════════════ */

.filters{gap:8px}
.filters select.in{width:auto;max-width:210px}
.srch{display:flex;align-items:center;gap:6px;flex:1 1 260px;min-width:200px;position:relative}
.srch .ic{position:absolute;left:10px;color:var(--ink-3)}
.srch .in{padding-left:32px}
.tscroll.tall{max-height:calc(68vh / var(--z))}
table.reg td{vertical-align:top}
table.reg td b{font-weight:600}
table.reg .lu-c{font-size:12px;color:var(--ink-2);max-width:340px}
table.reg tr.grp td{background:var(--mist-2);font-weight:700;font-size:12px;color:var(--jor-deep);position:sticky;top:34px}
.declist{max-height:calc(68vh / var(--z));overflow:auto}
.decrow{display:flex;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.decrow:hover{background:var(--mist-3)}
.dr-d{text-align:center;flex:0 0 52px;line-height:1.1}
.dr-d b{display:block;font-family:var(--serif);font-size:16px}
.dr-d span{font-size:11px;color:var(--ink-3)}
.dr-t{font-size:14px;font-weight:600;line-height:1.45;margin-bottom:3px}

/* ══ 11. Team ═══════════════════════════════════════════════════════════ */

.tile.danger .tv{color:var(--risk)}
.tile.warn .tv{color:var(--orange)}
table.team td{vertical-align:top}
.tl-c{max-width:320px}
.tlist{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.tlist::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#E1A200;margin-right:7px;vertical-align:2px}
b.bad{color:var(--risk)}
b.warnc{color:var(--orange)}
.chartwrap{position:relative}
.legend-row{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.wkchart{height:auto}
.wkchart .hit.on{fill:rgba(0,135,90,.06)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.5;padding:7px 10px;border-radius:8px;
  box-shadow:0 8px 24px rgba(4,30,20,.3);white-space:nowrap;z-index:5}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.bar{grid-template-columns:minmax(0,210px) 1fr 40px}

/* ══ 12. Settings ═══════════════════════════════════════════════════════ */

.mems{display:flex;flex-wrap:wrap;gap:6px}
.mem{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:12.5px;cursor:pointer;background:#fff}
.mem input{display:none}
.mem.on,.mem:has(input:checked){background:var(--mist-2);border-color:#A9D8C3;font-weight:600}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #BFD2C9;border-radius:12px;padding:26px;cursor:pointer;text-align:center;color:var(--ink-2)}
.drop:hover,.drop.over{border-color:var(--jor);background:var(--mist-3)}
.drop .ic{width:26px;height:26px;color:var(--jor)}
.tabs-pick{display:flex;gap:8px;flex-wrap:wrap}
.tpick{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;text-align:left;cursor:pointer;font:inherit}
.tpick b{display:block;font-size:13.5px}
.tpick span{font-size:11.5px;color:var(--ink-3)}
.tpick.on{border-color:var(--jor);background:var(--mist-2);box-shadow:0 0 0 2px rgba(0,166,110,.15)}
.tpick:disabled{opacity:.45;cursor:default}
.imp-grid{grid-template-columns:minmax(0,1fr) 300px;align-items:start}
@media(max-width:1400px){.imp-grid{grid-template-columns:1fr}}
table.imp td{vertical-align:top;font-size:12.5px}
table.imp select.in{min-width:112px}
table.imp td b{font-weight:600}
table.imp .notes{color:var(--amber);margin-top:3px}
.mapr{display:grid;grid-template-columns:minmax(52px,92px) minmax(0,1fr);gap:6px;align-items:center;margin-bottom:8px}
.mapr b{overflow-wrap:anywhere;font-size:12.5px;line-height:1.2}
.mapr input{grid-column:2}

/* ══ 13. Dialogs and toasts ═════════════════════════════════════════════ */

.scrim{position:fixed;inset:0;z-index:80;background:rgba(9,32,24,.5);backdrop-filter:blur(2px);display:grid;place-items:center;padding:24px;animation:fade .14s ease;
  width:calc(100vw / var(--z));height:calc(100vh / var(--z))}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{background:#fff;border-radius:14px;width:min(620px,calc(96vw / var(--z)));max-height:calc(88vh / var(--z));display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(4,30,20,.42);overflow:hidden}
.dlg.wide{width:min(940px,calc(96vw / var(--z)))}
.dlg-h{padding:16px 20px 13px;border-bottom:1px solid var(--line-2);position:relative;flex:0 0 auto}
.dlg-h h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:660;letter-spacing:-.015em;padding-right:32px}
.dlg-sub{margin-top:5px}
.dlg-h .x{position:absolute;right:14px;top:14px;border:0;background:transparent;font-size:17px;cursor:pointer;color:var(--ink-3);line-height:1;padding:4px 7px;border-radius:7px}
.dlg-h .x:hover{color:var(--ink);background:var(--mist-2)}
.dlg-b{padding:18px 20px;overflow-y:auto;flex:1 1 auto}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;background:var(--mist-3);flex:0 0 auto}
.dlg-f .rowend{margin-left:auto}
.lede{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0 0 14px}

/* With a dialog open the corner is where its buttons are, so toasts go to the top. */

.toast{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:11px 14px;border-radius:10px;font-size:13px;line-height:1.45;
  box-shadow:0 12px 34px rgba(4,30,20,.34);max-width:min(460px,calc(86vw / var(--z)));opacity:0;transform:translateY(9px);transition:opacity .22s,transform .22s;
  border-left:3px solid var(--gold);pointer-events:auto}

/* ══ 14. Printing the minutes ═══════════════════════════════════════════
   Only the document; A4; the green kept. Margins come from @page so the
   band runs to the paper's edge on screen-like proportions.            */


@media print{
  body.printing{zoom:1;background:#fff}
  body.printing #app>.topbar,body.printing .mtool,body.printing .mstate,body.printing .toasts{display:none!important}

  body.printing .doc{box-shadow:none;border-radius:0;max-width:none;font-size:9.5pt}
  body.printing .d-band{margin:0 -13mm;padding:16px 13mm}
  body.printing .d-title,body.printing .d-sec{padding-left:0;padding-right:0}

}

.pl-v{font-size:12.5px;white-space:nowrap;min-width:150px;text-align:right}
.pl-sep{height:1px;background:var(--line-2);margin:6px 0}

/* Procedures: kept per department, read in from a Word document, added to a to-do as steps. */
.procrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.procrow:last-child{border-bottom:0}
.procrow>div{flex:1;min-width:0}
.procsteps{margin:4px 0 12px;padding-left:22px;font-size:13px;line-height:1.45}
.procsteps li{margin:2px 0}
.procpick select{width:100%;color:var(--ink-3)}
/* The steps in a to-do: kept apart from the minutes' status pill, which shares the name .st. */
.steps .st{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;border-radius:0;border-bottom:1px dashed var(--line-2)}
.steps .st.add{border-bottom:0;padding-top:8px}
.steps .st.add .in{flex:1;min-width:0;font-weight:400}

.rvflag{margin:0 0 0 4px;font-size:12px;white-space:nowrap}

/* Who's speaking: beside the transcript where there's room, under it where there isn't. */
.tx-wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-top:6px}
.tx-wrap .tx-l{flex:1 1 340px;min-width:0;margin-top:0}
.tx-wrap .tx-l.tall{max-height:420px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.spk{flex:0 1 250px;min-width:210px;background:var(--mist-3);border:1px solid var(--line);border-radius:8px;padding:10px}
.spk h5{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.spk .mini{margin:0 0 8px}
.spk-r{background:#fff;border:1px solid var(--line-2);border-radius:7px;padding:7px 8px;margin-bottom:6px}
.spk-r.unk{border-color:var(--gold, #D9A21B)}
.spk-t{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.spk-q{font-size:11.5px;color:var(--ink-3);font-style:italic;margin:3px 0 5px;line-height:1.35}
.spk-r select{width:100%}
.spk-n{font-weight:700;color:var(--jor-deep)}
.spk-n.unk{color:#9A6B00;background:#FFF4D6;border-radius:3px;padding:0 3px}
.waitcard .card-b>p:first-child{margin-top:0}

</style>

<script>/* when.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — dates
   Every date in the app is a plain 'YYYY-MM-DD' string, worked in UTC so a
   clock change can never move a deadline by a day.

   parse() reads a date out of ordinary speech: "by Friday", "end of the
   month", "the 9th of October", "before the next meeting", "02/10". It is
   what lets a to-do be typed (or said) as one line, and what lets the
   meeting transcript turn "Maude will send it by the 9th" into a due date.
   No DOM in here, so the tests run it under Node.
   ═══════════════════════════════════════════════════════════════════════ */

(function (root) {
  'use strict';

  const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july',
    'august', 'september', 'october', 'november', 'december'];
  const MON3 = MONTHS.map(function (m) { return m.slice(0, 3); });
  const DAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  const DSHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MSHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  /* ══ Arithmetic ════════════════════════════════════════════════════════ */

  function D(s) {
    const p = String(s).split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  }
  function iso(d) { return d.toISOString().slice(0, 10); }
  function ymd(y, m, d) { return iso(new Date(Date.UTC(y, m, d))); }
  function add(s, n) { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
  function diff(a, b) { return Math.round((D(b) - D(a)) / 864e5); }
  function dow(s) { return D(s).getUTCDay(); }
  function dim(y, m) { return new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); }
  function valid(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }

  /* A deadline that lands on a weekend is really the Friday before. */
  function workBack(s) { const w = dow(s); return w === 6 ? add(s, -1) : w === 0 ? add(s, -2) : s; }
  function workFwd(s) { const w = dow(s); return w === 6 ? add(s, 2) : w === 0 ? add(s, 1) : s; }
  function addWork(s, n) {
    let d = s, k = 0;
    while (k < n) { d = add(d, 1); if (dow(d) !== 0 && dow(d) !== 6) k++; }
    return d;
  }

  function mondayOf(s) { const w = dow(s); return add(s, w === 0 ? -6 : 1 - w); }
  /* "This week" ends on the Friday; asked at the weekend it means next week's. */
  function fridayOf(s) { const w = dow(s); return w === 6 ? add(s, 6) : w === 0 ? add(s, 5) : add(s, 5 - w); }
  function sundayOf(s) { return add(mondayOf(s), 6); }
  function monthEnd(s) { const d = D(s); return ymd(d.getUTCFullYear(), d.getUTCMonth(), dim(d.getUTCFullYear(), d.getUTCMonth())); }

  /* ══ Words ═════════════════════════════════════════════════════════════ */

  function fmt(s, style) {
    if (!valid(s)) return s ? String(s) : '';
    const d = D(s), dd = d.getUTCDate(), m = d.getUTCMonth(), y = d.getUTCFullYear(), w = d.getUTCDay();
    switch (style) {
      case 'dm': return dd + ' ' + MSHORT[m];
      case 'short': return DSHORT[w] + ' ' + dd + ' ' + MSHORT[m];
      case 'long': return DAYS[w][0].toUpperCase() + DAYS[w].slice(1) + ' ' + dd + ' ' +
        MONTHS[m][0].toUpperCase() + MONTHS[m].slice(1) + ' ' + y;
      case 'num': return String(dd).padStart(2, '0') + '/' + String(m + 1).padStart(2, '0') + '/' + String(y).slice(2);
      case 'day': return DAYS[w][0].toUpperCase() + DAYS[w].slice(1);
      default: return dd + ' ' + MSHORT[m] + ' ' + y;          // 'med'
    }
  }

  /* How a due date reads next to today: the words people actually use. */
  function rel(s, today) {
    if (!valid(s)) return '';
    const n = diff(today, s);
    if (n === 0) return 'today';
    if (n === 1) return 'tomorrow';
    if (n === -1) return 'yesterday';
    if (n < 0) return n > -14 ? (-n) + ' days ago' : n > -60 ? Math.round(-n / 7) + ' weeks ago' : Math.round(-n / 30) + ' months ago';
    if (n < 7) return DSHORT[dow(s)];
    if (n < 14 && mondayOf(s) === add(mondayOf(today), 7)) return 'next ' + DSHORT[dow(s)];
    if (n < 60) return 'in ' + Math.round(n / 7) + ' weeks';
    return 'in ' + Math.round(n / 30) + ' months';
  }

  /* The same, but only when it adds something beside a date that already
     names the day: "tomorrow", "in 3 weeks" — never "Mon 28 Sep (Mon)". */
  function relNote(s, today) {
    const r = rel(s, today);
    return /^[A-Z][a-z]{2}$/.test(r) ? '' : r;
  }

  /* ══ Reading a date out of speech ══════════════════════════════════════
     Every pattern returns the date and the stretch of text it came from,
     so the caller can take the date phrase out of the title. The earliest
     match wins, then the longest.                                        */

  const NUMW = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8,
    nine: 9, ten: 10, couple: 2, 'a couple of': 2 };
  const MRX = '(january|february|march|april|may|june|july|august|september|october|november|december|' +
    'jan|feb|mar|apr|jun|jul|aug|sept|sep|oct|nov|dec)';
  const DRX = '(monday|mon|tuesday|tues|tue|wednesday|wed|thursday|thurs|thur|thu|friday|fri|saturday|sunday)';

  function monthIx(w) { w = w.toLowerCase(); if (w === 'sept') w = 'sep'; return MON3.indexOf(w.slice(0, 3)); }
  function dayIx(w) { return DAYS.map(function (d) { return d.slice(0, 3); }).indexOf(w.toLowerCase().slice(0, 3)); }

  /* A day and month with no year: this year, unless that is well past. */
  function guessYear(m, d, today) {
    const ty = D(today).getUTCFullYear();
    if (d > dim(ty, m)) return null;
    const cand = ymd(ty, m, d);
    return diff(today, cand) < -60 ? ymd(ty + 1, m, d) : cand;
  }
  function fullYear(y) { y = +y; return y < 100 ? 2000 + y : y; }

  function rules(today, ctx) {
    ctx = ctx || {};
    return [
      { re: /\b(?:the\s+)?day after tomorrow\b/gi, f: function () { return add(today, 2); } },
      { re: /\b(today|tonight|this (?:evening|afternoon|morning)|eod|end of (?:the )?day|close of business|cob)\b/gi, f: function () { return today; } },
      { re: /\b(tomorrow|tmrw|tmw|tmr)\b/gi, f: function () { return add(today, 1); } },
      { re: /\b(?:before|by|at|for|until)?\s*(?:the\s+)?next meeting\b/gi, f: function () {
        return ctx.nextMeeting || add(today, 14); }, label: 'next meeting' },
      { re: /\b(asap|a\.s\.a\.p\.?|as soon as possible|urgently)\b/gi, f: function () { return addWork(today, 2); }, label: 'ASAP' },
      { re: /\b(?:early|start of|beginning of) next week\b/gi, f: function () { return add(mondayOf(today), 7); } },
      { re: /\b(?:end of )?next week\b/gi, f: function () { return add(fridayOf(today), dow(today) === 0 || dow(today) === 6 ? 0 : 7); } },
      { re: /\b(end of (?:the |this )?week|eow|this week|by the weekend|before the weekend)\b/gi, f: function () {
        return fridayOf(today); } },
      { re: /\b(?:in\s+)?(?:a\s+)?fortnight(?:'s time)?\b/gi, f: function () { return add(today, 14); } },
      { re: /\b(end of (?:the |this )?month|eom|month[- ]end)\b/gi, f: function () { return workBack(monthEnd(today)); } },
      { re: /\b(?:end of )?next month\b/gi, f: function () {
        const d = D(today); return workBack(ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, dim(d.getUTCFullYear(), d.getUTCMonth() + 1)));
      } },
      { re: /\b(?:mid|the middle of) next month\b/gi, f: function () {
        const d = D(today); return workFwd(ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, 15)); } },
      { re: /\b(end of (?:the |this )?year|year[- ]end)\b/gi, f: function () { return workBack(D(today).getUTCFullYear() + '-12-31'); } },
      { re: /\bend of (?:the |this )?quarter\b/gi, f: function () {
        const d = D(today), q = Math.floor(d.getUTCMonth() / 3) * 3 + 2;
        return workBack(ymd(d.getUTCFullYear(), q, dim(d.getUTCFullYear(), q)));
      } },
      /* "end of January", "end Jan 2027", "the end of October" */
      { re: new RegExp('\\b(?:the\\s+)?end\\s+(?:of\\s+)?' + MRX + '(?:\\s+(\\d{4}))?\\b', 'gi'), f: function (m) {
        const mi = monthIx(m[0]); if (mi < 0) return null;
        let y = m[1] ? +m[1] : D(today).getUTCFullYear();
        let s = ymd(y, mi, dim(y, mi));
        if (!m[1] && diff(today, s) < -60) { y++; s = ymd(y, mi, dim(y, mi)); }
        return workBack(s);
      } },
      /* "mid October", "middle of November" */
      { re: new RegExp('\\b(?:mid|the middle of|middle of)[- ]' + MRX + '\\b', 'gi'), f: function (m) {
        const mi = monthIx(m[0]); return mi < 0 ? null : guessYear(mi, 15, today) && workFwd(guessYear(mi, 15, today)); } },
      /* "in 3 days", "in two weeks", "in a couple of weeks", "two weeks' time" */
      { re: /\b(?:in\s+)?(\d+|a couple of|a|an|one|two|three|four|five|six|seven|eight|nine|ten)\s+(day|days|week|weeks|month|months)(?:'?s?\s+time)?\b/gi,
        f: function (m, full) {
          if (!/^in\s/i.test(full) && !/time$/i.test(full)) return null;   // "two weeks" on its own is not a deadline
          const n = /^\d+$/.test(m[0]) ? +m[0] : NUMW[m[0].toLowerCase()] || 0;
          if (!n) return null;
          const u = m[1].toLowerCase();
          if (u.indexOf('day') === 0) return add(today, n);
          if (u.indexOf('week') === 0) return add(today, 7 * n);
          const d = D(today);
          const y = d.getUTCFullYear(), mo = d.getUTCMonth() + n;
          return workFwd(ymd(y, mo, Math.min(d.getUTCDate(), dim(y + Math.floor(mo / 12), mo % 12))));
        } },
      /* "the 9th of October", "9 October 2026", "9th Oct" */
      { re: new RegExp('\\b(?:the\\s+)?(\\d{1,2})(?:st|nd|rd|th)?(?:\\s+of)?\\s+' + MRX + '(?:,?\\s+(\\d{4}))?\\b', 'gi'),
        f: function (m) {
          const d = +m[0], mi = monthIx(m[1]);
          if (mi < 0 || d < 1) return null;
          if (m[2]) return d <= dim(+m[2], mi) ? ymd(+m[2], mi, d) : null;
          return guessYear(mi, d, today);
        } },
      /* "October 9th", "Oct 9" */
      { re: new RegExp('\\b' + MRX + '\\s+(?:the\\s+)?(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?\\b', 'gi'),
        f: function (m) {
          const mi = monthIx(m[0]), d = +m[1];
          if (mi < 0 || d < 1) return null;
          if (m[2]) return d <= dim(+m[2], mi) ? ymd(+m[2], mi, d) : null;
          return guessYear(mi, d, today);
        } },
      /* Irish numeric dates: 02/10, 02/10/2026, 2.10.26. Dots and dashes only
         with a year, so "1.5%" or a file reference like 26-1104 is never a date. */
      { re: /\b(\d{1,2})\/(\d{1,2})(?:\/(\d{4}|\d{2}))?(?![\d\/])/g, f: function (m) {
        const d = +m[0], mo = +m[1] - 1;
        if (mo < 0 || mo > 11 || d < 1) return null;
        if (m[2]) { const y = fullYear(m[2]); return d <= dim(y, mo) ? ymd(y, mo, d) : null; }
        return guessYear(mo, d, today);
      } },
      { re: /\b(\d{1,2})[-.](\d{1,2})[-.](\d{4}|\d{2})\b/g, f: function (m) {
        const d = +m[0], mo = +m[1] - 1, y = fullYear(m[2]);
        return mo >= 0 && mo < 12 && d >= 1 && d <= dim(y, mo) ? ymd(y, mo, d) : null;
      } },
      /* "next Friday", "this Thursday", "Friday", "by Mon" */
      { re: new RegExp('\\b(next|this coming|this|coming)?\\s*' + DRX + '\\b', 'gi'), f: function (m) {
        const want = dayIx(m[1]); if (want < 0) return null;
        const q = (m[0] || '').toLowerCase();
        const have = dow(today);
        if (q === 'next') {
          /* The day in next week's Monday-to-Sunday, the way it's said here. */
          const mon = add(mondayOf(today), 7);
          return add(mon, (want + 6) % 7);
        }
        let n = (want - have + 7) % 7;
        if (n === 0) n = q ? 0 : 7;
        return add(today, n);
      } },
      /* "the 30th", "by the 3rd" — this month if still to come, otherwise next. */
      { re: /\bthe\s+(\d{1,2})(?:st|nd|rd|th)\b/gi, f: function (m) {
        const d = +m[0], t = D(today);
        let y = t.getUTCFullYear(), mo = t.getUTCMonth();
        if (d < t.getUTCDate()) { mo++; if (mo > 11) { mo = 0; y++; } }
        return d <= dim(y, mo) ? ymd(y, mo, d) : null;
      } }
    ];
  }

  const LEAD = /\b(?:no later than|at the latest by|by|on|before|for|due|until|till|from|at)\s+(?:the\s+)?$/i;

  function parse(text, today, ctx) {
    text = String(text || '');
    if (!text.trim() || !valid(today)) return null;
    const found = [];
    rules(today, ctx).forEach(function (r) {
      r.re.lastIndex = 0;
      let m;
      while ((m = r.re.exec(text))) {
        const full = m[0];
        let lead = full.length - full.replace(/^\s+/, '').length;
        const date = r.f(m.slice(1).map(function (x) { return x == null ? '' : x; }), full.trim());
        if (date && valid(date)) {
          const start = m.index + lead;
          found.push({ date: date, start: start, end: m.index + full.length, text: full.trim(), label: r.label || null });
        }
        if (m[0] === '') r.re.lastIndex++;
      }
    });
    if (!found.length) return null;
    found.sort(function (a, b) { return a.start - b.start || (b.end - b.start) - (a.end - a.start); });
    const best = found[0];
    /* Take a leading "by", "on", "before" with it, so the title reads cleanly. */
    const before = text.slice(0, best.start);
    const lm = before.match(LEAD);
    if (lm) best.start -= lm[0].length;
    return best;
  }

  /* The text with the date phrase lifted out, spacing and punctuation tidied. */
  function strip(text, hit) {
    if (!hit) return String(text || '').trim();
    const s = (text.slice(0, hit.start) + ' ' + text.slice(hit.end))
      .replace(/\s+([,.;:!?])/g, '$1').replace(/\s{2,}/g, ' ').replace(/[,;:\s-]+$/g, '').trim();
    return s;
  }

  const When = {
    D: D, iso: iso, add: add, diff: diff, dow: dow, valid: valid, fmt: fmt, rel: rel, relNote: relNote,
    workBack: workBack, workFwd: workFwd, addWork: addWork,
    mondayOf: mondayOf, fridayOf: fridayOf, sundayOf: sundayOf, monthEnd: monthEnd,
    parse: parse, strip: strip, MONTHS: MONTHS, MSHORT: MSHORT, DSHORT: DSHORT
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = When;
  else root.When = When;
})(typeof window !== 'undefined' ? window : globalThis);
