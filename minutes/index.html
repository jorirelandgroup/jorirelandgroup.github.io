    let h = '<div class="as-h"><h3>Minutes assistant</h3><span class="gem">' + gemMark() + BOT + '</span></div>';
    h += '<div class="as-b">';

    if (!window.Gemini.ready()) {
      h += '<div class="as-card warnbox"><b>' + BOT + ' isn’t set up on this computer.</b><p>Paste a free key in Settings → ' + BOT + ' once, and recordings, photos of handwritten notes and typed notes can be written up automatically. ' +
        (E.isAdmin(App.ME) ? '<button class="btn sm" data-go="admin/gemini">Set it up</button>' : 'Ask Iain to set it up.') + '</p></div>';
    }

    if (rec) {
      h += '<div class="as-card reclive"><div class="as-row"><span class="recdot"></span><b>' + (st.paused ? 'Paused' : 'Recording') + '</b>' +
        '<span class="mini" id="rec-meta">' + mmss(st.secs) + ' · ' + size(st.bytes) + '</span></div>' +
        '<ul class="recsafe"><li id="rec-saved">' + savedLine(st) + '</li>' +
        '<li id="rec-awake">' + awakeLine(st) + '</li>' +
        '<li>If the page closes or crashes, what’s saved stays here — open the meeting again and press Record more</li></ul>' +
        (st.trouble ? '<p class="mini warnc">' + esc(st.trouble) + '</p>' : '') +
        '<p class="mini">Nothing is sent anywhere until you press <b>Write the minutes</b>. Carry on as normal — tick actions off, add new ones; ' + BOT + ' fills in the rest afterwards.</p></div>';
    } else if (kept[m.id] && kept[m.id].bytes && !jobs[m.id] && ai.status !== 'ready') {
      const k = kept[m.id];
      h += '<div class="as-card"><div class="as-row">' + U.icon('wave') + '<b>Recording kept</b><span class="mini">' + mmss(k.secs) + ' · ' + mb(k.bytes) + (k.sessions > 1 ? ' · ' + k.sessions + ' parts' : '') + '</span></div>' +
        '<p class="mini" style="margin-top:4px">Saved on this computer. It stays here if the page is closed — even after a crash.</p>' +
        '<button class="btn g block" data-act="as-run"' + (window.Gemini.ready() ? '' : ' disabled') + '>Write the minutes with ' + BOT + '</button>' +
        '<div class="row" style="margin-top:8px"><button class="btn sm" data-act="as-record">Record more</button><button class="btn sm" data-act="as-dl">' + U.icon('down') + 'Keep a copy</button>' +
        '<button class="btn sm dngr" data-act="as-del">Delete</button></div></div>';
    }

    if (jobs[m.id] || /preparing|uploading|transcribing|writing/.test(ai.status || '')) {
      const at = STAGES.findIndex(function (s) { return s[0] === ai.status; });
      h += '<div class="as-card busy"><b>' + BOT + ' is working on it</b><p class="mini">You can carry on, or leave this page — it keeps going, and says when the draft is ready.</p><ol class="stages">' +
        stagesFor(ai).map(function (s) {
          const i = STAGES.indexOf(s);
          return '<li class="' + (i < at ? 'done' : i === at ? 'now' : '') + '">' + esc(s[1]) + '</li>';
        }).join('') + '</ol></div>';
    } else if (ai.status === 'error') {
      h += '<div class="as-card errbox"><b>That didn’t work.</b><p>' + esc(ai.error) + '</p>' +
        (canRetry(m) ? '<button class="btn sm" data-act="as-run">Try again</button>' : '') + '</div>';
    } else if (ai.status === 'ready' && ai.draft) {
      const d = ai.draft;
      const n = function (a) { return (a || []).length; };
      h += '<div class="as-card ready"><div class="as-row">' + U.icon('check') + '<b>' + (ai.applied ? 'Added to the minutes' : BOT + '’s draft is ready') + '</b></div>' +
        '<div class="as-counts"><span><b>' + n(d.updates) + '</b>updates</span><span><b>' + n(d.actions) + '</b>new to-dos</span><span><b>' + n(d.decisions) + '</b>decisions</span><span><b>' + n(d.notes) + '</b>notes</span>' + (n(d.discuss) ? '<span><b>' + n(d.discuss) + '</b>for next time</span>' : '') + '</div>' +
        '<button class="btn ' + (ai.applied ? '' : 'g ') + 'block" data-act="as-review">' + (ai.applied ? 'See the draft again' : 'Review and add to the minutes') + '</button></div>';
    }

    if (!rec && !kept[m.id] && !jobs[m.id] && !ai.status) {
      h += '<div class="as-card intro"><p><b>Three ways to fill the minutes</b></p><ol class="ways">' +
        '<li><b>Type as you go</b> — tick actions off on the left, add new ones in the bar at the bottom.</li>' +
        '<li><b>Record the meeting</b> — ' + BOT + ' writes it up afterwards: updates, new to-dos for each person, decisions.</li>' +
        '<li><b>Add a recording, photos or notes</b> — a voice memo from a phone, photos of handwritten notes, rough typed notes, or a Teams transcript.</li></ol></div>';
    }

    /* What Gemini read off the photos, so a misread word can be caught. */
    if (ai.handwriting) {
      const unclear = (ai.handwriting.match(/\[\?\]/g) || []).length;
      h += '<details class="as-hw"><summary>' + U.icon('camera') + '<b>Read from the photos</b><span class="mini">' +
        [ai.pages ? (+ai.pages || 0) + ' page' + (+ai.pages === 1 ? '' : 's') : '', unclear ? '<span class="unk-n">' + unclear + ' unclear</span>' : ''].filter(Boolean).join(' · ') + '</span></summary>' +
        '<pre class="hw-t">' + esc(ai.handwriting).replace(/\[\?\]/g, '<mark class="unk" title="' + BOT + ' couldn’t read this word">[?]</mark>') + '</pre>' +
        (jobs[m.id] ? '' : '<button class="btn sm" data-act="as-hw-edit">Correct the reading and write it up again</button>') + '</details>';
    }

    /* The transcript, from Gemini or from live captions, and who's speaking. */
    const lines = m.transcript || [];
    if (lines.length) {
      h += '<div class="as-tx"><div class="as-row"><b>Transcript</b><span class="mini">' + lines.length + ' lines</span></div>' +
        '<div class="tx-wrap"><div class="tx-l" id="tx-l"></div>' + speakers(m) + '</div></div>';
    }
    h += '</div>';
    return h;
  }

  /* ══ Who's speaking ════════════════════════════════════════════════════
     Gemini names a speaker only when it's clear who it is, and otherwise
     writes Speaker 1, Speaker 2. Each one is listed with how much they
     said and their first words, to choose who it was. */

  function speakersOf(m) {
    const s = S(), byName = {}, by = {}, out = [];
    s.people.forEach(function (p) { byName[p.name.toLowerCase()] = p.id; });
    (m.transcript || []).forEach(function (l) {
      const x = String(l.t || '').match(/^([^:\[\]()]{1,40}):\s*([\s\S]*)$/);
      if (!x) return;
      const k = x[1].trim();
      let r = by[k];
      if (!r) {
        r = by[k] = { label: k, n: 0, sample: '', pid: byName[k.toLowerCase()] || null, unknown: /^(speaker|person|voice)\s*\d+$|^unknown/i.test(k) };
        out.push(r);
      }
      r.n++;
      if (!r.sample && x[2].trim().length > 12) r.sample = x[2].trim().slice(0, 80);
    });
    return out.sort(function (a, b) { return (b.unknown - a.unknown) || (b.n - a.n); });
  }

  function speakers(m) {
    const list = speakersOf(m);
    if (!list.length) return '';
    const can = E.canMinute(S(), App.ME, m), unk = list.filter(function (x) { return x.unknown; }).length;
    const draft = m.ai && m.ai.draft && !m.ai.applied;
    return '<aside class="spk"><h5>Who’s speaking</h5>' +
      (unk && can ? '<p class="mini">' + unk + (unk === 1 ? ' voice wasn’t' : ' voices weren’t') + ' named. Choose who each one is: the name goes into the transcript' +
        (draft ? ', and onto any to-do the write-up gave them' : '') + '.</p>' : '') +
      list.map(function (x) {
        return '<div class="spk-r' + (x.unknown ? ' unk' : '') + '"><div class="spk-t"><b>' + esc(x.label) + '</b><span class="mini">' + x.n + ' line' + (x.n === 1 ? '' : 's') + '</span></div>' +
          (x.sample ? '<div class="spk-q">“' + esc(x.sample) + (x.sample.length >= 80 ? '…' : '') + '”</div>' : '') +
          (can ? U.selectOf('spk', U.whoOptions(m.present, x.unknown ? 'Who is this?' : 'Not ' + x.label.split(' ')[0] + '? Choose…'), '', 'data-ch="spk-name" data-from="' + esc(x.label) + '" class="in sm"') : '') +
          '</div>';
      }).join('') + '</aside>';
  }

  App.onChange['spk-name'] = function (el) {
    const from = el.getAttribute('data-from'), pid = el.value;
    if (!pid || pid === '__new') return;
    const m = mt(App.param);
    const before = m && m.ai && m.ai.draft ? (m.ai.draft.actions || []).filter(function (a) { return !a.owner; }).length : 0;
    A.renameSpeaker(App.param, from, pid);
    const after = m && m.ai && m.ai.draft ? (m.ai.draft.actions || []).filter(function (a) { return !a.owner; }).length : 0;
    U.toast(esc(from) + ' is ' + esc(U.name(pid)) + ' — in the transcript' + (before > after ? ', and on ' + (before - after) + ' to-do' + (before - after === 1 ? '' : 's') + ' in the write-up' : '') + '.', 'good');
    App.render();
  };

  /* A transcript line with its speaker picked out. */
  function lineHtml(l) {
    const x = String(l.t || '').match(/^([^:\[\]()]{1,40}):\s*([\s\S]*)$/);
    const t = x ? '<b class="spk-n' + (/^(speaker|person|voice)\s*\d+$/i.test(x[1].trim()) ? ' unk' : '') + '">' + esc(x[1]) + '</b> ' + esc(x[2]) : esc(l.t);
    return '<div class="txl"><span class="ts">' + Math.floor(l.s / 60) + ':' + String(l.s % 60).padStart(2, '0') + '</span><span class="tt">' + t + '</span></div>';
  }

  /* On the minutes of a meeting written up afterwards — emailed in, or a
     recording added later — the write-up waiting to be reviewed, and the
     speakers still to name. */
  function waiting(m) {
    const ai = m.ai || {}, d = ai.draft;
    if (!E.canMinute(S(), App.ME, m)) return '';
    const pending = ai.status === 'ready' && d && !ai.applied;
    const unk = speakersOf(m).filter(function (x) { return x.unknown; }).length;
    if (!pending && !unk) return '';
    const n = function (a, one, many) { a = a || []; return a.length + ' ' + (a.length === 1 ? one : many); };
    let h = '<div class="card waitcard"><div class="card-h"><h3>' + (pending ? 'The write-up is waiting for you' : 'Name the speakers') + '</h3>' +
      (ai.emailed ? '<span class="note">from ' + esc(ai.emailed.by ? U.first(ai.emailed.by) + '’s email' : 'an email from ' + (ai.emailed.from || 'the office')) + (ai.emailed.subject ? ', “' + esc(ai.emailed.subject) + '”' : '') + '</span>' : '') + '</div><div class="card-b">';
    if (pending) {
      h += '<p>Written from ' + esc(fromWhat(ai)) + ': ' + [n(d.actions, 'new to-do', 'new to-dos'), n(d.updates, 'update', 'updates'), n(d.decisions, 'decision', 'decisions'),
        n(d.discuss, 'point for next time', 'points for next time')].join(', ') + '. Nothing is on anyone’s list until you review it.</p>' +
        '<button class="btn p" data-act="as-review">Review and add to the minutes</button>';
    }
    if ((m.transcript || []).length) {
      h += '<div class="tx-wrap"><div class="tx-l tall">' + m.transcript.map(lineHtml).join('') + '</div>' + speakers(m) + '</div>';
    }
    return h + '</div></div>';
  }

  function gemMark() {
    return '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10z" fill="currentColor"/></svg>';
  }

  /* Keep the timer and level moving without redrawing the page. */
  function tick() {
    clearInterval(ticker);
    ticker = setInterval(function () {
      const st = window.Recorder.state();
      if (!st) { clearInterval(ticker); ticker = null; return; }
      const t = document.getElementById('rec-time'); if (t) t.textContent = mmss(st.secs);
      const l = document.getElementById('rec-lvl'); if (l) l.style.width = Math.round(st.level * 100) + '%';
      const meta = document.getElementById('rec-meta'); if (meta) meta.textContent = mmss(st.secs) + ' · ' + size(st.bytes);
      const sv = document.getElementById('rec-saved'); if (sv) sv.innerHTML = savedLine(st);
      const aw = document.getElementById('rec-awake'); if (aw) aw.innerHTML = awakeLine(st);
    }, 250);
  }

  function awakeLine(st) {
    return st.awake ? U.icon('check') + ' Screen kept awake while recording' : st.canWake ? 'Keeping the screen awake…' :
      '<span class="warnc">This browser can’t keep the screen awake — keep the laptop plugged in and set not to sleep</span>';
  }

  /* Proof it's being kept: when the last piece reached this computer. */
  function savedLine(st) {
    if (st.trouble) return '<span class="warnc">Not saving to this computer</span>';
    if (st.savedAgo == null) return 'Saving to this computer every ' + (window.Recorder.PIECE_MS / 1000) + ' seconds…';
    return U.icon('check') + ' Saved to this computer ' + (st.savedAgo < 2 ? 'just now' : st.savedAgo + ' seconds ago');
  }

  /* When the room opens, find out whether a recording is already kept. */
  function after(m) {
    if (window.Recorder.state()) tick();
    if (kept[m.id] === undefined) {
      kept[m.id] = null;
      window.Recorder.saved(m.id).then(function (k) {
        kept[m.id] = k;
        if (k && App.param === m.id) App.render();
      });
    }
  }

  /* ══ Recording ═════════════════════════════════════════════════════════ */

  App.on['as-record'] = function () {
    const m = mt(App.param);
    const go = function () {
      window.Recorder.start(m.id, function (why, stopped) {
        U.toast(esc(why), 'bad', 12000);
        if (stopped) window.Recorder.saved(m.id).then(function (k) { kept[m.id] = k; App.render(); });
        else App.render();
      }).then(function () { tick(); App.render(); U.toast('Recording. It saves to this computer every few seconds.', 'good'); })
        .catch(function (e) { U.toast(esc(e.message), 'bad', 8000); });
    };
    if (m.consent) { go(); return; }
    U.confirm({ title: 'Record the meeting?', yes: 'Everyone agrees — record',
      body: '<p>Only if everyone here agrees. The recording is kept on this computer and sent to Gemini only when you ask it to write up the minutes. ' +
        'You can delete it from the meeting afterwards.</p><p class="mini">' + BOT + ' uses Gemini, Google’s AI, to turn it into a transcript. For users in Ireland, Google’s terms say it is not used to train their products.</p>' })
      .then(function (y) { if (y) { A.editMeeting(m.id, { consent: true }, 'Everyone agreed to the meeting being recorded'); go(); } });
  };
  App.on['as-pause'] = function () { window.Recorder.pause(); App.render(); };
  App.on['as-resume'] = function () { window.Recorder.resume(); App.render(); };
  App.on['as-stop'] = function () {
    const mid = App.param;
    window.Recorder.stop().then(function (k) {
      kept[mid] = k;
      App.render();
      if (k && window.Gemini.ready()) {
        U.toast('Recording saved (' + mmss(k.secs) + '). ' + BOT + ' can write it up now.', 'good', 7000, { label: 'Write it up', fn: function () { run(mid, { recording: true }); } });
      }
    });
  };
  /* A copy to keep: each part as its own file. */
  App.on['as-dl'] = function () {
    const mid = App.param;
    window.Recorder.segments(mid).then(function (list) {
      list.forEach(function (sg, i) {
        setTimeout(function () {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(sg.blob);
          a.download = titleOf(mt(mid)) + ' ' + mt(mid).date + (list.length > 1 ? ' part ' + (i + 1) : '') + '.' + sg.blob.name.split('.').pop();
          document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        }, i * 700);
      });
    });
  };
  App.on['as-del'] = function () {
    const mid = App.param;
    U.confirm({ title: 'Delete the recording?', tone: 'danger', yes: 'Delete it', body: '<p>The sound is deleted from this computer. Anything already written into the minutes stays.</p>' })
      .then(function (y) { if (y) window.Recorder.clear(mid).then(function () { kept[mid] = null; App.render(); }); });
  };
  App.on['as-run'] = function () {
    const m = mt(App.param), ai = m.ai || {};
    const p = ai.status === 'error' && ai.parts ? ai.parts : null;       // a retry repeats what failed
    const want = function (k) { return !p || p.indexOf(k) >= 0; };
    const input = {};
    if (kept[m.id] && want('recording')) input.recording = true;
    else if (p && want('file') && files[m.id]) input.file = files[m.id];
    if (p && want('photos')) {
      if (ai.handwriting) input.handwriting = ai.handwriting;          // already read: don't pay for it twice
      else if (pics[m.id]) input.photos = pics[m.id];
    }
    if (ai.notes && want('notes')) input.notes = ai.notes;
    if (!input.recording && !input.file && !input.photos && !input.handwriting && !input.notes) return;
    run(m.id, input);
  };

  /* ══ Adding a recording, photos or notes ═══════════════════════════════ */

  const MAX_PAGES = 30;
  let picked = [];                 // photos chosen in the open dialog: { file, url }

  function openAdd(pre) {
    picked = [];
    U.modal({
      title: 'Add a recording, photos or notes', wide: true, cls: 'adddlg',
      sub: '<span class="mini">Any or all of them. ' + BOT + ' writes them up into the minutes in the background. Nothing goes in until you’ve looked at it.</span>',
      body: '<div class="addways">' +
        '<div class="aw"><h4>' + U.icon('wave') + 'A recording</h4><p class="mini">A voice memo from a phone, or any audio file — m4a, mp3, wav, webm, ogg. Up to a few hours.</p>' +
        '<label class="drop sm" id="as-adrop"><input type="file" id="as-file" accept="audio/*,.m4a,.mp3,.wav,.webm,.ogg,.aac,.flac,.opus,.mp4" hidden>' + U.icon('upload') + '<b>Choose the recording</b><span class="mini" id="as-fname">or drop it here</span></label></div>' +
        '<div class="aw aw-photos"><h4>' + U.icon('camera') + 'Photos of handwritten notes</h4><p class="mini">A photo of each page, or a scanned PDF. On a phone this can take the photos. ' + BOT + ' writes out what it can read and marks what it can’t.</p>' +
        '<label class="drop sm" id="as-pdrop"><input type="file" id="as-photos" accept="image/*,.heic,.heif,.pdf,application/pdf" multiple hidden>' + U.icon('upload') + '<b>Choose the photos</b><span class="mini">or drop them here</span></label>' +
        '<div class="pthumbs" id="as-pthumbs"></div></div>' +
        '<div class="aw aw-notes"><h4>' + U.icon('list') + 'Notes or a transcript</h4><p class="mini">Type or paste rough notes as they were taken, or a Teams transcript (.vtt or text).</p>' +
        '<textarea class="in" id="as-notes" rows="9" placeholder="Type or paste the notes here, however rough."></textarea>' +
        '<div class="row"><label class="btn sm"><input type="file" id="as-vtt" accept=".vtt,.txt,.srt" hidden>' + U.icon('upload') + 'Load a .vtt or .txt</label>' + U.micBtn('#as-notes', 'Dictate the notes') + '</div></div></div>',
      foot: '<button class="btn" data-close>Cancel</button><button class="btn g" data-act="as-add-go"' + (window.Gemini.ready() ? '' : ' disabled title="Set up ' + BOT + ' in Settings first"') + '>Write the minutes with ' + BOT + '</button>',
      on: function (dlg) {
        const f = dlg.querySelector('#as-file');
        f.addEventListener('change', function () { dlg.querySelector('#as-fname').textContent = f.files[0] ? f.files[0].name + ' · ' + size(f.files[0].size) : 'or drop it here'; });
        dropZone(dlg.querySelector('#as-adrop'), function (list) {
          if (!list[0]) return;
          const dt = new DataTransfer(); dt.items.add(list[0]); f.files = dt.files; f.dispatchEvent(new Event('change'));
        });
        const ph = dlg.querySelector('#as-photos');
        ph.addEventListener('change', function () { addPics(ph.files); ph.value = ''; });
        dropZone(dlg.querySelector('#as-pdrop'), addPics);
        dlg.querySelector('#as-pthumbs').addEventListener('click', function (ev) {
          const b = ev.target.closest('button[data-i]');
          if (!b) return;
          ev.preventDefault();
          const i = +b.getAttribute('data-i');
          if (b.classList.contains('rm')) { if (picked[i].url) URL.revokeObjectURL(picked[i].url); picked.splice(i, 1); }
          else if (i > 0) { const t = picked[i - 1]; picked[i - 1] = picked[i]; picked[i] = t; }
          thumbs();
        });
        dlg.querySelector('#as-vtt').addEventListener('change', function (ev) {
          const file = ev.target.files[0]; if (!file) return;
          file.text().then(function (t) { dlg.querySelector('#as-notes').value = fromVtt(t); });
        });
        if (pre && pre.notes) dlg.querySelector('#as-notes').value = pre.notes;
      },
      onClose: function () { picked.forEach(function (p) { if (p.url) URL.revokeObjectURL(p.url); }); }
    });
  }
  App.on['as-add'] = function () { openAdd(); };

  function dropZone(el, take) {
    el.addEventListener('dragover', function (ev) { ev.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', function () { el.classList.remove('over'); });
    el.addEventListener('drop', function (ev) { ev.preventDefault(); el.classList.remove('over'); take(ev.dataTransfer.files); });
  }

  /* Pages chosen together come in name order (IMG_0412, IMG_0413 … or
     Scan 1, Scan 2 …), after any already there; the ‹ button fixes the rest. */
  function addPics(list) {
    let skipped = 0;
    Array.prototype.slice.call(list || []).sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); })
      .forEach(function (f) {
        if (!window.Gemini.pageMime(f) || picked.length >= MAX_PAGES) { skipped++; return; }
        picked.push({ file: f, url: /^image\/(jpeg|png|webp|gif)$/.test(f.type) ? URL.createObjectURL(f) : '' });
      });
    if (skipped) U.toast(skipped + ' file' + (skipped === 1 ? ' was' : 's were') + ' left out: only photos and PDFs, up to ' + MAX_PAGES + ' pages.', 'bad');
    thumbs();
  }

  function thumbs() {
    const box = document.getElementById('as-pthumbs');
    if (!box) return;
    const total = picked.reduce(function (a, p) { return a + p.file.size; }, 0);
    box.innerHTML = picked.map(function (p, i) {
      const ext = (p.file.name.split('.').pop() || '').toUpperCase();
      return '<div class="pth" title="' + esc(p.file.name) + '">' +
        (p.url ? '<img src="' + p.url + '" alt="Page ' + (i + 1) + '">' : '<span class="pth-f"><b>' + esc(ext) + '</b><small>' + esc(p.file.name) + '</small></span>') +
        '<i>' + (i + 1) + '</i>' +
        (i ? '<button type="button" class="lf" data-i="' + i + '" title="Move earlier" aria-label="Move page ' + (i + 1) + ' earlier">‹</button>' : '') +
        '<button type="button" class="rm" data-i="' + i + '" title="Take this page out" aria-label="Take page ' + (i + 1) + ' out">✕</button></div>';
    }).join('') + (picked.length ? '<div class="pcount">' + picked.length + ' page' + (picked.length === 1 ? '' : 's') + ' · ' + size(total) +
      (total > 8388608 ? ' — photos are made smaller before they’re sent' : '') + '</div>' : '');
  }

  /* A Teams transcript (.vtt) as plain "Name: words" lines. */
  function fromVtt(t) {
    if (!/WEBVTT|-->/.test(t)) return t;
    const out = [];
    t.split(/\r?\n/).forEach(function (ln) {
      if (!ln.trim() || /^WEBVTT|^NOTE|-->|^\d+$/.test(ln.trim())) return;
      const v = ln.match(/<v\s+([^>]+)>([\s\S]*?)(?:<\/v>)?$/);
      out.push(v ? v[1].trim() + ': ' + v[2].replace(/<[^>]+>/g, '').trim() : ln.replace(/<[^>]+>/g, '').trim());
    });
    return out.join('\n');
  }

  App.on['as-add-go'] = function () {
    const mid = App.param;
    const f = document.getElementById('as-file').files[0] || null;
    const photos = picked.map(function (p) { return p.file; });
    const notes = document.getElementById('as-notes').value.trim();
    if (!f && !photos.length && !notes) { U.toast('Choose a recording or photos, or type some notes.', 'bad'); return; }
    Voice.stopDictation();
    U.close();
    run(mid, { file: f, photos: photos.length ? photos : null, notes: notes });
  };

  /* A misread word: put what was read into the notes box to correct. */
  App.on['as-hw-edit'] = function () {
    const ai = mt(App.param).ai || {};
    openAdd({ notes: [ai.handwriting, ai.notes].filter(Boolean).join('\n\n') });
  };

  /* ══ The background job ════════════════════════════════════════════════ */

  function context(m) { return window.Gemini.contextFor(S(), m, App.today); }

  function run(mid, input) {
    if (jobs[mid]) return;
    const m = mt(mid);
    const ctx = context(m);
    const stage = function (st) { setAI(mid, { status: st, error: '' }); };
    const audio = !!(input.recording || input.file);
    const photos = input.photos && input.photos.length ? input.photos : null;
    const parts = [];
    if (input.recording) parts.push('recording');
    if (input.file) { parts.push('file'); files[mid] = input.file; }
    if (photos || input.handwriting) parts.push('photos');
    if (photos) pics[mid] = photos;
    if (input.notes) parts.push('notes');
    U.clearToasts();          // a "Write it up" toast is out of date once it's writing
    setAI(mid, { status: audio ? 'preparing' : photos && !input.handwriting ? 'reading' : 'writing', source: parts.join('+'), parts: parts,
      error: '', applied: false, draft: null, notes: input.notes || '', handwriting: input.handwriting || '',
      pages: photos ? photos.length : input.handwriting ? (m.ai && m.ai.pages) || 0 : 0, started: new Date().toISOString() });
    jobs[mid] = (async function () {
      let transcript = '';
      if (audio) {
        /* A file added, or the parts recorded here, one after another, each
           part's times carried on from where the one before ended. */
        const parts0 = input.file ? [{ blob: input.file, secs: 0 }] : await window.Recorder.segments(mid);
        if (!parts0.length) throw new Error('The recording couldn’t be found on this computer.');
        const texts = [];
        let offset = 0;
        for (let i = 0; i < parts0.length; i++) {
          const t = await window.Gemini.transcribe(parts0[i].blob, ctx, stage);
          texts.push((i ? '[' + mmss(offset) + '] (recording carried on)\n' : '') + shiftTimes(t, offset));
          offset += parts0[i].secs || 0;
        }
        transcript = texts.join('\n');
        m.transcript = window.Gemini.lines(transcript);
        setAI(mid, { transcript: transcript });
      }
      let hand = input.handwriting || '';
      if (!hand && photos) {
        hand = await window.Gemini.readNotes(photos, ctx, stage);
        if (!hand) throw new Error(BOT + ' couldn’t make out any writing in the photos.');
        setAI(mid, { handwriting: hand });
      }
      return window.Gemini.draft({ transcript: transcript, handwriting: hand, notes: input.notes || '' }, ctx, stage);
    })().then(function (draft) {
      delete jobs[mid];
      setAI(mid, { status: 'ready', draft: draft, done: new Date().toISOString() });
      C.mutate({ what: BOT + ' drafted the minutes of the ' + titleOf(m) + ': ' + draft.updates.length + ' updates, ' + draft.actions.length + ' new to-dos', kind: 'ai' }, function () { });
      U.toast('<b>' + BOT + '’s draft is ready</b> — ' + draft.updates.length + ' updates, ' + draft.actions.length + ' new to-dos, ' + draft.decisions.length + ' decisions.', 'good', 10000,
        { label: 'Review', fn: function () { App.go('meeting', mid); setTimeout(function () { review(mid); }, 150); } });
    }).catch(function (e) {
      delete jobs[mid];
      setAI(mid, { status: 'error', error: e.message || String(e) });
      U.toast(esc(e.message || BOT + ' couldn’t write it up.'), 'bad', 9000);
    });
    if (App.param === mid) App.render();
  }

  /* ══ Reviewing the draft ═══════════════════════════════════════════════ */

  let rv = null;           // the draft being reviewed, edited in place

  function review(mid) {
    const m = mt(mid);
    if (!m || !m.ai || !m.ai.draft) return;
    rv = { mid: mid, d: JSON.parse(JSON.stringify(m.ai.draft)) };
    draw();
  }
  App.on['as-review'] = function () { review(App.param); };

  function who(sel, pid, attrs, blank) {
    const m = mt(rv.mid);
    return U.selectOf('o', U.whoOptions(m.present, blank || 'Who?'), pid || '', attrs + ' class="in sm"');
  }

  function draw() {
    const s = S(), d = rv.d, T = App.today, m = mt(rv.mid);
    const byOwner = {};
    d.actions.forEach(function (a, i) { (byOwner[a.owner || ''] = byOwner[a.owner || ''] || []).push(i); });
    const owners = Object.keys(byOwner).sort(function (a, b) { return a === '' ? 1 : b === '' ? -1 : U.name(a).localeCompare(U.name(b)); });
    const ev = function (x) { return x ? '<div class="evq">“' + esc(x) + '”</div>' : ''; };
    const dupNote = function (a, i) {
      const o = a.dup && s.itemMap[a.dup];
      if (!o || !E.isOpen(o)) return '';
      return '<div class="rvdup">' + U.icon('copy') + '<span>Looks like <b>' + esc(o.ref) + ' ' + esc(o.title) + '</b>, already open' +
        (o.owner ? ' for ' + esc(U.first(o.owner)) : '') + '. Left unticked so it isn’t on the list twice.</span>' +
        '<button class="btn sm" data-act="rv-merge" data-i="' + i + '">Add it as an update to ' + esc(o.ref) + '</button></div>';
    };
    const chk = function (group, i, on) { return '<input type="checkbox" class="rvk" data-ch="rv-keep" data-g="' + group + '" data-i="' + i + '"' + (on ? ' checked' : '') + '>'; };
    const flag = function (i, f, on, label) {
      return '<label class="chk rvflag"><input type="checkbox" data-ch="rv-b" data-g="actions" data-i="' + i + '" data-f="' + f + '"' + (on ? ' checked' : '') + '> ' + label + '</label>';
    };
    d.discuss = d.discuss || [];

    let h = '<div class="rv">';
    h += '<section><h4>Summary</h4><textarea class="in" rows="3" data-ch="rv-sum">' + esc(d.summary) + '</textarea></section>';

    h += '<section><h4>Updates to open actions <span class="n">' + d.updates.length + '</span></h4>' + (d.updates.length ? d.updates.map(function (u, i) {
      const it = s.itemMap[u.id];
      if (!it) return '';
      return '<div class="rvr' + (u.keep ? '' : ' off') + '">' + chk('updates', i, u.keep) + '<div class="rvm">' +
        '<div class="rvt"><span class="ref">' + esc(it.ref) + '</span><b>' + esc(it.title) + '</b>' + U.avatar(it.owner, 'xs') + U.dueChip(it, T) + '</div>' +
        '<textarea class="in sm" rows="2" data-ch="rv-f" data-g="updates" data-i="' + i + '" data-f="update">' + esc(u.update) + '</textarea>' +
        '<div class="rvc">' + U.selectOf('st', [{ v: 'open', t: 'Still open' }, { v: 'done', t: 'Done' }, { v: 'waiting', t: 'Waiting on someone' }, { v: 'dropped', t: 'Dropped' }], u.status, 'data-ch="rv-f" data-g="updates" data-i="' + i + '" data-f="status" class="in sm"') +
        (u.status === 'open' ? U.selectOf('pc', [0, 25, 50, 75].map(function (p) { return { v: p, t: p + '%' }; }), u.completion, 'data-ch="rv-f" data-g="updates" data-i="' + i + '" data-f="completion" class="in sm"') : '') +
        (u.status === 'waiting' ? '<input class="in sm" placeholder="Waiting on…" value="' + esc(u.waitingOn) + '" data-ch="rv-f" data-g="updates" data-i="' + i + '" data-f="waitingOn">' : '') +
        '<span class="mini">New date</span><input class="in sm" type="date" value="' + esc(u.newDate || '') + '" data-ch="rv-f" data-g="updates" data-i="' + i + '" data-f="newDate">' +
        (u.newDate && it.due && u.newDate > it.due ? U.selectOf('why', D.SLIP.map(function (r) { return { v: r.t, t: r.t }; }), u.dateReason || D.SLIP[2].t, 'data-ch="rv-f" data-g="updates" data-i="' + i + '" data-f="dateReason" class="in sm"') : '') +
        (u.owner && u.owner !== it.owner ? '<span class="fl k-moved">Passes to ' + esc(U.first(u.owner)) + '</span>' : '') + '</div>' + ev(u.evidence) + '</div></div>';
    }).join('') : '<p class="mini">None of the open actions came up.</p>') + '</section>';

    h += '<section><h4>New to-dos, person by person <span class="n">' + d.actions.length + '</span></h4>' + (d.actions.length ? owners.map(function (pid) {
      return '<div class="rvp"><div class="rvp-h">' + (pid ? U.avatar(pid, 'sm') + '<b>' + esc(U.name(pid)) + '</b>' : '<b class="warnc">Nobody named yet</b>') + '</div>' +
        byOwner[pid].map(function (i) {
          const a = d.actions[i];
          return '<div class="rvr' + (a.keep ? '' : ' off') + '">' + chk('actions', i, a.keep) + '<div class="rvm">' +
            '<div class="rvg"><input class="in sm" value="' + esc(a.actionPoint) + '" data-ch="rv-f" data-g="actions" data-i="' + i + '" data-f="actionPoint" title="Action point">' +
            '<input class="in sm grow" value="' + esc(a.task) + '" data-ch="rv-f" data-g="actions" data-i="' + i + '" data-f="task" title="Task"></div>' +
            '<div class="rvc">' + who('o', a.owner, 'data-ch="rv-f" data-g="actions" data-i="' + i + '" data-f="owner"', a.ownerSaid ? '“' + a.ownerSaid + '” — who?' : 'Who?') +
            (a.ongoing ? '' : '<span class="mini">Due</span><input class="in sm" type="date" value="' + esc(a.due || '') + '" data-ch="rv-f" data-g="actions" data-i="' + i + '" data-f="due">') +
            flag(i, 'ongoing', a.ongoing, 'Ongoing') + flag(i, 'priority', a.priority, 'Priority') + flag(i, 'discussNext', a.discussNext, 'Next meeting') +
            (a.update ? '<span class="mini">' + esc(a.update) + '</span>' : '') + '</div>' + ev(a.evidence) + dupNote(a, i) + '</div></div>';
        }).join('') + '</div>';
    }).join('') : '<p class="mini">No new to-dos.</p>') + '</section>';

    h += '<section><h4>Decisions <span class="n">' + d.decisions.length + '</span></h4>' + (d.decisions.length ? d.decisions.map(function (x, i) {
      return '<div class="rvr' + (x.keep ? '' : ' off') + '">' + chk('decisions', i, x.keep) + '<div class="rvm"><input class="in sm" value="' + esc(x.text) + '" data-ch="rv-f" data-g="decisions" data-i="' + i + '" data-f="text">' + ev(x.evidence) + '</div></div>';
    }).join('') : '<p class="mini">No decisions.</p>') + '</section>';

    h += '<section><h4>Notes <span class="n">' + d.notes.length + '</span></h4>' + (d.notes.length ? d.notes.map(function (x, i) {
      return '<div class="rvr' + (x.keep ? '' : ' off') + '">' + chk('notes', i, x.keep) + '<div class="rvm"><input class="in sm" value="' + esc(x.text) + '" data-ch="rv-f" data-g="notes" data-i="' + i + '" data-f="text"></div></div>';
    }).join('') : '<p class="mini">No notes.</p>') + '</section>';

    const nm = nextOf(m);
    h += '<section><h4>For the next meeting <span class="n">' + d.discuss.length + '</span></h4>' +
      '<p class="mini">' + (m.series ? 'Ticked points go on the agenda of the next ' + esc(titleOf(m)) + ', ' + esc(W.fmt(nm ? nm.date : d.nextMeeting || E.nextAfter(s, m), 'med')) +
        (nm ? '' : ' (planned when you add these)') + '.' : 'This meeting isn’t one of a series, so ticked points are kept as notes.') + '</p>' +
      (d.discuss.length ? d.discuss.map(function (x, i) {
        return '<div class="rvr' + (x.keep ? '' : ' off') + '">' + chk('discuss', i, x.keep) + '<div class="rvm"><div class="rvg">' +
          '<input class="in sm grow" value="' + esc(x.text) + '" data-ch="rv-f" data-g="discuss" data-i="' + i + '" data-f="text">' +
          who('o', x.owner, 'data-ch="rv-f" data-g="discuss" data-i="' + i + '" data-f="owner"', 'Anyone') + '</div>' + ev(x.evidence) + '</div></div>';
      }).join('') : '<p class="mini">Nothing put off to the next meeting.</p>') + '</section>';
    h += '</div>';

    const nKeep = ['updates', 'actions', 'decisions', 'notes', 'discuss'].reduce(function (a, g) { return a + d[g].filter(function (x) { return x.keep; }).length; }, 0);
    const noOwner = d.actions.filter(function (a) { return a.keep && !a.owner; }).length;
    const applied = m.ai && m.ai.applied;
    const dlg = document.querySelector('.dlg.rvdlg');
    const foot = '<span class="mini">' + (applied ? 'Already added to the minutes. Adding again would duplicate it.' : noOwner ? '<span class="warnc">' + noOwner + ' to-do' + (noOwner === 1 ? ' has' : 's have') + ' nobody named.</span>' : 'Everything ticked goes into the minutes and onto people’s lists.') + '</span>' +
      '<span class="rowend"></span><button class="btn" data-close>Later</button><button class="btn p" data-act="rv-apply"' + (applied || !nKeep || noOwner ? ' disabled' : '') + '>Add ' + nKeep + ' to the minutes</button>';
    if (dlg) {
      const b = dlg.querySelector('.dlg-b'), sc = b.scrollTop;
      b.innerHTML = h; dlg.querySelector('.dlg-f').innerHTML = foot; b.scrollTop = sc;
    } else {
      U.modal({ title: BOT + '’s draft — ' + titleOf(m) + ', ' + W.fmt(m.date, 'dm'), cls: 'rvdlg', wide: true,
        sub: '<span class="mini">Written from ' + fromWhat(m.ai) + '. Untick anything that’s wrong, correct anything that’s nearly right.</span>',
        body: h, foot: foot, onClose: function () { rv = null; } });
    }
  }

  /* Fold a doubled-up to-do into the update of the action it repeats. */
  App.on['rv-merge'] = function (el) {
    const d = rv.d, i = +el.getAttribute('data-i'), a = d.actions[i], it = S().itemMap[a.dup];
    if (!it) return;
    const words = a.update && a.update !== a.task ? a.task + ' — ' + a.update : a.task;
    /* A date only comes across when one was said, not the next-meeting default. */
    const date = a.dueSaid && a.due && a.due !== it.due ? a.due : '';
    let u = d.updates.find(function (x) { return x.id === it.id; });
    if (u) {
      if (words && u.update.indexOf(words) < 0) u.update = (u.update ? u.update + ' ' : '') + words;
      if (date && !u.newDate) u.newDate = date;
      u.keep = true;
    } else {
      d.updates.push({ id: it.id, ref: it.ref, update: words, completion: Math.max(a.completion || 0, it.progress || 0), status: 'open',
        newDate: date, dateReason: '', waitingOn: '', owner: a.owner && a.owner !== it.owner ? a.owner : null, evidence: a.evidence, keep: true });
    }
    d.actions.splice(i, 1);
    draw();
  };

  App.onChange['rv-keep'] = function (el) { rv.d[el.getAttribute('data-g')][+el.getAttribute('data-i')].keep = el.checked; draw(); };
  App.onChange['rv-b'] = function (el) {
    const x = rv.d[el.getAttribute('data-g')][+el.getAttribute('data-i')], f = el.getAttribute('data-f');
    x[f] = el.checked;
    if (f === 'ongoing' && !el.checked && !x.due) x.due = context(mt(rv.mid)).next;
    draw();
  };

  /* The next meeting of this one's series, if it's already planned. */
  function nextOf(m) {
    if (!m.series) return null;
    return S().meetings.filter(function (x) { return x.series === m.series && x.id !== m.id && x.status === 'planned' && x.date > m.date; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0] || null;
  }
  App.onChange['rv-sum'] = function (el) { rv.d.summary = el.value; };
  App.onChange['rv-f'] = function (el) {
    const x = rv.d[el.getAttribute('data-g')][+el.getAttribute('data-i')], f = el.getAttribute('data-f');
    x[f] = f === 'completion' ? +el.value : el.value || (f === 'owner' ? null : '');
    if (f === 'status' || f === 'owner' || f === 'newDate') draw();
  };

  /* Everything ticked, written through the same actions a chair would use
     by hand, so the minutes and the history can't tell the difference. */
  App.on['rv-apply'] = function () {
    const mid = rv.mid, d = rv.d, m = mt(mid), s = S();
    const prev = A.meetingNow();
    A.inMeeting(mid);
    let n = 0;
    try {
      d.updates.forEach(function (u) {
        if (!u.keep || !s.itemMap[u.id]) return;
        const it = s.itemMap[u.id];
        if (u.owner && u.owner !== it.owner) A.reassign(it.id, u.owner);
        if (u.newDate && u.newDate !== it.due) A.move(it.id, u.newDate, it.due && u.newDate > it.due ? (u.dateReason || D.SLIP[2].t) : '');
        if (u.status === 'done') A.done(it.id, u.update);
        else if (u.status === 'dropped') { if (u.update) A.update(it.id, u.update); A.drop(it.id, 'Decided at the meeting'); }
        else {
          if (u.update) A.update(it.id, u.update);
          if (u.status === 'waiting' && it.status !== 'waiting') A.wait(it.id, u.waitingOn || 'someone outside the meeting');
          if (u.status === 'open' && it.status === 'waiting') A.unwait(it.id);
          if (u.status === 'open' && u.completion !== it.progress && u.completion > it.progress) A.progress(it.id, u.completion);
        }
        n++;
      });
      d.actions.forEach(function (a) {
        if (!a.keep || !a.owner) return;
        const it = A.create({ kind: 'action', title: a.actionPoint || a.task, detail: a.actionPoint && a.task !== a.actionPoint ? a.task : '',
          owner: a.owner, helpers: a.helpers || [], due: a.ongoing ? null : a.due || null, ongoing: !!a.ongoing, high: !!a.priority,
          series: m.series, meeting: mid, topic: 'office' });
        if (a.update) A.update(it.id, a.update);
        if (a.completion) A.progress(it.id, a.completion);
        if (a.discussNext && m.series) A.raise(it.id, m.series);
        n++;
      });
      const talk = (d.discuss || []).filter(function (x) { return x.keep && String(x.text || '').trim(); });
      if (talk.length && m.series) {
        let nm = nextOf(m);
        if (!nm) {
          const on = d.nextMeeting && d.nextMeeting > m.date ? d.nextMeeting : E.nextAfter(s, m);
          nm = A.createMeeting({ series: m.series, date: on });
        }
        talk.forEach(function (x) { A.addAgenda(nm.id, String(x.text).trim(), 'raised', x.owner || null, mid); n++; });
      } else talk.forEach(function (x) {
        A.create({ kind: 'note', title: 'For the next meeting: ' + String(x.text).trim(), series: m.series, meeting: mid, owner: null, topic: 'office' }); n++;
      });
      d.decisions.forEach(function (x) { if (x.keep) { A.create({ kind: 'decision', title: x.text, detail: x.actionPoint || '', series: m.series, meeting: mid, owner: null, topic: 'office' }); n++; } });
      d.notes.forEach(function (x) { if (x.keep) { A.create({ kind: 'note', title: x.text, series: m.series, meeting: mid, owner: null, topic: 'office' }); n++; } });
      A.editMeeting(mid, { summary: d.summary || '', ai: Object.assign({}, m.ai, { applied: true, draft: d }) }, 'Added ' + BOT + '’s draft to the minutes');
    } finally {
      A.inMeeting(prev);
    }
    U.close();
    App.render();
    U.toast(n + ' item' + (n === 1 ? '' : 's') + ' added to the minutes. New to-dos are on each person’s list.', 'good', 6000);
  };

  function busy(mid) { return !!jobs[mid]; }
  function stopRecordingFor(mid) {
    const st = window.Recorder.state();
    if (st && st.mid === mid) return window.Recorder.stop().then(function (k) { kept[mid] = k; });
    return Promise.resolve();
  }

  return { bar: bar, panel: panel, after: after, run: run, review: review, busy: busy, stopRecordingFor: stopRecordingFor, fromVtt: fromVtt, context: context, fromWhat: fromWhat,
    speakers: speakers, speakersOf: speakersOf, waiting: waiting };
})();

</script>
<script>/* digest.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — choosing the emails
   Each person decides for themselves: a short email every weekday
   morning, a weekly one, both, or neither. Bernard and Iain can have
   their weekly one include how everyone below them is getting on. The
   emails are built by mail.js; the server sends them. This file is the
   choosing and the preview.
   ═══════════════════════════════════════════════════════════════════════ */

window.Digest = (function () {
  'use strict';
  const BOT = (window.JOR_MIN_DATA && window.JOR_MIN_DATA.BOT) || 'O’Reilly AI';   // the assistant's name on screen (data.js)

  const App = window.App, C = window.Core, E = window.Engine, W = window.When, U = window.UI, A = window.Actions, Mail = window.Mail;
  const esc = C.esc;

  function prefs(pid) { return Mail.prefsOf(App.S, pid); }

  function save(pid, patch) {
    C.mutate({ what: 'Email choices for ' + U.name(pid), kind: 'prefs' }, function (s) {
      s.prefs = s.prefs || {};
      s.prefs[pid] = Object.assign(Mail.prefsOf(s, pid), patch);
      delete s.prefs[pid].u;
    });
  }

  /* ══ The card on the to-do page ════════════════════════════════════════ */

  function card() {
    const ME = App.ME, p = prefs(ME.id);
    const server = window.Server && window.Server.connected();
    const hours = [7, 8, 9].map(function (h) { return { v: h, t: h + ':00' }; });
    let h = '<div class="card mailcard"><div class="card-h"><h3>' + U.icon('mail') + 'Email me</h3></div><div class="card-b">' +
      '<label class="chk"><input type="checkbox" data-ch="dg" data-f="daily"' + (p.daily ? ' checked' : '') + '> Every weekday morning</label>' +
      (p.daily ? '<div class="dgsub">at ' + U.selectOf('h', hours, p.dailyHour, 'data-ch="dg" data-f="dailyHour" class="in sm"') + ' — today’s list, overdue, and what’s due this week</div>' : '') +
      '<label class="chk"><input type="checkbox" data-ch="dg" data-f="weekly"' + (p.weekly ? ' checked' : '') + '> Once a week</label>' +
      (p.weekly ? '<div class="dgsub">' + U.selectOf('w', [{ v: 'mon', t: 'Monday morning — the week ahead' }, { v: 'fri', t: 'Friday afternoon — the week done' }], p.weekly_when, 'data-ch="dg" data-f="weekly_when" class="in sm"') + '</div>' : '') +
      (ME.access !== 'staff' && p.weekly ? '<label class="chk sub"><input type="checkbox" data-ch="dg" data-f="team"' + (p.team ? ' checked' : '') + '> Include how ' + (ME.access === 'owner' ? 'everyone' : 'my team') + ' is getting on</label>' : '') +
      '<div class="row" style="margin-top:6px"><button class="btn sm" data-act="dg-prev" data-k="daily" data-p="' + esc(ME.id) + '">Preview daily</button>' +
      '<button class="btn sm" data-act="dg-prev" data-k="weekly" data-p="' + esc(ME.id) + '">Preview weekly</button></div>' +
      (!ME.email ? '<p class="mini warnc">There’s no email address for you yet' + (E.isAdmin(ME) ? ' — add it under Settings → People.' : ' — ask Iain to add it.') + '</p>' :
        !server && (p.daily || p.weekly) ? '<p class="mini">Emails start once the server is connected (Settings → Server). Until then, preview shows exactly what you’ll get.</p>' :
          (p.daily || p.weekly) ? '<p class="mini">To ' + esc(ME.email) + '.</p>' : '') +
      '</div></div>';
    /* Lists emailed in: only with the server, and only from the address on file. */
    const inbox = server ? window.Server.inbox : '';
    if (inbox) {
      h += '<div class="card mailcard inbound"><div class="card-h"><h3>' + U.icon('mail') + 'Email a list in</h3></div><div class="card-b">' +
        '<p class="mini" style="margin-top:0">Send a to-do list to</p>' +
        '<div class="inaddr"><b>' + esc(inbox) + '</b><button class="btn sm" data-act="dg-copy" data-v="' + esc(inbox) + '">' + U.icon('copy') + 'Copy</button></div>' +
        '<p class="mini">Typed, pasted, or a photo of a handwritten list. ' + BOT + ' puts each thing on your list — or on someone else’s, if you say “for Maude” or “@MB” — and replies with what it added.</p>' +
        (ME.email ? '<p class="mini">Send it from <b>' + esc(ME.email) + '</b>: mail from any other address is ignored.</p>' :
          '<p class="mini warnc">It needs your email address on file first' + (E.isAdmin(ME) ? ' — add it under Settings → People.' : ' — ask Iain to add it.') + '</p>') +
        '</div></div>';
    }
    /* Meetings emailed in: for whoever takes minutes. */
    const meetIn = server ? window.Server.meetInbox : '';
    if (meetIn && E.canAddPeople(ME)) {
      h += '<div class="card mailcard inbound"><div class="card-h"><h3>' + U.icon('mail') + 'Email a meeting in</h3></div><div class="card-b">' +
        '<p class="mini" style="margin-top:0">Send a meeting to</p>' +
        '<div class="inaddr"><b>' + esc(meetIn) + '</b><button class="btn sm" data-act="dg-copy" data-v="' + esc(meetIn) + '">' + U.icon('copy') + 'Copy</button></div>' +
        '<p class="mini">Typed or forwarded notes, photos of the handwritten pages, or a recording from your phone — any of them, or all together. ' +
        'It becomes that day’s meeting with the write-up waiting for you to review; nothing goes on anyone’s list until you do. ' +
        'Say “yesterday” or a date in the subject if it wasn’t today.</p>' +
        (window.Server.minutesFrom ? '<p class="mini">Minutes sent from ' + esc(window.Server.minutesFrom.split(/[\s,;]+/).map(function (d) { return d.indexOf('@') > 0 ? d : '@' + d.replace(/^@/, ''); }).join(' or ')) +
          ' with “minutes” in the subject are picked up anyway: just copy in <b>' + esc(meetIn.replace(/\+[^@]*@/, '@')) + '</b>. Replies to them aren’t.</p>' : '') +
        (ME.email ? '<p class="mini">Send it from <b>' + esc(ME.email) + '</b>.</p>' : '') +
        '</div></div>';
    }
    return h;
  }

  App.on['dg-copy'] = function (b) {
    const v = b.getAttribute('data-v');
    const done = function () { U.toast('Copied: ' + esc(v), 'good'); };
    if (navigator.clipboard) navigator.clipboard.writeText(v).then(done).catch(function () { U.toast(esc(v), 'good', 8000); }); else U.toast(esc(v), 'good', 8000);
  };

  App.onChange.dg = function (el) {
    const f = el.getAttribute('data-f');
    const v = el.type === 'checkbox' ? el.checked : f === 'dailyHour' ? +el.value : el.value;
    const pid = el.getAttribute('data-p') || App.ME.id;
    const patch = {}; patch[f] = v;
    save(pid, patch);
    App.render();
  };

  /* ══ Preview ═══════════════════════════════════════════════════════════ */

  function built(pid, kind) {
    const S = App.S;
    return Mail.build(S, pid, kind, App.today, {
      logo: window.JOR_MARKS ? window.JOR_MARKS.logo : '', hour: kind === 'weekly' && prefs(pid).weekly_when === 'fri' ? 15 : prefs(pid).dailyHour,
      appUrl: location.protocol === 'file:' ? '' : location.href.split('#')[0]
    });
  }

  App.on['dg-prev'] = function (b) {
    const pid = b.getAttribute('data-p'), kind = b.getAttribute('data-k');
    const m = built(pid, kind);
    const p = App.S.personMap[pid];
    U.modal({
      title: (kind === 'daily' ? 'Daily' : 'Weekly') + ' email — ' + p.name, wide: true, cls: 'maildlg',
      sub: '<span class="mini"><b>Subject:</b> ' + esc(m.subject) + (m.empty ? ' · <i>Nothing on — this one wouldn’t be sent.</i>' : '') + '</span>',
      body: '<iframe class="mailframe" title="Email preview" sandbox="allow-same-origin"></iframe>',
      foot: (window.Server && window.Server.connected() && p.email ? '<button class="btn" data-act="dg-test" data-p="' + esc(pid) + '" data-k="' + kind + '">' + U.icon('mail') + 'Send it to ' + esc(p.email) + ' now</button>' : '') +
        '<span class="rowend"></span><button class="btn p" data-close>Close</button>',
      on: function (dlg) {
        const f = dlg.querySelector('iframe');
        f.srcdoc = m.html;
        f.addEventListener('load', function () { try { f.style.height = (f.contentDocument.body.scrollHeight + 20) + 'px'; } catch (e) { } });
      }
    });
  };

  App.on['dg-test'] = function (b) {
    window.Server.call('sendTest', { pid: b.getAttribute('data-p'), kind: b.getAttribute('data-k') })
      .then(function (r) { U.toast('Sent to ' + esc(r.to) + '.', 'good'); })
      .catch(function (e) { U.toast(esc(e.message), 'bad', 7000); });
  };

  /* ══ Settings → Email reports ══════════════════════════════════════════ */

  function settings() {
    const S = App.S;
    const server = window.Server && window.Server.connected();
    return '<p class="hint">Everyone chooses their own emails on their to-do list, under <b>Email me</b>. This is everyone’s choice in one place, with a preview of what each person gets.</p>' +
      (server ? '' : '<div class="conf"><p><b>Emails are sent by the server.</b> Until it’s connected (Settings → Server) the choices are kept and the previews work, but nothing goes out.</p></div>') +
      '<div class="card"><div class="card-b tight"><table class="t"><thead><tr><th>Person</th><th>Email</th><th>Daily</th><th>Weekly</th><th></th></tr></thead><tbody>' +
      S.people.filter(function (p) { return !p.gone; }).map(function (p) {
        const pr = prefs(p.id);
        return '<tr><td><span class="person">' + U.avatar(p.id, 'sm') + '<b>' + esc(p.name) + '</b></span></td>' +
          '<td class="mini">' + (p.email ? esc(p.email) : '<span class="warnc">no address yet</span>') + '</td>' +
          '<td>' + (pr.daily ? 'Weekdays ' + (+pr.dailyHour || 8) + ':00' : '<span class="mini">—</span>') + '</td>' +
          '<td>' + (pr.weekly ? (pr.weekly_when === 'fri' ? 'Friday 15:00' : 'Monday ' + (+pr.dailyHour || 8) + ':00') + (pr.team && p.access !== 'staff' ? ' + team' : '') : '<span class="mini">—</span>') + '</td>' +
          '<td class="nw"><button class="btn sm" data-act="dg-prev" data-k="daily" data-p="' + esc(p.id) + '">Daily</button> <button class="btn sm" data-act="dg-prev" data-k="weekly" data-p="' + esc(p.id) + '">Weekly</button></td></tr>';
      }).join('') + '</tbody></table></div></div>' +
      '<p class="mini">Emails come from the Google account the server runs under, named “JOR Minutes &amp; To-Do”. The daily one isn’t sent on a day with nothing open and nothing done.</p>';
  }

  return { card: card, settings: settings, built: built };
})();
