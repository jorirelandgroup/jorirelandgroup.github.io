<script>/* data.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the company
   The real JOR team, as far as the office's own records name them: full
   names from the HubSpot owners list, and first names with the initials
   the minutes already use for everyone else. Surnames, roles and email
   addresses the records don't give are left blank to be filled in under
   Settings → People, never guessed.

   Who sees whom: Bernard sees everyone. Iain sees everyone below him.
   Everyone else sees their own list and the meetings they sit in.
   ═══════════════════════════════════════════════════════════════════════ */

window.JOR_MIN_DATA = (function () {
  'use strict';

  /* `access`: owner sees the whole company; manager sees the people who
     report to them, all the way down; staff see their own. */
  const PEOPLE = [];

  /* Initials the way the office writes them: an O' or Mc surname gives two
     letters, its first and the capital after the O' or Mc. */
  function initialsOf(name) {
    const parts = String(name).normalize('NFD').replace(/[̀-ͯ]/g, '').split(/\s+/).filter(Boolean);
    return parts.map(function (w, i) {
      const m = w.match(/^(O'|Mc|Mac(?=[A-Z]))(.)/);
      if (m && i > 0) return w[0] + m[2];
      return w[0];
    }).join('').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 4);
  }

  PEOPLE.forEach(function (p) {
    p.access = p.access || 'staff';
    p.initials = p.initials || initialsOf(p.name);
    p.first = p.name.split(' ')[0];
    p.role = p.role || '';
    p.email = p.email || '';
    p.aliases = p.aliases || [];
    p.says = p.says || [];
  });

  /* The meeting the minutes workbook records. More can be added in
     Settings → Meetings. */
  const SERIES = [];

  const TOPICS = [
    { id: 'sales',   name: 'Sales & markets' },
    { id: 'mkt',     name: 'Marketing' },
    { id: 'ops',     name: 'Operations' },
    { id: 'guides',  name: 'Guides & transport' },
    { id: 'res',     name: 'Hotels & contracting' },
    { id: 'fin',     name: 'Finance' },
    { id: 'office',  name: 'Office & people' },
    { id: 'shows',   name: 'Trade shows & travel' },
    { id: 'systems', name: 'Systems & reports' }
  ];

  /* A date only moves with a reason. Counting the reasons is how the
     meeting learns whether the problem is outside JOR or inside it. */
  const SLIP = [
    { id: 'ext',   t: 'Waiting on someone outside JOR' },
    { id: 'int',   t: 'Waiting on someone in JOR' },
    { id: 'prio',  t: 'Other work came first' },
    { id: 'big',   t: 'Bigger job than expected' },
    { id: 'none',  t: 'Not started yet' },
    { id: 'unreal',t: 'First date was not realistic' },
    { id: 'plan',  t: 'Plans changed' }
  ];

  const DROP = [
    'No longer needed', 'Overtaken by events', 'Merged into another action', 'Decided not to do it'
  ];

  /* Sign-in codes until the server checks them. Only a hash is stored. */
  const DEMO_PINS = {};

  /* Colours for people's initials, handed out in order. */
  const TINTS = ['#00875A', '#0E8C8C', '#4E6E8E', '#8A6D1F', '#6C63B5', '#C2703D', '#5F6E70', '#A8527A', '#2F7D5B', '#7A5C9E', '#B0572E', '#3D6F99', '#6E7F2A'];

  /* The minutes assistant's name, on screen and in the emails. It runs on
     Gemini, Google's AI; the screens say so where it matters (the key,
     and what happens to a recording). */
  const BOT = 'O’Reilly AI';

  return {
    BOT: BOT, PEOPLE: PEOPLE, SERIES: SERIES, TOPICS: TOPICS, SLIP: SLIP, DROP: DROP, DEMO_PINS: DEMO_PINS,
    TINTS: TINTS, initialsOf: initialsOf, DOMAIN: 'jorireland.com'
  };
})();

<script>/* engine.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — the rules
   One list of actions, and meetings that review it. Nothing here draws or
   stores anything, so the same code can run on an Apps Script server.

   The idea the whole app rests on: an action is raised once and lives
   until it is done or dropped. A meeting does not copy last meeting's
   sheet; it reviews what is still open, and the minutes are written from
   what happened to each action at that meeting. The owner sees the same
   action on their own to-do list, so it is never typed twice.

   Every change to an action is kept in its history (`hist`), which is what
   lets the app say "moved three times" without anyone writing "old
   deadline 18/09" into the update column, and lets old minutes be drawn
   exactly as they stood on the day.
   ═══════════════════════════════════════════════════════════════════════ */

(function (root) {
  'use strict';

  const W = root.When || (typeof require !== 'undefined' ? require('./when.js') : null);

  const OPEN = { open: true, waiting: true };
  function isOpen(it) { return !!OPEN[it.status]; }

  /* ══ History ═══════════════════════════════════════════════════════════ */

  /* How an action stood at the end of a given day, replayed from its
     history. Used for old minutes, so they never change after the event. */
  function asOf(it, date) {
    const st = { status: 'open', due: null, ongoing: false, progress: 0, waiting: '', owner: it.owner,
      lastTouch: null, lastText: '', lastTextOn: null, slips: 0, firstDue: null, doneOn: null, dropWhy: '' };
    (it.hist || []).forEach(function (h) {
      if (date && h.on > date) return;
      switch (h.k) {
        case 'new':
          st.due = (h.to && h.to.due) || null; st.firstDue = st.due;
          st.ongoing = !!(h.to && h.to.ongoing); st.progress = (h.to && h.to.progress) || 0;
          st.owner = (h.to && h.to.owner) || it.owner; st.lastTouch = h.on;
          break;
        case 'upd': st.lastText = h.t; st.lastTextOn = h.on; st.lastTouch = h.on; break;
        case 'prog': st.progress = h.to; st.lastTouch = h.on; break;
        case 'due':
          if (h.from && h.to && h.to > h.from) st.slips++;
          if (!st.firstDue) st.firstDue = h.from || h.to;
          st.due = h.to || null; st.ongoing = !h.to && !!h.ongoing; st.lastTouch = h.on;
          break;
        case 'done': st.status = 'done'; st.progress = 100; st.doneOn = h.on; st.lastTouch = h.on;
          if (h.t) { st.lastText = h.t; st.lastTextOn = h.on; } break;
        case 'reopen': st.status = 'open'; st.doneOn = null; st.progress = Math.min(st.progress, 75); st.lastTouch = h.on; break;
        case 'drop': st.status = 'dropped'; st.dropWhy = h.why || ''; st.lastTouch = h.on; break;
        case 'wait': st.status = 'waiting'; st.waiting = h.t || ''; st.lastTouch = h.on; break;
        case 'unwait': if (st.status === 'waiting') st.status = 'open'; st.waiting = ''; st.lastTouch = h.on; break;
        case 'owner': st.owner = h.to; st.lastTouch = h.on; break;
        case 'part': case 'listed': st.lastTouch = h.on; break;
      }
    });
    return st;
  }

  function slips(it) {
    let n = 0;
    (it.hist || []).forEach(function (h) { if (h.k === 'due' && h.from && h.to && h.to > h.from) n++; });
    return n;
  }

  function firstDue(it) {
    const h = (it.hist || []).find(function (x) { return x.k === 'new'; });
    if (h && h.to && h.to.due) return h.to.due;
    const d = (it.hist || []).find(function (x) { return x.k === 'due'; });
    return d ? (d.from || d.to) : it.due;
  }

  /* The last time anyone said or did anything about it. */
  function lastTouch(it) {
    let on = it.on || null;
    (it.hist || []).forEach(function (h) { if (h.k !== 'noted' && (!on || h.on > on)) on = h.on; });
    return on;
  }

  function lastUpdate(it) {
    let u = null;
    (it.hist || []).forEach(function (h) {
      if ((h.k === 'upd' || (h.k === 'done' && h.t)) && (!u || h.on >= u.on)) u = h;
    });
    return u;
  }

  /* ══ Who sees what ═════════════════════════════════════════════════════ */

  function members(S, sid) { const s = S.seriesMap[sid]; return s ? s.members : []; }

  /* The reporting line. Bernard sees everyone; Iain sees everyone below
     him, however far down; nobody sees upwards. */
  function manages(S, viewerId, pid) {
    if (!viewerId || !pid || viewerId === pid) return false;
    let p = S.personMap[pid], guard = 0;
    while (p && p.reportsTo && guard++ < 20) {
      if (p.reportsTo === viewerId) return true;
      p = S.personMap[p.reportsTo];
    }
    return false;
  }
  function below(S, viewerId) {
    return S.people.filter(function (p) { return !p.gone && manages(S, viewerId, p.id); });
  }
  function isAdmin(me) { return !!me && (me.access === 'owner' || me.access === 'manager'); }

  /* Taking minutes — planning, starting, recording and writing up a meeting,
     and adding someone new to the team from it — is for Bernard, Iain,
     anyone marked "Takes minutes", and whoever chairs that meeting. */
  function canMinute(S, me, m) {
    if (!me) return false;
    if (isAdmin(me) || me.minutes) return true;
    if (m && (m.chair === me.id || m.taker === me.id)) return true;
    const s = m && S.seriesMap ? S.seriesMap[m.series] : null;
    return !!(s && s.chair === me.id);
  }
  function canAddPeople(me) { return !!me && (isAdmin(me) || !!me.minutes); }

  function canSee(S, me, it) {
    if (!me) return false;
    if (it.private) return it.owner === me.id;
    if (me.access === 'owner') return true;
    if (it.owner === me.id || it.by === me.id) return true;
    if ((it.helpers || []).indexOf(me.id) >= 0 || (it.everyone || []).indexOf(me.id) >= 0) return true;
    if (manages(S, me.id, it.owner)) return true;
    if (it.series) return members(S, it.series).indexOf(me.id) >= 0;
    return false;
  }

  function canSeeMeeting(S, me, m) {
    if (!me) return false;
    if (me.access === 'owner') return true;
    if ((m.present || []).indexOf(me.id) >= 0 || (m.apologies || []).indexOf(me.id) >= 0) return true;
    if (m.chair === me.id || m.taker === me.id) return true;
    return m.series ? members(S, m.series).indexOf(me.id) >= 0 : false;
  }

  /* May this person change it? The owner, whoever raised it, and anyone
     above the owner in the reporting line; helpers can add updates only. */
  function canEdit(S, me, it) {
    if (!me) return false;
    if (it.private) return it.owner === me.id;
    return it.owner === me.id || it.by === me.id || me.access === 'owner' || manages(S, me.id, it.owner) || !it.owner;
  }
  function canUpdate(S, me, it) {
    return canEdit(S, me, it) || (it.helpers || []).indexOf(me.id) >= 0 || (it.everyone || []).indexOf(me.id) >= 0;
  }

  /* Is this on my list, and in what capacity? */
  function myPart(it, pid) {
    if (it.owner === pid && !(it.everyone || []).length) return 'owner';
    if ((it.everyone || []).indexOf(pid) >= 0) return (it.parts || {})[pid] ? 'partdone' : 'part';
    if (it.owner === pid) return 'owner';
    if ((it.helpers || []).indexOf(pid) >= 0) return 'helper';
    if (it.by === pid && it.owner !== pid) return 'asked';
    return null;
  }

  /* ══ Where it sits on a to-do list ═════════════════════════════════════ */

  function bucket(it, today) {
    if (!isOpen(it)) return 'done';
    if (it.status === 'waiting') return 'waiting';
    if (!it.due) return 'nodate';
    const n = W.diff(today, it.due);
    if (n < 0) return 'overdue';
    if (n === 0) return 'today';
    if (it.due <= W.sundayOf(today)) return 'week';
    return 'later';
  }

  /* The badges beside an action. Each one is something the meeting would
     otherwise have had to notice by reading every line. */
  function flags(S, it, today) {
    const f = [];
    const open = isOpen(it);
    if (open && it.due && it.due < today) {
      const n = W.diff(it.due, today);
      f.push({ k: 'overdue', t: n === 1 ? '1 day over' : n + ' days over', w: 5 + Math.min(4, n / 7) });
    }
    const n = slips(it);
    if (n) f.push({ k: n >= 2 ? 'moved2' : 'moved', t: 'Moved ' + n + '×', w: n >= 2 ? 3 : 1,
      d: 'First due ' + W.fmt(firstDue(it), 'dm') });
    const lt = lastTouch(it);
    if (open && it.status !== 'waiting' && lt && W.diff(lt, today) >= 14) {
      f.push({ k: 'stale', t: 'No update ' + W.rel(lt, today).replace(' ago', ''), w: 2 });
    }
    if (it.status === 'waiting') f.push({ k: 'waiting', t: 'Waiting' + (it.waitingOn ? ' on ' + it.waitingOn : ''), w: 2 });
    if (open && it.high) f.push({ k: 'high', t: 'Priority', w: 3 });
    return f;
  }

  /* ══ Meetings ══════════════════════════════════════════════════════════ */

  function meetingsOf(S, sid) {
    return S.meetings.filter(function (m) { return m.series === sid; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1); });
  }

  function prevClosed(S, m) {
    if (!m.series) return null;
    const list = meetingsOf(S, m.series).filter(function (x) {
      return x.id !== m.id && x.status === 'closed' && x.date <= m.date;
    });
    return list.length ? list[list.length - 1] : null;
  }

  function lastClosed(S, sid) {
    const list = meetingsOf(S, sid).filter(function (x) { return x.status === 'closed'; });
    return list.length ? list[list.length - 1] : null;
  }

  /* The next date on the series' rhythm after a given day. */
  function projectNext(S, sid, from) {
    const s = S.seriesMap[sid];
    if (!s) return W.add(from, 14);
    const last = lastClosed(S, sid);
    let d = last ? W.add(last.date, s.every) : from;
    while (d <= from) d = W.add(d, s.every);
    /* Keep it on the series' weekday. */
    const w = W.dow(d);
    if (s.day != null && w !== s.day) d = W.add(d, (s.day - w + 7) % 7);
    return d;
  }

  /* The date after this meeting on the series' rhythm — what "before the
     next meeting" means while the meeting is going on. */
  function nextAfter(S, m) {
    const s = S.seriesMap[m.series];
    if (!s) return W.add(m.date, 14);
    let d = W.add(m.date, s.every);
    const w = W.dow(d);
    if (s.day != null && w !== s.day) d = W.add(d, (s.day - w + 7) % 7);
    return d;
  }

  /* The next meeting of a series: one already planned, or the date it
     would fall on. `m` is null when nothing has been scheduled yet. */
  function nextMeeting(S, sid, today) {
    const up = meetingsOf(S, sid).filter(function (m) { return m.status !== 'closed' && m.date >= today; });
    const live = meetingsOf(S, sid).find(function (m) { return m.status === 'live'; });
    if (live) return { date: live.date, m: live };
    if (up.length) return { date: up[0].date, m: up[0] };
    return { date: projectNext(S, sid, today), m: null };
  }

  /* Why an open action needs the meeting's attention. An action with no
     reason is on track and gets nodded through instead of read out. */
  function reasons(S, it, m, since, today) {
    const r = [];
    const at = m.status === 'closed' ? m.date : today;
    if (it.due && it.due < at) r.push({ k: 'overdue', t: 'Overdue since ' + W.fmt(it.due, 'dm'), w: 6 });
    const movedNow = (it.hist || []).some(function (h) { return h.k === 'due' && h.on > since && h.m !== m.id && h.from && h.to > h.from; });
    const n = slips(it);
    if (n >= 2) r.push({ k: 'moved2', t: 'Moved ' + n + ' times', w: 4 });
    else if (movedNow) r.push({ k: 'moved', t: 'Moved since last meeting', w: 2 });
    if (it.status === 'waiting') r.push({ k: 'waiting', t: 'Waiting on ' + (it.waitingOn || 'someone'), w: 3 });
    const touched = (it.hist || []).some(function (h) { return h.on > since && h.k !== 'noted'; });
    if (since > '0000' && !touched && it.on <= since) r.push({ k: 'stale', t: 'No update since last meeting', w: 3 });
    if (it.agenda && it.agenda === m.series) r.push({ k: 'raised', t: 'Owner asked to discuss', w: 5 });
    if (it.high) r.push({ k: 'high', t: 'Priority', w: 3 });
    return r;
  }

  /* The agenda for a meeting, built from the register rather than typed. */
  function review(S, m, today) {
    const prev = prevClosed(S, m);
    const since = prev ? prev.date : '0000';
    const inSeries = S.items.filter(function (it) {
      return it.series === m.series && it.meeting !== m.id && it.kind === 'action' && !it.private;
    });
    const done = inSeries.filter(function (it) {
      return it.status === 'done' && it.doneOn > since &&
        !(it.hist || []).some(function (h) { return h.k === 'done' && h.m === m.id; });
    }).sort(function (a, b) { return a.doneOn < b.doneOn ? -1 : 1; });
    const open = inSeries.filter(function (it) {
      return (isOpen(it) || (it.hist || []).some(function (h) { return h.m === m.id; })) &&
        it.on <= (m.status === 'closed' ? m.date : today) && done.indexOf(it) < 0;
    });
    const discuss = [], ontrack = [];
    open.forEach(function (it) {
      const r = reasons(S, it, m, since, today);
      const w = r.reduce(function (a, x) { return a + x.w; }, 0);
      (r.length ? discuss : ontrack).push({ it: it, why: r, w: w });
    });
    discuss.sort(function (a, b) { return (b.w - a.w) || ((a.it.due || '9') < (b.it.due || '9') ? -1 : 1); });
    ontrack.sort(function (a, b) { return (a.it.due || '9999') < (b.it.due || '9999') ? -1 : 1; });
    const raisedItems = discuss.filter(function (x) { return x.why.some(function (r) { return r.k === 'raised'; }); });
    const created = S.items.filter(function (it) { return it.meeting === m.id; });
    const updatedSince = open.filter(function (it) {
      return (it.hist || []).some(function (h) { return h.on > since && h.k !== 'noted' && h.m !== m.id; });
    }).length;
    return {
      prev: prev, since: since, done: done, discuss: discuss, ontrack: ontrack, open: open,
      standing: (m.agenda || []).filter(function (a) { return a.kind === 'standing'; }),
      raised: (m.agenda || []).filter(function (a) { return a.kind !== 'standing'; }),
      raisedItems: raisedItems, created: created, updatedSince: updatedSince
    };
  }

  /* ══ The minutes ═══════════════════════════════════════════════════════
     Written from what happened, not typed up afterwards. For a closed
     meeting everything is read as it stood that day.                    */

  function minutes(S, m) {
    const prev = prevClosed(S, m);
    const since = prev ? prev.date : '0000';
    const at = m.date;
    const here = S.items.filter(function (it) { return it.meeting === m.id; });
    const series = S.items.filter(function (it) {
      return it.series === m.series && it.meeting !== m.id && it.kind === 'action' && !it.private && it.on <= at;
    });
    const row = function (it) {
      const st = asOf(it, at);
      return { id: it.id, ref: it.ref, title: it.title, detail: it.detail || '', owner: st.owner,
        helpers: it.helpers || [], everyone: it.everyone || [], due: st.due, ongoing: st.ongoing,
        progress: st.progress, status: st.status, topic: it.topic };
    };
    const reviewed = [], carried = [], completed = [];
    series.forEach(function (it) {
      const hs = (it.hist || []).filter(function (h) { return h.m === m.id; });
      const st = asOf(it, at);
      if (hs.length || (m.reviewed || {})[it.id]) {
        const r = row(it);
        const upd = hs.filter(function (h) { return h.k === 'upd'; }).pop();
        const slip = hs.filter(function (h) { return h.k === 'due'; }).pop();
        const done = hs.find(function (h) { return h.k === 'done'; });
        const drop = hs.find(function (h) { return h.k === 'drop'; });
        const wait = hs.filter(function (h) { return h.k === 'wait'; }).pop();
        const own = hs.filter(function (h) { return h.k === 'owner'; }).pop();
        r.update = upd ? upd.t : (done && done.t) || '';
        r.slip = slip ? { from: slip.from, to: slip.to, why: slip.why || '' } : null;
        r.done = !!done; r.dropped = drop ? (drop.why || 'Dropped') : '';
        r.waiting = wait ? wait.t : '';
        r.reassigned = own ? { from: own.from, to: own.to } : null;
        r.noted = !hs.length;
        if (!r.update && !r.done && !r.slip && !r.dropped) {
          const lu = st.lastText;
          if (lu && st.lastTextOn > since) r.update = lu;
        }
        reviewed.push(r);
      } else if (st.status === 'done' && st.doneOn > since && st.doneOn <= at) {
        const r = row(it); r.doneOn = st.doneOn; r.update = st.lastText; completed.push(r);
      } else if (st.status === 'open' || st.status === 'waiting') {
        const r = row(it); r.last = st.lastText; r.lastOn = st.lastTextOn; r.slips = st.slips; carried.push(r);
      }
    });
    const byDue = function (a, b) { return (a.due || '9999') < (b.due || '9999') ? -1 : 1; };
    reviewed.sort(function (a, b) { return (a.done - b.done) || byDue(a, b); });
    carried.sort(byDue);
    const series0 = S.seriesMap[m.series] || null;
    return {
      id: m.id, title: m.title || (series0 ? series0.name : 'Meeting'), series: m.series,
      date: m.date, time: m.time || '', place: m.place || '', chair: m.chair, taker: m.taker,
      present: (m.present || []).slice(), apologies: (m.apologies || []).slice(), guests: m.guests || '',
      prev: prev ? prev.date : null,
      decisions: here.filter(function (it) { return it.kind === 'decision'; }).map(row),
      notes: here.filter(function (it) { return it.kind === 'note'; }).map(row),
      actions: here.filter(function (it) { return it.kind === 'action'; }).map(row),
      agenda: (m.agenda || []).filter(function (a) { return a.note; }).map(function (a) { return { t: a.t, note: a.note, by: a.by }; }),
      /* Points this meeting put off to a later one. */
      forNext: S.meetings.reduce(function (acc, x) {
        (x.agenda || []).forEach(function (g) { if (g.from === m.id) acc.push({ t: g.t, by: g.by, date: x.date }); });
        return acc;
      }, []),
      reviewed: reviewed, completed: completed, carried: carried,
      next: m.next || null, consent: !!m.consent, summary: m.summary || '',
      transcriptLines: (m.transcript || []).length
    };
  }

  /* ══ People ════════════════════════════════════════════════════════════ */

  /* Everything one person owes, open or recently finished. */
  function listFor(S, pid) {
    return S.items.filter(function (it) {
      if (it.kind !== 'action') return false;
      const p = myPart(it, pid);
      return p === 'owner' || p === 'part' || p === 'partdone' || p === 'helper';
    });
  }

  function personStats(S, pid, today) {
    const list = listFor(S, pid);
    const wk = W.add(today, -6);
    const q = W.add(today, -90);
    const st = { open: 0, overdue: 0, week: 0, todayList: [], doneToday: 0, done7: 0, moved2: 0, stale: 0,
      ontimeN: 0, ontimeD: 0, priv: 0, fromMeetings: 0, lastActive: null };
    list.forEach(function (it) {
      const part = myPart(it, pid);
      const doneOn = part === 'partdone' ? it.parts[pid] : it.status === 'done' ? it.doneOn : null;
      /* An everyone-action closed as a whole is closed for each of them too. */
      const open = (part === 'part' || part === 'owner' || part === 'helper') && isOpen(it);
      if (open) {
        st.open++;
        if (it.series) st.fromMeetings++;
        if (it.due && it.due < today) st.overdue++;
        else if (it.due && it.due <= W.sundayOf(today)) st.week++;
        if (it.focus === today && part !== 'helper') st.todayList.push(it);
        if (slips(it) >= 2) st.moved2++;
        const lt = lastTouch(it);
        if (lt && W.diff(lt, today) >= 14 && it.status !== 'waiting') st.stale++;
        if (it.private) st.priv++;
      }
      if (doneOn && part !== 'helper') {
        if (doneOn === today) st.doneToday++;
        if (doneOn >= wk) st.done7++;
        if (doneOn >= q) {
          const fd = firstDue(it);
          if (fd) { st.ontimeD++; if (doneOn <= fd) st.ontimeN++; }
        }
      }
      const lt = lastTouch(it);
      if (lt && (!st.lastActive || lt > st.lastActive)) st.lastActive = lt;
    });
    st.ontime = st.ontimeD ? Math.round(100 * st.ontimeN / st.ontimeD) : null;
    return st;
  }

  /* ══ Finding a person from what was typed or said ══════════════════════ */

  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[’`]/g, "'").trim();
  }

  function findPerson(S, word, prefer) {
    const w = norm(word).replace(/[^a-z' ]/g, '');
    if (!w) return null;
    const ppl = S.people.filter(function (p) { return !p.gone; });
    let hit = ppl.filter(function (p) { return norm(p.initials) === w || (p.aliases || []).some(function (a) { return norm(a) === w; }); });
    if (hit.length === 1) return hit[0];
    hit = ppl.filter(function (p) { return norm(p.name) === w; });
    if (hit.length === 1) return hit[0];
    hit = ppl.filter(function (p) { return norm(p.first) === w; });
    if (hit.length > 1 && prefer) {
      const pref = hit.filter(function (p) { return prefer.indexOf(p.id) >= 0; });
      if (pref.length === 1) return pref[0];
    }
    if (hit.length === 1) return hit[0];
    /* Last, how a transcript tends to spell them: "Shinade", "Neena". */
    hit = ppl.filter(function (p) { return (p.says || []).some(function (a) { return norm(a) === w; }); });
    if (hit.length === 1) return hit[0];
    return null;
  }

  /* One line in, a to-do out: "Send the revised quote fri @MB !" */
  function parseQuick(S, text, today, ctx) {
    let t = ' ' + String(text || '') + ' ';
    let high = false;
    if (/\s!+\s/.test(t)) { high = true; t = t.replace(/\s!+(?=\s)/g, ' '); }
    let owner = null, ownerWord = '';
    t = t.replace(/(\s)@([A-Za-zÀ-ÿ'’]+)/g, function (m0, sp, w) {
      if (owner) return m0;
      const p = findPerson(S, w);
      if (p) { owner = p.id; ownerWord = w; return sp; }
      return m0;
    });
    const hit = W.parse(t, today, ctx);
    if (hit) t = W.strip(t, hit);
    t = t.replace(/\s{2,}/g, ' ').trim();
    if (t) t = t[0].toUpperCase() + t.slice(1);
    return { title: t, due: hit ? hit.date : null, dueText: hit ? hit.text : '', owner: owner, ownerWord: ownerWord, high: high };
  }

  /* ══ The register, for management ══════════════════════════════════════ */

  /* Raised and closed per week, for the trend on the Team page. */
  function weekly(S, today, weeks, owners) {
    const out = [];
    const mon0 = W.add(W.mondayOf(today), -7 * (weeks - 1));
    for (let i = 0; i < weeks; i++) {
      const a = W.add(mon0, 7 * i), b = W.add(a, 6);
      let raised = 0, closed = 0, moved = 0;
      S.items.forEach(function (it) {
        if (it.kind !== 'action' || it.private || !it.series) return;
        if (owners && !owners[it.owner]) return;
        if (it.on >= a && it.on <= b) raised++;
        if (it.status === 'done' && it.doneOn >= a && it.doneOn <= b) closed++;
        (it.hist || []).forEach(function (h) { if (h.k === 'due' && h.on >= a && h.on <= b && h.from && h.to > h.from) moved++; });
      });
      out.push({ from: a, to: b, raised: raised, closed: closed, moved: moved });
    }
    return out;
  }

  /* Why dates move, counted. Outside JOR or inside it is the useful split. */
  function slipReasons(S, since, owners) {
    const c = {};
    S.items.forEach(function (it) {
      if (!it.series) return;
      if (owners && !owners[it.owner]) return;
      (it.hist || []).forEach(function (h) {
        if (h.k === 'due' && h.on >= since && h.from && h.to > h.from) c[h.why || 'No reason given'] = (c[h.why || 'No reason given'] || 0) + 1;
      });
    });
    return Object.keys(c).map(function (k) { return { k: k, v: c[k] }; }).sort(function (a, b) { return b.v - a.v; });
  }

  /* How someone is doing, in words a manager would use. Deliberately
     simple so anyone can see why a person is marked the way they are. */
  function health(st) {
    if (!st.open) return { k: 'clear', t: 'Nothing open' };
    if (st.overdue >= 3 || st.overdue / st.open >= 0.4 || st.stale >= 3) return { k: 'behind', t: 'Needs a hand' };
    if (st.overdue || st.moved2 || st.stale) return { k: 'watch', t: 'Some slipping' };
    return { k: 'ok', t: 'On top of it' };
  }

  /* ══ Procedures ════════════════════════════════════════════════════════
     A department's written procedures, kept with its topic: each numbered
     procedure has one or more cases ("If the client decides to cancel"),
     each a list of steps. Every case can become a to-do's steps. The ones
     whose words best match the to-do are suggested first — words shared
     with few procedures ("extend", "cancel", "coach") count for far more
     than words in all of them ("file", "hotel", "TP"). */

  const PSTOP = { the: 1, and: 1, for: 1, with: 1, are: 1, was: 1, this: 1, that: 1, all: 1, any: 1, each: 1, from: 1, into: 1, their: 1,
    has: 1, have: 1, will: 1, then: 1, once: 1, not: 1, new: 1, via: 1, its: 1 };
  function stems(s) {
    return (norm(s).match(/[a-z]{3,}/g) || []).filter(function (w) { return !PSTOP[w]; })
      .map(function (w) { return (w.length > 4 ? w.replace(/([^s])s$/, '$1') : w).slice(0, 5); });
  }

  function procedureChoices(S, it) {
    const out = [];
    (S.topics || []).forEach(function (t) {
      (t.procs || []).forEach(function (p) {
        (p.br || []).forEach(function (b, bi) {
          const text = [p.name, b.when].concat((b.steps || []).map(function (s) { return s.t + ' ' + (s.sub || []).map(function (c) { return c.t; }).join(' '); })).join(' ');
          out.push({ topic: t.id, topicName: t.name, proc: p, bi: bi, when: b.when || '', words: stems(text), name: stems(p.name), score: 0 });
        });
      });
    });
    if (!out.length || !it) return out;
    const df = {};
    out.forEach(function (o) { const seen = {}; o.words.forEach(function (w) { if (!seen[w]) { seen[w] = 1; df[w] = (df[w] || 0) + 1; } }); });
    const mine = {};
    stems(String(it.title || '').replace(/^[^:]{1,60}:\s*/, '')).forEach(function (w) { mine[w] = 1; });
    out.forEach(function (o) {
      const has = {};
      o.words.forEach(function (w) { has[w] = 1; });
      Object.keys(mine).forEach(function (w) {
        if (!has[w]) return;
        const idf = Math.log(1 + out.length / df[w]);
        o.score += o.name.indexOf(w) >= 0 ? 1.5 * idf : idf;
      });
      o.score = Math.round(o.score * 100) / 100;
    });
    return out;
  }

  /* Look-ups by id, rebuilt after every change. Here rather than in the
     browser code so the server can use the same state. */
  function hydrate(s) {
    s.personMap = {}; s.people.forEach(function (p) { s.personMap[p.id] = p; });
    s.seriesMap = {}; s.series.forEach(function (x) { s.seriesMap[x.id] = x; });
    s.topicMap = {}; (s.topics || []).forEach(function (t) { s.topicMap[t.id] = t; });
    s.itemMap = {}; s.items.forEach(function (it) { s.itemMap[it.id] = it; });
    s.meetingMap = {}; s.meetings.forEach(function (m) { s.meetingMap[m.id] = m; });
    return s;
  }

  const Engine = {
    hydrate: hydrate,
    W: W, isOpen: isOpen, asOf: asOf, slips: slips, firstDue: firstDue, lastTouch: lastTouch, lastUpdate: lastUpdate,
    manages: manages, below: below, isAdmin: isAdmin,
    canSee: canSee, canMinute: canMinute, canAddPeople: canAddPeople, canSeeMeeting: canSeeMeeting, canEdit: canEdit, canUpdate: canUpdate, myPart: myPart,
    bucket: bucket, flags: flags,
    meetingsOf: meetingsOf, prevClosed: prevClosed, lastClosed: lastClosed, projectNext: projectNext,
    nextMeeting: nextMeeting, nextAfter: nextAfter, review: review, minutes: minutes,
    listFor: listFor, personStats: personStats, findPerson: findPerson, parseQuick: parseQuick, norm: norm,
    weekly: weekly, slipReasons: slipReasons, health: health, procedureChoices: procedureChoices
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
  else root.Engine = Engine;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* extract.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — reading the transcript
   Turns what was said into suggested actions, decisions and updates for
   the chair to accept, change or dismiss. It never writes the minutes on
   its own: speech-to-text mishears, and a wrong owner or date in the
   minutes is worse than a missing one.

   This version works offline, sentence by sentence, on the patterns
   minutes are actually spoken in: "<name> will <do it> by <date>",
   "<name> to <do it> by <date>", "we agreed <…>", and an open request
   ("can someone <…>?") picked up a sentence later ("<name>, can you do
   that <when>?"). It is the free fallback for live captions; a recording or
   notes sent to Gemini (gemini.js) is read as a whole instead, and comes
   back to the same kind of accept/dismiss screen.
   ═══════════════════════════════════════════════════════════════════════ */

(function (root) {
  'use strict';

  const W = root.When || (typeof require !== 'undefined' ? require('./when.js') : null);

  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[’`]/g, "'");
  }
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  /* Every way a person might appear in a transcript: full name, first
     name, how speech-to-text spells an Irish name (Niina comes out as
     Nina, Sinéad as Shinade), and initials, which only count in capitals. */
  function nameIndex(people, prefer) {
    const words = [];
    const firstCount = {};
    people.forEach(function (p) { const f = norm(p.first); firstCount[f] = (firstCount[f] || 0) + 1; });
    people.forEach(function (p) {
      if (p.gone) return;
      words.push({ w: norm(p.name), p: p, cs: false });
      const f = norm(p.first);
      if (firstCount[f] === 1 || (prefer && prefer.indexOf(p.id) >= 0)) words.push({ w: f, p: p, cs: false });
      (p.says || []).forEach(function (s) { words.push({ w: norm(s), p: p, cs: false }); });
      (p.aliases || []).concat([p.initials]).forEach(function (a) {
        if (a && a.length >= 2) words.push({ w: a.toUpperCase(), p: p, cs: true });
      });
    });
    words.sort(function (a, b) { return b.w.length - a.w.length; });
    return words;
  }

  /* People named in a sentence, longest match first, no overlaps. */
  function mentions(text, idx) {
    const low = norm(text), raw = text.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const taken = [];
    const out = [];
    idx.forEach(function (n) {
      const re = new RegExp('(^|[^A-Za-z\'])(' + esc(n.w) + ')(?![A-Za-z])', n.cs ? 'g' : 'gi');
      const hay = n.cs ? raw : low;
      let m;
      while ((m = re.exec(hay))) {
        const s = m.index + m[1].length, e = s + m[2].length;
        if (!taken.some(function (t) { return s < t[1] && e > t[0]; })) {
          taken.push([s, e]);
          out.push({ p: n.p, start: s, end: e });
        }
      }
    });
    return out.sort(function (a, b) { return a.start - b.start; });
  }

  const DECIDE = /\b(we(?:'ve| have)? (?:all )?agreed|it(?:'s| is| was) agreed|agreed that|all agreed|we(?:'ll| will) go with|we(?:'re| are) going with|we(?:'ve| have)? decided|decision is|the decision was|we(?:'re| are) not going to|signed off on|from now on|going forward|the rule (?:is|will be)|we(?:'ll| will) stick with)\b/i;
  const ASSIGN = /^\s*(?:,\s*)?(is going to|is gonna|'s going to|is to|to|will|'ll|needs to|has to|should|must|can|could|please|is on|is doing|will be doing|will do|is taking|takes|will take|is looking after|will look after|is handling|will handle)\s+(.+)$/i;
  /* Where the linking words carry the verb, keep it: "Giovanna is taking the
     airport desk" is the action "Take the airport desk". */
  const KEEPVERB = { 'is doing': 'do', 'will be doing': 'do', 'will do': 'do', 'is taking': 'take', 'takes': 'take',
    'will take': 'take', 'is looking after': 'look after', 'will look after': 'look after',
    'is handling': 'handle', 'will handle': 'handle', 'is on': 'cover' };
  const VOC = /^\s*,?\s*(?:can|could|would|will) you (?:please |just |also )?(.+)$/i;
  const TRAIL = /^(?:.*?\b)?(?:can|could|would|will) you (?:please |just |also )?(.+?),?\s*$/i;
  const SELF = /\b(?:i'll|i will|i'm going to|i am going to|i'll take|leave (?:it|that|this) with me(?:,)?(?: and)?(?: i'll)?)\s*(.*)$/i;
  const OPENREQ = /\b(?:(?:can|could) (?:someone|somebody|anyone)|(?:someone|somebody|we) (?:needs? to|should|must|has to|have to|got to|'ve got to|ought to))\s+(.+)$/i;
  const ACTIONFOR = /\baction (?:for|on) ([^:,-]+)[:,-]\s*(.+)$/i;
  const STATUS = /\b(done|finished|completed|sent|received|booked|confirmed|signed|waiting (?:on|for)|chas(?:ed|ing)|still|haven'?t|not yet|halfway|started|in progress|delayed|pushed|on hold|came back|come back|no reply|no response|two of|three of|of the)\b/i;
  const FILLER = /^(?:and|so|ok|okay|right|then|also|just|maybe|actually|yeah|yes|well|now|um|uh|er|probably|perhaps|definitely|really)\b[,\s]*/i;
  const PRONOUN = /^(\w+(?:\s+(?:at|into|up|on|over|out|through|after))?)\s+(?:that|it|this|them|those)$/i;

  function clean(t) {
    let s = String(t || '').trim();
    for (let i = 0; i < 4; i++) s = s.replace(FILLER, '');
    s = s.replace(/^to\s+/i, '').replace(/\s+(?:myself|yourself|himself|herself|ourselves|as well|too)(?=[\s,;:.!?]*$)/i, '')
      .replace(/[\s,;:.!?]+$/g, '').replace(/\s{2,}/g, ' ').trim();
    if (s.length > 160) s = s.slice(0, 157).replace(/\s+\S*$/, '') + '…';
    return s ? s[0].toUpperCase() + s.slice(1) : '';
  }

  function words(s) { return String(s || '').split(/\s+/).filter(Boolean).length; }

  function sentences(lines) {
    const out = [];
    (lines || []).forEach(function (ln, li) {
      String(ln.t || '').split(/(?<=[.!?])\s+/).forEach(function (s) {
        s = s.trim();
        if (s) out.push({ t: s, at: ln.at || null, s: ln.s || 0, li: li });
      });
    });
    return out;
  }

  /* The heart of it. `ctx`: { people, present, today, nextMeeting, items } */
  function suggest(lines, ctx) {
    const idx = nameIndex(ctx.people || [], ctx.present || []);
    const today = ctx.today, wctx = { nextMeeting: ctx.nextMeeting };
    const itemIds = {};
    (ctx.items || []).forEach(function (it) { itemIds[it.id] = it; });
    const out = [];
    let pending = null;

    function dueFrom(rest, whole) {
      let hit = W.parse(rest, today, wctx), from = rest;
      if (!hit) { hit = W.parse(whole, today, wctx); from = null; }
      return { due: hit ? hit.date : null, dueText: hit ? hit.text : '', rest: hit && from !== null ? W.strip(rest, hit) : rest };
    }

    function push(o) {
      const key = o.kind + '|' + norm(o.title).replace(/[^a-z0-9]/g, '');
      if (out.some(function (x) { return x.key === key; })) return;
      o.key = key;
      o.id = 'sg' + (out.length + 1);
      out.push(o);
    }

    function flushPending() {
      if (pending && !pending.used) {
        push({ kind: 'action', title: pending.title, owner: null, needsOwner: true, due: pending.due,
          dueText: pending.dueText, src: pending.src, at: pending.at, s: pending.s });
      }
      pending = null;
    }

    /* "Sinéad will do the rooming lists and Giovanna is taking the airport desk"
       is two actions. Cut a sentence wherever "and" or a comma is followed by
       another person being given something. */
    const sents = [];
    sentences(lines).forEach(function (sn) {
      const t = sn.t.normalize('NFC');
      const cuts = [];
      mentions(t, idx).forEach(function (mn, k) {
        if (!k) return;
        const before = t.slice(0, mn.start), after = t.slice(mn.end);
        const joint = before.match(/(?:,\s*(?:and\s+)?|;\s*|\s+and\s+)$/i);
        if (joint && ASSIGN.test(after)) cuts.push({ at: mn.start - joint[0].length, from: mn.start });
      });
      if (!cuts.length) { sents.push({ t: t, at: sn.at, s: sn.s }); return; }
      let from = 0;
      cuts.forEach(function (c) { sents.push({ t: t.slice(from, c.at).trim(), at: sn.at, s: sn.s }); from = c.from; });
      sents.push({ t: t.slice(from).trim(), at: sn.at, s: sn.s });
    });

    sents.forEach(function (sn, i) {
      const t = sn.t;
      const ms = mentions(t, idx);
      let found = null;

      /* A decision. */
      if (DECIDE.test(t)) {
        let body = t.replace(/^.*?\b(?:we(?:'ve| have)? (?:all )?agreed|it(?:'s| is| was) agreed|agreed|all agreed|we(?:'ve| have)? decided|the decision was|decision is)\b\s*(?:that\s+|to\s+|on\s+)?/i, '');
        if (words(body) < 3) body = t;
        push({ kind: 'decision', title: clean(body), src: t, at: sn.at, s: sn.s });
        return;
      }

      /* "Action for Barra: post the webinar recording." */
      let m = t.match(ACTIONFOR);
      if (m) {
        const who = mentions(m[1], idx)[0];
        found = { owner: who ? who.p.id : null, rest: m[2] };
      }

      /* "<name> to <do it>", "<name> will <do it>" */
      if (!found) {
        ms.some(function (mn) {
          const after = t.slice(mn.end);
          const a = after.match(ASSIGN);
          if (a && !/^\s*,?\s*(?:can|could|would|will) you\b/i.test(after)) {
            /* "Iain can you…" is a request, handled below; "Iain can do it" is an assignment. */
            const verb = KEEPVERB[a[1].toLowerCase()];
            found = { owner: mn.p.id, rest: verb ? verb + ' ' + a[2] : a[2] };
            return true;
          }
          /* "Iain, can you check that next week?" */
          const v = after.match(VOC);
          const lead = t.slice(0, mn.start).replace(FILLER, '').trim();
          if (v && (!lead || /^(?:and|so|ok|okay|right|now)$/i.test(lead))) {
            found = { owner: mn.p.id, rest: v[1] };
            return true;
          }
          return false;
        });
      }

      /* "Can you send that on to the agents, Niina?" */
      if (!found && ms.length) {
        const last = ms[ms.length - 1];
        const tail = t.slice(last.end).replace(/[\s?.!]+$/, '');
        if (!tail) {
          const tm = t.slice(0, last.start).match(TRAIL);
          if (tm) found = { owner: last.p.id, rest: tm[1] };
        }
      }

      /* "I'll look after that" — the speaker, whom the transcript can't name. */
      if (!found) {
        const sm = t.match(SELF);
        if (sm && words(sm[1]) >= 1) found = { owner: null, self: true, rest: sm[1] || '' };
      }

      /* "Can someone <do it>?" — wait a sentence or two to see who
         picks it up. */
      if (!found) {
        const om = t.match(OPENREQ);
        if (om) {
          flushPending();
          const d = dueFrom(om[1], t);
          const title = clean(d.rest);
          if (words(title) >= 2) pending = { title: title, due: d.due, dueText: d.dueText, src: t, at: sn.at, s: sn.s, i: i };
          return;
        }
      }

      if (found) {
        const d = dueFrom(found.rest, t);
        let title = clean(d.rest);
        let due = d.due, dueText = d.dueText, src = t;
        /* "…can you do that?" points back at the open request. */
        if (PRONOUN.test(title) || /^(?:that|it|this)$/i.test(title) || words(title) <= 1) {
          if (pending && i - pending.i <= 3) {
            title = pending.title; due = due || pending.due; dueText = dueText || pending.dueText;
            src = pending.src + ' ' + t; pending.used = true; pending = null;
          } else if (words(title) <= 1) {
            return;
          }
        }
        if (words(title) < 2) return;
        push({ kind: 'action', title: title, owner: found.owner, needsOwner: !found.owner, self: !!found.self,
          due: due, dueText: dueText, src: src, at: sn.at, s: sn.s });
        return;
      }

      /* Said while an action was on screen and sounds like progress. */
      if (sn.at && itemIds[sn.at] && STATUS.test(t) && !/\?\s*$/.test(t)) {
        const prev = out.length ? out[out.length - 1] : null;
        if (prev && prev.kind === 'update' && prev.item === sn.at) {
          prev.title = clean(prev.title + '. ' + t); prev.src += ' ' + t;
        } else {
          push({ kind: 'update', item: sn.at, title: clean(t), src: t, at: sn.at, s: sn.s });
        }
      }

      if (pending && i - pending.i > 3) flushPending();
    });
    flushPending();
    return out.map(function (o) { delete o.key; return o; });
  }

  const Extract = { suggest: suggest, nameIndex: nameIndex, mentions: mentions, sentences: sentences, clean: clean };
  if (typeof module !== 'undefined' && module.exports) module.exports = Extract;
  else root.Extract = Extract;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* importer.js */
/* ═══════════════════════════════════════════════════════════════════════
   JOR Minutes — bringing the spreadsheet across
   Reads the meeting-minutes workbook the office keeps today, one tab per
   meeting, and turns the latest tab into actions so nobody retypes the
   open list on day one. No library: an .xlsx is a zip of XML, the browser
   can unzip it (DecompressionStream) and the XML is regular enough to
   read directly. Works offline.

   The workbook is not tidy, and this is written for the way it really is:
   - the columns move between tabs (Task is column C on one, E on another),
     so columns are found by their heading, not their letter;
   - "Completion %" holds 0.5, 1, "Complete", "complete" and "?";
   - "Completion Date" holds real dates, "Delayed 26/06", "End Jan 2026",
     "ASAP", "N/A", "Ongoing" and "Complete";
   - "Assigned To?" holds initials, "ID / SM", "ALL", "ID / Team" and
     trailing spaces;
   - one action point runs over several rows: extra tasks, extra update
     lines, a sentence that wraps onto the next row;
   - decisions ("Agreed that…") sit in the same rows as actions;
   - an earlier deadline survives only as words in the update
     ("original completion date 18/09/26"), and becomes a real slip here;
   - a tab can hold several meetings, one after another, each starting at a
     row that says "Minutes - 08/09/26";
   - a row with only a heading in it ("Guides", "Outstanding from previous
     minutes") groups the rows under it and is not an action itself.

   The same layout is used for plans: one tab per department, no dates in
   the tab names, and a "Check in update" column beside "Update". A workbook
   whose tabs carry no meeting dates is read as a plan.

   A department's own to-do list is a third layout: one row per job, with
   whose it is ("Name"), when it went on the list, a priority, a tick for
   "working on it today", the client, the file reference, the travel date,
   when it was last commented on, and a row saying "ON HOLD" above the
   parked ones. Every one of those columns is kept.

   A Word document of procedures (numbered sections, bullet steps, "If the
   client…:" lines before each set of steps) is read into checklists, one
   per numbered procedure and case, to add to a to-do as its steps.
   ═══════════════════════════════════════════════════════════════════════ */

(function (root) {
  'use strict';

  const W = root.When || (typeof require !== 'undefined' ? require('./when.js') : null);

  /* ══ Unzipping ═════════════════════════════════════════════════════════ */

  async function inflateBrowser(u8) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([u8]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  function unzip(buf, inflate) {
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let e = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
    }
    if (e < 0) throw new Error('That file is not an Excel workbook (.xlsx).');
    const n = dv.getUint16(e + 10, true);
    let off = dv.getUint32(e + 16, true);
    const files = {};
    const dec = new TextDecoder('utf-8');
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nlen = dv.getUint16(off + 28, true), xlen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true);
      const loff = dv.getUint32(off + 42, true);
      const name = dec.decode(u8.subarray(off + 46, off + 46 + nlen));
      const start = loff + 30 + dv.getUint16(loff + 26, true) + dv.getUint16(loff + 28, true);
      files[name] = { method: method, data: u8.subarray(start, start + csize) };
      off += 46 + nlen + xlen + clen;
    }
    return {
      names: Object.keys(files),
      read: async function (name) {
        const f = files[name];
        if (!f) return null;
        const raw = f.method === 0 ? f.data : await inflate(f.data);
        return dec.decode(raw);
      }
    };
  }

  /* ══ Reading the XML ═══════════════════════════════════════════════════ */

  function ent(s) {
    return String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&#(\d+);/g, function (m, d) { return String.fromCharCode(+d); })
      .replace(/&#x([0-9a-f]+);/gi, function (m, h) { return String.fromCharCode(parseInt(h, 16)); })
      .replace(/&amp;/g, '&');
  }
  function attrs(s) {
    const o = {};
    String(s).replace(/([\w:]+)="([^"]*)"/g, function (m, k, v) { o[k] = ent(v); return m; });
    return o;
  }
  function texts(xml) {
    let out = '';
    xml.replace(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g, function (m, t) { out += ent(t); return m; });
    return out;
  }

  const DATE_IDS = { 14: 1, 15: 1, 16: 1, 17: 1, 18: 0, 19: 0, 20: 0, 21: 0, 22: 1, 45: 0, 46: 0, 47: 0 };

  function isDateFormat(code) {
    const c = String(code || '').replace(/"[^"]*"|\[[^\]]*\]|\\./g, '');
    return /[dy]/i.test(c) || /m{3,}/i.test(c);
  }

  function serialToIso(v) {
    const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 864e5);
    return d.toISOString().slice(0, 10);
  }

  function colIx(ref) {
    const m = String(ref).match(/^([A-Z]+)(\d+)$/);
    if (!m) return null;
    let c = 0;
    for (let i = 0; i < m[1].length; i++) c = c * 26 + (m[1].charCodeAt(i) - 64);
    return { c: c, r: +m[2], col: m[1] };
  }

  async function readWorkbook(buf, inflate) {
    const z = unzip(buf, inflate || inflateBrowser);
    const wb = await z.read('xl/workbook.xml');
    if (!wb) throw new Error('That file is not an Excel workbook (.xlsx).');
    const rels = (await z.read('xl/_rels/workbook.xml.rels')) || '';
    const relMap = {};
    rels.replace(/<Relationship\s([^>]*?)\/?>/g, function (m, a) { const o = attrs(a); relMap[o.Id] = o.Target; return m; });
    const ss = [];
    const sst = await z.read('xl/sharedStrings.xml');
    if (sst) sst.replace(/<si>([\s\S]*?)<\/si>/g, function (m, si) { ss.push(texts(si)); return m; });
    const styles = (await z.read('xl/styles.xml')) || '';
    const custom = {};
    styles.replace(/<numFmt\s([^>]*?)\/?>/g, function (m, a) { const o = attrs(a); custom[o.numFmtId] = o.formatCode; return m; });
    const xfs = [];
    const cx = styles.match(/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/);
    if (cx) cx[1].replace(/<xf\s([^>]*?)\/?>/g, function (m, a) { xfs.push(+attrs(a).numFmtId || 0); return m; });
    const dateStyle = xfs.map(function (id) { return id in DATE_IDS || (custom[id] && isDateFormat(custom[id])); });

    const sheets = [];
    const list = [];
    wb.replace(/<sheet\s([^>]*?)\/?>/g, function (m, a) { list.push(attrs(a)); return m; });
    for (let i = 0; i < list.length; i++) {
      const sh = list[i];
      let target = relMap[sh['r:id']] || ('worksheets/sheet' + (i + 1) + '.xml');
      target = target.replace(/^\/?xl\//, '').replace(/^\//, '');
      const xml = await z.read('xl/' + target);
      if (!xml) continue;
      const rows = {};
      let maxRow = 0;
      xml.replace(/<c\s([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, function (m, a, inner) {
        const o = attrs(a), at = colIx(o.r);
        if (!at || inner == null) return m;
        let v = null;
        const vm = inner.match(/<v>([\s\S]*?)<\/v>/);
        if (o.t === 's') v = vm ? ss[+vm[1]] : null;
        else if (o.t === 'inlineStr') v = texts(inner);
        else if (o.t === 'str' || o.t === 'e') v = vm ? ent(vm[1]) : null;
        else if (o.t === 'b') v = vm ? vm[1] === '1' : null;
        else if (vm) {
          const num = +vm[1];
          v = dateStyle[+o.s || 0] && num > 20000 && num < 80000 ? { date: serialToIso(num) } : num;
        }
        if (v === null || v === '') return m;
        (rows[at.r] = rows[at.r] || {})[at.col] = v;
        if (at.r > maxRow) maxRow = at.r;
        return m;
      });
      sheets.push({ name: sh.name, state: sh.state || 'visible', rows: rows, maxRow: maxRow });
    }
    return { sheets: sheets };
  }

  /* ══ Finding the table ═════════════════════════════════════════════════ */

  /* In this order: a heading takes the first of these it fits, so "Date
     added" and "Date of Comment" are taken before the plain "date" of the
     due column can have them. */
  const HEAD = [
    ['title', /action\s*point|^topic$|^item$|^subject$/i],
    ['task', /^tasks?\b|^action$|^what\b/i],
    ['added', /date\s*(added|raised|logged|opened)|^(added|raised)\b/i],
    ['asat', /^today'?s?\s*date$|^date\s*today$/i],
    ['age', /days\s*(on|open)|^age\b/i],
    ['said', /date\s*of\s*(last\s*)?(comment|update)|(comment|update)\s*date|^last\s*updated?$/i],
    ['travel', /^d\.?\s*o\.?\s*t\.?$|date\s*of\s*travel|travel\s*date/i],
    ['prio', /^priority|^prio\b/i],
    ['client', /^client|^customer/i],
    ['fileRef', /^ref(erence)?\b|file\s*(no|number|#|ref)|booking\s*(no|ref)/i],
    ['now', /working\s*on|^today$|^focus$/i],
    ['prog', /%|progress|^status$/i],
    ['check', /check\s*-?\s*in/i],
    ['update', /update|^notes?$|comment/i],
    ['due', /date|due|deadline/i],
    ['owner', /assign|owner|^who\b|responsib|^name$|^staff$/i]
  ];

  function cellText(v) {
    if (v == null) return '';
    if (typeof v === 'object' && v.date) return v.date;
    return String(v).replace(/ /g, ' ').trim();
  }

  function findHeader(sheet) {
    for (let r = 1; r <= Math.min(sheet.maxRow, 25); r++) {
      const row = sheet.rows[r];
      if (!row) continue;
      const cols = {};
      Object.keys(row).forEach(function (col) {
        const t = cellText(row[col]);
        for (let i = 0; i < HEAD.length; i++) {
          const k = HEAD[i][0];
          if (!cols[k] && HEAD[i][1].test(t)) { cols[k] = col; break; }
        }
      });
      if ((cols.title || cols.task) && (cols.update || cols.owner || cols.due)) {
        /* A column with no heading of its own, labelled in the row above
           ("Actively Working On Today" over a column of ticks). */
        const above = sheet.rows[r - 1] || {};
        Object.keys(above).forEach(function (col) {
          if (cols.now || row[col] != null) return;
          if (Object.keys(cols).some(function (k) { return cols[k] === col; })) return;
          if (HEAD.find(function (h) { return h[0] === 'now'; })[1].test(cellText(above[col]))) cols.now = col;
        });
        return { row: r, cols: cols };
      }
    }
    return null;
  }

  /* A to-do list rather than minutes: a row per job with whose it is, and
     the columns only a working list has. */
  function isList(cols) {
    return !!(cols.task && cols.owner && !cols.title && (cols.added || cols.prio || cols.client || cols.fileRef || cols.said || cols.now));
  }

  /* "Name: Sinéad" above the table: whose list it is. */
  function keeperOf(sheet, hd) {
    for (let r = 1; r < hd.row; r++) {
      const row = sheet.rows[r] || {};
      const cols = Object.keys(row).sort(function (a, b) { return a.length - b.length || (a < b ? -1 : 1); });
      for (let i = 0; i < cols.length; i++) {
        const t = cellText(row[cols[i]]);
        const one = t.match(/^(?:name|kept by|owner|list of)\s*:\s*(.+)$/i);
        if (one) return one[1].trim();
        if (/^(?:name|kept by|owner)\s*:?$/i.test(t) && cols[i + 1]) return cellText(row[cols[i + 1]]);
      }
    }
    return '';
  }

  /* The meeting's date: "Meeting Notes - 31/08/26" in a cell, or the tab name. */
  function meetingDate(sheet, fallbackYear) {
    for (let r = 1; r <= Math.min(sheet.maxRow, 8); r++) {
      const row = sheet.rows[r] || {};
      for (const col in row) {
        const t = cellText(row[col]);
        const m = t.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
        if (m && /meet|minute|notes/i.test(t)) return iso3(m[1], m[2], m[3]);
      }
    }
    const m = String(sheet.name).match(/(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/);
    if (m) return iso3(m[1], m[2], m[3] || String(fallbackYear));
    return null;
  }
  function iso3(d, m, y) {
    y = +y; if (y < 100) y += 2000;
    const s = y + '-' + String(+m).padStart(2, '0') + '-' + String(+d).padStart(2, '0');
    return W.valid(s) ? s : null;
  }

  /* ══ Reading the rows ══════════════════════════════════════════════════ */

  function continues(prev, next) {
    if (!prev || !next) return false;
    if (/^[a-z]/.test(next)) return true;
    return /(?:[,;:\-–]|\b(?:and|or|with|to|the|of|for|by|a|our|your))\s*$/i.test(prev);
  }

  function joinText(a, b) {
    a = String(a || '').trim(); b = String(b || '').trim();
    if (!a) return b; if (!b) return a;
    return /[.!?]$/.test(a) || /^[A-Z]/.test(b) && /[.!?)]$/.test(a) ? a + ' ' + b : a + (/[,;:\-–]$/.test(a) ? ' ' : '. ') + b;
  }

  /* Rows that start another meeting inside the same tab: "Minutes - 08/09/26". */
  const MARK = /^\s*(?:meeting\s+)?(?:minutes|notes|meeting)\b[^0-9]{0,12}(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\s*$/i;

  function markers(sheet, fromRow) {
    const out = [];
    for (let r = fromRow + 1; r <= sheet.maxRow; r++) {
      const row = sheet.rows[r];
      if (!row) continue;
      const cells = Object.keys(row).map(function (col) { return cellText(row[col]); }).filter(Boolean);
      if (cells.length !== 1) continue;
      const m = cells[0].match(MARK);
      if (m) out.push({ row: r, date: iso3(m[1], m[2], m[3]), text: cells[0] });
    }
    return out;
  }

  /* One tab, as the meetings (or the one plan page) it holds. */
  function splitSheet(sheet, opts) {
    opts = opts || {};
    const hd = findHeader(sheet);
    if (!hd) return [{ ok: false, sheet: sheet.name, why: onlyChoices(sheet) ? 'Only a list of choices for a drop-down, no to-dos' : 'No heading row found (looked for "Action Point", "Task", "Update", "Assigned To").' }];
    if (isList(hd.cols)) return [parseList(sheet, hd, opts)];
    const marks = markers(sheet, hd.row);
    const first = meetingDate(sheet, opts.year || 2026);
    const parts = [{ from: hd.row + 1, to: marks.length ? marks[0].row - 1 : sheet.maxRow, date: first, label: sheet.name }];
    marks.forEach(function (mk, i) {
      parts.push({ from: mk.row + 1, to: i + 1 < marks.length ? marks[i + 1].row - 1 : sheet.maxRow, date: mk.date, label: mk.text });
    });
    return parts.map(function (pt) {
      return parseSheet(sheet, Object.assign({}, opts, { from: pt.from, to: pt.to, date: pt.date, label: pt.label, header: hd }));
    }).filter(function (r) { return r.ok && (r.items.length || r.label === sheet.name); });
  }

  /* The whole workbook: meetings in date order, or a plan in tab order. */
  function parseBook(wb, opts) {
    const tabs = [], skipped = [];
    wb.sheets.forEach(function (sh) {
      splitSheet(sh, opts).forEach(function (t) {
        if (!t.ok) skipped.push({ sheet: t.sheet || sh.name, why: t.why });
        else if (!t.items.length) skipped.push({ sheet: sh.name, why: 'Nothing under the headings' });
        else tabs.push(t);
      });
    });
    if (tabs.length && tabs.every(function (t) { return t.list; })) {
      return { plan: true, list: true, tabs: tabs, skipped: skipped,
        keeper: (tabs.find(function (t) { return t.keeper; }) || {}).keeper || '',
        asAt: tabs.map(function (t) { return t.asAt; }).filter(Boolean).sort().pop() || null };
    }
    const dated = tabs.filter(function (t) { return t.date && !t.list; });
    if (dated.length) {
      tabs.filter(function (t) { return !t.date; }).forEach(function (t) { skipped.push({ sheet: t.sheet, why: 'No meeting date on this tab' }); });
      dated.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      return { plan: false, tabs: dated, skipped: skipped };
    }
    return { plan: true, tabs: tabs, skipped: skipped };
  }

  function parseSheet(sheet, opts) {
    opts = opts || {};
    const hd = opts.header || findHeader(sheet);
    if (!hd) return { ok: false, why: 'No heading row found (looked for "Action Point", "Task", "Update", "Assigned To").' };
    const mdate = opts.date !== undefined ? opts.date : (meetingDate(sheet, opts.year || 2026) || opts.fallbackDate || null);
    const c = hd.cols;
    const get = function (row, k) { return c[k] ? row[c[k]] : undefined; };
    const raw = [], headings = [];
    let point = '', last = null, pointFirst = null;
    const from = opts.from || hd.row + 1, to = Math.min(opts.to || sheet.maxRow, sheet.maxRow);
    for (let r = from; r <= to; r++) {
      const row = sheet.rows[r];
      if (!row) continue;
      const t = cellText(get(row, 'title')), k = cellText(get(row, 'task')), u = cellText(get(row, 'update'));
      const dRaw = get(row, 'due'), pRaw = get(row, 'prog'), o = cellText(get(row, 'owner')), ck = cellText(get(row, 'check'));
      const d = cellText(dRaw), p = cellText(pRaw);
      if (!t && !k && !u && !d && !p && !o && !ck) continue;
      /* A heading on its own groups what follows; it isn't an action. */
      if (t && !k && !u && !d && !p && !o && !ck) { point = t; pointFirst = null; last = null; headings.push(t); continue; }
      if (t) { point = t; pointFirst = null; }
      const hasMeta = !!(d || p || o);
      let rec = null;
      if (k) {
        /* A task line: a new action, unless it is the tail of the one above. */
        if (!t && last && !hasMeta && !u && !ck && continues(last.task, k)) { last.task = joinText(last.task, k); last.rows.push(r); continue; }
        rec = { point: point || k, task: k, update: u, check: ck, due: dRaw, prog: pRaw, owner: o, rows: [r] };
      } else if (u || ck) {
        if (!t && last && (!hasMeta || (!last.due && !last.owner && !last.prog))) {
          /* More words for the action above, perhaps carrying its date and owner. */
          if (u) last.update = joinText(last.update, u);
          if (ck) last.check = joinText(last.check, ck);
          if (dRaw != null && last.due == null) last.due = dRaw;
          if (pRaw != null && last.prog == null) last.prog = pRaw;
          if (o && !last.owner) last.owner = o;
          last.rows.push(r);
          continue;
        }
        rec = { point: point || u || ck, task: t ? '' : (u || ck), update: t ? u : '', check: t || u ? ck : '', due: dRaw, prog: pRaw, owner: o, rows: [r] };
      } else if (t) {
        rec = { point: t, task: '', update: '', check: '', due: dRaw, prog: pRaw, owner: o, rows: [r] };
      } else if (last) {
        if (dRaw != null && last.due == null) last.due = dRaw;
        if (pRaw != null && last.prog == null) last.prog = pRaw;
        if (o && !last.owner) last.owner = o;
        continue;
      }
      if (rec) {
        if (!pointFirst) pointFirst = rec; else rec.inherit = pointFirst;
        raw.push(rec); last = rec;
      }
    }
    const items = [];
    raw.forEach(function (rec) { normalise(rec, mdate, items, opts.today); });
    return { ok: true, sheet: sheet.name, label: opts.label || sheet.name, date: mdate, header: hd, items: items, headings: headings };
  }

  /* ══ Making sense of each value ════════════════════════════════════════ */

  function normalise(rec, mdate, out, todayIso) {
    const today = mdate || todayIso || W.iso(new Date());
    const it = {
      rows: rec.rows, point: tidy(rec.point), task: tidy(rec.task), update: tidy(rec.update), check: tidy(rec.check),
      kind: 'action', status: 'open', progress: 0, due: null, ongoing: false, slips: [],
      owners: [], everyone: false, notes: [], raw: {
        due: cellText(rec.due), prog: cellText(rec.prog), owner: cellText(rec.owner)
      }
    };

    /* Progress: a fraction, a word, or a question mark. */
    const p = rec.prog;
    if (typeof p === 'number') {
      if (p >= 1) { it.status = 'done'; it.progress = 100; }
      else if (p > 0) {
        it.progress = Math.max(25, Math.min(75, Math.round(p * 4) * 25));
        if (Math.round(p * 100) !== it.progress) it.notes.push(Math.round(p * 100) + '% rounded to ' + it.progress + '%');
      }
    } else if (typeof p === 'string') {
      if (/complete|done|finished|closed/i.test(p)) { it.status = 'done'; it.progress = 100; }
      else if (/^\s*\?+\s*$/.test(p)) { it.unknown = true; it.notes.push('Progress was "?" — owner to confirm'); }
      else if (/^\s*(\d+)\s*%?\s*$/.test(p)) {
        const n = +p.match(/\d+/)[0];
        if (n >= 100) { it.status = 'done'; it.progress = 100; } else if (n > 0) it.progress = Math.max(25, Math.min(75, Math.round(n / 25) * 25));
      }
    }

    /* The date column, which holds far more than dates. */
    const d = rec.due;
    dueInto(it, d, today);

    /* "End Jan 2026" on a tab from August 2026 means next January. Say so
       rather than quietly importing an action that is seven months late. */
    if (it.due && mdate && it.status !== 'done' && it.due < W.add(mdate, -45)) {
      const y = +it.due.slice(0, 4);
      const txt = typeof d === 'string' ? d : '';
      const again = txt.indexOf(String(y)) >= 0 ? W.parse(txt.replace(String(y), String(y + 1)), today, {}) : null;
      const fixed = again ? again.date : (y + 1) + it.due.slice(4);
      if (fixed >= mdate) {
        it.notes.push('The sheet says ' + W.fmt(it.due, 'med') + ', months before the meeting; read as ' + W.fmt(fixed, 'med'));
        it.due = fixed; it.yearFixed = true;
      } else {
        it.checkDate = true;
        it.notes.push('Date is ' + W.fmt(it.due, 'med') + ', months before the meeting — check the year');
      }
    }

    /* A plan has no meeting date to measure against: a date long gone on an
       open row is probably last year's, or a slip of the keyboard. */
    if (!mdate && it.due && it.status !== 'done' && todayIso && it.due < W.add(todayIso, -60)) {
      it.checkDate = true;
      it.notes.push('Date is ' + W.fmt(it.due, 'med') + ', months ago — check the year');
    }

    /* An earlier deadline written into the words: "Old deadline 18/09/26". */
    const words = it.update + ' ' + it.task;
    const old = words.match(/(?:original(?:\s+completion)?\s+date|old deadline|tentative completion date|was due|original deadline)\s*(?:was|of|:)?\s*(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)/i) ||
      words.match(/(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)\s+was a tentative completion date/i);
    if (old) {
      const h = W.parse(old[1], today, {});
      if (h && it.due && h.date < it.due) {
        it.slips = it.slips.filter(function (x) { return x.from; });
        it.slips.push({ from: h.date, to: it.due, why: 'In the old minutes' });
        it.notes.push('Earlier date ' + W.fmt(h.date, 'num') + ' found in the notes — recorded as a slip');
      }
    }

    const who = (rec.owner || (rec.inherit && rec.inherit.owner) || '');
    if (!rec.owner && rec.inherit && rec.inherit.owner) it.notes.push('Owner taken from "' + it.point + '" above');
    whoInto(it, who);

    /* What kind of row it is. */
    const body = it.task || it.update || it.point;
    if (/^\s*(?:agreed|we agreed|it was agreed|decided|we decided)\b/i.test(it.task)) it.kind = 'decision';
    else if (/\bno action\b/i.test(it.task + ' ' + it.update)) it.kind = 'note';
    it.title = it.point && it.task && it.point !== it.task ? it.point : (body.length > 90 ? it.point || body.slice(0, 87) + '…' : body);
    it.detail = it.point && it.task && it.point !== it.task ? it.task : (it.task && it.task !== it.title ? it.task : '');

    /* "Agreed only Friday night for the party. Finalise budget and itinerary."
       is a decision and an action. The action keeps the date and the owner. */
    if (it.kind === 'decision') {
      const parts = it.task.split(/(?<=[.!?])\s+/);
      if (parts.length > 1) {
        const act = JSON.parse(JSON.stringify(it));
        act.kind = 'action'; act.detail = tidy(parts.slice(1).join(' ')); act.split = true;
        act.notes = act.notes.concat(['Split from the decision above']);
        it.detail = parts[0]; it.task = parts[0];
        it.due = null; it.owners = []; it.everyone = false; it.slips = []; it.progress = 0; it.status = 'open';
        out.push(it); out.push(act);
        return;
      }
      it.due = null; it.slips = []; it.progress = 0; it.status = 'open';
    }
    out.push(it);

    /* "Agreed …" in the update of an action is a decision in its own right. */
    const ag = it.kind === 'action' && it.update.match(/(?:^|[.!]\s+)((?:agreed|we agreed|it was agreed|decided)\b[^.]*\.?)/i);
    if (ag) {
      out.push({ rows: rec.rows, point: it.point, task: ag[1].trim(), update: '', kind: 'decision', status: 'open',
        progress: 0, due: null, ongoing: false, slips: [], owners: [], everyone: false,
        notes: ['Taken from the update of "' + it.point + '"'], raw: {}, title: tidy(ag[1]), detail: 'From: ' + it.point, split: true });
    }
  }

  function dueInto(it, d, today) {
    if (d && typeof d === 'object' && d.date) it.due = d.date;
    else if (typeof d === 'number' && d > 20000 && d < 80000) it.due = serialToIso(d);
    else if (typeof d === 'string' && d.trim()) {
      const s = d.trim();
      if (/^(complete|completed|done)$/i.test(s)) { it.status = 'done'; it.progress = 100; }
      else if (/^n\/?a$/i.test(s)) { it.notes.push('No date ("N/A")'); }
      else if (/^(tbc|tbd|to be (confirmed|decided|agreed)|unknown|not known)\.?$/i.test(s)) { it.notes.push('No date yet ("' + s + '")'); }
      else if (/ongoing|continuous|always/i.test(s)) { it.ongoing = true; }
      else if (/^asap$/i.test(s)) { it.due = W.addWork(today, 2); it.notes.push('"ASAP" set to two working days after the meeting'); }
      else {
        const hit = W.parse(s, today, {});
        if (hit) {
          it.due = hit.date;
          if (/delay|moved|pushed|postpon/i.test(s)) {
            it.slips.push({ from: null, to: hit.date, why: 'Delayed (original date not recorded)' });
            it.notes.push('"' + s + '" — recorded as a slip');
          }
        } else it.notes.push('Date "' + s + '" not understood — left blank');
      }
    }
  }

  /* Who: "ID / SM", "name / name  /name", "name - name  name, name",
     "GL & team", "ALL", "Whole Team". A spaced dash or a double space
     separates names too. */
  function whoInto(it, who) {
    let team = false;
    String(who).split(/\s[-–]\s|[\/,&+;]|\band\b|\s{2,}/i).forEach(function (tok) {
      tok = tok.trim().replace(/\.$/, '');
      if (!tok) return;
      if (/^(all|everyone|every one|whole team)$/i.test(tok)) { it.everyone = true; return; }
      if (/^(the\s+)?team$/i.test(tok)) { team = true; return; }
      if (it.owners.indexOf(tok.toUpperCase()) < 0) it.owners.push(tok.toUpperCase());
    });
    /* "Team" on its own is everyone; "GL & team" is GL's, with the team helping. */
    if (team && !it.owners.length) it.everyone = true;
    else if (team) it.notes.push('"& team" — the team isn’t named, so it goes on ' + it.owners[0] + '’s list');
  }

  /* A day in a cell: a real date, a serial, or typed ("01/09//2026"). */
  function dayOf(v, notes, what) {
    if (v && typeof v === 'object' && v.date) return v.date;
    if (typeof v === 'number' && v > 20000 && v < 80000) return serialToIso(v);
    const s = cellText(v);
    if (!s) return null;
    const m = s.replace(/[\/.\-]{2,}/g, '/').match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
    const iso = m ? iso3(m[1], m[2], m[3]) : null;
    if (notes) notes.push(iso ? what + ' "' + s + '" read as ' + W.fmt(iso, 'med') : what + ' "' + s + '" not understood — left out');
    return iso;
  }

  /* "N/A", "-", "none" and the like mean nothing is there. */
  function nothing(s) { return !s || /^(n\/?a|none|nil|-+|\.+|tbc|tbd)$/i.test(s); }
  function several(s) { return /^(multiple|various|several|many|all)$/i.test(s); }

  /* ══ A department's to-do list ═════════════════════════════════════════ */

  function parseList(sheet, hd, opts) {
    opts = opts || {};
    const c = hd.cols;
    const get = function (row, k) { return c[k] ? row[c[k]] : undefined; };
    const items = [], headings = [], asAt = {};
    let section = '';
    for (let r = hd.row + 1; r <= sheet.maxRow; r++) {
      const row = sheet.rows[r];
      if (!row) continue;
      const task = cellText(get(row, 'task')), who = cellText(get(row, 'owner'));
      if (!task && !who) {
        /* "ON HOLD" on a row of its own: what follows is parked. */
        const cells = Object.keys(row).map(function (col) { return cellText(row[col]); }).filter(Boolean);
        if (cells.length === 1 && typeof row[Object.keys(row)[0]] === 'string') { section = cells[0]; headings.push(section); }
        continue;
      }
      const a = dayOf(get(row, 'asat'));
      if (a) asAt[a] = (asAt[a] || 0) + 1;
      items.push(listItem(row, get, r, section, opts.today));
    }
    const day = Object.keys(asAt).sort(function (x, y) { return asAt[y] - asAt[x] || (x < y ? 1 : -1); })[0] || null;
    /* A date long gone on an open job is probably a slip of the keyboard. */
    items.forEach(function (it) {
      const ref = day || opts.today;
      if (ref && it.due && it.status !== 'done' && it.due < W.add(ref, -60)) {
        it.checkDate = true;
        it.notes.push('Due ' + W.fmt(it.due, 'med') + ', months before the list’s date — check the year');
      }
    });
    return { ok: true, list: true, sheet: sheet.name, label: sheet.name.trim(), date: null, header: hd, items: items, headings: headings,
      keeper: keeperOf(sheet, hd), asAt: day };
  }

  function listItem(row, get, r, section, todayIso) {
    const it = {
      rows: [r], point: '', task: '', update: '', check: '', kind: 'action', status: 'open', progress: 0, due: null, ongoing: false,
      slips: [], owners: [], everyone: false, notes: [], list: true, raw: {}, high: false, prio: null, now: false,
      added: null, said: null, client: '', fileRef: '', travel: '', section: section || ''
    };
    ['task', 'owner', 'due', 'prio', 'client', 'fileRef', 'travel', 'added', 'said', 'now', 'age', 'asat'].forEach(function (k) {
      const v = cellText(get(row, k)); if (v) it.raw[k] = v;
    });

    /* The words, less the stars the list marks some rows with. */
    let task = cellText(get(row, 'task'));
    const stars = (task.match(/\*+\s*$/) || [''])[0].trim();
    task = task.replace(/\s*\*+\s*$/, '');
    if (/^ongoing\.?$/i.test(task)) { it.ongoing = true; task = ''; }
    it.task = tidy(task);

    const client = cellText(get(row, 'client'));
    if (!nothing(client)) it.client = client;
    const ref = cellText(get(row, 'fileRef'));
    if (!nothing(ref)) it.fileRef = ref;
    const tv = get(row, 'travel');
    const travel = tv && typeof tv === 'object' && tv.date ? W.fmt(tv.date, 'med') : cellText(tv).replace(/^[^\w]+/, '');
    if (!nothing(travel)) it.travel = travel;

    const one = it.client && !several(it.client);
    it.title = one ? it.client + (it.task ? ': ' + it.task : '') : (it.task || it.client || 'Row ' + r);
    it.point = it.title;

    /* Priority 1 is the app's "priority"; 2 and 3 are kept in the words. */
    const pv = get(row, 'prio'), ps = cellText(pv);
    const p = typeof pv === 'number' ? pv : /^\d$/.test(ps) ? +ps : /high|urgent/i.test(ps) ? 1 : /med/i.test(ps) ? 2 : /low/i.test(ps) ? 3 : null;
    if (p >= 1 && p <= 9) { it.prio = Math.round(p); it.high = it.prio === 1; }

    const nv = get(row, 'now');
    it.now = nv === true || /^(true|yes|y|x|✓|✔)$/i.test(cellText(nv));

    it.added = dayOf(get(row, 'added'), it.notes, 'Date added');
    it.said = dayOf(get(row, 'said'), it.notes, 'Comment date');
    /* A typed date that read cleanly needs no note; an odd one keeps its note. */
    it.notes = it.notes.filter(function (n) { return !/^(Date added|Comment date) "\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}" read as/.test(n); });

    const d = get(row, 'due'), ds = cellText(d);
    if (/^on\s*hold$/i.test(ds)) { it.status = 'waiting'; it.waitingOn = 'On hold'; }
    else dueInto(it, d, todayIso || W.iso(new Date()));
    if (/on\s*hold|parked|paused/i.test(section) && it.status === 'open') { it.status = 'waiting'; it.waitingOn = 'On hold'; it.notes.push('Under “' + section + '” on the list'); }
    else if (/^(done|complete|completed|finished)$/i.test(section)) { it.status = 'done'; it.progress = 100; }

    whoInto(it, cellText(get(row, 'owner')));

    const bits = [];
    if (it.client && !one) bits.push('Several clients');
    if (it.fileRef) bits.push(several(it.fileRef) ? 'Several files' : 'Ref ' + it.fileRef);
    if (it.travel) bits.push('Travel ' + it.travel);
    if (it.prio && it.prio > 1) bits.push('Priority ' + it.prio + ' on the list');
    if (stars) bits.push('Marked ' + stars + ' on the list');
    if (section && !/on\s*hold|parked|paused|^(done|complete|completed|finished)$/i.test(section)) bits.push('Under “' + section + '” on the list');
    it.detail = bits.join(' · ');
    return it;
  }

  function tidy(s) {
    s = String(s || '').replace(/\s+/g, ' ').trim();
    return s ? s[0].toUpperCase() + s.slice(1) : '';
  }

  function onlyChoices(sheet) {
    const cols = {};
    Object.keys(sheet.rows).forEach(function (r) { Object.keys(sheet.rows[r]).forEach(function (c) { cols[c] = true; }); });
    return Object.keys(cols).length === 1 && sheet.maxRow <= 60;
  }

  /* ══ Following one action from tab to tab ══════════════════════════════
     Each tab is a copy of the one before, retyped and renamed as it goes:
     a heading is shortened, misspelt one month and fixed the next, or
     loses its year. Words are compared loosely (prefixes, one
     slipped letter, years ignored) so the same action is followed through
     the tabs and its history — moved dates included — comes across.     */

  const STOP = { the: 1, a: 1, an: 1, for: 1, of: 1, to: 1, and: 1, on: 1, with: 1, all: 1, our: 1, in: 1, re: 1, by: 1, from: 1, be: 1, is: 1 };

  function tokens(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
      .replace(/[’']s\b/g, '').replace(/[^a-z0-9]+/g, ' ').split(' ')
      .filter(function (w) { return w.length >= 2 && !STOP[w] && !/^\d+$/.test(w); });
  }

  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 3;
    const d = [];
    for (let i = 0; i <= a.length; i++) { d[i] = [i]; }
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    return d[a.length][b.length];
  }

  function same(a, b) {
    if (a === b) return true;
    const n = Math.min(a.length, b.length);
    if (n >= 4 && (a.indexOf(b) === 0 || b.indexOf(a) === 0)) return true;
    if (n >= 5 && lev(a, b) <= 1) return true;
    return n >= 7 && lev(a, b) <= 2;
  }

  function similar(x, y) {
    const A = tokens(x), B = tokens(y);
    if (!A.length || !B.length) return 0;
    const used = {};
    let m = 0;
    A.forEach(function (a) {
      for (let j = 0; j < B.length; j++) if (!used[j] && same(a, B[j])) { used[j] = 1; m++; return; }
    });
    return 2 * m / (A.length + B.length);
  }

  /* For every row of every tab after the first, the earlier action it most
     likely continues. A row continues an action when the action point
     matches, and either that action was still open or the task matches
     too — a finished action with a new task under the same heading is a
     new action (a logo agreed in July, a different logo asked for in August). */
  function thread(tabs) {
